<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kullanıcı Profili</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="lobby-header">
      <a href="menu.html" class="btn-sm" style="background:var(--neon-purple);">‹ Lobi</a>
      <div style="font-weight:bold; font-size:12px;">👤 Oyuncu Profili</div>
      <div></div>
    </div>

    <div style="padding:15px; display:flex; flex-direction:column; gap:10px;">
      <div class="mode-card" style="text-align:center; padding:20px;">
        <div style="font-size:45px;">👑</div>
        <h2 id="u-fullname" style="color:#fff; margin:5px 0;">Mecaga#12345</h2>
        <span class="badge-title" id="u-title" style="font-size:14px;">[Çaylak]</span>
      </div>

      <div class="mode-card" style="line-height:2; font-size:13px;">
        <div><b>Seviye:</b> <span id="u-lvl" style="color:var(--gold);">Lvl 1</span></div>
        <div><b>XP Puanı:</b> <span id="u-xp">0/100</span></div>
        <div><b>Altın:</b> <span id="u-gold" style="color:var(--gold);">500</span></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    window.onload = () => {
      let u = getUser();
      document.getElementById("u-fullname").innerText = `${u.name}${u.tag}`;
      document.getElementById("u-title").innerText = `[${u.title}]`;
      document.getElementById("u-lvl").innerText = `Lvl ${u.level}`;
      document.getElementById("u-xp").innerText = `${u.xp}/${u.level * 100}`;
      document.getElementById("u-gold").innerText = u.gold;
    };
  </script>
</body>
</html>
