<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profilim</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="top-header">
      <a href="menu.html" class="icon-btn" style="border-color:var(--danger);">‹ Lobi</a>
      <div style="font-weight:bold; font-size:12px;">👤 Oyuncu Profili</div>
      <div></div>
    </div>

    <div style="background:#0b1329; border:1px solid var(--border-blue); border-radius:12px; padding:16px; text-align:center; margin-bottom:8px;">
      <div style="font-size:45px; margin-bottom:4px;">👑</div>
      <h2 id="u-fullname" style="color:var(--neon-blue); font-size:16px;">...</h2>

      <div style="background:#050a14; padding:8px; border-radius:8px; text-align:left; font-size:11px; line-height:2; margin-top:10px;">
        <div><b>Toplam Oynanan Oyun:</b> <span id="u-played" style="color:var(--neon-blue);">0</span></div>
        <div><b>Kazanma / Başarı Oranı:</b> <span id="u-winrate" style="color:var(--btn-green);">%100</span></div>
      </div>
    </div>

    <div style="font-size:11px; font-weight:bold; color:var(--gold); margin-bottom:4px;">🏆 Mod Bazlı En Yüksek Rekorlar:</div>
    <div id="records-list" style="display:flex; flex-direction:column; gap:4px;"></div>
  </div>

  <script src="app.js"></script>
  <script>
    window.onload = () => {
      const u = getActiveUser();
      if (!u) return window.location.href = "index.html";

      document.getElementById("u-fullname").innerText = `${u.name}${u.tag}`;
      document.getElementById("u-played").innerText = u.gamesPlayed || 0;
      document.getElementById("u-winrate").innerText = `%${Math.min(100, Math.max(70, ((u.gamesPlayed || 1) * 8) % 100))}`;

      const recBox = document.getElementById("records-list");
      recBox.innerHTML = "";
      const modLabels = {
        standard: "Normal Kasa (30s)",
        ten_cases: "10 Kutu Modu",
        catch_open: "Yakala & Aç Modu",
        upgrade_mode: "Şans Yükseltme",
        mines_mode: "Mayınlı Kasa",
        pvp_mode: "Online PvP"
      };

      const recs = u.records || {};
      for (let k in modLabels) {
        recBox.innerHTML += `
          <div class="rank-card">
            <span style="font-size:11px;">${modLabels[k]}</span>
            <b style="color:var(--btn-green);">${recs[k] || 0} P</b>
          </div>
        `;
      }
    };
  </script>
</body>
</html>
