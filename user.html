<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Oyuncu Profili</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #020617; font-family: system-ui, sans-serif; color: #fff; }

    .user-layout { width: 100%; max-width: 480px; height: 100dvh; margin: 0 auto; background: #030712; display: flex; flex-direction: column; position: relative; }
    .user-header { background: #090d1a; border-bottom: 2px solid #1e293b; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; }
    .user-content { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

    .profile-card { background: linear-gradient(135deg, #1e1b4b, #0f172a); border: 1px solid #334155; border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 12px; }
    .profile-avatar { width: 56px; height: 56px; background: #060913; border: 2px solid var(--neon-gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; flex-shrink: 0; }

    .stat-section-title { font-size: 9px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .stat-box { background: #0b1329; border: 1px solid #1e293b; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 2px; }

    /* Kayar Çekmece */
    .settings-drawer { position: absolute; top: 0; right: -100%; width: 82%; max-width: 350px; height: 100%; background: #090d1a; border-left: 2px solid #334155; z-index: 300; display: flex; flex-direction: column; transition: right 0.28s ease; }
    .settings-drawer.active { right: 0; }
    .drawer-backdrop { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.65); z-index: 200; }
    .drawer-backdrop.active { display: block; }
    .drawer-header { padding: 12px; background: #050814; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .avatar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; background: #030712; padding: 6px; border-radius: 6px; }
    .avatar-cell { font-size: 18px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; text-align: center; padding: 3px 0; cursor: pointer; }
    .avatar-cell.active { border-color: var(--neon-gold); background: #1e1b4b; }
  </style>
</head>
<body>
  <div class="user-layout">
    <div class="user-header">
      <a href="menu.html" class="icon-btn" style="border-color:var(--danger); padding:3px 8px; font-size:10px; text-decoration:none;">‹ Lobi</a>
      <div style="font-weight:bold; font-size:11.5px; color:#38bdf8;">👤 Profilim</div>
      <button type="button" class="icon-btn" style="border-color:var(--neon-gold); padding:3px 8px; font-size:10px;" onclick="openDrawer(true)">⚙️ Ayarlar</button>
    </div>

    <div class="user-content">
      <div class="profile-card">
        <div class="profile-avatar" id="p-avatar">👤</div>
        <div style="flex:1;">
          <div style="font-size:14px; font-weight:900;" id="p-username">-</div>
          <div style="font-size:10px; font-weight:bold; color:var(--neon-gold);" id="p-title">[Çaylak]</div>
          <div style="font-size:8px; color:#94a3b8; margin-top:4px;">
            🗓️ <span id="p-date">-</span> <span style="color:#64748b;" id="p-ago"></span>
          </div>
        </div>
      </div>

      <div>
        <div class="stat-section-title">📊 Toplam Oynama</div>
        <div class="stat-box" style="align-items:center; text-align:center; padding:10px;">
          <b style="font-size:18px; color:#38bdf8;" id="st-total">0 Maç</b>
        </div>
      </div>

      <div>
        <div class="stat-section-title">💣 Mayın Tarlası Karnesi</div>
        <div class="stat-grid">
          <div class="stat-box">
            <span style="font-size:7.5px; color:#94a3b8;">OYNAMA / KAZANMA</span>
            <b style="font-size:12px; color:#f87171;" id="st-mines-record">0 / 0</b>
          </div>
          <div class="stat-box">
            <span style="font-size:7.5px; color:#94a3b8;">KAZANMA ORANI</span>
            <b style="font-size:12px; color:var(--neon-green);" id="st-mines-rate">%0</b>
          </div>
        </div>
      </div>

      <div>
        <div class="stat-section-title">🎮 Bütün Modlar Oynama Sayısı</div>
        <div style="display:flex; flex-direction:column; gap:3px; background:#070d1e; padding:6px; border-radius:6px; font-size:9px;">
          <div style="display:flex; justify-content:space-between;"><span>⚔️ Normal Kasa:</span><b id="c-std">0</b></div>
          <div style="display:flex; justify-content:space-between;"><span>🎯 Yakala & Aç:</span><b id="c-cat">0</b></div>
          <div style="display:flex; justify-content:space-between;"><span>💣 Mayın Tarlası:</span><b id="c-min">0</b></div>
          <div style="display:flex; justify-content:space-between;"><span>⚡ Speedrun:</span><b id="c-spd">0</b></div>
          <div style="display:flex; justify-content:space-between;"><span>🎰 Çift Rulet:</span><b id="c-dbl">0</b></div>
        </div>
      </div>
    </div>

    <div class="drawer-backdrop" id="backdrop" onclick="openDrawer(false)"></div>

    <!-- SAĞDAN KAYAR AYARLAR ÇEKMECESİ -->
    <div class="settings-drawer" id="drawer">
      <div class="drawer-header">
        <div style="font-weight:bold; font-size:11px; color:var(--neon-gold);">⚙️ Profil Ayarları</div>
        <button type="button" class="icon-btn" onclick="openDrawer(false)">✕</button>
      </div>
      <div class="drawer-body">
        <div>
          <label style="font-size:8px; color:#94a3b8; font-weight:bold;">KULLANICI ADI DEĞİŞTİR</label>
          <input type="text" id="set-name" class="input-field" style="margin-top:3px; font-size:10px; padding:6px;">
        </div>

        <div>
          <label style="font-size:8px; color:#94a3b8; font-weight:bold;">UNVAN SEÇ</label>
          <select id="set-title" class="input-field" style="margin-top:3px; font-size:9.5px; padding:6px; background:#0f172a;">
            <option value="Çaylak">🌱 Çaylak</option>
            <option value="Usta">⚔️ Kasa Ustası</option>
            <option value="Efsane">🔥 Efsanevi Açıcı</option>
            <option value="Kral">👑 Kasa Kralı</option>
            <option value="Mayın Avcısı">💣 Mayın Avcısı</option>
          </select>
        </div>

        <div>
          <label style="font-size:8px; color:#94a3b8; font-weight:bold; display:block; margin-bottom:3px;">AVATAR SEÇ</label>
          <div class="avatar-grid" id="set-avatar-grid"></div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; background:#0f172a; padding:8px; border-radius:6px;">
          <span style="font-size:9.5px;">Sistem Sesleri</span>
          <input type="checkbox" id="set-sound">
        </div>

        <button type="button" class="btn-start" style="background:#16a34a; font-size:10px; padding:8px;" onclick="saveSettings()">💾 Değişiklikleri Kaydet</button>
        <hr style="border:0; border-top:1px solid #1e293b;">
        <button type="button" class="icon-btn" style="background:#334155; justify-content:center; padding:7px; font-size:9.5px;" onclick="logout()">🚪 Güvenli Çıkış Yap</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let tempAvatar = "👤";

    window.onload = () => loadProfile();

    function openDrawer(o) {
      document.getElementById("drawer").classList.toggle("active", o);
      document.getElementById("backdrop").classList.toggle("active", o);
    }

    function formatExactDate(t) {
      const d = new Date(t);
      const days = ["Paz","Pzt","Sal","Çar","Per","Cum","Cts"];
      return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()} ${days[d.getDay()]} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
    }

    function timeAgo(t) {
      const diff = Date.now() - t;
      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      return d === 0 ? "(Bugün)" : `(${d} gün önce)`;
    }

    function loadProfile() {
      const u = getActiveUser();
      if (!u) return location.href = "index.html";

      tempAvatar = u.avatar || "👤";
      document.getElementById("p-avatar").innerText = tempAvatar;
      document.getElementById("p-username").innerText = u.displayName || u.name || u.username;
      document.getElementById("p-title").innerText = `[${u.title || 'Çaylak'}]`;

      const reg = u.createdAt || Date.now();
      document.getElementById("p-date").innerText = formatExactDate(reg);
      document.getElementById("p-ago").innerText = timeAgo(reg);

      document.getElementById("set-name").value = u.displayName || u.name || u.username;
      document.getElementById("set-title").value = u.title || "Çaylak";
      document.getElementById("set-sound").checked = u.sound !== false;

      renderAvatars();

      const cleanUser = String(u.username || u.name).trim().toLowerCase();

      // Hem accounts hem de users yolundan istatistikleri garantili oku
      db.ref("accounts/" + cleanUser).once("value").then(snap => {
        let stats = (snap.val() && snap.val().stats) || {};

        const std = (stats["standard"] && stats["standard"].played) || 0;
        const cat = (stats["catch_open"] && stats["catch_open"].played) || 0;
        const min = (stats["mines_mode"] && stats["mines_mode"].played) || 0;
        const minW = (stats["mines_mode"] && stats["mines_mode"].wins) || 0;
        const spd = (stats["speedrun_mode"] && stats["speedrun_mode"].played) || 0;
        const dbl = (stats["double_mode"] && stats["double_mode"].played) || 0;

        document.getElementById("st-total").innerText = `${std + cat + min + spd + dbl} Maç`;
        document.getElementById("c-std").innerText = std;
        document.getElementById("c-cat").innerText = cat;
        document.getElementById("c-min").innerText = min;
        document.getElementById("c-spd").innerText = spd;
        document.getElementById("c-dbl").innerText = dbl;

        const rate = min > 0 ? Math.round((minW / min) * 100) : 0;
        document.getElementById("st-mines-record").innerText = `${min} / ${minW}`;
        document.getElementById("st-mines-rate").innerText = `%${rate}`;
      });
    }

    function renderAvatars() {
      const box = document.getElementById("set-avatar-grid");
      box.innerHTML = "";
      AVATAR_LIST.forEach(av => {
        const d = document.createElement("div");
        d.className = "avatar-cell" + (av === tempAvatar ? " active" : "");
        d.innerText = av;
        d.onclick = () => { tempAvatar = av; renderAvatars(); };
        box.appendChild(d);
      });
    }

    function saveSettings() {
      const u = getActiveUser();
      const newName = document.getElementById("set-name").value.trim();
      u.title = document.getElementById("set-title").value;
      u.sound = document.getElementById("set-sound").checked;
      u.avatar = tempAvatar;

      if (newName && newName !== (u.displayName || u.name)) {
        changeUsernameGlobal(newName);
      } else {
        setActiveUser(u);
        alert("Ayarlar kaydedildi.");
        openDrawer(false);
        loadProfile();
      }
    }

    function logout() {
      localStorage.removeItem("kutu_active_session");
      location.href = "index.html";
    }
  </script>
</body>
</html>
