<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profilim</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="app-container" style="justify-content:space-between;">
    <div>
      <div class="top-header">
        <a href="menu.html" class="icon-btn" style="border-color:var(--danger);">‹ Lobi</a>
        <div style="font-weight:bold; font-size:12px;">👤 Oyuncu Profili</div>
        <div></div>
      </div>

      <div class="profile-badge-card">
        <div style="font-size:38px; margin-bottom:2px;" id="u-avatar-icon">👤</div>
        <h2 id="u-fullname" style="color:var(--neon-blue); font-size:15px;">...</h2>
        <div id="u-title-badge" style="color:var(--neon-gold); font-size:10px;">[Çaylak]</div>
        <div style="font-size:9px; color:#94a3b8; margin-top:4px;" id="u-created-at">Hesap Oluşturma: -</div>

        <div class="profile-stats-grid">
          <div class="stat-mini-box"><span class="stat-mini-val" id="u-total-played" style="color:var(--neon-blue);">0</span><span class="stat-mini-lbl">Oynanan</span></div>
          <div class="stat-mini-box"><span class="stat-mini-val" id="u-total-wins" style="color:var(--neon-green);">0</span><span class="stat-mini-lbl">Kazanma</span></div>
          <div class="stat-mini-box"><span class="stat-mini-val" id="u-total-losses" style="color:var(--danger);">0</span><span class="stat-mini-lbl">Kaybetme</span></div>
          <div class="stat-mini-box"><span class="stat-mini-val" id="u-total-winrate" style="color:var(--neon-gold);">%0</span><span class="stat-mini-lbl">Genel Oran</span></div>
        </div>
      </div>

      <div style="font-size:11px; font-weight:bold; color:var(--neon-gold); margin-bottom:4px;">📊 Mod Bazlı İstatistikler & Kazanma Oranları:</div>
      <div id="stats-table-box" style="display:flex; flex-direction:column; gap:4px; max-height:220px; overflow-y:auto;"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    window.onload = () => {
      const u = getActiveUser();
      if (!u) return window.location.href = "index.html";

      document.getElementById("u-avatar-icon").innerText = u.avatar || "👤";
      document.getElementById("u-fullname").innerText = `${u.name}${u.tag}`;
      document.getElementById("u-title-badge").innerText = `[${u.title || 'Çaylak'}]`;
      document.getElementById("u-created-at").innerText = `Hesap Oluşturma: ${u.createdAt || '-'}`;

      const stats = u.stats || {};
      let totalGames = 0, totalWins = 0, totalLosses = 0;

      const modNames = {
        standard: "Normal Kasa",
        ten_cases: "10 Kutu Modu",
        catch_basket: "Tut & Aç (Sepet)",
        catch_open: "Yakala & Aç",
        mines_mode: "Mayınlı Kasa",
        mega_mode: "Mega Kasa",
        speedrun_mode: "Speedrun Yarışı",
        bomb_mode: "Zaman Bombası",
        double_mode: "Çift Rulet",
        temple_mode: "Gizli Tapınak"
      };

      const box = document.getElementById("stats-table-box");
      box.innerHTML = "";

      for (let k in modNames) {
        const s = stats[k] || { played: 0, wins: 0, losses: 0, best: 0, bestTime: null };
        totalGames += s.played || 0;
        totalWins += s.wins || 0;
        totalLosses += s.losses || 0;

        const winRate = s.played > 0 ? Math.round((s.wins / s.played) * 100) : 0;
        const recVal = k === 'speedrun_mode' 
          ? (s.bestTime ? `${s.bestTime}s` : "-") 
          : `${s.best || 0} P`;

        box.innerHTML += `
          <div class="rank-card" style="font-size:9.5px; min-height:40px; padding:5px 8px;">
            <div>
              <b style="color:#fff;">${modNames[k]}</b><br>
              <span style="color:#94a3b8;">${s.played} Maç (${s.wins} Galibiyet / ${s.losses || 0} Mağlubiyet)</span><br>
              <b style="color:var(--neon-green); font-size:8.5px;">Kazanma Oranı: %${winRate}</b>
            </div>
            <div style="text-align:right;">
              <b style="color:var(--neon-gold); font-size:11px;">${recVal}</b>
            </div>
          </div>
        `;
      }

      document.getElementById("u-total-played").innerText = totalGames;
      document.getElementById("u-total-wins").innerText = totalWins;
      document.getElementById("u-total-losses").innerText = totalLosses;
      document.getElementById("u-total-winrate").innerText = totalGames > 0 ? `%${Math.round((totalWins / totalGames) * 100)}` : "%0";
    };
  </script>
</body>
</html>
