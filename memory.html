<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kart Eşleştirme</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: auto;
      width: 100%;
      max-width: 300px;
    }
    .memory-card {
      background: #111827;
      border: 2px solid var(--neon-purple);
      border-radius: 8px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s, background 0.2s;
    }
    .memory-card.flipped {
      background: #1e1b4b;
      border-color: #38bdf8;
    }
    .memory-card.matched {
      background: #064e3b !important;
      border-color: #10b981 !important;
      cursor: default;
    }
  </style>
</head>
<body class="bg-standard">
  <div class="app-container" style="justify-content:space-between;">
    <div>
      <div class="top-header">
        <a href="menu.html" class="icon-btn" style="border-color:var(--danger); z-index:999;">‹ Çıkış</a>
        <div style="font-weight:bold; font-size:12px;">🃏 Kart Eşleştirme</div>
        <div id="lbl-score" style="color:var(--neon-gold); font-weight:bold; font-size:12px;">0 P</div>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--text-dim); margin-top:2px;">
        <span>Hamle: <b id="lbl-moves" style="color:#fff;">0</b></span>
        <span>Eşleşen: <b id="lbl-matches" style="color:var(--neon-green);">0 / 4</b></span>
      </div>
    </div>

    <div class="memory-grid" id="memory-board"></div>

    <div>
      <button class="btn-start" style="background:#0284c7;" onclick="location.reload()">🔄 Yeniden Dağıt</button>
    </div>

    <!-- Özet Ekranı -->
    <div id="summary-overlay" class="modal-overlay">
      <div class="modal-card">
        <div style="font-size:14px; font-weight:bold; color:var(--neon-gold); text-align:center; margin-bottom:8px;">🏆 TÜM KARTLAR BULUNDU!</div>
        <div style="text-align:center; margin-bottom:8px; font-size:13px;">Kazanılan Puan: <b id="sum-score" style="color:var(--neon-green);">0 P</b></div>
        <div style="display:flex; gap:6px;">
          <button class="icon-btn" style="flex:1; background:var(--btn-blue); justify-content:center;" onclick="location.reload()">🔄 Tekrar</button>
          <a href="menu.html" class="icon-btn" style="flex:1; background:var(--danger); justify-content:center;">🚪 Lobi</a>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const ICONS = ["⚔️", "💎", "👑", "🔥"];
    let deck = [...ICONS, ...ICONS].sort(() => Math.random() - 0.5);
    let flippedCards = [], matchedCount = 0, moves = 0, totalScore = 0;

    window.onload = initMemory;

    function initMemory() {
      const board = document.getElementById("memory-board");
      board.innerHTML = "";
      deck.forEach((icon, idx) => {
        const card = document.createElement("div");
        card.className = "memory-card";
        card.dataset.icon = icon;
        card.dataset.index = idx;
        card.innerText = "❓";
        card.onclick = () => flipCard(card);
        board.appendChild(card);
      });
    }

    function flipCard(card) {
      if (card.classList.contains("flipped") || card.classList.contains("matched") || flippedCards.length >= 2) return;

      card.classList.add("flipped");
      card.innerText = card.dataset.icon;
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        moves++;
        document.getElementById("lbl-moves").innerText = moves;
        checkMatch();
      }
    }

    function checkMatch() {
      const [c1, c2] = flippedCards;
      if (c1.dataset.icon === c2.dataset.icon) {
        c1.classList.add("matched");
        c2.classList.add("matched");
        matchedCount++;
        totalScore += 75;
        document.getElementById("lbl-score").innerText = `${totalScore} P`;
        document.getElementById("lbl-matches").innerText = `${matchedCount} / 4`;
        flippedCards = [];

        if (matchedCount === 4) {
          setTimeout(showSummary, 500);
        }
      } else {
        setTimeout(() => {
          c1.classList.remove("flipped");
          c2.classList.remove("flipped");
          c1.innerText = "❓";
          c2.innerText = "❓";
          flippedCards = [];
        }, 700);
      }
    }

    function showSummary() {
      document.getElementById("sum-score").innerText = `${totalScore} P`;
      document.getElementById("summary-overlay").style.display = "flex";
      recordGameScore('memory_mode', 'Kart Eşleştirme', totalScore, [{name:"Kart Seti Tamamlandı", p:totalScore, c:"#10b981"}], true);
    }
  </script>
</body>
</html>
