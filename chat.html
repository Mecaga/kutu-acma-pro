<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sohbetler & Kanallar</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="lobby-header">
      <a href="menu.html" class="btn-sm" style="background:var(--danger);">‹ Çıkış</a>
      <div style="font-weight:bold; font-size:12px;">Sohbetler & Kanallar</div>
      <div class="btn-group">
        <button class="btn-sm" style="background:var(--btn-green);" onclick="loadChannels()">Katıl</button>
        <button class="btn-sm" style="background:var(--neon-purple);" onclick="createChannel()">Kanal Kur</button>
      </div>
    </div>

    <!-- 3 Bölüm -->
    <div class="chat-subnav">
      <div class="chat-subtab active" onclick="setTab(1)">1. Global Chat</div>
      <div class="chat-subtab" onclick="setTab(2)">2. Kanallar</div>
      <div class="chat-subtab" onclick="setTab(3)">3. Özel DM</div>
    </div>

    <div class="chat-area" id="box-global"></div>
    <div class="chat-area" id="box-channels" style="display:none;"></div>
    <div class="chat-area" id="box-dm" style="display:none;"></div>

    <div class="chat-input-bar">
      <input type="text" id="chat-msg" placeholder="Bir mesaj yazın...">
      <button class="btn-sm" style="background:var(--btn-green); border-radius:50%; width:36px; height:36px;" onclick="sendMsg()">➤</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let tab = 1;
    let dmTarget = localStorage.getItem("active_dm_target");

    window.onload = () => {
      listenGlobal();
      if (dmTarget) setTab(3);
    };

    function setTab(t) {
      tab = t;
      document.querySelectorAll(".chat-subtab").forEach((el, i) => el.classList.toggle("active", i + 1 === t));
      document.getElementById("box-global").style.display = t === 1 ? "flex" : "none";
      document.getElementById("box-channels").style.display = t === 2 ? "flex" : "none";
      document.getElementById("box-dm").style.display = t === 3 ? "flex" : "none";
      if (t === 2) loadChannels();
      if (t === 3 && dmTarget) listenDM();
    }

    function listenGlobal() {
      let u = getUser();
      db.ref("global_messages").limitToLast(35).on("value", snap => {
        let b = document.getElementById("box-global");
        b.innerHTML = "";
        snap.forEach(c => {
          let m = c.val(), k = c.key, isMe = m.uid === u.uid;
          b.innerHTML += `
            <div class="msg-bubble ${isMe ? 'me' : 'other'}">
              <div class="msg-author">${m.sender} [${m.title}]</div>
              <div id="txt-${k}">${m.text}</div>
              <div class="msg-actions">
                <span onclick="navigator.clipboard.writeText('${m.text}'); alert('Kopyalandı');">📋 Kopyala</span>
                ${isMe ? `<span onclick="editMsg('${k}')">✏️ Düzenle</span><span onclick="delMsg('${k}')" style="color:var(--danger)">🗑️ Sil</span>` : ''}
              </div>
            </div>
          `;
        });
        b.scrollTop = b.scrollHeight;
      });
    }

    function sendMsg() {
      let inp = document.getElementById("chat-msg");
      if (!inp.value.trim()) return;
      let u = getUser();

      if (tab === 1) {
        db.ref("global_messages").push({ uid: u.uid, sender: `${u.name}${u.tag}`, title: u.title, text: inp.value.trim() });
      } else if (tab === 3 && dmTarget) {
        let chatID = [u.uid, dmTarget].sort().join("_");
        db.ref("dm_messages/" + chatID).push({ uid: u.uid, sender: `${u.name}${u.tag}`, text: inp.value.trim() });
      }
      inp.value = "";
    }

    function editMsg(k) {
      let old = document.getElementById(`txt-${k}`).innerText;
      let val = prompt("Mesajı düzenle:", old);
      if (val && val !== old) db.ref(`global_messages/${k}/text`).set(val + " (düzenlendi)");
    }

    function delMsg(k) {
      if (confirm("Silinsin mi?")) db.ref(`global_messages/${k}`).remove();
    }

    function createChannel() {
      let name = prompt("Kanal Adı:");
      let isPriv = confirm("ÖZEL kanal mı olsun? (Tamam: Özel, İptal: Açık)");
      if (!name) return;
      let id = name.toLowerCase().replace(/\s+/g, '-');
      db.ref("custom_channels/" + id).set({ name: name, type: isPriv ? "Özel" : "Açık" });
      loadChannels();
    }

    function loadChannels() {
      db.ref("custom_channels").on("value", snap => {
        let b = document.getElementById("box-channels");
        b.innerHTML = "";
        snap.forEach(c => {
          let ch = c.val();
          b.innerHTML += `
            <div class="mode-card" style="display:flex; justify-content:space-between;">
              <span># ${ch.name}</span>
              <b style="color:${ch.type === 'Özel' ? 'var(--danger)' : 'var(--btn-green)'}">[${ch.type}]</b>
            </div>
          `;
        });
      });
    }

    function listenDM() {
      let u = getUser();
      let chatID = [u.uid, dmTarget].sort().join("_");
      db.ref("dm_messages/" + chatID).on("value", snap => {
        let b = document.getElementById("box-dm");
        b.innerHTML = `<div style="text-align:center; font-size:10px; color:var(--gold); margin-bottom:5px;">💬 Özel Sohbet</div>`;
        snap.forEach(c => {
          let m = c.val(), isMe = m.uid === u.uid;
          b.innerHTML += `
            <div class="msg-bubble ${isMe ? 'me' : 'other'}">
              <div>${m.text}</div>
            </div>
          `;
        });
        b.scrollTop = b.scrollHeight;
      });
    }
  </script>
</body>
</html>
