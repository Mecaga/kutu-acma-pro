<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sohbet Sistemi</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="app.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #020617; font-family: system-ui, sans-serif; color: #fff; }

    .chat-layout { width: 100%; max-width: 480px; height: 100dvh; margin: 0 auto; background: #030712; display: flex; flex-direction: column; position: relative; }
    .chat-header { flex-shrink: 0; background: #090d1a; border-bottom: 2px solid #1e293b; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .chat-tabs-bar { flex-shrink: 0; background: #0b1120; border-bottom: 1px solid #1e293b; display: flex; gap: 4px; padding: 5px 8px; }
    .chat-tab-btn { flex: 1; padding: 6px 2px; background: #1e293b; border: 1px solid #334155; color: #94a3b8; font-size: 9.5px; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; }
    .chat-tab-btn.active { background: #4338ca; border-color: var(--neon-gold); color: #fff; }

    .chat-main-view { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; -webkit-overflow-scrolling: touch; }
    .chat-main-view::-webkit-scrollbar { width: 3px; }
    .chat-main-view::-webkit-scrollbar-thumb { background: #3b1d6e; border-radius: 4px; }

    .msg-bubble { background: #0b1329; border: 1px solid #1e293b; border-radius: 8px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; max-width: 88%; word-break: break-word; font-size: 9.5px; }
    .msg-bubble.is-me { border-color: #38bdf8; background: #081a38; align-self: flex-end; }
    
    .chat-input-bar { flex-shrink: 0; background: #090d1a; border-top: 1px solid #1e293b; padding: 8px; display: none; gap: 6px; align-items: center; }
    .custom-list-card { background: #070d1e; border: 1px solid #1e293b; border-radius: 8px; padding: 7px 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .section-label { font-size: 8.5px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin: 4px 0 2px 0; }
  </style>
</head>
<body>
  <div class="chat-layout">
    <div class="chat-header">
      <div style="display:flex; align-items:center; gap:6px;">
        <a href="menu.html" class="icon-btn" style="border-color:var(--danger); padding:2px 6px; font-size:9.5px; text-decoration:none;">‹ Lobi</a>
        <button id="btn-sub-back" class="icon-btn" style="display:none; padding:2px 6px; font-size:9px;" onclick="exitSubChat()">‹ Geri</button>
      </div>
      <div id="lbl-chat-title" style="font-weight:900; font-size:11.5px; color:#38bdf8;">🌐 Global Sohbet</div>
      <div id="lbl-status" style="font-size:8px; color:var(--neon-green);">● Çevrimiçi</div>
    </div>

    <div class="chat-tabs-bar" id="tabs-bar">
      <button type="button" class="chat-tab-btn active" id="tab-global" onclick="switchNav('global')">🌐 Global</button>
      <button type="button" class="chat-tab-btn" id="tab-channels" onclick="switchNav('channels')">📢 Kanallar</button>
      <button type="button" class="chat-tab-btn" id="tab-friends" onclick="switchNav('friends')">👥 Arkadaşlar</button>
    </div>

    <div class="chat-main-view" id="main-view"></div>

    <div class="chat-input-bar" id="input-bar">
      <input type="text" id="in-msg" class="input-field" style="margin:0; font-size:10.5px; padding:7px; flex:1;" placeholder="Mesajınızı yazın..." maxlength="150" onkeydown="if(event.key==='Enter') sendCurrentMessage()">
      <button type="button" class="btn-start" style="padding:7px 12px; font-size:10px; width:auto;" onclick="sendCurrentMessage()">Gönder</button>
    </div>
  </div>

  <!-- KANAL KURMA MODALI -->
  <div id="modal-create-channel" class="modal-overlay">
    <div class="modal-card">
      <div style="font-size:12px; font-weight:bold; color:var(--neon-gold); text-align:center; margin-bottom:6px;">📢 Yeni Kanal Kur</div>
      <input type="text" id="new-chan-name" class="input-field" placeholder="Kanal Adı (Örn: Pro Klanı)">
      <input type="text" id="new-chan-tag" class="input-field" placeholder="Klan Etiketi (Örn: #PRO)">
      <input type="password" id="new-chan-pwd" class="input-field" placeholder="Kanal Şifresi (İsteğe bağlı)">
      <button type="button" class="btn-start" style="background:#16a34a; font-size:10px; padding:7px; margin-top:4px;" onclick="createChannelSubmit()">Kanalı Oluştur</button>
      <button type="button" class="btn-close" style="margin-top:4px;" onclick="closeModals()">Kapat</button>
    </div>
  </div>

  <!-- KANALA KATILMA MODALI -->
  <div id="modal-join-channel-direct" class="modal-overlay">
    <div class="modal-card">
      <div style="font-size:12px; font-weight:bold; color:#38bdf8; text-align:center; margin-bottom:6px;">🔑 Kanala Katıl</div>
      <input type="text" id="direct-chan-id" class="input-field" placeholder="Kanal ID veya Adı">
      <input type="password" id="direct-chan-pwd" class="input-field" placeholder="Şifre (Varsa)">
      <button type="button" class="btn-start" style="background:#0284c7; font-size:10px; padding:7px; margin-top:4px;" onclick="joinChannelDirectSubmit()">Giriş Yap</button>
      <button type="button" class="btn-close" style="margin-top:4px;" onclick="closeModals()">Kapat</button>
    </div>
  </div>

  <script>
    let currentNav = 'global';
    let subChatType = null;
    let subTargetId = null;
    let subTargetName = null;
    let activeUser = null;
    let activeListener = null;

    window.onload = () => {
      activeUser = getActiveUser();
      if (!activeUser) return location.href = "index.html";
      switchNav('global');
    };

    function closeModals() {
      document.querySelectorAll(".modal-overlay").forEach(m => m.style.display = "none");
    }

    function switchNav(navKey) {
      currentNav = navKey;
      subChatType = null;
      subTargetId = null;
      document.getElementById("btn-sub-back").style.display = "none";
      document.getElementById("tabs-bar").style.display = "flex";

      document.querySelectorAll(".chat-tab-btn").forEach(b => b.classList.remove("active"));
      const btn = document.getElementById("tab-" + navKey);
      if (btn) btn.classList.add("active");

      const inputBar = document.getElementById("input-bar");

      if (navKey === 'global') {
        document.getElementById("lbl-chat-title").innerText = "🌐 Global Sohbet";
        inputBar.style.display = "flex";
        renderGlobalMessages();
      } else if (navKey === 'channels') {
        document.getElementById("lbl-chat-title").innerText = "📢 Kanallar";
        inputBar.style.display = "none";
        renderChannelsList();
      } else if (navKey === 'friends') {
        document.getElementById("lbl-chat-title").innerText = "👥 Arkadaşlar";
        inputBar.style.display = "none";
        renderFriendsCategorizedList();
      }
    }

    function renderGlobalMessages() {
      const view = document.getElementById("main-view");
      view.innerHTML = "<div style='color:#64748b; font-size:9px; text-align:center; padding:15px;'>Global akış yükleniyor...</div>";
      if (activeListener) activeListener.off();

      activeListener = db.ref("messages/global").limitToLast(50);
      activeListener.on("value", snap => {
        if (currentNav !== 'global' || subChatType) return;
        renderMessageList(snap, "messages/global");
      });
    }

    function renderChannelsList() {
      if (activeListener) activeListener.off();
      const view = document.getElementById("main-view");
      view.innerHTML = `
        <div style="display:flex; gap:6px; margin-bottom:6px;">
          <button type="button" class="btn-start" style="flex:1; background:#16a34a; font-size:9px; padding:7px;" onclick="document.getElementById('modal-create-channel').style.display='flex'">➕ Kanal Kur</button>
          <button type="button" class="btn-start" style="flex:1; background:#0284c7; font-size:9px; padding:7px;" onclick="document.getElementById('modal-join-channel-direct').style.display='flex'">🔑 Kanala Katıl</button>
        </div>
        <div class="section-label">📋 Aktif Kanallar</div>
        <div id="channels-feed" style="display:flex; flex-direction:column; gap:4px;"></div>
      `;

      db.ref("chat_channels").on("value", snap => {
        if (currentNav !== 'channels' || subChatType) return;
        const feed = document.getElementById("channels-feed");
        if (!feed) return;
        feed.innerHTML = "";

        if (!snap.exists()) {
          feed.innerHTML = "<div style='color:#64748b; font-size:9px; text-align:center; padding:15px;'>Henüz kanal açılmamış.</div>";
          return;
        }

        snap.forEach(c => {
          const chan = c.val();
          const cId = c.key;
          const isLocked = !!chan.password;

          const card = document.createElement("div");
          card.className = "custom-list-card";
          card.innerHTML = `
            <div>
              <b style="color:#38bdf8; font-size:10px;">${isLocked ? '🔒' : '📢'} ${chan.name}</b>
              <span style="font-size:8px; color:var(--neon-gold);">${chan.tag || ''}</span>
              <div style="font-size:7px; color:#64748b;">Kurucu: ${chan.ownerName}</div>
            </div>
            <button class="icon-btn" style="background:#0284c7; font-size:8px; padding:3px 6px;">Giriş ›</button>
          `;
          card.onclick = () => {
            if (isLocked) {
              const pass = prompt("Kanal Şifresi:");
              if (pass !== chan.password) return alert("Hatalı şifre!");
            }
            enterChannelChat(cId, chan.name);
          };
          feed.appendChild(card);
        });
      });
    }

    function createChannelSubmit() {
      const name = document.getElementById("new-chan-name").value.trim();
      const tag = document.getElementById("new-chan-tag").value.trim();
      const pwd = document.getElementById("new-chan-pwd").value.trim();

      if (!name) return alert("Kanal adı giriniz!");
      const cKey = "chan_" + Date.now().toString(36);

      db.ref("chat_channels/" + cKey).set({
        name: name,
        tag: tag,
        password: pwd || null,
        ownerKey: String(activeUser.username).toLowerCase(),
        ownerName: activeUser.displayName,
        createdAt: Date.now()
      }).then(() => {
        closeModals();
        enterChannelChat(cKey, name);
      });
    }

    function joinChannelDirectSubmit() {
      const query = document.getElementById("direct-chan-id").value.trim().toLowerCase();
      const pwd = document.getElementById("direct-chan-pwd").value.trim();
      if (!query) return alert("Kanal ID veya adı girin!");

      db.ref("chat_channels").once("value", snap => {
        let foundKey = null, foundChan = null;
        snap.forEach(c => {
          if (c.key.toLowerCase() === query || c.val().name.toLowerCase() === query) {
            foundKey = c.key;
            foundChan = c.val();
          }
        });

        if (!foundKey) return alert("Kanal bulunamadı!");
        if (foundChan.password && foundChan.password !== pwd) return alert("Hatalı şifre!");

        closeModals();
        enterChannelChat(foundKey, foundChan.name);
      });
    }

    function enterChannelChat(cId, cName) {
      subChatType = 'channel';
      subTargetId = cId;
      subTargetName = cName;

      document.getElementById("lbl-chat-title").innerText = "📢 " + cName;
      document.getElementById("btn-sub-back").style.display = "inline-block";
      document.getElementById("tabs-bar").style.display = "none";
      document.getElementById("input-bar").style.display = "flex";

      if (activeListener) activeListener.off();
      activeListener = db.ref(`channel_messages/${cId}`).limitToLast(50);
      activeListener.on("value", snap => renderMessageList(snap, `channel_messages/${cId}`));
    }

    function renderFriendsCategorizedList() {
      if (activeListener) activeListener.off();
      const view = document.getElementById("main-view");
      view.innerHTML = "<div style='color:#64748b; font-size:9px; text-align:center; padding:15px;'>Arkadaşlar taranıyor...</div>";

      const myKey = String(activeUser.username).toLowerCase();

      Promise.all([
        db.ref(`friends/${myKey}`).once("value"),
        db.ref(`dms_active/${myKey}`).once("value"),
        db.ref("accounts").once("value")
      ]).then(([fSnap, dmsSnap, accSnap]) => {
        if (currentNav !== 'friends' || subChatType) return;
        view.innerHTML = "";

        if (!fSnap.exists()) {
          view.innerHTML = "<div style='color:#64748b; font-size:9px; text-align:center; padding:20px;'>Ekli arkadaşınız yok. Sıralama ekranından ekleyebilirsiniz!</div>";
          return;
        }

        const activeDms = dmsSnap.val() || {};
        const allAccounts = accSnap.val() || {};

        let opened = [];
        let unopened = [];

        fSnap.forEach(c => {
          const fKey = c.key.toLowerCase();
          const fData = allAccounts[fKey] || { displayName: fKey, avatar: '👤', title: 'Çaylak', tag: '' };
          if (activeDms[fKey]) opened.push({ key: fKey, data: fData });
          else unopened.push({ key: fKey, data: fData });
        });

        const openBox = document.createElement("div");
        openBox.innerHTML = `<div class="section-label">💬 Sohbet Başlatılan Arkadaşlar (${opened.length})</div>`;
        if (opened.length === 0) {
          openBox.innerHTML += `<div style="color:#475569; font-size:8px; padding:6px; background:#070d1e; border-radius:6px;">Aktif sohbet yok.</div>`;
        } else {
          opened.forEach(item => {
            const card = document.createElement("div");
            card.className = "custom-list-card";
            card.style.borderColor = "#1e3a8a";
            card.innerHTML = `
              <div style="display:flex; align-items:center; gap:6px;">
                <span style="font-size:20px;">${item.data.avatar || '👤'}</span>
                <div>
                  <b style="color:#fff; font-size:10px;">${item.data.displayName} <small style="color:var(--neon-gold);">${item.data.tag || ''}</small></b>
                  <div style="font-size:7.5px; color:#38bdf8;">Konuşmaya devam et ›</div>
                </div>
              </div>
              <button class="icon-btn" style="background:#0284c7; font-size:8px; padding:3px 8px;">Aç ›</button>
            `;
            card.onclick = () => enterDirectChat(item.key, item.data.displayName);
            openBox.appendChild(card);
          });
        }
        view.appendChild(openBox);

        const unopenBox = document.createElement("div");
        unopenBox.innerHTML = `<div class="section-label" style="margin-top:8px;">💤 Diğer Arkadaşlar (${unopened.length})</div>`;
        if (unopened.length === 0) {
          unopenBox.innerHTML += `<div style="color:#475569; font-size:8px; padding:6px; background:#070d1e; border-radius:6px;">Tüm arkadaşlarınızla sohbet başlatıldı!</div>`;
        } else {
          unopened.forEach(item => {
            const card = document.createElement("div");
            card.className = "custom-list-card";
            card.innerHTML = `
              <div style="display:flex; align-items:center; gap:6px;">
                <span style="font-size:18px;">${item.data.avatar || '👤'}</span>
                <div>
                  <b style="color:#94a3b8; font-size:9.5px;">${item.data.displayName} <small style="color:var(--neon-gold);">${item.data.tag || ''}</small></b>
                  <div style="font-size:7px; color:#64748b;">Mesaj yok</div>
                </div>
              </div>
              <button class="icon-btn" style="background:#16a34a; font-size:8px; padding:3px 8px;">💬 Mesaj At</button>
            `;
            card.onclick = () => enterDirectChat(item.key, item.data.displayName);
            unopenBox.appendChild(card);
          });
        }
        view.appendChild(unopenBox);
      });
    }

    function enterDirectChat(friendKey, friendName) {
      subChatType = 'dm';
      subTargetId = friendKey;
      subTargetName = friendName;

      const myKey = String(activeUser.username).toLowerCase();
      db.ref(`dms_active/${myKey}/${friendKey}`).set(Date.now());
      db.ref(`dms_active/${friendKey}/${myKey}`).set(Date.now());

      document.getElementById("lbl-chat-title").innerText = "👤 " + friendName;
      document.getElementById("btn-sub-back").style.display = "inline-block";
      document.getElementById("tabs-bar").style.display = "none";
      document.getElementById("input-bar").style.display = "flex";

      const dmRoomId = [myKey, friendKey].sort().join("__dm__");
      if (activeListener) activeListener.off();
      activeListener = db.ref(`dm_messages/${dmRoomId}`).limitToLast(50);
      activeListener.on("value", snap => renderMessageList(snap, `dm_messages/${dmRoomId}`));
    }

    function exitSubChat() {
      if (activeListener) activeListener.off();
      subChatType = null;
      subTargetId = null;
      document.getElementById("btn-sub-back").style.display = "none";
      document.getElementById("input-bar").style.display = "none";
      document.getElementById("tabs-bar").style.display = "flex";

      if (currentNav === 'channels') renderChannelsList();
      else if (currentNav === 'friends') renderFriendsCategorizedList();
    }

    function renderMessageList(snap, dbPath) {
      const view = document.getElementById("main-view");
      view.innerHTML = "";
      if (!snap.exists()) {
        view.innerHTML = "<div style='color:#64748b; font-size:9px; text-align:center; padding:20px;'>İlk mesajı yazın!</div>";
        return;
      }

      const myKey = String(activeUser.username).toLowerCase();
      snap.forEach(c => {
        const m = c.val();
        const mId = c.key;
        const isMe = m.senderKey === myKey;

        const bubble = document.createElement("div");
        bubble.className = "msg-bubble" + (isMe ? " is-me" : "");

        const actionBtns = isMe ? `
          <span style="cursor:pointer; margin-left:6px; color:#38bdf8;" onclick="editMessage('${dbPath}', '${mId}', '${encodeURIComponent(m.text)}')">✏️</span>
          <span style="cursor:pointer; margin-left:4px; color:#ef4444;" onclick="deleteMessage('${dbPath}', '${mId}')">🗑️</span>
        ` : "";

        bubble.innerHTML = `
          <div style="display:flex; justify-content:space-between; font-size:7.5px; margin-bottom:1px;">
            <span>${m.avatar || '👤'} <b style="color:${isMe ? '#38bdf8' : '#fff'};">${m.senderName}</b> <small style="color:var(--neon-gold);">${m.tag || ''}</small></span>
            <span style="color:#64748b;">${m.time || ''} ${m.isEdited ? '<small>(düzenlendi)</small>' : ''} ${actionBtns}</span>
          </div>
          <div style="font-size:10px; color:#e2e8f0;">${m.text}</div>
        `;
        view.appendChild(bubble);
      });
      view.scrollTop = view.scrollHeight;
    }

    function sendCurrentMessage() {
      const input = document.getElementById("in-msg");
      const text = input.value.trim();
      if (!text) return;

      const myKey = String(activeUser.username).toLowerCase();
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      const payload = {
        senderKey: myKey,
        senderName: activeUser.displayName,
        tag: activeUser.tag || '',
        avatar: activeUser.avatar || "👤",
        title: activeUser.title || "Çaylak",
        text: text,
        time: timeStr,
        timestamp: Date.now()
      };

      SoundFX.play('msg');

      let targetRef = null;
      if (currentNav === 'global' && !subChatType) {
        targetRef = db.ref("messages/global");
      } else if (subChatType === 'channel') {
        targetRef = db.ref(`channel_messages/${subTargetId}`);
      } else if (subChatType === 'dm') {
        const dmRoomId = [myKey, subTargetId].sort().join("__dm__");
        targetRef = db.ref(`dm_messages/${dmRoomId}`);
        db.ref(`dms_active/${subTargetId}/${myKey}`).set(Date.now());
        db.ref(`dms_active/${myKey}/${subTargetId}`).set(Date.now());
      }

      if (targetRef) {
        targetRef.push(payload).then(() => {
          input.value = "";
        });
      }
    }

    function editMessage(dbPath, mId, currentTextEnc) {
      const oldText = decodeURIComponent(currentTextEnc);
      const newText = prompt("Mesajı düzenleyin:", oldText);
      if (newText !== null && newText.trim() !== "" && newText !== oldText) {
        db.ref(`${dbPath}/${mId}`).update({
          text: newText.trim(),
          isEdited: true
        });
      }
    }

    function deleteMessage(dbPath, mId) {
      if (confirm("Mesajı silmek istediğinize emin misiniz?")) {
        db.ref(`${dbPath}/${mId}`).remove();
      }
    }
  </script>
</body>
</html>
