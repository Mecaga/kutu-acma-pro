<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Sohbet</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body style="padding: 10px;">

    <div class="chat-wrapper">
        <div class="chat-top">
            <button class="btn btn-danger" style="font-size: 12px; padding: 6px 10px;" onclick="location.href='menu.html'">‹ Sohbetler</button>
            <div style="font-weight: bold; color: #60a5fa;" id="active-chat-title">🌐 Genel Sohbet</div>
            <select id="channel-dropdown" onchange="changeChannel(this.value)" style="width: 110px; padding: 4px; font-size: 12px;">
                <option value="genel"># Genel</option>
            </select>
        </div>

        <div style="padding: 6px 12px; background: #120924; display: flex; gap: 6px; border-bottom: 1px solid #3b206b;">
            <input type="text" id="new-ch-name" placeholder="Kanal Adı..." style="padding: 6px; font-size: 12px; border-radius: 6px; flex: 1; background: #0a0514; border: 1px solid #3b206b; color: #fff;">
            <button class="btn btn-purple" style="font-size: 12px; padding: 6px 12px;" onclick="createChannel()">Kanal Aç</button>
        </div>

        <div class="chat-msgs-area" id="chat-stream"></div>

        <div class="chat-input-bar">
            <input type="text" id="chat-input" placeholder="Bir mesaj yazın...">
            <button class="btn btn-green" style="border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;" onclick="sendMsg()">➤</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        let currentCh = "genel";

        window.onload = () => {
            renderHeader();
            listenChannels();
            listenMessages(currentCh);
        };

        function createChannel() {
            let name = document.getElementById("new-ch-name").value.trim();
            if (!name) return alert("Kanal adı girin!");
            let id = name.toLowerCase().replace(/\s+/g, '-');
            db.ref("channels/" + id).set({ title: name });
            document.getElementById("new-ch-name").value = "";
        }

        function listenChannels() {
            db.ref("channels").on("value", snap => {
                let sel = document.getElementById("channel-dropdown");
                sel.innerHTML = '<option value="genel"># Genel</option>';
                snap.forEach(c => {
                    sel.innerHTML += `<option value="${c.key}"># ${c.val().title}</option>`;
                });
            });
        }

        function changeChannel(val) {
            currentCh = val;
            document.getElementById("active-chat-title").innerText = "# " + val;
            listenMessages(val);
        }

        function listenMessages(chId) {
            let u = getCurrentUser();
            db.ref("chat_messages/" + chId).limitToLast(40).on("value", snap => {
                let stream = document.getElementById("chat-stream");
                stream.innerHTML = "";
                snap.forEach(child => {
                    let msg = child.val();
                    let key = child.key;
                    let isMe = msg.uid === u.uid;

                    let bubble = document.createElement("div");
                    bubble.className = `chat-bubble ${isMe ? 'me' : 'other'}`;
                    bubble.innerHTML = `
                        <div class="chat-meta">${msg.author} <span style="color:#c084fc;">[${msg.title}]</span></div>
                        <div id="msg-text-${key}">${msg.text}</div>
                        <div class="chat-time">${msg.time}</div>
                        <div class="chat-actions">
                            <span onclick="copyMsg('${encodeURIComponent(msg.text)}')">📋 Kopyala</span>
                            ${isMe ? `<span onclick="editMsg('${chId}', '${key}')">✏️ Düzenle</span>` : ''}
                            ${isMe ? `<span onclick="deleteMsg('${chId}', '${key}')" style="color:var(--danger)">🗑️ Sil</span>` : ''}
                        </div>
                    `;
                    stream.appendChild(bubble);
                });
                stream.scrollTop = stream.scrollHeight;
            });
        }

        function sendMsg() {
            let input = document.getElementById("chat-input");
            if (!input.value.trim()) return;
            let u = getCurrentUser();
            let now = new Date();
            let timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            db.ref("chat_messages/" + currentCh).push({
                uid: u.uid,
                author: `${u.username}${u.tag}`,
                title: u.title,
                text: input.value.trim(),
                time: timeStr
            });
            input.value = "";
        }

        function copyMsg(text) {
            navigator.clipboard.writeText(decodeURIComponent(text));
            alert("Mesaj kopyalandı!");
        }

        function editMsg(chId, key) {
            let cur = document.getElementById(`msg-text-${key}`).innerText;
            let updated = prompt("Mesajı düzenle:", cur);
            if (updated && updated !== cur) {
                db.ref(`chat_messages/${chId}/${key}/text`).set(updated + " (düzenlendi)");
            }
        }

        function deleteMsg(chId, key) {
            if (confirm("Mesajı silmek istiyor musun?")) {
                db.ref(`chat_messages/${chId}/${key}`).remove();
            }
        }
    </script>
</body>
</html>
