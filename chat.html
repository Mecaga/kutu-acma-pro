<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sohbetler & Kanallar</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="top-header">
      <a href="menu.html" class="icon-btn" style="border-color:var(--danger);">‹ Çıkış</a>
      <div style="font-weight:bold; font-size:12px;">Sohbet & Kanallar</div>
      <div class="btn-group-top">
        <button class="icon-btn" style="border-color:var(--btn-green);" onclick="joinChannel()">Katıl</button>
        <button class="icon-btn" style="border-color:var(--neon-purple);" onclick="createChannel()">Kanal Kur</button>
      </div>
    </div>

    <!-- 1. BÖLÜM: GLOBAL CHAT -->
    <div class="section-block">
      <div class="section-title"><span>🌐 1. Global Chat (Herkese Açık)</span></div>
      <div class="chat-scroll-box" id="box-global"></div>
      <div class="chat-input-row">
        <input type="text" id="in-global" placeholder="Global mesaj yaz...">
        <button class="icon-btn" style="background:var(--btn-green);" onclick="sendGlobal()">➤</button>
      </div>
    </div>

    <!-- 2. BÖLÜM: KANALLAR (kanaladı#id) -->
    <div class="section-block">
      <div class="section-title"><span>📡 2. Kanallar (Açık / Özel)</span></div>
      <div style="padding:6px; max-height:110px; overflow-y:auto; display:flex; flex-direction:column; gap:4px;" id="box-channels"></div>
    </div>

    <!-- 3. BÖLÜM: ÖZEL DM -->
    <div class="section-block">
      <div class="section-title"><span id="dm-title">💬 3. Özel Arkadaş Sohbeti</span></div>
      <div class="chat-scroll-box" id="box-dm">
        <div style="text-align:center; color:#64748b; font-size:10px; margin-top:20px;">Arkadaşlar sayfasından bir arkadaş seçip mesaja basın.</div>
      </div>
      <div class="chat-input-row">
        <input type="text" id="in-dm" placeholder="Özel mesaj yaz...">
        <button class="icon-btn" style="background:var(--neon-purple);" onclick="sendDM()">➤</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let activeDM = localStorage.getItem("active_dm_target");
    let activeDMName = localStorage.getItem("active_dm_name");

    window.onload = () => {
      listenGlobal();
      listenChannels();
      if (activeDM) initDM();
    };

    function listenGlobal() {
      const u = getActiveUser();
      db.ref("global_chat").limitToLast(30).on("value", snap => {
        const box = document.getElementById("box-global");
        box.innerHTML = "";
        snap.forEach(c => {
          const m = c.val(), k = c.key, isMe = m.uid === u.uid;
          box.innerHTML += `
            <div class="msg-bubble ${isMe ? 'me' : 'other'}">
              <div style="font-size:9px; color:#60a5fa; font-weight:bold;">${m.sender}</div>
              <div id="gtxt-${k}">${m.text}</div>
              <div class="msg-actions">
                <span onclick="navigator.clipboard.writeText('${m.text}'); alert('Kopyalandı');">📋</span>
                ${isMe ? `<span onclick="editMsg('${k}')">✏️</span><span onclick="delMsg('${k}')" style="color:var(--danger)">🗑️</span>` : ''}
              </div>
            </div>
          `;
        });
        box.scrollTop = box.scrollHeight;
      });
    }

    function sendGlobal() {
      const inp = document.getElementById("in-global");
      if (!inp.value.trim()) return;
      const u = getActiveUser();
      db.ref("global_chat").push({ uid: u.uid, sender: `${u.name}${u.tag}`, text: inp.value.trim() });
      inp.value = "";
    }

    function editMsg(k) {
      const old = document.getElementById(`gtxt-${k}`).innerText;
      const val = prompt("Mesajı düzenle:", old);
      if (val && val !== old) db.ref(`global_chat/${k}/text`).set(val + " (düzenlendi)");
    }
    function delMsg(k) {
      if (confirm("Silinsin mi?")) db.ref(`global_chat/${k}`).remove();
    }

    function createChannel() {
      const name = prompt("Kanal Adı:");
      if (!name) return;
      const isPriv = confirm("Kanal ÖZEL mi olsun? (Tamam: Özel, İptal: Açık)");
      const chId = `${name.toLowerCase()}#${Math.floor(1000 + Math.random()*9000)}`;
      db.ref("channels/" + chId.replace('#','_')).set({ name: chId, type: isPriv ? "Özel" : "Açık" });
    }

    function joinChannel() {
      const target = prompt("Katılmak istediğiniz kanaladı#id girin:");
      if (target) alert(`${target} kanalına katıldınız!`);
    }

    function listenChannels() {
      db.ref("channels").on("value", snap => {
        const box = document.getElementById("box-channels");
        box.innerHTML = "";
        snap.forEach(c => {
          const ch = c.val();
          box.innerHTML += `
            <div style="background:#090d1a; padding:4px 8px; border-radius:6px; display:flex; justify-content:space-between; font-size:10px;">
              <span># ${ch.name}</span>
              <b style="color:${ch.type === 'Özel' ? 'var(--danger)' : 'var(--btn-green)'};">[${ch.type}]</b>
            </div>
          `;
        });
      });
    }

    function initDM() {
      const u = getActiveUser();
      document.getElementById("dm-title").innerText = `💬 3. Özel: ${activeDMName || activeDM}`;
      const chatID = [u.uid, activeDM].sort().join("_");

      db.ref("dm_chats/" + chatID).limitToLast(30).on("value", snap => {
        const box = document.getElementById("box-dm");
        box.innerHTML = "";
        snap.forEach(c => {
          const m = c.val(), isMe = m.uid === u.uid;
          box.innerHTML += `
            <div class="msg-bubble ${isMe ? 'me' : 'other'}">
              <div>${m.text}</div>
            </div>
          `;
        });
        box.scrollTop = box.scrollHeight;
      });
    }

    function sendDM() {
      const inp = document.getElementById("in-dm");
      if (!inp.value.trim() || !activeDM) return;
      const u = getActiveUser();
      const chatID = [u.uid, activeDM].sort().join("_");
      db.ref("dm_chats/" + chatID).push({ uid: u.uid, text: inp.value.trim() });
      inp.value = "";
    }
  </script>
</body>
</html>
