<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sohbet & Kanallar</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="app-container" style="justify-content:space-between;">
    <div>
      <div class="top-header">
        <a href="menu.html" class="icon-btn" style="border-color:var(--danger);">‹ Lobi</a>
        <div id="active-chat-title" style="font-weight:bold; font-size:12px; color:var(--neon-gold);">💬 #genel</div>
        <div></div>
      </div>

      <!-- 3'lü Sekme: Global, Kanallar, Arkadaşlar (DM) -->
      <div style="display:flex; gap:3px; margin-bottom:6px;">
        <button class="mode-btn" id="tab-global" style="flex:1; background:var(--btn-blue); font-size:10px; text-align:center;" onclick="switchChatType('global')">🌐 Global</button>
        <button class="mode-btn" id="tab-channels" style="flex:1; font-size:10px; text-align:center;" onclick="switchChatType('channels')">📡 Kanallar</button>
        <button class="mode-btn" id="tab-dm" style="flex:1; font-size:10px; text-align:center;" onclick="switchChatType('dm')">👥 DM (Arkadaşlar)</button>
      </div>

      <!-- Kanallar Listesi & Kurma -->
      <div id="channels-panel" style="display:none; background:#070212; border:1px solid var(--neon-purple); border-radius:8px; padding:6px; margin-bottom:6px;">
        <div style="display:flex; gap:4px; margin-bottom:4px;">
          <input type="text" id="in-chan-name" class="input-field" style="margin:0; font-size:10px;" placeholder="Kanal Kur / Katıl...">
          <button class="icon-btn" style="background:var(--neon-green); white-space:nowrap;" onclick="joinOrCreateChannel()">Katıl</button>
        </div>
        <div id="channels-sublist" style="display:flex; gap:4px; overflow-x:auto; padding-bottom:2px;"></div>
      </div>

      <!-- Arkadaşlar (DM) Listesi -->
      <div id="dm-friends-panel" style="display:none; background:#070212; border:1px solid var(--neon-gold); border-radius:8px; padding:6px; margin-bottom:6px;">
        <div style="font-size:9px; color:var(--text-dim); margin-bottom:3px;">Mesajlaşmak için arkadaşını seç:</div>
        <div id="dm-friends-sublist" style="display:flex; gap:4px; overflow-x:auto; padding-bottom:2px;"></div>
      </div>
    </div>

    <!-- Mesaj Listesi -->
    <div id="chat-messages-box" style="flex:1; background:#040814; border:1px solid #1e293b; border-radius:8px; padding:8px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; margin:4px 0;"></div>

    <!-- Mesaj Yazma Barı -->
    <div style="display:flex; gap:4px;">
      <input type="text" id="in-msg-txt" class="input-field" style="margin:0; text-align:left; font-size:11px;" placeholder="Mesajınızı yazın..." onkeydown="if(event.key==='Enter') sendChatMessage()">
      <button class="icon-btn" style="background:var(--neon-purple); padding:0 14px;" onclick="sendChatMessage()">Gönder</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let currentMode = "global"; // 'global' | 'channel' | 'dm'
    let currentTarget = "genel"; // kanal adı veya DM arkadaş UID
    let currentTargetName = "Genel Sohbet";

    window.onload = () => {
      loadGlobalChat();
    };

    function switchChatType(type) {
      currentMode = type;
      document.getElementById("tab-global").style.background = type === 'global' ? 'var(--btn-blue)' : '#13072b';
      document.getElementById("tab-channels").style.background = type === 'channels' ? 'var(--btn-blue)' : '#13072b';
      document.getElementById("tab-dm").style.background = type === 'dm' ? 'var(--btn-blue)' : '#13072b';

      document.getElementById("channels-panel").style.display = type === 'channels' ? 'block' : 'none';
      document.getElementById("dm-friends-panel").style.display = type === 'dm' ? 'block' : 'none';

      if (type === 'global') {
        loadGlobalChat();
      } else if (type === 'channels') {
        loadChannelsList();
      } else if (type === 'dm') {
        loadDMFriendsList();
      }
    }

    function loadGlobalChat() {
      currentMode = "global";
      currentTarget = "genel";
      document.getElementById("active-chat-title").innerText = "💬 #genel (Global)";
      listenMessages(`channel_msgs/genel`);
    }

    function loadChannelsList() {
      db.ref("channels").on("value", snap => {
        const box = document.getElementById("channels-sublist");
        box.innerHTML = `<button class="icon-btn" style="background:#1e1b4b;" onclick="openChannel('genel')">#genel</button>`;
        if (snap.exists()) {
          snap.forEach(c => {
            box.innerHTML += `<button class="icon-btn" style="background:#1e1b4b;" onclick="openChannel('${c.key}')">#${c.key}</button>`;
          });
        }
      });
    }

    function joinOrCreateChannel() {
      const val = document.getElementById("in-chan-name").value.trim().toLowerCase().replace(/[^a-z0-9]/g, '_');
      if (!val) return;
      db.ref("channels/" + val).set({ name: val, createdAt: Date.now() });
      openChannel(val);
      document.getElementById("in-chan-name").value = "";
    }

    function openChannel(chanKey) {
      currentMode = "channel";
      currentTarget = chanKey;
      document.getElementById("active-chat-title").innerText = `📡 #${chanKey}`;
      listenMessages(`channel_msgs/${chanKey}`);
    }

    function loadDMFriendsList() {
      const u = getActiveUser();
      if (!u) return;

      db.ref("friends/" + u.uid).on("value", snap => {
        const box = document.getElementById("dm-friends-sublist");
        box.innerHTML = "";
        if (!snap.exists()) {
          box.innerHTML = "<div style='color:#666; font-size:9px;'>Ekli arkadaşınız yok.</div>";
          return;
        }

        snap.forEach(c => {
          const f = c.val();
          box.innerHTML += `<button class="icon-btn" style="background:#1e1b4b;" onclick="openDM('${c.key}', '${f.fullName}')">👤 ${f.fullName}</button>`;
        });
      });
    }

    function openDM(friendUID, friendName) {
      const u = getActiveUser();
      currentMode = "dm";
      currentTarget = friendUID;
      currentTargetName = friendName;
      document.getElementById("active-chat-title").innerText = `🔒 DM: ${friendName}`;

      // İki kullanıcı için ortak benzersiz DM odası anahtarı
      const chatRoomId = u.uid < friendUID ? `${u.uid}_${friendUID}` : `${friendUID}_${u.uid}`;
      listenMessages(`direct_msgs/${chatRoomId}`);
    }

    function listenMessages(dbPath) {
      const u = getActiveUser();
      db.ref(dbPath).limitToLast(40).on("value", snap => {
        const box = document.getElementById("chat-messages-box");
        box.innerHTML = "";
        if (!snap.exists()) {
          box.innerHTML = "<div style='text-align:center; color:#666; font-size:10px; margin:auto;'>Henüz mesaj yok. İlk mesajı yazın!</div>";
          return;
        }

        snap.forEach(c => {
          const m = c.val();
          const isMe = u && m.senderUid === u.uid;
          box.innerHTML += `
            <div style="background:${isMe ? '#1e1b4b' : '#070212'}; border:1px solid ${isMe ? 'var(--neon-purple)' : '#3b1d6e'}; border-radius:6px; padding:4px 8px; font-size:10px; align-self:${isMe ? 'flex-end' : 'flex-start'}; max-width:85%;">
              <div style="display:flex; justify-content:space-between; gap:6px; font-size:8px; margin-bottom:2px;">
                <b style="color:${isMe ? 'var(--neon-gold)' : '#38bdf8'};">${m.senderName}</b>
                <span style="color:#64748b;">${m.time || ''}</span>
              </div>
              <div style="color:#fff;">${m.text}</div>
            </div>
          `;
        });
        box.scrollTop = box.scrollHeight;
      });
    }

    function sendChatMessage() {
      const txt = document.getElementById("in-msg-txt").value.trim();
      const u = getActiveUser();
      if (!txt || !u) return;

      const timeStr = new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
      const msgPayload = {
        senderUid: u.uid,
        senderName: `${u.avatar || '👤'} ${u.name}${u.tag}`,
        text: txt,
        time: timeStr,
        timestamp: Date.now()
      };

      if (currentMode === "global" || currentMode === "channel") {
        db.ref(`channel_msgs/${currentTarget}`).push(msgPayload);
      } else if (currentMode === "dm") {
        const chatRoomId = u.uid < currentTarget ? `${u.uid}_${currentTarget}` : `${currentTarget}_${u.uid}`;
        db.ref(`direct_msgs/${chatRoomId}`).push(msgPayload);
      }

      document.getElementById("in-msg-txt").value = "";
    }
  </script>
</body>
</html>
