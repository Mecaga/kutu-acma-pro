<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sohbet & Kanallar</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    .chat-bubble {
      max-width: 78%;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 11px;
      margin-bottom: 4px;
      display: flex;
      flex-direction: column;
      word-break: break-word;
    }
    .chat-me {
      align-self: flex-end;
      background: linear-gradient(135deg, #059669, #10b981);
      color: #fff;
      border-bottom-right-radius: 2px;
    }
    .chat-other {
      align-self: flex-start;
      background: #1e1b4b;
      border: 1px solid #3b1d6e;
      color: #fff;
      border-bottom-left-radius: 2px;
    }
    .chat-time {
      font-size: 7.5px;
      color: rgba(255, 255, 255, 0.7);
      align-self: flex-end;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="app-container" style="justify-content:space-between;">
    <div>
      <div class="top-header">
        <a href="menu.html" class="icon-btn" style="border-color:var(--danger);">‹ Lobi</a>
        <div id="active-channel-lbl" style="font-weight:bold; font-size:12px; color:var(--neon-gold);">💬 Genel Sohbet</div>
        <button class="icon-btn" style="border-color:var(--neon-blue);" onclick="toggleChannelPanel()">📡 Kanallar</button>
      </div>

      <!-- Kanal Oluşturma & Katılma Bölümü -->
      <div id="channel-drawer" style="display:none; background:#070212; border:1px solid var(--neon-purple); border-radius:8px; padding:6px; margin-bottom:6px;">
        <div style="display:flex; gap:4px; margin-bottom:4px;">
          <input type="text" id="in-chan-name" class="input-field" style="margin:0; font-size:10px;" placeholder="Kanal İsmi (#klan)">
          <button class="icon-btn" style="background:var(--neon-green); white-space:nowrap;" onclick="joinOrCreateChannel()">Katıl/Kur</button>
        </div>
        <div style="font-size:9px; color:#94a3b8; margin-bottom:2px;">Mevcut Kanallar:</div>
        <div id="channels-list" style="display:flex; gap:4px; overflow-x:auto; padding-bottom:2px;"></div>
      </div>
    </div>

    <!-- Mesaj Akış Alanı -->
    <div id="chat-messages-box" style="flex:1; background:#040814; border:1px solid #1e293b; border-radius:8px; padding:8px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; margin:4px 0;"></div>

    <!-- Mesaj Gönderme Paneli -->
    <div style="display:flex; gap:4px;">
      <input type="text" id="in-msg-txt" class="input-field" style="margin:0; text-align:left; font-size:11px;" placeholder="Mesaj yaz..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="icon-btn" style="background:var(--neon-purple); padding:0 14px;" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let currentChannel = "genel";

    window.onload = () => {
      loadMessages("genel");
      loadChannelsList();
    };

    function toggleChannelPanel() {
      const el = document.getElementById("channel-drawer");
      el.style.display = el.style.display === "none" ? "block" : "none";
    }

    function joinOrCreateChannel() {
      const val = document.getElementById("in-chan-name").value.trim().toLowerCase().replace(/[^a-z0-9]/g, '_');
      if (!val) return;
      db.ref("channels/" + val).set({ name: val, createdAt: Date.now() });
      switchChannel(val);
      document.getElementById("in-chan-name").value = "";
      toggleChannelPanel();
    }

    function switchChannel(chanKey) {
      currentChannel = chanKey;
      document.getElementById("active-channel-lbl").innerText = `💬 #${chanKey}`;
      loadMessages(chanKey);
    }

    function loadChannelsList() {
      db.ref("channels").on("value", snap => {
        const box = document.getElementById("channels-list");
        box.innerHTML = `<button class="icon-btn" style="background:#1e1b4b;" onclick="switchChannel('genel')">#genel</button>`;
        if (snap.exists()) {
          snap.forEach(c => {
            box.innerHTML += `<button class="icon-btn" style="background:#1e1b4b;" onclick="switchChannel('${c.key}')">#${c.key}</button>`;
          });
        }
      });
    }

    function loadMessages(chanKey) {
      const u = getActiveUser();
      db.ref("channel_msgs/" + chanKey).limitToLast(40).on("value", snap => {
        const box = document.getElementById("chat-messages-box");
        box.innerHTML = "";
        if (!snap.exists()) {
          box.innerHTML = "<div style='text-align:center; color:#666; font-size:10px; margin:auto;'>Henüz mesaj yok. İlk mesajı sen gönder!</div>";
          return;
        }

        snap.forEach(c => {
          const m = c.val();
          const isMe = u && m.senderUid === u.uid;
          box.innerHTML += `
            <div class="chat-bubble ${isMe ? 'chat-me' : 'chat-other'}">
              <span style="font-size:8.5px; font-weight:bold; color:${isMe ? '#fef08a' : '#38bdf8'};">${m.senderName}</span>
              <span>${m.text}</span>
              <span class="chat-time">${m.time || ''}</span>
            </div>
          `;
        });
        box.scrollTop = box.scrollHeight;
      });
    }

    function sendMessage() {
      const txt = document.getElementById("in-msg-txt").value.trim();
      const u = getActiveUser();
      if (!txt || !u) return;

      const timeStr = new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });

      db.ref("channel_msgs/" + currentChannel).push({
        senderUid: u.uid,
        senderName: `${u.avatar || '👤'} ${u.name}${u.tag}`,
        text: txt,
        time: timeStr,
        timestamp: Date.now()
      });

      document.getElementById("in-msg-txt").value = "";
    }
  </script>
</body>
</html>
