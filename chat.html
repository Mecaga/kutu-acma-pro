<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Canlı Sohbet Odaları</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #020617;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }

    .chat-layout {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      background: #030712;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Üst Sabit Başlık */
    .chat-top-header {
      flex-shrink: 0;
      background: #090d1a;
      border-bottom: 2px solid #1e293b;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    /* Kanal Seçim Şeridi */
    .channel-bar {
      flex-shrink: 0;
      background: #0b1120;
      border-bottom: 1px solid #1e293b;
      display: flex;
      gap: 4px;
      padding: 4px 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .channel-bar::-webkit-scrollbar { display: none; }

    .channel-chip {
      flex: 0 0 auto;
      padding: 3px 8px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 8.5px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
    }
    .channel-chip.active {
      background: #4338ca;
      border-color: var(--neon-gold);
      color: #fff;
    }

    /* Mesaj Akış Alanı */
    .messages-scroll-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      -webkit-overflow-scrolling: touch;
    }
    .messages-scroll-area::-webkit-scrollbar { width: 3px; }
    .messages-scroll-area::-webkit-scrollbar-thumb { background: #3b1d6e; border-radius: 4px; }

    /* Mesaj Kartı */
    .msg-bubble {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 5px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 9px;
      max-width: 90%;
      word-break: break-word;
    }
    .msg-bubble.is-me {
      align-self: flex-end;
      background: #1e1b4b;
      border-color: #6366f1;
    }
    .msg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 7.5px;
      color: #94a3b8;
      gap: 6px;
    }

    /* Alt Sabit Yazma Alanı */
    .chat-bottom-bar {
      flex-shrink: 0;
      background: #090d1a;
      border-top: 2px solid #1e293b;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 1000;
    }

    .quick-emojis-row {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .quick-emojis-row::-webkit-scrollbar { display: none; }
    .emoji-chip {
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 8px;
      font-size: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="chat-layout">
    
    <!-- 1. Üst Başlık -->
    <div class="chat-top-header">
      <a href="menu.html" class="icon-btn" style="border-color:var(--danger); padding:2px 8px; font-size:9.5px; text-decoration:none;">‹ Lobi</a>
      <div style="font-weight:900; font-size:11px; color:#38bdf8;" id="lbl-channel-title">💬 Genel Sohbet</div>
      <a href="friends.html" class="icon-btn" style="background:#4338ca; padding:2px 8px; font-size:9.5px; text-decoration:none;">👥 Arkadaşlar</a>
    </div>

    <!-- 2. Kanal Seçimi -->
    <div class="channel-bar">
      <button type="button" class="channel-chip active" id="chn-general" onclick="switchChannel('general')">🌍 Genel Oda</button>
      <button type="button" class="channel-chip" id="chn-trade" onclick="switchChannel('trade')">🏪 Pazar & Ticaret</button>
      <button type="button" class="channel-chip" id="chn-farm" onclick="switchChannel('farm')">🌾 Çiftlik Yardımlaşma</button>
      <button type="button" class="channel-chip" id="chn-pvp" onclick="switchChannel('pvp')">⚔️ PvP Meydanı</button>
    </div>

    <!-- 3. Mesajlar Akış Alanı -->
    <div class="messages-scroll-area" id="chat-messages-container">
      <div style="color:#64748b; font-size:8px; text-align:center; padding:10px;">Mesajlar yükleniyor...</div>
    </div>

    <!-- 4. Alt Sabit Gönderme Alanı -->
    <div class="chat-bottom-bar">
      <div class="quick-emojis-row">
        <span class="emoji-chip" onclick="insertEmoji('🔥')">🔥</span>
        <span class="emoji-chip" onclick="insertEmoji('🌾')">🌾</span>
        <span class="emoji-chip" onclick="insertEmoji('⚔️')">⚔️</span>
        <span class="emoji-chip" onclick="insertEmoji('🪙')">🪙</span>
        <span class="emoji-chip" onclick="insertEmoji('👑')">👑</span>
        <span class="emoji-chip" onclick="insertEmoji('😎')">😎</span>
        <span class="emoji-chip" onclick="insertEmoji('🤝')">🤝</span>
      </div>
      <div style="display:flex; gap:4px;">
        <input type="text" id="in-chat-text" class="input-field" style="margin:0; flex:1; font-size:10px; padding:6px 8px;" placeholder="Mesajını yaz..." onkeydown="handleChatKey(event)">
        <button type="button" class="icon-btn" style="background:#16a34a; padding:6px 12px; font-size:10px; font-weight:bold;" onclick="sendMessage()">Gönder</button>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
  <script>
    let activeChannel = 'general';
    let chatListener = null;

    window.onload = () => {
      const u = getActiveUser();
      if (!u) return location.href = "index.html";
      listenChannel(activeChannel);
    };

    function switchChannel(channelKey) {
      activeChannel = channelKey;
      ['general', 'trade', 'farm', 'pvp'].forEach(c => {
        const btn = document.getElementById(`chn-${c}`);
        if (btn) btn.classList.toggle('active', c === channelKey);
      });

      const titleMap = {
        general: "💬 Genel Sohbet",
        trade: "🏪 Pazar & Ticaret",
        farm: "🌾 Çiftlik Yardımlaşma",
        pvp: "⚔️ PvP Meydanı"
      };
      document.getElementById("lbl-channel-title").innerText = titleMap[channelKey];
      listenChannel(channelKey);
    }

    function listenChannel(channelKey) {
      const container = document.getElementById("chat-messages-container");
      container.innerHTML = "<div style='color:#64748b; font-size:8px; text-align:center; padding:10px;'>Yükleniyor...</div>";

      if (chatListener) {
        db.ref("public_chats/" + activeChannel).off();
      }

      const u = getActiveUser();
      const myUID = u ? String(u.uid).replace(/[.#$\[\]]/g, "_") : "";

      chatListener = db.ref("public_chats/" + channelKey).limitToLast(50);
      chatListener.on("value", snap => {
        container.innerHTML = "";
        if (!snap.exists()) {
          container.innerHTML = "<div style='color:#64748b; font-size:8.5px; text-align:center; padding:15px;'>Henüz mesaj yok. İlk mesajı sen yaz!</div>";
          return;
        }

        snap.forEach(child => {
          const m = child.val();
          const isMe = m.senderUID === myUID;
          const div = document.createElement("div");
          div.className = "msg-bubble" + (isMe ? " is-me" : "");

          const addFriendBtn = (!isMe && myUID) ? `<button type="button" class="icon-btn" style="padding:1px 4px; font-size:6px; background:#4338ca;" onclick="sendFriendRequestDirect('${m.senderUID}', '${m.senderName}')">➕ Ekle</button>` : '';

          div.innerHTML = `
            <div class="msg-header">
              <span style="font-weight:bold; color:${isMe ? 'var(--neon-gold)' : 'var(--neon-blue)'};">${m.senderAvatar || '👤'} ${m.senderName} ${isMe ? '(Sen)' : ''}</span>
              <div style="display:flex; align-items:center; gap:3px;">
                ${addFriendBtn}
                <span>${m.time || ''}</span>
              </div>
            </div>
            <div style="color:#f8fafc; font-size:9.5px; margin-top:1px;">${escapeHtml(m.text)}</div>
          `;
          container.appendChild(div);
        });

        container.scrollTop = container.scrollHeight;
      });
    }

    function sendMessage() {
      const input = document.getElementById("in-chat-text");
      const text = input.value.trim();
      if (!text) return;

      const u = getActiveUser();
      if (!u) return alert("Mesaj göndermek için giriş yapmalısın!");

      const cleanUID = String(u.uid).replace(/[.#$\[\]]/g, "_");
      const d = new Date();
      const timeStr = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;

      db.ref("public_chats/" + activeChannel).push({
        senderUID: cleanUID,
        senderName: `${u.name}${u.tag || ''}`,
        senderAvatar: u.avatar || '👤',
        text: text,
        timestamp: Date.now(),
        time: timeStr
      });

      input.value = "";
    }

    function handleChatKey(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function insertEmoji(emo) {
      const input = document.getElementById("in-chat-text");
      input.value += emo;
      input.focus();
    }

    function sendFriendRequestDirect(targetUID, targetName) {
      const u = getActiveUser();
      if (!u) return;
      const myUID = String(u.uid).replace(/[.#$\[\]]/g, "_");
      if (myUID === targetUID) return alert("Kendine istek atamazsın!");

      db.ref(`friend_requests/${targetUID}/${myUID}`).set({
        fromUID: myUID,
        fromName: `${u.name}${u.tag || ''}`,
        fromAvatar: u.avatar || '👤',
        timestamp: Date.now()
      }).then(() => {
        alert(`${targetName} oyuncusuna arkadaşlık isteği yollandı!`);
      });
    }

    function escapeHtml(string) {
      return String(string).replace(/[&<>"']/g, function (s) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s];
      });
    }
  </script>
</body>
</html>
