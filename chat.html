<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sohbet & Kanallar</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="top-header">
      <a href="menu.html" class="icon-btn" style="border-color:var(--danger);">‹ Çıkış</a>
      <div style="font-weight:bold; font-size:12px;" id="chat-header-title">Sohbetler</div>
      <div class="btn-group-top">
        <button class="icon-btn" style="border-color:var(--btn-green);" onclick="promptJoinChannel()">Katıl</button>
        <button class="icon-btn" style="border-color:var(--neon-purple);" onclick="promptCreateChannel()">Kanal Kur</button>
      </div>
    </div>

    <div style="display:flex; gap:4px; overflow-x:auto; padding-bottom:4px; margin-bottom:6px;" id="channel-buttons-bar">
      <button class="icon-btn" style="background:var(--btn-blue); white-space:nowrap;" onclick="switchChatPanel('global')">🌐 Global</button>
      <button class="icon-btn" style="white-space:nowrap;" onclick="switchChatPanel('dm')">💬 Özel DM</button>
      </div>

    <div class="chat-scroll-box" id="active-chat-box" style="flex:1; height:auto; margin-bottom:6px;"></div>

    <div class="chat-input-row">
      <input type="text" id="chat-text-input" placeholder="Mesajınızı yazın...">
      <button class="icon-btn" style="background:var(--btn-green); border-radius:50%; width:32px; height:32px; justify-content:center;" onclick="sendActiveMsg()">➤</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let activeChannelType = 'global'; // 'global', 'dm', veya 'custom_kanaladi#1234'
    let activeDMTargetUID = localStorage.getItem("active_dm_target");
    let activeDMTargetName = localStorage.getItem("active_dm_name");

    window.onload = () => {
      loadChannelButtons();
      listenMessages();
    };

    function switchChatPanel(type, name = null) {
      activeChannelType = type;
      document.getElementById("chat-header-title").innerText = name ? `# ${name}` : (type === 'global' ? "🌐 Global Chat" : "💬 Özel DM");
      listenMessages();
    }

    function loadChannelButtons() {
      const bar = document.getElementById("channel-buttons-bar");
      db.ref("channels").on("value", snap => {
        // Global ve DM butonlarını koruyarak temizle
        bar.innerHTML = `
          <button class="icon-btn ${activeChannelType === 'global' ? 'active' : ''}" style="${activeChannelType === 'global' ? 'background:var(--btn-blue);' : ''} white-space:nowrap;" onclick="switchChatPanel('global')">🌐 Global</button>
          <button class="icon-btn ${activeChannelType === 'dm' ? 'active' : ''}" style="${activeChannelType === 'dm' ? 'background:var(--btn-blue);' : ''} white-space:nowrap;" onclick="switchChatPanel('dm')">💬 Özel DM</button>
        `;
        snap.forEach(c => {
          const ch = c.val();
          const btn = document.createElement("button");
          btn.className = "icon-btn";
          btn.style.white-space = "nowrap";
          btn.innerText = `# ${ch.name}`;
          btn.onclick = () => switchChatPanel('custom_' + c.key, ch.name);
          bar.appendChild(btn);
        });
      });
    }

    function listenMessages() {
      const u = getActiveUser();
      const box = document.getElementById("active-chat-box");
      box.innerHTML = "";

      let dbPath = "global_chat";
      if (activeChannelType === 'dm') {
        if (!activeDMTargetUID) {
          box.innerHTML = "<div style='text-align:center; color:#666; font-size:11px; margin-top:30px;'>Arkadaşlar veya Sıralama sayfasından bir oyuncunun yanındaki mesaja basınız.</div>";
          return;
        }
        dbPath = "dm_chats/" + [u.uid, activeDMTargetUID].sort().join("_");
      } else if (activeChannelType.startsWith('custom_')) {
        dbPath = "channel_msgs/" + activeChannelType.replace('custom_', '');
      }

      db.ref(dbPath).limitToLast(40).on("value", snap => {
        box.innerHTML = "";
        snap.forEach(c => {
          const m = c.val(), k = c.key, isMe = m.uid === u.uid;
          box.innerHTML += `
            <div class="msg-bubble ${isMe ? 'me' : 'other'}">
              <div style="font-size:9px; color:#60a5fa; font-weight:bold;">${m.sender || ''}</div>
              <div id="msg-${k}">${m.text}</div>
              <div class="msg-actions">
                <span onclick="navigator.clipboard.writeText('${m.text}'); alert('Kopyalandı');">📋</span>
                ${isMe ? `<span onclick="editMessage('${dbPath}', '${k}')">✏️</span><span onclick="delMessage('${dbPath}', '${k}')" style="color:var(--danger)">🗑️</span>` : ''}
              </div>
            </div>
          `;
        });
        box.scrollTop = box.scrollHeight;
      });
    }

    function sendActiveMsg() {
      const inp = document.getElementById("chat-text-input");
      if (!inp.value.trim()) return;
      const u = getActiveUser();

      let dbPath = "global_chat";
      if (activeChannelType === 'dm') {
        if (!activeDMTargetUID) return;
        dbPath = "dm_chats/" + [u.uid, activeDMTargetUID].sort().join("_");
      } else if (activeChannelType.startsWith('custom_')) {
        dbPath = "channel_msgs/" + activeChannelType.replace('custom_', '');
      }

      db.ref(dbPath).push({
        uid: u.uid,
        sender: `${u.name}${u.tag}`,
        text: inp.value.trim()
      });
      inp.value = "";
    }

    function editMessage(path, key) {
      const old = document.getElementById(`msg-${key}`).innerText;
      const val = prompt("Mesajı düzenle:", old);
      if (val && val !== old) db.ref(`${path}/${key}/text`).set(val + " (düzenlendi)");
    }

    function delMessage(path, key) {
      if (confirm("Bu mesajı silmek istiyor musunuz?")) db.ref(`${path}/${key}`).remove();
    }

    function promptCreateChannel() {
      const name = prompt("Kanal Adı:");
      if (!name) return;
      const chId = `${name.toLowerCase()}#${Math.floor(1000 + Math.random() * 9000)}`;
      db.ref("channels/" + chId.replace('#', '_')).set({ name: chId });
    }

    function promptJoinChannel() {
      const target = prompt("Katılmak istediğiniz kanaladı#id girin:");
      if (target) alert(`${target} kanalına katıldınız!`);
    }
  </script>
</body>
</html>
