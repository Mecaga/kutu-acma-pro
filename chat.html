<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sohbetler & Kanallar</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="top-header">
      <a href="menu.html" class="icon-btn" style="border-color:var(--danger);">‹ Çıkış</a>
      <div style="font-weight:bold; font-size:12px;" id="lbl-chat-main-title">Sohbetler & Kanallar</div>
      <div style="display:flex; gap:3px;">
        <button class="icon-btn" style="border-color:var(--neon-blue);" onclick="openJoinChannelModal()">Katıl</button>
        <button class="icon-btn" style="border-color:var(--neon-purple);" onclick="openCreateChannelModal()">+ Kur</button>
      </div>
    </div>

    <!-- Sohbet Seçim Paneli -->
    <div id="panel-chat-select" style="display:flex; flex-direction:column; flex:1; overflow-y:auto;">
      <button class="mode-btn" style="padding:12px; font-weight:bold; font-size:12px; color:#fff; background:linear-gradient(90deg, #7e22ce, #a855f7); margin-bottom:6px;" onclick="openRoom('global', '🌐 Global Sohbet', 'global')">
        🌐 GLOBAL SOHBET (HERKESE AÇIK)
      </button>

      <div style="font-size:11px; color:var(--neon-purple); font-weight:bold; margin:4px 0 2px 0;">📡 Kanallar:</div>
      <div id="channels-list-box" style="display:flex; flex-direction:column; gap:4px; margin-bottom:8px;"></div>

      <div style="font-size:11px; color:var(--neon-gold); font-weight:bold; margin-bottom:2px;">💬 Özel Sohbetler (DM):</div>
      <div id="dm-conversations-list" style="display:flex; flex-direction:column; gap:4px;"></div>
    </div>

    <!-- Mesajlaşma Odası (WhatsApp Tarzı Saatli & Sistem Rozetli) -->
    <div id="panel-chat-room" style="display:none; flex-direction:column; flex:1;">
      <div class="top-header" style="background:#120826; border-bottom:1px solid #3b1d6e; padding:4px 6px; margin-bottom:4px;">
        <button class="icon-btn" onclick="closeChatRoom()">‹ Geri</button>
        <div id="room-active-title" style="font-size:11px; font-weight:bold; color:var(--neon-blue);">Oda</div>
        <div id="room-header-actions" style="display:flex; gap:4px;">
          <button id="btn-channel-settings" class="icon-btn" style="display:none;" onclick="openChannelSettingsModal()">⚙️</button>
          <button id="btn-channel-leave" class="icon-btn" style="border-color:var(--danger); display:none;" onclick="leaveCurrentChannel()">Çık</button>
        </div>
      </div>

      <!-- Tarih Ayracı -->
      <div style="text-align:center; margin:2px 0;">
        <span style="background:#1e0b3d; border:1px solid #3b1d6e; padding:2px 8px; border-radius:10px; font-size:8px; color:var(--text-dim);">📅 29 Ağustos 2026</span>
      </div>

      <div id="active-chat-messages" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding:6px; background:#070212; border-radius:8px; margin-bottom:6px;"></div>

      <div style="display:flex; gap:4px;">
        <input type="text" id="in-msg-text" class="input-field" style="margin:0; font-size:11px; flex:1;" placeholder="Mesaj yaz...">
        <button class="icon-btn" style="background:var(--neon-green); border-radius:50%; width:34px; height:34px; justify-content:center;" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let currentChatPath = null, activeChannelID = null, activeChannelData = null;

    window.onload = () => {
      loadChannels();
      loadDMConversations();
    };

    function loadChannels() {
      const u = getActiveUser();
      db.ref("channels").on("value", snap => {
        const box = document.getElementById("channels-list-box");
        box.innerHTML = "";
        if (!snap.exists()) { box.innerHTML = "<div style='color:#666; font-size:10px;'>Kanal yok.</div>"; return; }
        snap.forEach(c => {
          const ch = c.val();
          if (ch.type === "Açık" || (ch.members && ch.members[u.uid]) || ch.ownerUID === u.uid) {
            box.innerHTML += `
              <div class="rank-card" onclick="openRoom('channel_${c.key}', '# ${ch.name}', 'channel', '${c.key}')">
                <span>📡 <b>${ch.name}</b> <small style="color:${ch.type==='Özel'?'var(--danger)':'var(--neon-green)'};">[${ch.type}]</small></span>
                <span style="font-size:10px; color:#38bdf8;">Gir ›</span>
              </div>
            `;
          }
        });
      });
    }

    function loadDMConversations() {
      const u = getActiveUser();
      db.ref("friends/" + u.uid).on("value", snap => {
        const list = document.getElementById("dm-conversations-list");
        list.innerHTML = "";
        if (!snap.exists()) { list.innerHTML = "<div style='color:#666; font-size:10px;'>Arkadaş yok.</div>"; return; }
        snap.forEach(c => {
          list.innerHTML += `
            <div class="rank-card" onclick="openRoom('dm_${[u.uid, c.key].sort().join('_')}', '💬 ${c.val().fullName}', 'dm')">
              <span>👤 <b>${c.val().fullName}</b></span>
              <span style="font-size:10px; color:#38bdf8;">Sohbet ›</span>
            </div>
          `;
        });
      });
    }

    function openRoom(pathKey, title, roomType, chKey = null) {
      const u = getActiveUser();
      activeChannelID = chKey;
      currentChatPath = pathKey.startsWith('global') ? 'global_chat' : (pathKey.startsWith('channel_') ? `channel_msgs/${chKey}` : `dm_chats/${pathKey.replace('dm_', '')}`);

      document.getElementById("panel-chat-select").style.display = "none";
      document.getElementById("panel-chat-room").style.display = "flex";
      document.getElementById("room-active-title").innerText = title;

      if (roomType === 'channel') {
        db.ref("channels/" + chKey).on("value", snap => {
          activeChannelData = snap.val();
          if (!activeChannelData || (activeChannelData.type === "Özel" && !activeChannelData.members[u.uid] && activeChannelData.ownerUID !== u.uid)) {
            alert("Bu kanaldan çıkarıldınız.");
            return closeChatRoom();
          }
          document.getElementById("btn-channel-settings").style.display = "inline-flex";
          document.getElementById("btn-channel-leave").style.display = (activeChannelData.type === "Özel" && activeChannelData.ownerUID !== u.uid) ? "inline-flex" : "none";
        });
      } else {
        document.getElementById("btn-channel-settings").style.display = "none";
        document.getElementById("btn-channel-leave").style.display = "none";
      }

      listenRoomMessages();
    }

    function closeChatRoom() {
      document.getElementById("panel-chat-room").style.display = "none";
      document.getElementById("panel-chat-select").style.display = "flex";
      currentChatPath = null;
    }

    function listenRoomMessages() {
      const u = getActiveUser();
      db.ref(currentChatPath).limitToLast(40).on("value", snap => {
        const box = document.getElementById("active-chat-messages");
        box.innerHTML = "";
        snap.forEach(c => {
          const m = c.val(), isMe = m.uid === u.uid;
          
          // Sistem İşlem Mesajı (Kanalın tam ortasında gri rozet)
          if (m.isSystem) {
            box.innerHTML += `
              <div style="text-align:center; margin:4px 0;">
                <span style="background:rgba(30,41,59,0.9); padding:2px 8px; border-radius:6px; font-size:8.5px; color:#cbd5e1;">ℹ️ ${m.text}</span>
              </div>
            `;
          } else {
            box.innerHTML += `
              <div class="msg-bubble ${isMe ? 'me' : 'other'}">
                <div style="font-size:8.5px; color:#60a5fa; font-weight:bold;">${m.sender}</div>
                <div style="font-size:11px;">${m.text}</div>
                <div style="text-align:right; font-size:7.5px; color:#94a3b8; margin-top:2px;">${m.time || '16:28'}</div>
              </div>
            `;
          }
        });
        box.scrollTop = box.scrollHeight;
      });
    }

    function sendMessage() {
      const inp = document.getElementById("in-msg-text");
      let text = inp.value.trim();
      if (!text || !currentChatPath) return;
      const u = getActiveUser();
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      db.ref(currentChatPath).push({
        uid: u.uid,
        sender: `${u.avatar || '👤'} ${u.name}${u.tag}`,
        text: text,
        time: timeStr
      });
      inp.value = "";
    }
  </script>
</body>
</html>
