<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sohbet Kanalları</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="app.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #020617; font-family: system-ui, sans-serif; color: #fff; }

    .chat-layout {
      width: 100%; max-width: 480px; height: 100dvh; margin: 0 auto;
      background: #030712; display: flex; flex-direction: column; position: relative;
    }

    .chat-header {
      flex-shrink: 0; background: #090d1a; border-bottom: 2px solid #1e293b;
      padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; z-index: 10;
    }

    /* Kanal Sekmeleri */
    .chat-channels {
      flex-shrink: 0; background: #0b1120; border-bottom: 1px solid #1e293b;
      display: flex; gap: 4px; padding: 6px 8px;
    }
    .channel-tab {
      flex: 1; padding: 5px 2px; background: #1e293b; border: 1px solid #334155;
      color: #94a3b8; font-size: 9px; font-weight: bold; border-radius: 6px;
      cursor: pointer; text-align: center; white-space: nowrap;
    }
    .channel-tab.active { background: #4338ca; border-color: var(--neon-gold); color: #fff; }

    /* Mesaj Akış Alanı */
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column;
      gap: 6px; -webkit-overflow-scrolling: touch;
    }
    .chat-messages::-webkit-scrollbar { width: 3px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #3b1d6e; border-radius: 4px; }

    .msg-bubble {
      background: #0b1329; border: 1px solid #1e293b; border-radius: 8px;
      padding: 6px 8px; display: flex; flex-direction: column; gap: 2px;
      position: relative; word-break: break-word; font-size: 9.5px;
    }
    .msg-bubble.is-me { border-color: #38bdf8; background: #071530; align-self: flex-end; width: 88%; }
    .msg-bubble.is-admin { border-color: var(--danger); background: rgba(239, 68, 68, 0.08); }
    .msg-bubble.is-system { border-color: var(--neon-gold); background: rgba(251, 191, 36, 0.05); }

    /* Alt Mesaj Giriş Barı */
    .chat-input-bar {
      flex-shrink: 0; background: #090d1a; border-top: 1px solid #1e293b;
      padding: 8px; display: flex; gap: 6px; align-items: center;
    }
  </style>
</head>
<body>
  <div class="chat-layout">
    
    <!-- Üst Başlık -->
    <div class="chat-header">
      <a href="menu.html" class="icon-btn" style="border-color:var(--danger); padding:3px 8px; font-size:10px; text-decoration:none;">‹ Lobi</a>
      <div style="font-weight:900; font-size:12px; color:#38bdf8;">💬 Sohbet Kanalları</div>
      <div id="lbl-online-status" style="font-size:8.5px; color:var(--neon-green);">● Çevrimiçi</div>
    </div>

    <!-- Kanallar Şeridi -->
    <div class="chat-channels">
      <button type="button" class="channel-tab active" id="tab-general" onclick="switchChannel('general')">🌐 Genel</button>
      <button type="button" class="channel-tab" id="tab-drops" onclick="switchChannel('drops')">📢 Kasa & Drop</button>
      <button type="button" class="channel-tab" id="tab-room" onclick="switchChannel('room')">👥 Oda Sohbeti</button>
    </div>

    <!-- Mesaj Listesi -->
    <div class="chat-messages" id="chat-feed">
      <div style="color:#64748b; font-size:9px; text-align:center; padding:15px;">Mesajlar yükleniyor...</div>
    </div>

    <!-- Alt Gönderim Kutusu -->
    <div class="chat-input-bar" id="input-bar-container">
      <input type="text" id="chat-input-text" class="input-field" style="margin:0; font-size:11px; padding:8px; flex:1;" placeholder="Mesajınızı yazın..." maxlength="140" onkeydown="if(event.key==='Enter') sendMessage()">
      <button type="button" class="btn-start" style="padding:8px 12px; font-size:10px; width:auto;" onclick="sendMessage()">Gönder</button>
    </div>

  </div>

  <script>
    let currentChannel = 'general';
    let currentUser = null;
    let listenerRef = null;

    window.onload = () => {
      currentUser = getActiveUser();
      if (!currentUser) return location.href = "index.html";
      switchChannel('general');
    };

    function switchChannel(channelKey) {
      currentChannel = channelKey;
      document.querySelectorAll(".channel-tab").forEach(t => t.classList.remove("active"));
      const activeTab = document.getElementById("tab-" + channelKey);
      if (activeTab) activeTab.classList.add("active");

      // Kasa & Drop kanalı salt okunur sistem duyurusu akışıdır
      const inputBar = document.getElementById("input-bar-container");
      if (channelKey === 'drops') {
        inputBar.style.display = "none";
      } else {
        inputBar.style.display = "flex";
      }

      loadMessages(channelKey);
    }

    function loadMessages(channelKey) {
      const feed = document.getElementById("chat-feed");
      feed.innerHTML = "<div style='color:#64748b; font-size:9px; text-align:center; padding:15px;'>Bağlanıyor...</div>";

      if (listenerRef) listenerRef.off();

      listenerRef = db.ref(`messages/${channelKey}`).limitToLast(60);
      listenerRef.on("value", snap => {
        feed.innerHTML = "";
        if (!snap.exists()) {
          feed.innerHTML = "<div style='color:#64748b; font-size:9px; text-align:center; padding:20px;'>Bu kanalda henüz mesaj bulunmuyor.</div>";
          return;
        }

        const myKey = String(currentUser.username || currentUser.name).toLowerCase();
        const isAdmin = currentUser.isAdmin || (currentUser.displayName || currentUser.username).toLowerCase() === "admin";

        snap.forEach(child => {
          const m = child.val();
          const mId = child.key;
          const isMe = m.senderKey === myKey;
          const msgAdmin = m.isAdmin;

          const bubble = document.createElement("div");
          let bubbleClass = "msg-bubble";
          if (isMe) bubbleClass += " is-me";
          if (msgAdmin) bubbleClass += " is-admin";
          if (channelKey === 'drops') bubbleClass += " is-system";
          bubble.className = bubbleClass;

          const adminBadge = msgAdmin ? `<span style="background:var(--danger); color:#fff; font-size:7px; font-weight:bold; padding:1px 4px; border-radius:3px; margin-right:3px;">ADMIN</span>` : "";
          const titleBadge = m.title ? `<span style="color:var(--neon-gold); font-size:7.5px; margin-right:3px;">[${m.title}]</span>` : "";
          const delBtn = isAdmin ? `<span style="cursor:pointer; color:#ef4444; font-size:8px; margin-left:6px;" onclick="deleteMessage('${channelKey}', '${mId}')">🗑️</span>` : "";

          bubble.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; font-size:8px; margin-bottom:1px;">
              <div>
                ${adminBadge}<span>${m.avatar || '👤'}</span> <b style="color:${isMe ? '#38bdf8' : '#fff'};">${m.senderName}</b> ${titleBadge}
              </div>
              <div style="color:#64748b; font-size:7.5px;">${m.time || ''} ${delBtn}</div>
            </div>
            <div style="color:#e2e8f0; font-size:10px; line-height:1.3;">${m.text}</div>
          `;
          feed.appendChild(bubble);
        });

        feed.scrollTop = feed.scrollHeight;
      });
    }

    function sendMessage() {
      const input = document.getElementById("chat-input-text");
      const text = input.value.trim();
      if (!text) return;

      const isAdmin = currentUser.isAdmin || (currentUser.displayName || currentUser.username).toLowerCase() === "admin";
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      const payload = {
        senderKey: String(currentUser.username || currentUser.name).toLowerCase(),
        senderName: currentUser.displayName || currentUser.name || currentUser.username,
        avatar: currentUser.avatar || "👤",
        title: currentUser.title || "Çaylak",
        isAdmin: isAdmin,
        text: text,
        time: timeStr,
        timestamp: Date.now()
      };

      db.ref(`messages/${currentChannel}`).push(payload).then(() => {
        input.value = "";
      });
    }

    function deleteMessage(channelKey, messageId) {
      if (confirm("Bu mesajı silmek istediğinize emin misiniz?")) {
        db.ref(`messages/${channelKey}/${messageId}`).remove();
      }
    }
  </script>
</body>
</html>
