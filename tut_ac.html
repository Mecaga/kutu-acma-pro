<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tut & Aç Modu</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    #basket {
      position: absolute;
      bottom: 10px;
      width: 60px;
      height: 35px;
      background: linear-gradient(180deg, #38bdf8, #0284c7);
      border: 2px solid #fff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: left 0.08s ease-out;
    }
  </style>
</head>
<body class="bg-catch_open">
  <div class="app-container" style="justify-content:space-between;">
    <div>
      <div class="top-header">
        <a href="menu.html" class="icon-btn" style="border-color:var(--danger);">‹ Çıkış</a>
        <div style="font-weight:bold; font-size:12px;">🧺 Tut & Aç (20s)</div>
        <div id="score-badge" style="color:var(--neon-gold); font-weight:bold; font-size:12px;">0 P</div>
      </div>
      <div class="game-stats-top" style="display:flex; justify-content:space-between; margin-bottom:6px;">
        <div class="stat-card timer" style="border:1px solid #ef4444; background:#0d1527; padding:4px 8px; border-radius:8px;">
          <div style="font-size:9px; color:#94a3b8;">SÜRE</div>
          <div style="font-size:14px; font-weight:bold; color:#f87171;" id="lbl-timer">20s</div>
        </div>
        <div class="stat-card score" style="border:1px solid #10b981; background:#0d1527; padding:4px 8px; border-radius:8px; text-align:right;">
          <div style="font-size:9px; color:#94a3b8;">YAKALANAN</div>
          <div style="font-size:14px; font-weight:bold; color:#34d399;" id="lbl-caught">0 Adet</div>
        </div>
      </div>
    </div>

    <!-- Oyun Alanı -->
    <div id="game-arena" style="flex:1; background:#050a14; border:2px dashed #3b1d6e; border-radius:8px; position:relative; overflow:hidden; margin-bottom:6px;">
      <div id="basket" style="left:120px;">🛒</div>
    </div>

    <!-- Kontrol Butonları -->
    <div style="display:flex; gap:10px; margin-bottom:6px;">
      <button class="btn-start" style="flex:1; background:#1e293b; border:1px solid #38bdf8; font-size:18px;" onclick="moveBasket(-25)">◀ SOL</button>
      <button class="btn-start" style="flex:1; background:#1e293b; border:1px solid #38bdf8; font-size:18px;" onclick="moveBasket(25)">SAĞ ▶</button>
    </div>

    <!-- Özet Ekranı -->
    <div id="summary-overlay" class="modal-overlay">
      <div class="modal-card">
        <div style="font-size:14px; font-weight:bold; color:var(--neon-gold); text-align:center; margin-bottom:8px;">SÜRE DOLDU!</div>
        <div style="display:flex; justify-content:space-around; margin-bottom:8px; background:#070212; padding:6px; border-radius:6px;">
          <div>Toplam Skor: <b id="sum-score" style="color:var(--neon-green);">0 P</b></div>
          <div>Kutu Sayısı: <b id="sum-count" style="color:var(--neon-blue);">0</b></div>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="icon-btn" style="flex:1; background:var(--btn-blue); justify-content:center;" onclick="location.reload()">🔄 Tekrar</button>
          <a href="menu.html" class="icon-btn" style="flex:1; background:var(--danger); justify-content:center;">🚪 Lobi</a>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let timeLeft = 20, basketX = 120, caughtCount = 0, totalScore = 0, gameActive = true;
    const arena = document.getElementById("game-arena");
    const basket = document.getElementById("basket");

    function moveBasket(dir) {
      if (!gameActive) return;
      const maxRight = arena.offsetWidth - 65;
      basketX = Math.max(0, Math.min(maxRight, basketX + dir));
      basket.style.left = basketX + "px";
    }

    // Kutuların düşüşü
    const spawnTimer = setInterval(() => {
      if (!gameActive) return;
      const b = document.createElement("div");
      const startX = Math.random() * (arena.offsetWidth - 40);
      const pts = [10, 25, 50, 100][Math.floor(Math.random() * 4)];
      
      b.style.cssText = `position:absolute; width:34px; height:34px; background:#1e1b4b; border:2px solid #a855f7; border-radius:6px; font-size:10px; display:flex; align-items:center; justify-content:center; left:${startX}px; top:0px;`;
      b.innerText = `+${pts}`;
      arena.appendChild(b);

      let topPos = 0;
      const dropInt = setInterval(() => {
        if (!gameActive) { clearInterval(dropInt); b.remove(); return; }
        topPos += 4;
        b.style.top = topPos + "px";

        // Çarpışma Testi
        const arenaHeight = arena.offsetHeight;
        if (topPos >= arenaHeight - 45 && topPos <= arenaHeight - 15) {
          if (startX + 30 >= basketX && startX <= basketX + 60) {
            caughtCount++;
            totalScore += pts;
            document.getElementById("lbl-caught").innerText = `${caughtCount} Adet`;
            document.getElementById("score-badge").innerText = `${totalScore} P`;
            clearInterval(dropInt);
            b.remove();
          }
        }
        if (topPos > arenaHeight) { clearInterval(dropInt); b.remove(); }
      }, 30);
    }, 600);

    const timer = setInterval(() => {
      timeLeft--;
      document.getElementById("lbl-timer").innerText = `${timeLeft}s`;
      if (timeLeft <= 0) {
        gameActive = false;
        clearInterval(timer);
        clearInterval(spawnTimer);
        document.getElementById("sum-score").innerText = `${totalScore} P`;
        document.getElementById("sum-count").innerText = caughtCount;
        document.getElementById("summary-overlay").style.display = "flex";
        recordGameScore('catch_basket', 'Tut & Aç Modu', totalScore, [], totalScore > 0);
      }
    }, 1000);
  </script>
</body>
</html>
