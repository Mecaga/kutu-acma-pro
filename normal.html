<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Normal Kasa (30s)</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-standard">
  <div class="app-container" style="justify-content:space-between;">
    <div>
      <div class="top-header">
        <a href="menu.html" class="icon-btn" style="border-color:var(--danger); z-index:999;">‹ Çıkış</a>
        <div style="font-weight:bold; font-size:12px;">⚔️ Normal Kasa</div>
        <div id="score-badge" style="color:var(--neon-gold); font-weight:bold; font-size:12px;">0 P</div>
      </div>

      <div class="game-stats-top" style="display:flex; justify-content:space-between; margin-bottom:6px;">
        <div class="stat-card timer" style="border:1px solid #ef4444; background:#0d1527; padding:4px 8px; border-radius:8px;">
          <div style="font-size:9px; color:#94a3b8;">SÜRE</div>
          <div style="font-size:14px; font-weight:bold; color:#f87171;" id="lbl-timer">30s</div>
          <div style="font-size:10px; color:#38bdf8;" id="lbl-user-tag">@User</div>
        </div>
        <div class="stat-card score" style="border:1px solid #10b981; background:#0d1527; padding:4px 8px; border-radius:8px; text-align:right;">
          <div style="font-size:9px; color:#94a3b8;">PUAN</div>
          <div style="font-size:14px; font-weight:bold; color:#34d399;" id="lbl-score">0</div>
        </div>
      </div>

      <div class="rates-box" style="background:rgba(13,21,39,0.95); border:1px solid #334155; border-radius:8px; padding:6px 8px; font-size:10px;">
        <div style="color:#ffffff; font-weight:bold; margin-bottom:2px;">NORMAL KASA</div>
        <div style="display:flex; justify-content:space-between; color:#ffffff;"><span>Classic (%58)</span><span>1-3 P</span></div>
        <div style="display:flex; justify-content:space-between; color:#38bdf8;"><span>Super (%29)</span><span>4-10 P</span></div>
        <div style="display:flex; justify-content:space-between; color:#c084fc;"><span>Ultra (%10)</span><span>12-30 P</span></div>
        <div style="display:flex; justify-content:space-between; color:#fb923c;"><span>Omega (%2.8)</span><span>35-120 P</span></div>
        <div style="display:flex; justify-content:space-between; color:#f43f5e;"><span>Godly (%0.2)</span><span>500-1000 P</span></div>
      </div>
    </div>

    <div id="case-box-area" style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#060b17; border-radius:12px; border:1px solid #1e293b; margin:6px 0; position:relative; overflow:hidden;">
      <div id="ready-view" style="text-align:center;">
        <div style="font-size:24px; font-weight:900; color:#fff;">HAZIR!</div>
        <div style="font-size:11px; color:#fbbf24; margin-top:3px;">Normal Kasa (30s)</div>
      </div>

      <div id="roulette-view" class="roulette-container" style="display:none; width:100%; height:85px;">
        <div class="roulette-needle"></div>
        <div id="roulette-track" class="roulette-track"></div>
      </div>
    </div>

    <div>
      <div style="display:flex; justify-content:flex-end; margin-bottom:6px;">
        <div id="drop-badge" style="background:#0b1329; border:1px solid #334155; border-radius:6px; padding:4px 8px; font-size:11px;">
          Son Düşen: <span style="color:#64748b;">-</span>
        </div>
      </div>
      <button id="btn-spin" class="btn-start" style="background:#0284c7;" onclick="spinCase()">KASAYI AÇ (3s)</button>
    </div>

    <div id="summary-overlay" class="modal-overlay">
      <div class="modal-card">
        <div style="font-size:14px; font-weight:bold; color:var(--neon-gold); text-align:center; margin-bottom:8px;">OYUN BİTTİ</div>
        <div style="display:flex; justify-content:space-around; margin-bottom:8px; background:#070212; padding:6px; border-radius:6px;">
          <div>Toplam: <b id="sum-score" style="color:var(--neon-green);">0 P</b></div>
          <div>Açılan: <b id="sum-count" style="color:var(--neon-blue);">0</b></div>
        </div>
        <div id="summary-drops-list" style="max-height:140px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; margin-bottom:8px;"></div>
        <div style="display:flex; gap:6px;">
          <button class="icon-btn" style="flex:1; background:var(--btn-blue); justify-content:center;" onclick="location.reload()">🔄 Tekrar</button>
          <a href="menu.html" class="icon-btn" style="flex:1; background:var(--danger); justify-content:center;">🚪 Lobi</a>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const TIERS = [
      { name: 'Classic', rate: 58.0, minP: 1, maxP: 3, c: '#ffffff', items: ['Tahta Kılıç', 'Deri Kask'] },
      { name: 'Super', rate: 29.0, minP: 4, maxP: 10, c: '#38bdf8', items: ['Demir Balta', 'Gümüş Yüzük'] },
      { name: 'Ultra', rate: 10.0, minP: 12, maxP: 30, c: '#c084fc', items: ['Büyülü Asa', 'Ateş Pelerini'] },
      { name: 'Omega', rate: 2.8, minP: 35, maxP: 120, c: '#fb923c', items: ['Ejder Baltası', 'Lich Tacı'] },
      { name: 'Godly', rate: 0.2, minP: 500, maxP: 1000, c: '#f43f5e', items: ['Ebedi Kristal Kılıç'] }
    ];

    let totalScore = 0, drops = [], isSpinning = false, timeLeft = 30, timer = null;

    window.onload = () => {
      const u = getActiveUser();
      document.getElementById("lbl-user-tag").innerText = u ? `@${u.name}${u.tag}` : "@Misafir";
      timer = setInterval(() => {
        timeLeft--;
        document.getElementById("lbl-timer").innerText = `${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timer);
          document.getElementById("btn-spin").disabled = true;
          document.getElementById("btn-spin").innerText = "SÜRE BİTTİ!";
          if (!isSpinning) triggerSummary();
        }
      }, 1000);
    };

    function spinCase() {
      if (isSpinning || timeLeft <= 0) return;
      isSpinning = true;
      document.getElementById("btn-spin").disabled = true;

      document.getElementById("ready-view").style.display = "none";
      const rView = document.getElementById("roulette-view");
      const track = document.getElementById("roulette-track");
      rView.style.display = "flex";
      track.style.transition = "none";
      track.style.transform = "translateX(0px)";
      track.innerHTML = "";

      const totalItems = 30, winIdx = 22;
      let winDrop = null;
      const itemWidth = 80;

      for (let i = 0; i < totalItems; i++) {
        let rand = Math.random() * 100, cum = 0, d = TIERS[0];
        for (let t of TIERS) {
          cum += t.rate;
          if (rand <= cum) {
            d = { tier: t.name, item: t.items[Math.floor(Math.random() * t.items.length)], pts: Math.floor(Math.random() * (t.maxP - t.minP + 1)) + t.minP, c: t.c };
            break;
          }
        }
        if (i === winIdx) winDrop = d;
        track.innerHTML += `
          <div class="roulette-item" style="border-bottom:3px solid ${d.c};">
            <span style="color:${d.c}; font-weight:bold;">${d.tier}</span>
            <span style="font-size:8px;">${d.item}</span>
            <span style="color:var(--neon-green);">+${d.pts}P</span>
          </div>
        `;
      }

      setTimeout(() => {
        track.style.transition = "transform 2.8s cubic-bezier(0.12, 0.8, 0.2, 1)";
        const targetX = -(winIdx * itemWidth) + (rView.offsetWidth / 2) - (itemWidth / 2);
        track.style.transform = `translateX(${targetX}px)`;
      }, 20);

      setTimeout(() => {
        totalScore += winDrop.pts;
        drops.push(winDrop);
        document.getElementById("lbl-score").innerText = totalScore;
        document.getElementById("score-badge").innerText = `${totalScore} P`;
        document.getElementById("drop-badge").innerHTML = `Son: <span style="color:${winDrop.c};">${winDrop.tier}</span> +${winDrop.pts}P`;

        isSpinning = false;
        if (timeLeft <= 0) triggerSummary();
        else document.getElementById("btn-spin").disabled = false;
      }, 2900);
    }

    function triggerSummary() {
      document.getElementById("sum-score").innerText = `${totalScore} P`;
      document.getElementById("sum-count").innerText = drops.length;
      const dBox = document.getElementById("summary-drops-list");
      dBox.innerHTML = "";
      drops.forEach(d => {
        dBox.innerHTML += `
          <div style="background:#070212; padding:4px 8px; border-radius:4px; display:flex; justify-content:space-between; font-size:10px;">
            <span>[${d.tier}] ${d.item}</span>
            <b style="color:var(--neon-green);">+${d.pts}P</b>
          </div>
        `;
      });
      document.getElementById("summary-overlay").style.display = "flex";
      recordGameScore('standard', 'Normal Kasa', totalScore, drops, totalScore > 0);
    }
  </script>
</body>
</html>
