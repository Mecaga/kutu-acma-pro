<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Normal Kasa (30s)</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-standard">
  <div class="app-container" style="justify-content:space-between;">
    
    <!-- Üst Stat Bar (Ekran Görüntüsündeki Düzen) -->
    <div>
      <div class="game-stats-top" style="display:flex; justify-content:space-between; margin-bottom:6px;">
        <div class="stat-card timer" style="border:1px solid #ef4444; background:#0d1527; padding:5px 10px; border-radius:8px;">
          <div style="font-size:9px; color:#94a3b8;">SÜRE</div>
          <div style="font-size:15px; font-weight:bold; color:#f87171;" id="lbl-timer">30s</div>
          <div style="font-size:10px; color:#38bdf8;" id="lbl-user-tag">@User</div>
        </div>
        <div class="stat-card score" style="border:1px solid #10b981; background:#0d1527; padding:5px 10px; border-radius:8px; text-align:right;">
          <div style="font-size:9px; color:#94a3b8;">PUAN</div>
          <div style="font-size:15px; font-weight:bold; color:#34d399;" id="lbl-score">0</div>
        </div>
      </div>

      <!-- Oranlar Tablosu -->
      <div class="rates-box" style="background:rgba(13,21,39,0.95); border:1px solid #334155; border-radius:8px; padding:6px 8px; font-size:10px;">
        <div style="color:#ffffff; font-weight:bold; margin-bottom:2px;">NORMAL KASA</div>
        <div style="display:flex; justify-content:space-between; color:#ffffff;"><span>Classic (%58)</span><span>1-3 P</span></div>
        <div style="display:flex; justify-content:space-between; color:#38bdf8;"><span>Super (%29)</span><span>4-10 P</span></div>
        <div style="display:flex; justify-content:space-between; color:#c084fc;"><span>Ultra (%10)</span><span>12-30 P</span></div>
        <div style="display:flex; justify-content:space-between; color:#fb923c;"><span>Omega (%2.8)</span><span>35-120 P</span></div>
        <div style="display:flex; justify-content:space-between; color:#f43f5e;"><span>Godly (%0.2)</span><span>500-1000 P</span></div>
      </div>
    </div>

    <!-- Orta Kasa & CS Rulet Alanı -->
    <div id="case-box-area" style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#060b17; border-radius:12px; border:1px solid #1e293b; margin:8px 0; position:relative; overflow:hidden;">
      <div id="ready-view" style="text-align:center;">
        <div style="font-size:24px; font-weight:900; color:#fff;">HAZIR!</div>
        <div style="font-size:12px; color:#fbbf24; margin-top:3px;">Normal Kasa (30s)</div>
      </div>

      <!-- Rulet Bandı (Animasyon sırasında açılır) -->
      <div id="roulette-view" class="roulette-container" style="display:none; width:100%; height:90px; border-top:2px solid #334155; border-bottom:2px solid #334155;">
        <div class="roulette-needle"></div>
        <div id="roulette-track" class="roulette-track"></div>
      </div>
    </div>

    <!-- Alt Kısım: Son Düşen & Kasa Aç Butonu -->
    <div>
      <div style="display:flex; justify-content:flex-end; margin-bottom:6px;">
        <div id="drop-badge" style="background:#0b1329; border:1px solid #334155; border-radius:6px; padding:4px 8px; font-size:11px; text-align:right;">
          Son Düşen: <span style="color:#64748b;">-</span>
        </div>
      </div>
      <button id="btn-spin" class="btn-start" style="background:#0284c7; width:100%; padding:13px; font-weight:bold; border-radius:8px;" onclick="spinCase()">KASAYI AÇ (3s)</button>
    </div>

    <!-- Özet Ekranı (Süre Bitince Açılır) -->
    <div id="summary-overlay" class="modal-overlay">
      <div class="modal-card" style="background:#0b1329; border:1px solid #1e293b;">
        <div style="font-size:14px; font-weight:bold; color:var(--neon-gold); text-align:center; margin-bottom:8px;">OYUN BİTTİ</div>
        <div style="display:flex; justify-content:space-around; margin-bottom:8px; background:#070212; padding:6px; border-radius:6px;">
          <div>Toplam: <b id="sum-score" style="color:var(--neon-green);">0 P</b></div>
          <div>Açılan: <b id="sum-count" style="color:var(--neon-blue);">0</b></div>
        </div>
        <div id="summary-drops-list" style="max-height:160px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; margin-bottom:8px;"></div>
        <div style="display:flex; gap:6px;">
          <button class="icon-btn" style="flex:1; background:var(--btn-blue); justify-content:center;" onclick="location.reload()">🔄 Tekrar Oyna</button>
          <a href="menu.html" class="icon-btn" style="flex:1; background:var(--danger); justify-content:center;">🚪 Ana Menü</a>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
  <script>
    const TIERS = [
      { name: 'Classic', rate: 58.0, minP: 1, maxP: 3, c: '#ffffff', items: ['Tahta Kılıç', 'Deri Kask', 'Taş Parçası'] },
      { name: 'Super',   rate: 29.0, minP: 4, maxP: 10, c: '#38bdf8', items: ['Demir Balta', 'Gümüş Yüzük', 'Çelik Kalkan'] },
      { name: 'Ultra',   rate: 10.0, minP: 12, maxP: 30, c: '#c084fc', items: ['Büyülü Asa', 'Ateş Pelerini', 'Rünik Yay'] },
      { name: 'Omega',   rate: 2.8,  minP: 35, maxP: 120, c: '#fb923c', items: ['Ejder Baltası', 'Lich Tacı'] },
      { name: 'Godly',   rate: 0.2,  minP: 500, maxP: 1000, c: '#f43f5e', items: ['Ebedi Kristal Kılıç'] }
    ];

    let totalScore = 0;
    let drops = [];
    let isSpinning = false;
    let timeLeft = 30;
    let timer = null;

    window.onload = () => {
      const u = getActiveUser();
      document.getElementById("lbl-user-tag").innerText = u ? `@${u.name}${u.tag}` : "@Misafir";

      timer = setInterval(() => {
        timeLeft--;
        document.getElementById("lbl-timer").innerText = `${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timer);
          document.getElementById("btn-spin").disabled = true;
          document.getElementById("btn-spin").innerText = "SÜRE DOLDU!";
          if (!isSpinning) triggerSummary();
        }
      }, 1000);
    };

    function getRandomItem() {
      let rand = Math.random() * 100, cum = 0;
      for (let t of TIERS) {
        cum += t.rate;
        if (rand <= cum) {
          let it = t.items[Math.floor(Math.random() * t.items.length)];
          let pts = Math.floor(Math.random() * (t.maxP - t.minP + 1)) + t.minP;
          return { tier: t.name, item: it, pts: pts, c: t.c };
        }
      }
      return { tier: TIERS[0].name, item: TIERS[0].items[0], pts: TIERS[0].minP, c: TIERS[0].c };
    }

    function spinCase() {
      if (isSpinning || timeLeft <= 0) return;
      isSpinning = true;
      document.getElementById("btn-spin").disabled = true;

      document.getElementById("ready-view").style.display = "none";
      const rView = document.getElementById("roulette-view");
      const track = document.getElementById("roulette-track");
      rView.style.display = "flex";

      track.style.transition = "none";
      track.style.transform = "translateX(0px)";
      track.innerHTML = "";

      const totalItems = 30, winIdx = 24;
      let winDrop = null;

      for (let i = 0; i < totalItems; i++) {
        let d = getRandomItem();
        if (i === winIdx) winDrop = d;
        track.innerHTML += `
          <div class="roulette-item" style="border-bottom:3px solid ${d.c};">
            <span style="color:${d.c}; font-weight:bold;">${d.tier}</span>
            <span style="font-size:8px; margin:2px 0;">${d.item}</span>
            <span style="color:var(--neon-green);">+${d.pts}P</span>
          </div>
        `;
      }

      setTimeout(() => {
        track.style.transition = "transform 3s cubic-bezier(0.12, 0.8, 0.2, 1)";
        const itemWidth = 80;
        const targetX = -(winIdx * itemWidth) + (rView.offsetWidth / 2) - (itemWidth / 2) + (Math.random() * 20 - 10);
        track.style.transform = `translateX(${targetX}px)`;
      }, 20);

      setTimeout(() => {
        totalScore += winDrop.pts;
        drops.push(winDrop);
        document.getElementById("lbl-score").innerText = totalScore;
        document.getElementById("drop-badge").innerHTML = `Son Düşen: <span style="color:${winDrop.c}; font-weight:bold;">${winDrop.tier}</span> - <span>${winDrop.item}</span> <b style="color:var(--neon-green);">+${winDrop.pts}P</b>`;

        isSpinning = false;
        if (timeLeft <= 0) {
          triggerSummary();
        } else {
          document.getElementById("btn-spin").disabled = false;
        }
      }, 3100);
    }

    function triggerSummary() {
      setTimeout(() => {
        document.getElementById("sum-score").innerText = `${totalScore} P`;
        document.getElementById("sum-count").innerText = drops.length;

        const dBox = document.getElementById("summary-drops-list");
        dBox.innerHTML = "";
        drops.forEach(d => {
          dBox.innerHTML += `
            <div style="background:#070212; padding:4px 8px; border-radius:4px; display:flex; justify-content:space-between; font-size:10px; border:1px solid #3b1d6e;">
              <span><b style="color:${d.c};">[${d.tier}]</b> ${d.item}</span>
              <b style="color:var(--neon-green);">+${d.pts} P</b>
            </div>
          `;
        });

        document.getElementById("summary-overlay").style.display = "flex";
        recordGameScore('standard', 'Normal Kasa', totalScore, drops);
      }, 1000);
    }
  </script>
</body>
</html>
