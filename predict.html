<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasa Tahmini</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    .prediction-box {
      width: 140px;
      height: 140px;
      margin: auto;
      border: 3px solid #3b1d6e;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      background: #080c16;
      transition: all 0.3s;
    }
  </style>
</head>
<body class="bg-standard">
  <div class="app-container" style="justify-content:space-between;">
    <div>
      <div class="top-header">
        <a href="menu.html" class="icon-btn" style="border-color:var(--danger); z-index:999;">‹ Çıkış</a>
        <div style="font-weight:bold; font-size:12px;">🔮 Kasa Renk Tahmini</div>
        <div id="lbl-score" style="color:var(--neon-gold); font-weight:bold; font-size:12px;">0 P</div>
      </div>
      <div style="font-size:10px; color:var(--text-dim); text-align:center;">Kalan Tahmin Hakkı: <b id="lbl-rounds" style="color:#38bdf8;">5</b></div>
    </div>

    <div class="prediction-box" id="box-display">
      <span>📦</span>
      <span id="lbl-result" style="font-size:11px; color:#94a3b8; margin-top:4px;">Tahmin Et</span>
    </div>

    <div>
      <div style="font-size:10px; color:var(--text-dim); text-align:center; margin-bottom:4px;">Gelecek Kasa Rengini Seç:</div>
      <div style="display:flex; gap:6px;">
        <button class="mode-btn" style="flex:1; background:#0284c7; text-align:center; font-weight:bold;" onclick="makeGuess('blue')">Mavi<br><small>(x2 Puan)</small></button>
        <button class="mode-btn" style="flex:1; background:#9333ea; text-align:center; font-weight:bold;" onclick="makeGuess('purple')">Mor<br><small>(x3 Puan)</small></button>
        <button class="mode-btn" style="flex:1; background:#dc2626; text-align:center; font-weight:bold;" onclick="makeGuess('red')">Kırmızı<br><small>(x5 Puan)</small></button>
      </div>
    </div>

    <!-- Özet Ekranı -->
    <div id="summary-overlay" class="modal-overlay">
      <div class="modal-card">
        <div style="font-size:14px; font-weight:bold; color:var(--neon-gold); text-align:center; margin-bottom:8px;">🔮 TAHMİN TURU BİTTİ</div>
        <div style="text-align:center; margin-bottom:8px; font-size:13px;">Toplam Puan: <b id="sum-score" style="color:var(--neon-green);">0 P</b></div>
        <div style="display:flex; gap:6px;">
          <button class="icon-btn" style="flex:1; background:var(--btn-blue); justify-content:center;" onclick="location.reload()">🔄 Tekrar</button>
          <a href="menu.html" class="icon-btn" style="flex:1; background:var(--danger); justify-content:center;">🚪 Lobi</a>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const COLORS = [
      { id: "blue", name: "Mavi", mult: 2, bg: "#0284c7", chance: 50 },
      { id: "purple", name: "Mor", mult: 3, bg: "#9333ea", chance: 35 },
      { id: "red", name: "Kırmızı", mult: 5, bg: "#dc2626", chance: 15 }
    ];

    let totalScore = 0, remRounds = 5, isGuessing = false, drops = [];

    function makeGuess(userColor) {
      if (isGuessing || remRounds <= 0) return;
      isGuessing = true;

      const rand = Math.random() * 100;
      let outcome = COLORS[0];
      if (rand > 50 && rand <= 85) outcome = COLORS[1];
      else if (rand > 85) outcome = COLORS[2];

      const box = document.getElementById("box-display");
      box.style.background = outcome.bg;
      box.style.borderColor = "#fff";
      document.getElementById("lbl-result").innerText = outcome.name;

      setTimeout(() => {
        if (userColor === outcome.id) {
          const pts = outcome.mult * 40;
          totalScore += pts;
          drops.push({ name: `Doğru Tahmin (${outcome.name})`, p: pts, c: outcome.bg });
        }
        remRounds--;
        document.getElementById("lbl-score").innerText = `${totalScore} P`;
        document.getElementById("lbl-rounds").innerText = remRounds;

        setTimeout(() => {
          box.style.background = "#080c16";
          box.style.borderColor = "#3b1d6e";
          document.getElementById("lbl-result").innerText = "Tahmin Et";
          isGuessing = false;

          if (remRounds <= 0) showSummary();
        }, 800);
      }, 500);
    }

    function showSummary() {
      document.getElementById("sum-score").innerText = `${totalScore} P`;
      document.getElementById("summary-overlay").style.display = "flex";
      recordGameScore('predict_mode', 'Kasa Tahmini', totalScore, drops, totalScore > 0);
    }
  </script>
</body>
</html>
