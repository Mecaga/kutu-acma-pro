<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kutu Açma Pro - Giriş</title>
  <!-- Firebase SDK (v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root {
      --bg-dark: #05020d;
      --card-bg: #120826;
      --neon-purple: #a855f7;
      --neon-purple-dark: #6b21a8;
      --border-purple: #3b1d6e;
      --text-main: #ffffff;
      --text-dim: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      background: radial-gradient(circle at top, #1e0b3d 0%, var(--card-bg) 100%);
      border: 2px solid var(--neon-purple);
      border-radius: 24px;
      padding: 30px 20px;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.35);
      text-align: center;
    }

    .chest-icon {
      font-size: 54px;
      margin-bottom: 6px;
      display: inline-block;
      filter: drop-shadow(0 0 12px #ffd700);
    }

    .auth-title {
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 12px var(--neon-purple);
      margin-bottom: 20px;
      line-height: 1.1;
    }

    .auth-title span {
      color: var(--neon-purple);
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: #090314;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border-purple);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
    }

    .tab-btn.active {
      background: var(--neon-purple);
      color: #fff;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
    }

    .input-group {
      position: relative;
      margin-bottom: 12px;
    }

    .auth-input {
      width: 100%;
      padding: 14px 16px;
      background: #090314;
      border: 1px solid var(--border-purple);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .auth-input:focus {
      border-color: var(--neon-purple);
      box-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(90deg, #9333ea, #a855f7);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
      margin-top: 6px;
      transition: opacity 0.2s;
    }

    .btn-submit:active {
      opacity: 0.85;
    }

    .auth-footer {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 20px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="chest-icon">👑📦</div>
    <div class="auth-title">Kutu Açma<br><span>Pro</span></div>

    <!-- Giriş / Kayıt Sekmeleri -->
    <div class="auth-tabs">
      <button class="tab-btn active" id="tab-login-btn" onclick="switchAuthTab(true)">🎮 Giriş</button>
      <button class="tab-btn" id="tab-register-btn" onclick="switchAuthTab(false)">👤+ Kayıt</button>
    </div>

    <!-- Giriş Alanları -->
    <div class="input-group">
      <input type="text" id="username-in" class="auth-input" placeholder="Kullanıcı Adı" value="Mecaga">
    </div>

    <div class="input-group">
      <input type="password" id="password-in" class="auth-input" placeholder="Şifre" value="123456">
    </div>

    <button class="btn-submit" id="submit-btn" onclick="handleAuthSubmit()">Giriş Yap</button>

    <div class="auth-footer">
      🛡️ Güvenli ve hızlı oyun deneyimi için kutu açma dünyasına katıl!
    </div>
  </div>

  <script>
    // --- 1. FIREBASE BAĞLANTISI ---
    const firebaseConfig = {
      apiKey: "SENIN_API_KEY",
      authDomain: "SENIN_AUTH_DOMAIN",
      databaseURL: "SENIN_DATABASE_URL",
      projectId: "SENIN_PROJECT_ID",
      storageBucket: "SENIN_STORAGE_BUCKET",
      messagingSenderId: "SENIN_SENDER_ID",
      appId: "SENIN_APP_ID"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let isLoginMode = true;

    function switchAuthTab(loginMode) {
      isLoginMode = loginMode;
      document.getElementById('tab-login-btn').classList.toggle('active', loginMode);
      document.getElementById('tab-register-btn').classList.toggle('active', !loginMode);
      document.getElementById('submit-btn').innerText = loginMode ? "Giriş Yap" : "Yeni Hesap Oluştur";
    }

    function handleAuthSubmit() {
      const username = document.getElementById('username-in').value.trim();
      const password = document.getElementById('password-in').value.trim();

      if (!username || !password) {
        return alert("Lütfen kullanıcı adı ve şifre giriniz!");
      }

      // Mevcut kullanıcı verisini al veya sıfırdan etiket/unvan ile oluştur
      let savedUser = JSON.parse(localStorage.getItem("kutu_user")) || {};
      
      const tagNumber = savedUser.tag || ("#" + Math.floor(10000 + Math.random() * 90000));
      const userUID = savedUser.uid || ("U_" + Math.floor(1000 + Math.random() * 9000));

      const userData = {
        uid: userUID,
        name: username,
        tag: tagNumber,
        title: savedUser.title || "Çaylak",
        sound: savedUser.sound !== undefined ? savedUser.sound : true,
        dailyQuest: savedUser.dailyQuest || 0,
        gold: savedUser.gold || 500,
        level: savedUser.level || 1,
        xp: savedUser.xp || 0
      };

      // 1. Yerel Depolamaya Kaydet
      localStorage.setItem("kutu_user", JSON.stringify(userData));

      // 2. Firebase Kayıtlı Kullanıcılar Tablosuna Yaz
      db.ref("registered_users/" + userData.uid).set({
        uid: userData.uid,
        fullName: `${userData.name}${userData.tag}`,
        title: userData.title,
        lastLogin: Date.now()
      }).then(() => {
        // Doğrudan ana menüye yönlendir
        window.location.href = "menu.html";
      }).catch((err) => {
        console.error("Firebase yazma hatası:", err);
        // Hata durumunda da akışı kesmeden lobiye geçir
        window.location.href = "menu.html";
      });
    }
  </script>
</body>
</html>
