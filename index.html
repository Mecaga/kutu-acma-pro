<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kutu Açma Pro - Giriş</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="app-container" style="justify-content:center;">
    <div style="background:rgba(11,19,41,0.95); border:2px solid var(--neon-blue); border-radius:16px; padding:24px 16px; text-align:center;">
      <div style="font-size:45px; margin-bottom:4px;">👑📦</div>
      <div style="font-size:24px; font-weight:900; color:var(--neon-blue); margin-bottom:15px;">Kutu Açma Pro</div>

      <div style="display:flex; gap:6px; margin-bottom:12px;">
        <button class="nav-action-btn" id="tab-l" style="flex:1; background:var(--btn-blue);" onclick="toggleAuth(true)">Giriş</button>
        <button class="nav-action-btn" id="tab-r" style="flex:1;" onclick="toggleAuth(false)">Kayıt Ol</button>
      </div>

      <input type="text" id="auth-user" class="input-field" placeholder="Kullanıcı Adı" maxlength="14">
      <input type="password" id="auth-pass" class="input-field" placeholder="Şifre" maxlength="20">

      <button id="auth-btn" class="btn-start" onclick="handleAuth()">Giriş Yap</button>
      <div style="font-size:10px; color:var(--text-dim); margin-top:10px;">Kaydınız yoksa Kayıt Ol sekmesinden hesap oluşturun.</div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let isLogin = true;

    function toggleAuth(loginMode) {
      isLogin = loginMode;
      document.getElementById("tab-l").style.background = loginMode ? "var(--btn-blue)" : "#0f172a";
      document.getElementById("tab-r").style.background = !loginMode ? "var(--btn-blue)" : "#0f172a";
      document.getElementById("auth-btn").innerText = loginMode ? "Giriş Yap" : "Kayıt Ol ve Başla";
    }

    function handleAuth() {
      const uName = document.getElementById("auth-user").value.trim();
      const uPass = document.getElementById("auth-pass").value.trim();
      if (!uName || !uPass) return alert("Kullanıcı adı ve şifre zorunludur!");

      const safeKey = uName.toLowerCase().replace(/[^a-z0-9]/g, "_");

      if (isLogin) {
        // Kaydı olmayan giriş yapamaz
        db.ref("accounts/" + safeKey).once("value", snap => {
          const acc = snap.val();
          if (!acc || acc.password !== uPass) {
            return alert("Kayıtlı kullanıcı bulunamadı veya şifre yanlış!");
          }
          syncUserFromDB(acc.uid, (fullData) => {
            window.location.href = "menu.html";
          });
        });
      } else {
        // Yeni Kayıt
        db.ref("accounts/" + safeKey).once("value", snap => {
          if (snap.exists()) return alert("Bu kullanıcı adı zaten alınmış!");

          const tag = "#" + Math.floor(10000 + Math.random() * 90000);
          const uid = "U_" + Date.now();
          const newUser = {
            uid: uid,
            name: uName,
            tag: tag,
            title: "Çaylak",
            level: 1,
            xp: 0,
            gold: 500,
            sound: true,
            password: uPass
          };

          db.ref("accounts/" + safeKey).set({ uid: uid, password: uPass });
          db.ref("users/" + uid).set(newUser).then(() => {
            setActiveUser(newUser);
            window.location.href = "menu.html";
          });
        });
      }
    }
  </script>
</body>
</html>
