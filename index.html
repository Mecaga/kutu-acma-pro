<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kutu Açma Pro - Giriş</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

    <div class="auth-container">
        <div class="auth-logo">👑 Kutu Açma<br><span style="color: var(--neon-purple);">Pro</span></div>

        <div class="auth-tabs">
            <button class="auth-tab-btn active" id="tab-login-btn" onclick="toggleAuth(true)">🎮 Giriş</button>
            <button class="auth-tab-btn" id="tab-register-btn" onclick="toggleAuth(false)">👤+ Kayıt</button>
        </div>

        <div class="input-group">
            <input type="text" id="auth-username" placeholder="Kullanıcı Adı" value="MecagaTR">
        </div>

        <div class="input-group">
            <input type="password" id="auth-password" placeholder="Şifre" value="123456">
        </div>

        <button class="btn btn-purple" style="width: 100%; padding: 12px; margin-top: 10px;" onclick="handleAuthSubmit()">Giriş Yap</button>
        <p style="font-size: 11px; color: var(--text-dim); margin-top: 15px;">🛡️ Güvenli ve hızlı oyun deneyimi için kutu açma dünyasına katıl!</p>
    </div>

    <script src="app.js"></script>
    <script>
        let isLoginMode = true;
        function toggleAuth(login) {
            isLoginMode = login;
            document.getElementById('tab-login-btn').classList.toggle('active', login);
            document.getElementById('tab-register-btn').classList.toggle('active', !login);
        }

        function handleAuthSubmit() {
            let uName = document.getElementById('auth-username').value.trim();
            if (!uName) return alert("Kullanıcı adı giriniz!");
            
            let u = getCurrentUser();
            u.username = uName;
            saveCurrentUser(u);
            window.location.href = "menu.html";
        }
    </script>
</body>
</html>
