<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kutu Açma Pro - Giriş</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="auth-box">
      <div style="font-size: 50px; margin-bottom: 5px;">👑📦</div>
      <div class="auth-logo">Kutu Açma<br><span style="color: var(--neon-purple);">Pro</span></div>
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="setAuth(true)">🎮 Giriş</button>
        <button class="auth-tab" id="tab-reg" onclick="setAuth(false)">👤+ Kayıt</button>
      </div>
      <input type="text" id="auth-name-in" class="auth-input" placeholder="Kullanıcı Adı" value="Mecaga">
      <input type="password" id="auth-pass-in" class="auth-input" placeholder="Şifre" value="123456">
      <button class="btn-auth" onclick="doAuth()">Giriş Yap</button>
      <p style="font-size: 10px; color: var(--text-dim); margin-top: 15px;">🛡️ Güvenli ve hızlı oyun deneyimi için kutu açma dünyasına katıl!</p>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let isLogin = true;
    function setAuth(val) {
      isLogin = val;
      document.getElementById("tab-login").classList.toggle("active", val);
      document.getElementById("tab-reg").classList.toggle("active", !val);
    }
    function doAuth() {
      let name = document.getElementById("auth-name-in").value.trim();
      if (!name) return alert("Kullanıcı adı giriniz!");
      let u = getUser();
      u.name = name;
      saveUser(u);
      window.location.href = "menu.html";
    }
  </script>
</body>
</html>
