<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kutu Açma Pro - Giriş</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="app-container" style="justify-content:center;">
    <div style="background:radial-gradient(circle, #1e0b3d 0%, #100624 100%); border:2px solid var(--neon-purple); border-radius:20px; padding:24px 16px; text-align:center; box-shadow:0 0 25px var(--neon-purple-glow);">
      <div style="font-size:46px; margin-bottom:4px;">👑📦</div>
      <div style="font-size:22px; font-weight:900; color:#fff; text-shadow:0 0 12px var(--neon-purple); margin-bottom:14px;">Kutu Açma Pro</div>

      <div style="display:flex; gap:6px; margin-bottom:12px;">
        <button class="mode-btn" id="tab-l" style="flex:1; background:var(--neon-purple); color:#fff; font-weight:bold; text-align:center;" onclick="toggleAuth(true)">Giriş</button>
        <button class="mode-btn" id="tab-r" style="flex:1; text-align:center;" onclick="toggleAuth(false)">Kayıt Ol</button>
      </div>

      <input type="text" id="auth-user" class="input-field" placeholder="Kullanıcı Adı" maxlength="14">
      <input type="password" id="auth-pass" class="input-field" placeholder="Şifre" maxlength="20">

      <button id="auth-btn" class="btn-start" style="background:linear-gradient(90deg, #9333ea, #a855f7);" onclick="handleAuth()">Giriş Yap</button>
      <div style="font-size:10px; color:var(--text-dim); margin-top:10px;">Admin Girişi: <b>admin</b> / <b>12345</b></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let isLogin = true;

    function toggleAuth(loginMode) {
      isLogin = loginMode;
      document.getElementById("tab-l").style.background = loginMode ? "var(--neon-purple)" : "#13072b";
      document.getElementById("tab-l").style.color = loginMode ? "#fff" : "var(--text-dim)";
      document.getElementById("tab-r").style.background = !loginMode ? "var(--neon-purple)" : "#13072b";
      document.getElementById("tab-r").style.color = !loginMode ? "#fff" : "var(--text-dim)";
      document.getElementById("auth-btn").innerText = loginMode ? "Giriş Yap" : "Kayıt Ol ve Başla";
    }

    function handleAuth() {
      const uName = document.getElementById("auth-user").value.trim();
      const uPass = document.getElementById("auth-pass").value.trim();
      if (!uName || !uPass) return alert("Kullanıcı adı ve şifre zorunludur!");

      // Sabit Admin Hesabı Kontrolü
      if (uName.toLowerCase() === "admin" && uPass === "12345") {
        const adminUser = {
          uid: "ADMIN_ROOT",
          name: "admin",
          tag: "#0001",
          avatar: "👑",
          title: "Hükümdar",
          isAdmin: true,
          stats: {}
        };
        setActiveUser(adminUser);
        return window.location.href = "menu.html";
      }

      const safeKey = uName.toLowerCase().replace(/[^a-z0-9]/g, "_");

      if (isLogin) {
        db.ref("accounts/" + safeKey).once("value", snap => {
          const acc = snap.val();
          if (!acc || acc.password !== uPass) {
            return alert("Kayıtlı kullanıcı bulunamadı veya şifre yanlış!");
          }
          syncUserFromDB(acc.uid, () => {
            window.location.href = "menu.html";
          });
        });
      } else {
        db.ref("accounts/" + safeKey).once("value", snap => {
          if (snap.exists()) return alert("Bu kullanıcı adı zaten alınmış!");

          const tag = "#" + Math.floor(10000 + Math.random() * 90000);
          const uid = "U_" + Date.now();
          const newUser = {
            uid: uid,
            name: uName,
            tag: tag,
            avatar: "👤",
            title: "Çaylak",
            stats: {},
            password: uPass
          };

          db.ref("accounts/" + safeKey).set({ uid: uid, password: uPass });
          db.ref("users/" + uid).set(newUser).then(() => {
            setActiveUser(newUser);
            window.location.href = "menu.html";
          });
        });
      }
    }
  </script>
</body>
</html>
