<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaman Bombası Modu</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-standard">
  <div class="app-container" style="justify-content:space-between;">
    <div>
      <div class="top-header">
        <a href="menu.html" class="icon-btn" style="border-color:var(--danger);">‹ Çıkış</a>
        <div style="font-weight:bold; font-size:12px;">⏳ Zaman Bombası (10s)</div>
        <div id="score-badge" style="color:var(--neon-gold); font-weight:bold; font-size:12px;">0 P</div>
      </div>
      <div class="game-stats-top" style="display:flex; justify-content:space-between; margin-bottom:6px;">
        <div class="stat-card timer" style="border:1px solid #ef4444; background:#0d1527; padding:4px 8px; border-radius:8px;">
          <div style="font-size:9px; color:#94a3b8;">PATLAMA SÜRESİ</div>
          <div style="font-size:14px; font-weight:bold; color:#f87171;" id="lbl-timer">10.0s</div>
          <div style="font-size:10px; color:#38bdf8;" id="lbl-user-tag">@User</div>
        </div>
        <div class="stat-card score" style="border:1px solid #10b981; background:#0d1527; padding:4px 8px; border-radius:8px; text-align:right;">
          <div style="font-size:9px; color:#94a3b8;">KABLO DURUMU</div>
          <div style="font-size:14px; font-weight:bold; color:#34d399;" id="lbl-wires">0 / 3 Kesildi</div>
        </div>
      </div>
    </div>

    <!-- Bomba ve Kablolar Alanı -->
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#060b17; border-radius:12px; border:1px solid #1e293b; margin:6px 0; padding:10px; gap:8px;">
      <div style="font-size:36px;">💣 C4</div>
      <div style="font-size:10px; color:#fbbf24; text-align:center;">Doğru 3 kabloyu patlamadan sırayla kes!</div>
      
      <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:6px; width:100%;">
        <button class="btn-start" style="background:#ef4444; padding:8px; font-size:11px;" onclick="cutWire(0, this)">🔴 Kırmızı Kablo</button>
        <button class="btn-start" style="background:#38bdf8; padding:8px; font-size:11px;" onclick="cutWire(1, this)">🔵 Mavi Kablo</button>
        <button class="btn-start" style="background:#10b981; padding:8px; font-size:11px;" onclick="cutWire(2, this)">🟢 Yeşil Kablo</button>
        <button class="btn-start" style="background:#fbbf24; color:#000; padding:8px; font-size:11px;" onclick="cutWire(3, this)">🟡 Sarı Kablo</button>
      </div>
    </div>

    <div id="summary-overlay" class="modal-overlay">
      <div class="modal-card">
        <div id="summary-title" style="font-size:14px; font-weight:bold; color:var(--neon-gold); text-align:center; margin-bottom:8px;">BOMBA ETKİSİZ!</div>
        <div style="display:flex; justify-content:space-around; margin-bottom:8px; background:#070212; padding:6px; border-radius:6px;">
          <div>Kazanılan: <b id="sum-score" style="color:var(--neon-green);">0 P</b></div>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="icon-btn" style="flex:1; background:var(--btn-blue); justify-content:center;" onclick="location.reload()">🔄 Tekrar</button>
          <a href="menu.html" class="icon-btn" style="flex:1; background:var(--danger); justify-content:center;">🚪 Lobi</a>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let timeLeft = 10.0, timerInt = null, cutCount = 0, bombDefused = false;
    // Rastgele patlatan tuzak kablo
    const trapWire = Math.floor(Math.random() * 4);

    window.onload = () => {
      const u = getActiveUser();
      document.getElementById("lbl-user-tag").innerText = u ? `@${u.name}${u.tag}` : "@Misafir";
      timerInt = setInterval(() => {
        timeLeft -= 0.1;
        document.getElementById("lbl-timer").innerText = `${Math.max(0, timeLeft).toFixed(1)}s`;
        if (timeLeft <= 0 && !bombDefused) {
          clearInterval(timerInt);
          triggerGameOver(false);
        }
      }, 100);
    };

    function cutWire(wireIdx, btn) {
      if (timeLeft <= 0 || bombDefused) return;
      btn.disabled = true;

      if (wireIdx === trapWire) {
        clearInterval(timerInt);
        btn.style.background = "#000";
        triggerGameOver(false);
      } else {
        cutCount++;
        document.getElementById("lbl-wires").innerText = `${cutCount} / 3 Kesildi`;
        btn.style.opacity = "0.3";

        if (cutCount === 3) {
          bombDefused = true;
          clearInterval(timerInt);
          triggerGameOver(true);
        }
      }
    }

    function triggerGameOver(isSuccess) {
      const score = isSuccess ? 800 : 0;
      document.getElementById("score-badge").innerText = `${score} P`;
      document.getElementById("sum-score").innerText = `${score} P`;
      document.getElementById("summary-title").innerText = isSuccess ? "🎉 BOMBA İMHA EDİLDİ (+800P)" : "💥 BOOM! BOMBA PATLADI (0P)";
      document.getElementById("summary-overlay").style.display = "flex";

      recordGameScore('bomb_mode', 'Zaman Bombası', score, [{ tier: "İmha", item: isSuccess ? "C4 İmha Ödülü" : "Patlama", pts: score, c: isSuccess ? "#10b981" : "#ef4444" }], isSuccess);
    }
  </script>
</body>
</html>
