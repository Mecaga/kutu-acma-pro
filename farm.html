<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kasa Çiftliği - Hay Day Edition</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #020617;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
    }
    .farm-app-layout {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      background: #030712;
      position: relative;
    }
    
    /* 1. ÜST PANEL */
    .farm-top-bar {
      flex-shrink: 0;
      background: #090d1a;
      border-bottom: 2px solid #1e293b;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      z-index: 1000;
    }

    /* 2. ORTA SCROLL ALANI */
    .farm-scroll-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .farm-scroll-area::-webkit-scrollbar { width: 3px; }
    .farm-scroll-area::-webkit-scrollbar-thumb { background: #3b1d6e; border-radius: 4px; }

    /* 3. ALT DOCK */
    .farm-bottom-dock {
      flex-shrink: 0;
      background: #090d1a;
      border-top: 2px solid #1e293b;
      padding: 5px 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      z-index: 1000;
      height: 130px;
    }

    /* 30 Parselli Tarla */
    .farm-grid-30 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 3px;
      width: 100%;
    }
    .farm-plot-mini {
      background: #1c1306;
      border: 1px solid #854d0e;
      border-radius: 5px;
      height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      font-size: 7px;
    }
    .farm-plot-mini:active { transform: scale(0.94); }
    .farm-plot-mini.locked { background: #0c0a09; border-color: #332a22; opacity: 0.5; }
    .farm-plot-mini.ready { border-color: #22c55e; background: #062e16; box-shadow: 0 0 4px #22c55e; }

    /* Sağa Sola Kayan Kartlar */
    .horizontal-scroll-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .horizontal-scroll-row::-webkit-scrollbar { display: none; }

    .hayday-card {
      flex: 0 0 135px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 5px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 8px;
      gap: 4px;
    }
    .hayday-card.unbought {
      opacity: 0.7;
      border-style: dashed;
      background: #080c18;
    }

    .dock-tab-btn {
      flex: 1;
      padding: 4px;
      background: #1e1b4b;
      border: 1px solid #4338ca;
      color: #fff;
      font-size: 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .dock-tab-btn.active { background: #4338ca; border-color: var(--neon-gold); }

    .seed-btn-chip {
      padding: 2px 1px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      color: #fff;
      font-size: 6.5px;
      cursor: pointer;
      text-align: center;
      height: 38px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .seed-btn-chip.active { border-color: var(--neon-gold); background: #2a1b02; }
    .seed-btn-chip.locked { opacity: 0.35; }
  </style>
</head>
<body>
  <div class="farm-app-layout">
    
    <!-- 1. ÜST SABİT PANEL -->
    <div class="farm-top-bar">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <button type="button" class="icon-btn" style="border-color:var(--danger); padding:2px 8px; font-size:9.5px;" onclick="location.href='menu.html'">‹ Lobi</button>
        <div style="font-weight:900; font-size:11px; color:#38bdf8;">🌾 Kasa Çiftliği (Hay Day)</div>
        <div id="lbl-farm-gold" style="color:var(--neon-gold); font-weight:bold; font-size:11px;">🪙 200</div>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; background:#070a13; padding:2px 5px; border-radius:4px; font-size:7.5px;">
        <span>⭐ Lv.<b id="lbl-farm-lvl">1</b> (<span id="lbl-farm-xp">0/100</span>)</span>
        <span>📦 Depo: <b id="lbl-storage-count" style="color:#38bdf8;">0/100</b></span>
        <span>💧 Su: <b id="lbl-water-tank">15/15</b></span>
      </div>
    </div>

    <!-- 2. ORTA SCROLL ALANI -->
    <div class="farm-scroll-area">
      
      <!-- Tarlalar -->
      <div style="display:flex; justify-content:space-between; font-size:8px; color:#94a3b8; font-weight:bold;">
        <span>🌱 Tarla Parselleri (5x6 = 30 Parsel):</span>
        <span id="lbl-plot-stats">Açık: 8/30</span>
      </div>
      <div class="farm-grid-30" id="plots-container"></div>

      <!-- Hayvan Barınakları (Besleme & Toplama) -->
      <div style="font-size:8px; color:#38bdf8; font-weight:bold;">🐮 Hayvan Barınakları (Besle & Topla ➔):</div>
      <div class="horizontal-scroll-row" id="animals-container"></div>

      <!-- Yana Kayan Üretim Tezgahları (Crafting) -->
      <div style="font-size:8px; color:var(--neon-gold); font-weight:bold;">🏭 Üretim Tezgahları & İmalathaneler (Kaydır ➔):</div>
      <div class="horizontal-scroll-row" id="workbenches-container"></div>

      <!-- Sipariş Panosu -->
      <div style="background:#0f172a; border:1px solid #1e293b; border-radius:8px; padding:6px;">
        <div style="font-size:8px; color:var(--neon-gold); font-weight:bold; margin-bottom:4px;">📜 Kasaba Sipariş Panosu</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:4px;" id="orders-board-container"></div>
      </div>

    </div>

    <!-- 3. ALT SABİT DOCK -->
    <div class="farm-bottom-dock">
      <div style="display:flex; gap:3px;">
        <button type="button" class="dock-tab-btn active" id="tab-btn-seeds" onclick="switchDockTab('seeds')">🌱 Tohumlar</button>
        <button type="button" class="dock-tab-btn" id="tab-btn-feed" onclick="switchDockTab('feed')">🥣 Yem Değirmeni</button>
        <button type="button" class="dock-tab-btn" id="tab-btn-tools" onclick="switchDockTab('tools')">🛠️ Alet & Traktör</button>
        <button type="button" class="dock-tab-btn" id="tab-btn-barn" onclick="switchDockTab('barn')">📦 Ambar/Depo</button>
      </div>

      <!-- Panel 1: Tohumlar (Fiyat, Süre ve Lv Bilgisi) -->
      <div id="dock-panel-seeds" style="display:grid; grid-template-columns: repeat(5, 1fr); gap:2px; height:85px; overflow-y:auto;">
        <button type="button" class="seed-btn-chip active" id="btn-seed-0" onclick="selectSeed(0)"><b>🌱Tahta</b><small>0🪙•10s</small><span style="color:#94a3b8;">Lv.1</span></button>
        <button type="button" class="seed-btn-chip" id="btn-seed-1" onclick="selectSeed(1)"><b>⚔️Demir</b><small>15🪙•20s</small><span style="color:#94a3b8;">Lv.2</span></button>
        <button type="button" class="seed-btn-chip" id="btn-seed-2" onclick="selectSeed(2)"><b>🪙Altın</b><small>25🪙•30s</small><span style="color:#94a3b8;">Lv.3</span></button>
        <button type="button" class="seed-btn-chip" id="btn-seed-3" onclick="selectSeed(3)"><b>💎Safir</b><small>40🪙•45s</small><span style="color:#94a3b8;">Lv.4</span></button>
        <button type="button" class="seed-btn-chip" id="btn-seed-4" onclick="selectSeed(4)"><b>🌿Zümrüt</b><small>60🪙•60s</small><span style="color:#94a3b8;">Lv.5</span></button>
        <button type="button" class="seed-btn-chip" id="btn-seed-5" onclick="selectSeed(5)"><b>🔴Yakut</b><small>90🪙•80s</small><span style="color:#94a3b8;">Lv.6</span></button>
        <button type="button" class="seed-btn-chip" id="btn-seed-6" onclick="selectSeed(6)"><b>🔮Ametist</b><small>130🪙•100s</small><span style="color:#94a3b8;">Lv.7</span></button>
        <button type="button" class="seed-btn-chip" id="btn-seed-7" onclick="selectSeed(7)"><b>👑Efsane</b><small>200🪙•140s</small><span style="color:#94a3b8;">Lv.8</span></button>
        <button type="button" class="seed-btn-chip" id="btn-seed-8" onclick="selectSeed(8)"><b>🌌Kozmik</b><small>320🪙•200s</small><span style="color:#94a3b8;">Lv.10</span></button>
        <button type="button" class="seed-btn-chip" id="btn-seed-9" onclick="selectSeed(9)"><b>⚡Tanrısal</b><small>500🪙•300s</small><span style="color:#94a3b8;">Lv.12</span></button>
      </div>

      <!-- Panel 2: Yem Değirmeni -->
      <div id="dock-panel-feed" style="display:none; grid-template-columns: repeat(3, 1fr); gap:3px; height:85px;">
        <button type="button" class="icon-btn" style="background:#0f172a; font-size:7px; display:flex; flex-direction:column; justify-content:center; align-items:center;" onclick="craftFeed('chicken_feed')">
          <b>🐔 Tavuk Yemi</b>
          <small style="color:#94a3b8;">1 Tahta (Buğday)</small>
          <span style="color:var(--neon-green);">Üret</span>
        </button>
        <button type="button" class="icon-btn" style="background:#0f172a; font-size:7px; display:flex; flex-direction:column; justify-content:center; align-items:center;" onclick="craftFeed('cow_feed')">
          <b>🐄 İnek Yemi</b>
          <small style="color:#94a3b8;">1 Demir (Mısır)</small>
          <span style="color:var(--neon-green);">Üret</span>
        </button>
        <button type="button" class="icon-btn" style="background:#0f172a; font-size:7px; display:flex; flex-direction:column; justify-content:center; align-items:center;" onclick="craftFeed('sheep_feed')">
          <b>🐑 Koyun Yemi</b>
          <small style="color:#94a3b8;">1 Altın Ekin</small>
          <span style="color:var(--neon-green);">Üret</span>
        </button>
      </div>

      <!-- Panel 3: Aletler & Traktör -->
      <div id="dock-panel-tools" style="display:none; grid-template-columns: repeat(3, 1fr); gap:3px; height:85px; align-items:center;">
        <button type="button" class="icon-btn" style="background:#15803d; height:100%; font-size:7.5px; display:flex; flex-direction:column; justify-content:center; align-items:center;" onclick="tractorPlantAll()">
          <b>🚜 Toplu Ek</b>
          <small>Boş alanlara eker</small>
        </button>
        <button type="button" class="icon-btn" style="background:#b91c1c; height:100%; font-size:7.5px; display:flex; flex-direction:column; justify-content:center; align-items:center;" onclick="tractorHarvestAll()">
          <b>⚡ Toplu Hasat</b>
          <small>Olgunları toplar</small>
        </button>
        <button type="button" class="icon-btn" style="background:#0284c7; height:100%; font-size:7.5px; display:flex; flex-direction:column; justify-content:center; align-items:center;" onclick="fillWaterTank()">
          <b>💧 Su Doldur</b>
          <small>+15 Su (10🪙)</small>
        </button>
      </div>

      <!-- Panel 4: Ambar / Depo -->
      <div id="dock-panel-barn" style="display:none; height:85px; overflow-y:auto; font-size:7.5px; background:#050914; padding:4px; border-radius:4px;">
        <div id="barn-inventory-list" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:3px;"></div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
  <script>
    const SEEDS = [
      { id: 'wood', name: 'Tahta (Buğday)', cost: 0, reqLvl: 1, growTime: 10, pts: 15, gold: 8, xp: 8, icon: '🌾' },
      { id: 'iron', name: 'Demir (Mısır)', cost: 15, reqLvl: 2, growTime: 20, pts: 30, gold: 20, xp: 16, icon: '🌽' },
      { id: 'gold', name: 'Altın Havuç', cost: 25, reqLvl: 3, growTime: 30, pts: 55, gold: 38, xp: 28, icon: '🥕' },
      { id: 'sapphire', name: 'Safir Meyvesi', cost: 40, reqLvl: 4, growTime: 45, pts: 90, gold: 60, xp: 45, icon: '🫐' },
      { id: 'emerald', name: 'Zümrüt Şekerkamışı', cost: 60, reqLvl: 5, growTime: 60, pts: 130, gold: 90, xp: 65, icon: '🎋' },
      { id: 'ruby', name: 'Yakut Domatesi', cost: 90, reqLvl: 6, growTime: 80, pts: 190, gold: 135, xp: 95, icon: '🍅' },
      { id: 'amethyst', name: 'Ametist Pamuğu', cost: 130, reqLvl: 7, growTime: 100, pts: 280, gold: 190, xp: 135, icon: '☁️' },
      { id: 'legend', name: 'Efsane Kakaosu', cost: 200, reqLvl: 8, growTime: 140, pts: 420, gold: 280, xp: 190, icon: '🍫' },
      { id: 'cosmic', name: 'Kozmik Kahve', cost: 320, reqLvl: 10, growTime: 200, pts: 700, gold: 430, xp: 280, icon: '☕' },
      { id: 'godly', name: 'Tanrısal Çilek', cost: 500, reqLvl: 12, growTime: 300, pts: 1400, gold: 750, xp: 500, icon: '🍓' }
    ];

    const ANIMALS_DEF = [
      { id: 'coop', name: 'Tavuk Kümesi', reqLvl: 1, cost: 40, time: 20, feed: 'chicken_feed', produce: 'egg', icon: '🐔', prodIcon: '🥚', prodName: 'Yumurta' },
      { id: 'barn', name: 'İnek Ahırı', reqLvl: 2, cost: 100, time: 40, feed: 'cow_feed', produce: 'milk', icon: '🐮', prodIcon: '🥛', prodName: 'Süt' },
      { id: 'sheep', name: 'Koyun Ağılı', reqLvl: 4, cost: 220, time: 50, feed: 'sheep_feed', produce: 'wool', icon: '🐑', prodIcon: '🧶', prodName: 'Yün' },
      { id: 'hive', name: 'Arı Kovanı', reqLvl: 5, cost: 350, time: 35, feed: null, produce: 'honey', icon: '🐝', prodIcon: '🍯', prodName: 'Bal' },
      { id: 'pig', name: 'Domuz Çiftliği', reqLvl: 7, cost: 500, time: 60, feed: 'cow_feed', produce: 'truffle', icon: '🐷', prodIcon: '🍄', prodName: 'Trüf' }
    ];

    const WORKBENCHES_DEF = [
      { id: 'bakery', name: 'Ekmek Fırını', reqLvl: 1, cost: 50, icon: '🥖', recipes: [
        { id: 'bread', name: 'Taze Ekmek', time: 30, req: { wood: 2 }, out: 'bread', icon: '🍞', gold: 35, xp: 20 },
        { id: 'cookie', name: 'Kurabiye', time: 50, req: { wood: 2, egg: 1 }, out: 'cookie', icon: '🍪', gold: 70, xp: 45 }
      ]},
      { id: 'dairy', name: 'Mandıra', reqLvl: 3, cost: 150, icon: '🧀', recipes: [
        { id: 'butter', name: 'Köy Tereyağı', time: 40, req: { milk: 1 }, out: 'butter', icon: '🧈', gold: 55, xp: 30 },
        { id: 'cheese', name: 'Kaşar Peyniri', time: 60, req: { milk: 2 }, out: 'cheese', icon: '🧀', gold: 110, xp: 60 }
      ]},
      { id: 'sugar_mill', name: 'Şeker Ocağı', reqLvl: 5, cost: 300, icon: '🎋', recipes: [
        { id: 'sugar', name: 'Beyaz Şeker', time: 45, req: { emerald: 1 }, out: 'sugar', icon: '🍬', gold: 85, xp: 50 }
      ]},
      { id: 'pie_oven', name: 'Pasta Fırını', reqLvl: 6, cost: 450, icon: '🥧', recipes: [
        { id: 'apple_pie', name: 'Çiftlik Turtası', time: 70, req: { bread: 1, honey: 1, egg: 1 }, out: 'pie', icon: '🥧', gold: 190, xp: 110 }
      ]}
    ];

    let selectedSeedIdx = 0;
    let farmState = {
      gold: 200,
      xp: 0,
      lvl: 1,
      totalHarvestPts: 0,
      water: 15,
      unlockedPlots: 8,
      plots: Array(30).fill(null),
      ownedAnimals: ['coop'], // id listesi
      animalStatus: {}, // { coop: { state: 'hungry'|'eating'|'ready', readyTime: 0 } }
      ownedWorkbenches: ['bakery'],
      workbenchQueue: {}, // { bakery: { recipeId: '', readyTime: 0 } }
      inventory: { wood: 5, iron: 0, gold: 0, sapphire: 0, emerald: 0, chicken_feed: 2, cow_feed: 1 },
      orders: [
        { id: 1, req: { wood: 3 }, gold: 40, xp: 25 },
        { id: 2, req: { egg: 2 }, gold: 60, xp: 40 }
      ]
    };

    window.onload = () => {
      loadFarmData();
      setInterval(farmLoopEngine, 1000);
    };

    function switchDockTab(tab) {
      ['seeds', 'feed', 'tools', 'barn'].forEach(t => {
        const btn = document.getElementById(`tab-btn-${t}`);
        const pnl = document.getElementById(`dock-panel-${t}`);
        if (btn) btn.classList.toggle('active', t === tab);
        if (pnl) {
          if (t === 'seeds') pnl.style.display = tab === 'seeds' ? 'grid' : 'none';
          else if (t === 'feed') pnl.style.display = tab === 'feed' ? 'grid' : 'none';
          else if (t === 'tools') pnl.style.display = tab === 'tools' ? 'grid' : 'none';
          else if (t === 'barn') pnl.style.display = tab === 'barn' ? 'block' : 'none';
        }
      });
      if (tab === 'barn') renderBarnInventory();
    }

    function selectSeed(idx) {
      const s = SEEDS[idx];
      if (farmState.lvl < s.reqLvl) {
        return alert(`Bu tohum Seviye ${s.reqLvl}'de açılır! (Seviyen: ${farmState.lvl})`);
      }
      selectedSeedIdx = idx;
      for (let i = 0; i < SEEDS.length; i++) {
        const b = document.getElementById(`btn-seed-${i}`);
        if (b) b.classList.toggle('active', i === idx);
      }
    }

    function renderPlots() {
      const container = document.getElementById("plots-container");
      if (!container) return;
      container.innerHTML = "";
      const now = Date.now();

      farmState.plots.forEach((p, idx) => {
        const div = document.createElement("div");
        div.className = "farm-plot-mini";

        if (idx >= farmState.unlockedPlots) {
          div.className += " locked";
          const cost = (idx + 1) * 25;
          div.innerHTML = `<span>🔒</span><b style="font-size:6px; color:var(--neon-gold);">${cost}🪙</b>`;
          div.onclick = () => unlockPlot(idx, cost);
        } else if (!p) {
          div.innerHTML = `<span style="font-size:10px;">🟫</span><small style="font-size:5.5px; color:#a16207;">Boş</small>`;
          div.onclick = () => plantSeed(idx);
        } else {
          const remSec = Math.max(0, Math.ceil((p.readyTime - now) / 1000));
          const seed = SEEDS[p.seedIdx] || SEEDS[0];

          if (remSec === 0) {
            div.className += " ready";
            div.innerHTML = `<span style="font-size:12px;">${seed.icon}</span><b style="font-size:5.5px; color:#22c55e;">TOPLA!</b>`;
            div.onclick = () => harvestPlot(idx);
          } else {
            div.innerHTML = `
              <span style="font-size:9px;">🌱</span>
              <b style="font-size:6px; color:#fbbf24;">${remSec}s</b>
              ${!p.watered ? `<button type="button" class="icon-btn" style="padding:0px 2px; font-size:5px; background:#0284c7; margin-top:1px;" onclick="event.stopPropagation(); waterPlot(${idx});">💧</button>` : `<small style="font-size:5px; color:#38bdf8;">✓</small>`}
            `;
            div.onclick = () => {};
          }
        }
        container.appendChild(div);
      });

      document.getElementById("lbl-farm-gold").innerText = `🪙 ${farmState.gold}`;
      document.getElementById("lbl-farm-lvl").innerText = farmState.lvl;
      document.getElementById("lbl-farm-xp").innerText = `${farmState.xp}/${farmState.lvl * 120}`;
      document.getElementById("lbl-water-tank").innerText = `${farmState.water}/15`;
      document.getElementById("lbl-plot-stats").innerText = `Açık: ${farmState.unlockedPlots}/30`;

      renderAnimals();
      renderWorkbenches();
      renderOrders();
      updateStorageCounter();
    }

    /* Hayvan Barınakları */
    function renderAnimals() {
      const container = document.getElementById("animals-container");
      if (!container) return;
      container.innerHTML = "";
      const now = Date.now();

      ANIMALS_DEF.forEach(an => {
        const div = document.createElement("div");
        const isOwned = farmState.ownedAnimals.includes(an.id);
        div.className = "hayday-card" + (isOwned ? "" : " unbought");

        if (!isOwned) {
          const canBuy = farmState.lvl >= an.reqLvl;
          div.innerHTML = `
            <div style="display:flex; align-items:center; gap:3px;">
              <span style="font-size:14px;">${an.icon}</span>
              <div><b>${an.name}</b><div style="color:var(--neon-gold); font-size:6.5px;">${an.cost}🪙 (Lv.${an.reqLvl})</div></div>
            </div>
            <button type="button" class="icon-btn" style="padding:2px; font-size:6.5px; background:${canBuy ? '#16a34a' : '#334155'};" onclick="buyAnimal('${an.id}', ${an.cost}, ${an.reqLvl})">Satın Al</button>
          `;
        } else {
          const stat = farmState.animalStatus[an.id] || { state: 'hungry', readyTime: 0 };
          let statusHtml = "";

          if (stat.state === 'hungry') {
            statusHtml = `
              <div style="color:#f59e0b; font-size:6.5px;">Aç (Yem Bekliyor)</div>
              <button type="button" class="icon-btn" style="padding:2px; font-size:6.5px; background:#d97706;" onclick="feedAnimal('${an.id}')">🥣 Yem Ver</button>
            `;
          } else if (stat.state === 'eating') {
            const rem = Math.max(0, Math.ceil((stat.readyTime - now) / 1000));
            if (rem === 0) {
              stat.state = 'ready';
              statusHtml = `
                <div style="color:#22c55e; font-size:6.5px;">${an.prodName} Hazır!</div>
                <button type="button" class="icon-btn" style="padding:2px; font-size:6.5px; background:#16a34a;" onclick="collectAnimalProduce('${an.id}')">${an.prodIcon} Topla</button>
              `;
            } else {
              statusHtml = `<div style="color:#38bdf8; font-size:6.5px;">Üretiyor: ${rem}s</div>`;
            }
          } else if (stat.state === 'ready') {
            statusHtml = `
              <div style="color:#22c55e; font-size:6.5px;">${an.prodName} Hazır!</div>
              <button type="button" class="icon-btn" style="padding:2px; font-size:6.5px; background:#16a34a;" onclick="collectAnimalProduce('${an.id}')">${an.prodIcon} Topla</button>
            `;
          }

          div.innerHTML = `
            <div style="display:flex; align-items:center; justify-content:space-between;">
              <span style="font-size:14px;">${an.icon}</span>
              <b>${an.name}</b>
            </div>
            ${statusHtml}
          `;
        }
        container.appendChild(div);
      });
    }

    function buyAnimal(id, cost, reqLvl) {
      if (farmState.lvl < reqLvl) return alert(`Seviye ${reqLvl} gerekiyor!`);
      if (farmState.gold < cost) return alert("Yetersiz altın!");
      farmState.gold -= cost;
      farmState.ownedAnimals.push(id);
      farmState.animalStatus[id] = { state: 'hungry', readyTime: 0 };
      addXP(30);
      saveFarmData();
      renderPlots();
    }

    function feedAnimal(id) {
      const an = ANIMALS_DEF.find(a => a.id === id);
      if (!an) return;
      if (an.feed) {
        if ((farmState.inventory[an.feed] || 0) <= 0) {
          return alert(`Yem Değirmeni'nden ${an.name} için yem üretmelisin!`);
        }
        farmState.inventory[an.feed]--;
      }
      farmState.animalStatus[id] = {
        state: 'eating',
        readyTime: Date.now() + (an.time * 1000)
      };
      saveFarmData();
      renderPlots();
    }

    function collectAnimalProduce(id) {
      const an = ANIMALS_DEF.find(a => a.id === id);
      if (!an) return;
      farmState.inventory[an.produce] = (farmState.inventory[an.produce] || 0) + 1;
      farmState.animalStatus[id] = { state: 'hungry', readyTime: 0 };
      addXP(15);
      saveFarmData();
      renderPlots();
    }

    /* Üretim Tezgahları (Crafting) */
    function renderWorkbenches() {
      const container = document.getElementById("workbenches-container");
      if (!container) return;
      container.innerHTML = "";
      const now = Date.now();

      WORKBENCHES_DEF.forEach(wb => {
        const div = document.createElement("div");
        const isOwned = farmState.ownedWorkbenches.includes(wb.id);
        div.className = "hayday-card" + (isOwned ? "" : " unbought");

        if (!isOwned) {
          const canBuy = farmState.lvl >= wb.reqLvl;
          div.innerHTML = `
            <div style="display:flex; align-items:center; gap:3px;">
              <span style="font-size:14px;">${wb.icon}</span>
              <div><b>${wb.name}</b><div style="color:var(--neon-gold); font-size:6.5px;">${wb.cost}🪙 (Lv.${wb.reqLvl})</div></div>
            </div>
            <button type="button" class="icon-btn" style="padding:2px; font-size:6.5px; background:${canBuy ? '#16a34a' : '#334155'};" onclick="buyWorkbench('${wb.id}', ${wb.cost}, ${wb.reqLvl})">İnşa Et</button>
          `;
        } else {
          const q = farmState.workbenchQueue[wb.id];
          let craftBody = "";

          if (q && q.readyTime > 0) {
            const rem = Math.max(0, Math.ceil((q.readyTime - now) / 1000));
            if (rem === 0) {
              craftBody = `
                <div style="color:#22c55e; font-size:6.5px;">Üretim Tamam!</div>
                <button type="button" class="icon-btn" style="padding:2px; font-size:6.5px; background:#16a34a;" onclick="collectCraft('${wb.id}')">📦 Al</button>
              `;
            } else {
              craftBody = `<div style="color:#38bdf8; font-size:6.5px;">Üretiliyor: ${rem}s</div>`;
            }
          } else {
            craftBody = `<div style="display:flex; flex-direction:column; gap:2px;">`;
            wb.recipes.forEach(rcp => {
              craftBody += `
                <button type="button" class="icon-btn" style="padding:1px 2px; font-size:6px; background:#1e293b; text-align:left;" onclick="startCraft('${wb.id}', '${rcp.id}')">
                  ${rcp.icon} ${rcp.name} (${rcp.time}s)
                </button>
              `;
            });
            craftBody += `</div>`;
          }

          div.innerHTML = `
            <div style="display:flex; align-items:center; justify-content:space-between;">
              <span style="font-size:14px;">${wb.icon}</span>
              <b>${wb.name}</b>
            </div>
            ${craftBody}
          `;
        }
        container.appendChild(div);
      });
    }

    function buyWorkbench(id, cost, reqLvl) {
      if (farmState.lvl < reqLvl) return alert(`Seviye ${reqLvl} gerekiyor!`);
      if (farmState.gold < cost) return alert("Yetersiz altın!");
      farmState.gold -= cost;
      farmState.ownedWorkbenches.push(id);
      addXP(50);
      saveFarmData();
      renderPlots();
    }

    function startCraft(wbId, rcpId) {
      const wb = WORKBENCHES_DEF.find(w => w.id === wbId);
      const rcp = wb?.recipes.find(r => r.id === rcpId);
      if (!rcp) return;

      // Malzeme kontrolü
      for (let item in rcp.req) {
        if ((farmState.inventory[item] || 0) < rcp.req[item]) {
          return alert(`Yetersiz malzeme! Gerekli: ${rcp.req[item]}x ${item}`);
        }
      }

      // Malzemeleri düş
      for (let item in rcp.req) {
        farmState.inventory[item] -= rcp.req[item];
      }

      farmState.workbenchQueue[wbId] = {
        recipeId: rcpId,
        readyTime: Date.now() + (rcp.time * 1000)
      };
      saveFarmData();
      renderPlots();
    }

    function collectCraft(wbId) {
      const q = farmState.workbenchQueue[wbId];
      if (!q) return;
      const wb = WORKBENCHES_DEF.find(w => w.id === wbId);
      const rcp = wb?.recipes.find(r => r.id === q.recipeId);
      if (!rcp) return;

      farmState.inventory[rcp.out] = (farmState.inventory[rcp.out] || 0) + 1;
      addXP(rcp.xp);
      farmState.workbenchQueue[wbId] = null;
      saveFarmData();
      renderPlots();
    }

    /* Yem Değirmeni */
    function craftFeed(type) {
      if (type === 'chicken_feed') {
        if ((farmState.inventory.wood || 0) < 1) return alert("1 adet Tahta (Buğday) gerekiyor!");
        farmState.inventory.wood--;
        farmState.inventory.chicken_feed = (farmState.inventory.chicken_feed || 0) + 2;
      } else if (type === 'cow_feed') {
        if ((farmState.inventory.iron || 0) < 1) return alert("1 adet Demir (Mısır) gerekiyor!");
        farmState.inventory.iron--;
        farmState.inventory.cow_feed = (farmState.inventory.cow_feed || 0) + 2;
      } else if (type === 'sheep_feed') {
        if ((farmState.inventory.gold || 0) < 1) return alert("1 adet Altın Havuç gerekiyor!");
        farmState.inventory.gold--;
        farmState.inventory.sheep_feed = (farmState.inventory.sheep_feed || 0) + 2;
      }
      addXP(5);
      saveFarmData();
      renderPlots();
    }

    /* Sipariş Panosu */
    function renderOrders() {
      const container = document.getElementById("orders-board-container");
      if (!container) return;
      container.innerHTML = "";

      farmState.orders.forEach((ord, idx) => {
        let reqTxt = "";
        let canFulfill = true;
        for (let item in ord.req) {
          const have = farmState.inventory[item] || 0;
          reqTxt += `${item}: ${have}/${ord.req[item]} `;
          if (have < ord.req[item]) canFulfill = false;
        }

        const div = document.createElement("div");
        div.style.cssText = "background:#090d16; border:1px solid #334155; border-radius:4px; padding:3px; font-size:7px; display:flex; justify-content:space-between; align-items:center;";
        div.innerHTML = `
          <div>
            <b>Sipariş #${idx+1}</b>
            <div style="color:#94a3b8;">${reqTxt}</div>
            <div style="color:var(--neon-gold);">+${ord.gold}🪙 +${ord.xp}XP</div>
          </div>
          <button type="button" class="icon-btn" style="padding:2px 4px; font-size:6.5px; background:${canFulfill ? '#16a34a' : '#334155'};" onclick="fulfillOrder(${idx})">Gönder</button>
        `;
        container.appendChild(div);
      });
    }

    function fulfillOrder(idx) {
      const ord = farmState.orders[idx];
      if (!ord) return;

      for (let item in ord.req) {
        if ((farmState.inventory[item] || 0) < ord.req[item]) {
          return alert("Sipariş için malzemeler eksik!");
        }
      }

      for (let item in ord.req) {
        farmState.inventory[item] -= ord.req[item];
      }

      farmState.gold += ord.gold;
      addXP(ord.xp);

      // Yeni rastgele sipariş üret
      farmState.orders[idx] = generateRandomOrder();
      saveFarmData();
      renderPlots();
    }

    function generateRandomOrder() {
      const items = ['wood', 'iron', 'egg', 'milk', 'bread'];
      const pick = items[Math.floor(Math.random() * items.length)];
      const count = Math.floor(Math.random() * 2) + 1;
      const req = {};
      req[pick] = count;
      return { id: Date.now(), req: req, gold: count * 35, xp: count * 20 };
    }

    /* Depo (Ambar) Görüntüleme */
    function renderBarnInventory() {
      const list = document.getElementById("barn-inventory-list");
      if (!list) return;
      list.innerHTML = "";

      for (let item in farmState.inventory) {
        const count = farmState.inventory[item];
        if (count > 0) {
          list.innerHTML += `
            <div style="background:#0f172a; border:1px solid #1e293b; padding:3px; border-radius:4px;">
              <b>${item.toUpperCase()}:</b> <span style="color:var(--neon-green);">${count}</span>
            </div>
          `;
        }
      }
    }

    function updateStorageCounter() {
      let total = 0;
      for (let item in farmState.inventory) total += farmState.inventory[item] || 0;
      const el = document.getElementById("lbl-storage-count");
      if (el) el.innerText = `${total}/100`;
    }

    /* Tarla & Ekin İşlemleri */
    function plantSeed(plotIdx) {
      const seed = SEEDS[selectedSeedIdx];
      if (farmState.gold < seed.cost) return alert("Yetersiz altın!");

      farmState.gold -= seed.cost;
      const now = Date.now();
      farmState.plots[plotIdx] = {
        seedIdx: selectedSeedIdx,
        plantTime: now,
        readyTime: now + (seed.growTime * 1000),
        watered: false
      };

      saveFarmData();
      renderPlots();
    }

    function waterPlot(plotIdx) {
      if (farmState.water <= 0) return alert("Su tankı boş!");
      const p = farmState.plots[plotIdx];
      if (!p || p.watered) return;

      farmState.water--;
      p.watered = true;
      const rem = p.readyTime - Date.now();
      p.readyTime = Date.now() + Math.floor(rem * 0.55);

      saveFarmData();
      renderPlots();
    }

    function harvestPlot(plotIdx) {
      const p = farmState.plots[plotIdx];
      if (!p) return;
      const seed = SEEDS[p.seedIdx] || SEEDS[0];

      farmState.inventory[seed.id] = (farmState.inventory[seed.id] || 0) + 2; // Çift ürün
      farmState.totalHarvestPts += seed.pts;
      addXP(seed.xp);

      farmState.plots[plotIdx] = null;
      saveFarmData();
      renderPlots();
    }

    function tractorPlantAll() {
      const seed = SEEDS[selectedSeedIdx];
      let count = 0;
      farmState.plots.forEach((p, idx) => {
        if (idx < farmState.unlockedPlots && !p && farmState.gold >= seed.cost) {
          plantSeed(idx);
          count++;
        }
      });
      if (count === 0) alert("Toplu ekim yapılamadı!");
    }

    function tractorHarvestAll() {
      const now = Date.now();
      let count = 0;
      farmState.plots.forEach((p, idx) => {
        if (p && now >= p.readyTime) {
          harvestPlot(idx);
          count++;
        }
      });
      if (count > 0) saveFarmData();
    }

    function fillWaterTank() {
      if (farmState.gold < 10) return alert("10 altın gerekiyor!");
      farmState.gold -= 10;
      farmState.water = 15;
      saveFarmData();
      renderPlots();
    }

    function unlockPlot(idx, cost) {
      if (farmState.gold < cost) return alert(`Açmak için ${cost} altın gerekiyor!`);
      farmState.gold -= cost;
      farmState.unlockedPlots++;
      addXP(30);
      saveFarmData();
      renderPlots();
    }

    function addXP(amount) {
      farmState.xp += amount;
      const req = farmState.lvl * 120;
      if (farmState.xp >= req) {
        farmState.xp -= req;
        farmState.lvl++;
        farmState.gold += (farmState.lvl * 40);
        alert(`🎉 TEBRİKLER! Çiftlik Seviye ${farmState.lvl} oldu! Yeni tohum ve binalar açıldı! (+${farmState.lvl * 40}🪙)`);
      }
    }

    function farmLoopEngine() {
      renderPlots();
    }

    function saveFarmData() {
      localStorage.setItem("kutu_farm_hayday_save", JSON.stringify(farmState));
      const u = getActiveUser();
      if (u && u.uid && u.uid !== "ADMIN_ROOT") {
        db.ref(`users/${u.uid}/farm_hayday`).set(farmState);
      }
    }

    function loadFarmData() {
      const local = localStorage.getItem("kutu_farm_hayday_save");
      if (local) {
        try { farmState = Object.assign(farmState, JSON.parse(local)); } catch (e) {}
      }

      const u = getActiveUser();
      if (u && u.uid && u.uid !== "ADMIN_ROOT") {
        db.ref(`users/${u.uid}/farm_hayday`).once("value", snap => {
          if (snap.exists()) {
            farmState = Object.assign(farmState, snap.val());
          }
          renderPlots();
        });
      } else {
        renderPlots();
      }
    }
  </script>
</body>
</html>
