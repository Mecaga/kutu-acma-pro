<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasa Çiftliği Pro</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    .farm-container-scroll {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
    }
    .farm-grid-9 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin: 2px auto;
      width: 100%;
      max-width: 310px;
    }
    .farm-plot {
      background: #1c1306;
      border: 2px solid #854d0e;
      border-radius: 8px;
      height: 85px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      position: relative;
      transition: transform 0.1s;
    }
    .farm-plot:active { transform: scale(0.96); }
    .farm-plot.locked { background: #0c0a09; border-color: #44403c; opacity: 0.7; }
    .farm-plot.ready { border-color: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.4); }
    .farm-plot.pest { border-color: #ef4444; animation: shake 0.4s infinite; }
    
    .animal-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
    }
    .market-tab-btn {
      flex: 1;
      padding: 4px;
      background: #1e1b4b;
      border: 1px solid #4338ca;
      color: #fff;
      font-size: 9px;
      border-radius: 4px;
      cursor: pointer;
    }
    .market-tab-btn.active { background: #4338ca; font-weight: bold; border-color: var(--neon-gold); }
  </style>
</head>
<body class="bg-standard">
  <div class="app-container" style="justify-content:space-between;">
    <div>
      <div class="top-header">
        <a href="menu.html" class="icon-btn" style="border-color:var(--danger); z-index:999;">‹ Lobi</a>
        <div style="font-weight:bold; font-size:11px;">🌾 Kasa Çiftliği Pro</div>
        <div id="lbl-farm-gold" style="color:var(--neon-gold); font-weight:bold; font-size:11px;">🪙 0</div>
      </div>
      
      <!-- Çiftlik Durum Barı -->
      <div style="display:flex; justify-content:space-between; align-items:center; background:#070a13; padding:4px 6px; border-radius:6px; border:1px solid #1e293b; font-size:9px;">
        <span>⭐ Lv.<b id="lbl-farm-lvl">1</b> (<span id="lbl-farm-xp">0/100</span> XP)</span>
        <span id="lbl-weather-tag">☀️ Güneşli</span>
        <span>💧 Su: <b id="lbl-water-tank">10/10</b></span>
      </div>
    </div>

    <!-- Kaydırılabilir Çiftlik İçeriği -->
    <div class="farm-container-scroll">
      
      <!-- 9'lu Tarla Izgarası -->
      <div class="farm-grid-9" id="plots-container"></div>

      <!-- Hayvanlar & Üretim Binaları -->
      <div style="display:flex; flex-direction:column; gap:4px;">
        <div class="animal-card">
          <div style="display:flex; align-items:center; gap:6px;">
            <span style="font-size:20px;">🐔</span>
            <div>
              <b>Altın Kümes</b>
              <div style="font-size:8px; color:#94a3b8;" id="lbl-coop-timer">Yumurta: 20s</div>
            </div>
          </div>
          <button class="icon-btn" id="btn-collect-egg" style="background:#065f46; font-size:9px;" onclick="collectEgg()">Topla</button>
        </div>

        <div class="animal-card">
          <div style="display:flex; align-items:center; gap:6px;">
            <span style="font-size:20px;">🐄</span>
            <div>
              <b>Süt Ahırı</b>
              <div style="font-size:8px; color:#94a3b8;" id="lbl-barn-timer">Süt: 45s</div>
            </div>
          </div>
          <button class="icon-btn" id="btn-collect-milk" style="background:#065f46; font-size:9px;" onclick="collectMilk()">Topla</button>
        </div>
      </div>

      <!-- Çiftlik Görev Paneli -->
      <div style="background:#0f172a; padding:6px; border-radius:6px; border:1px solid #1e293b; font-size:9.5px;">
        <div style="display:flex; justify-content:space-between; color:var(--neon-gold); font-weight:bold; margin-bottom:2px;">
          <span>📜 Günlük Siparişler</span>
          <span id="lbl-quest-status">0 / 2</span>
        </div>
        <div id="quest-desc" style="color:#cbd5e1; font-size:8.5px;">2 adet Safir Hasat Et (+150 XP, +50🪙)</div>
      </div>
    </div>

    <!-- Alt Aksiyon & Tohum Menüsü -->
    <div>
      <div style="display:flex; gap:3px; margin-bottom:4px;">
        <button class="market-tab-btn active" id="tab-seed" onclick="switchFarmTab('seed')">🌱 Tohumlar</button>
        <button class="market-tab-btn" id="tab-tools" onclick="switchFarmTab('tools')">🛠️ Aletler</button>
        <button class="market-tab-btn" id="tab-tractor" onclick="harvestAllReady()">🚜 Traktör (Topla)</button>
      </div>

      <!-- Tohum Seçimi -->
      <div id="panel-seeds" style="display:flex; gap:3px;">
        <button class="seed-btn active" id="btn-seed-0" style="flex:1; font-size:8.5px; padding:4px;" onclick="selectSeed(0)">🌱 Tahta<br><small>10s-0🪙</small></button>
        <button class="seed-btn" id="btn-seed-1" style="flex:1; font-size:8.5px; padding:4px;" onclick="selectSeed(1)">💎 Safir<br><small>30s-20🪙</small></button>
        <button class="seed-btn" id="btn-seed-2" style="flex:1; font-size:8.5px; padding:4px;" onclick="selectSeed(2)">👑 Efsane<br><small>60s-50🪙</small></button>
        <button class="seed-btn" id="btn-seed-3" style="flex:1; font-size:8.5px; padding:4px;" onclick="selectSeed(3)">🔮 Kozmik<br><small>120s-120🪙</small></button>
      </div>

      <!-- Alet & Bakım Seçimi -->
      <div id="panel-tools" style="display:none; gap:4px;">
        <button class="icon-btn" style="flex:1; background:#0284c7; font-size:9px;" onclick="fillWaterTank()">💧 Su Doldur (10🪙)</button>
        <button class="icon-btn" style="flex:1; background:#7c3aed; font-size:9px;" onclick="buyFertilizer()">🧪 Gübre Al (2x Puan - 15🪙)</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const SEEDS = [
      { id: 'wood', name: 'Tahta Kasa', cost: 0, growTime: 10, pts: 15, goldReward: 8, xp: 10, icon: '📦' },
      { id: 'sapphire', name: 'Safir Kasa', cost: 20, growTime: 30, pts: 60, goldReward: 35, xp: 30, icon: '💎' },
      { id: 'legend', name: 'Efsane Kasa', cost: 50, growTime: 60, pts: 180, goldReward: 90, xp: 80, icon: '👑' },
      { id: 'cosmic', name: 'Kozmik Kasa', cost: 120, growTime: 120, pts: 500, goldReward: 260, xp: 200, icon: '🔮' }
    ];

    let selectedSeedIdx = 0;
    let currentTool = null;
    let hasFertilizer = false;

    let farmState = {
      gold: 50,
      xp: 0,
      lvl: 1,
      totalHarvestPts: 0,
      water: 10,
      coopReady: Date.now() + 20000,
      barnReady: Date.now() + 45000,
      unlockedPlots: 6, // 9'a kadar açılabilir
      plots: Array(9).fill(null) // { seedIdx, plantTime, readyTime, watered, pest }
    };

    window.onload = () => {
      loadFarmData();
      setInterval(farmLoop, 1000);
    };

    function switchFarmTab(tab) {
      document.getElementById("tab-seed").classList.toggle("active", tab === 'seed');
      document.getElementById("tab-tools").classList.toggle("active", tab === 'tools');
      document.getElementById("panel-seeds").style.display = tab === 'seed' ? 'flex' : 'none';
      document.getElementById("panel-tools").style.display = tab === 'tools' ? 'flex' : 'none';
    }

    function selectSeed(idx) {
      selectedSeedIdx = idx;
      [0, 1, 2, 3].forEach(i => {
        const b = document.getElementById(`btn-seed-${i}`);
        if (b) b.classList.toggle('active', i === idx);
      });
    }

    function renderPlots() {
      const container = document.getElementById("plots-container");
      container.innerHTML = "";
      const now = Date.now();

      farmState.plots.forEach((p, idx) => {
        const div = document.createElement("div");
        div.className = "farm-plot";

        if (idx >= farmState.unlockedPlots) {
          div.className += " locked";
          const cost = (idx + 1) * 60;
          div.innerHTML = `<span>🔒</span><b style="font-size:8px; color:var(--neon-gold);">${cost}🪙</b>`;
          div.onclick = () => unlockPlot(idx, cost);
        } else if (!p) {
          div.innerHTML = `<span style="font-size:16px;">🟫</span><small style="font-size:7.5px; color:#a16207;">Boş</small>`;
          div.onclick = () => plantSeed(idx);
        } else {
          const remSec = Math.max(0, Math.ceil((p.readyTime - now) / 1000));
          const seed = SEEDS[p.seedIdx];

          if (p.pest) {
            div.className += " pest";
            div.innerHTML = `<span style="font-size:16px;">🐛</span><b style="font-size:7.5px; color:#ef4444;">TIRTIKLA!</b>`;
            div.onclick = () => clearPest(idx);
          } else if (remSec === 0) {
            div.className += " ready";
            div.innerHTML = `<span style="font-size:18px;">${seed.icon}</span><b style="font-size:7.5px; color:#22c55e;">TOPLA!</b>`;
            div.onclick = () => harvestPlot(idx);
          } else {
            div.innerHTML = `
              <span style="font-size:14px;">🌱</span>
              <b style="font-size:8.5px; color:#fbbf24;">${remSec}s</b>
              ${!p.watered ? `<button class="icon-btn" style="padding:1px 4px; font-size:7px; background:#0284c7; margin-top:2px;" onclick="event.stopPropagation(); waterPlot(${idx});">💧 Sula</button>` : `<small style="font-size:6.5px; color:#38bdf8;">Sulandı</small>`}
            `;
            div.onclick = () => {};
          }
        }
        container.appendChild(div);
      });

      document.getElementById("lbl-farm-gold").innerText = `🪙 ${farmState.gold}`;
      document.getElementById("lbl-farm-lvl").innerText = farmState.lvl;
      document.getElementById("lbl-farm-xp").innerText = `${farmState.xp}/${farmState.lvl * 100}`;
      document.getElementById("lbl-water-tank").innerText = `${farmState.water}/10`;
    }

    function plantSeed(plotIdx) {
      const seed = SEEDS[selectedSeedIdx];
      if (farmState.gold < seed.cost) return alert("Yeterli altının yok!");

      farmState.gold -= seed.cost;
      const now = Date.now();
      farmState.plots[plotIdx] = {
        seedIdx: selectedSeedIdx,
        plantTime: now,
        readyTime: now + (seed.growTime * 1000),
        watered: false,
        pest: false
      };

      saveFarmData();
      renderPlots();
    }

    function waterPlot(plotIdx) {
      if (farmState.water <= 0) return alert("Su tankın boş! Aletler sekmesinden su doldur.");
      const p = farmState.plots[plotIdx];
      if (!p || p.watered) return;

      farmState.water--;
      p.watered = true;
      // Kalan süreyi %40 kısalt
      const rem = p.readyTime - Date.now();
      p.readyTime = Date.now() + Math.floor(rem * 0.6);

      saveFarmData();
      renderPlots();
    }

    function clearPest(plotIdx) {
      if (farmState.plots[plotIdx]) {
        farmState.plots[plotIdx].pest = false;
        addXP(10);
        saveFarmData();
        renderPlots();
      }
    }

    function harvestPlot(plotIdx) {
      const p = farmState.plots[plotIdx];
      if (!p) return;
      const seed = SEEDS[p.seedIdx];

      let mult = hasFertilizer ? 2 : 1;
      farmState.gold += (seed.goldReward * mult);
      farmState.totalHarvestPts += (seed.pts * mult);
      addXP(seed.xp);

      farmState.plots[plotIdx] = null;
      saveFarmData();
      renderPlots();

      recordGameScore('farm_mode', 'Kasa Çiftliği', farmState.totalHarvestPts, [{ name: `${seed.name} Hasatı`, p: seed.pts * mult, c: '#22c55e' }], true);
    }

    function harvestAllReady() {
      const now = Date.now();
      let count = 0;
      farmState.plots.forEach((p, idx) => {
        if (p && now >= p.readyTime && !p.pest) {
          harvestPlot(idx);
          count++;
        }
      });
      if (count > 0) saveFarmData();
    }

    function unlockPlot(idx, cost) {
      if (farmState.gold < cost) return alert(`Bu parseli açmak için ${cost} altın gerekiyor!`);
      farmState.gold -= cost;
      farmState.unlockedPlots++;
      addXP(50);
      saveFarmData();
      renderPlots();
    }

    function collectEgg() {
      if (Date.now() < farmState.coopReady) return alert("Tavuklar henüz yumurtlamadı!");
      farmState.gold += 15;
      addXP(15);
      farmState.coopReady = Date.now() + 20000;
      saveFarmData();
      alert("🥚 Altın Yumurta toplandı! (+15🪙, +15 XP)");
    }

    function collectMilk() {
      if (Date.now() < farmState.barnReady) return alert("İnekler henüz süt vermedi!");
      farmState.gold += 35;
      farmState.totalHarvestPts += 25;
      addXP(30);
      farmState.barnReady = Date.now() + 45000;
      saveFarmData();
      alert("🥛 Taze Süt toplandı! (+35🪙, +25P, +30 XP)");
    }

    function fillWaterTank() {
      if (farmState.gold < 10) return alert("Su doldurmak için 10 altın gerekiyor!");
      farmState.gold -= 10;
      farmState.water = 10;
      saveFarmData();
      renderPlots();
    }

    function buyFertilizer() {
      if (farmState.gold < 15) return alert("Gübre için 15 altın gerekiyor!");
      farmState.gold -= 15;
      hasFertilizer = true;
      saveFarmData();
      alert("🧪 Gübre uygulandı! Bir sonraki hasatların 2 kat puan ve altın verecek.");
    }

    function addXP(amount) {
      farmState.xp += amount;
      const req = farmState.lvl * 100;
      if (farmState.xp >= req) {
        farmState.xp -= req;
        farmState.lvl++;
        farmState.gold += (farmState.lvl * 30);
        alert(`🎉 TEBRİKLER! Çiftlik Seviye ${farmState.lvl} oldu! Bonus +${farmState.lvl * 30} Altın kazandın!`);
      }
    }

    function farmLoop() {
      const now = Date.now();
      
      // Rastgele Tırtıl / Böcek Olayı (%3 ihtimal)
      if (Math.random() < 0.03) {
        const planted = farmState.plots.filter(p => p && now < p.readyTime && !p.pest);
        if (planted.length > 0) {
          planted[Math.floor(Math.random() * planted.length)].pest = true;
        }
      }

      // Kümes ve Ahır Zamanlayıcıları
      const eggRem = Math.max(0, Math.ceil((farmState.coopReady - now) / 1000));
      const milkRem = Math.max(0, Math.ceil((farmState.barnReady - now) / 1000));
      document.getElementById("lbl-coop-timer").innerText = eggRem === 0 ? "🥚 Yumurta Hazır!" : `Yumurta: ${eggRem}s`;
      document.getElementById("lbl-barn-timer").innerText = milkRem === 0 ? "🥛 Süt Hazır!" : `Süt: ${milkRem}s`;

      renderPlots();
    }

    function saveFarmData() {
      localStorage.setItem("kutu_farm_save_v2", JSON.stringify(farmState));
      const u = getActiveUser();
      if (u && u.uid && u.uid !== "ADMIN_ROOT") {
        db.ref(`users/${u.uid}/farm_v2`).set(farmState);
      }
    }

    function loadFarmData() {
      const local = localStorage.getItem("kutu_farm_save_v2");
      if (local) {
        try { farmState = Object.assign(farmState, JSON.parse(local)); } catch (e) {}
      }

      const u = getActiveUser();
      if (u && u.uid && u.uid !== "ADMIN_ROOT") {
        db.ref(`users/${u.uid}/farm_v2`).once("value", snap => {
          if (snap.exists()) {
            farmState = Object.assign(farmState, snap.val());
          }
          renderPlots();
        });
      } else {
        renderPlots();
      }
    }
  </script>
</body>
</html>
