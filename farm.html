<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mega Kasa Çiftliği 2026</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #020617;
      font-family: system-ui, sans-serif;
    }
    .farm-app-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 460px;
      margin: 0 auto;
      position: relative;
    }
    
    /* 1. ÜST ÇAKILI PANEL (Tıklanma Garantili) */
    .farm-sticky-top {
      position: sticky;
      top: 0;
      z-index: 9999;
      background: #090d1a;
      border-bottom: 2px solid #1e293b;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    /* 2. ORTA KAYDIRILABİLİR ALAN */
    .farm-scroll-content {
      flex: 1;
      overflow-y: scroll;
      -webkit-overflow-scrolling: touch;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 3. ALT ÇAKILI DOCK (Tıklanma Garantili) */
    .farm-sticky-bottom {
      position: sticky;
      bottom: 0;
      z-index: 9999;
      background: #090d1a;
      border-top: 2px solid #1e293b;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 -6px 20px rgba(0,0,0,0.9);
    }

    /* 15 Parselli Tarla (3x5) */
    .farm-grid-15 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      width: 100%;
    }
    .farm-plot {
      background: #1c1306;
      border: 2px solid #854d0e;
      border-radius: 8px;
      height: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    .farm-plot:active { transform: scale(0.95); }
    .farm-plot.locked { background: #0c0a09; border-color: #44403c; opacity: 0.6; }
    .farm-plot.ready { border-color: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.4); }
    .farm-plot.pest { border-color: #ef4444; animation: shake 0.4s infinite; }

    .facilities-grid-4 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
    }
    .fac-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 8px;
    }

    .dock-tab-btn {
      flex: 1;
      padding: 4px;
      background: #1e1b4b;
      border: 1px solid #4338ca;
      color: #fff;
      font-size: 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .dock-tab-btn.active {
      background: #4338ca;
      border-color: var(--neon-gold);
    }
    .seed-btn-chip {
      padding: 3px 1px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      color: #fff;
      font-size: 7px;
      cursor: pointer;
      text-align: center;
    }
    .seed-btn-chip.active {
      border-color: var(--neon-gold);
      background: #2a1b02;
    }
  </style>
</head>
<body>
  <div class="farm-app-layout">
    
    <!-- 1. ÜST ÇAKILI BAŞLIK & KAYNAKLAR -->
    <div class="farm-sticky-top">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <button type="button" class="icon-btn" style="border-color:var(--danger); padding:3px 8px; font-size:10px; cursor:pointer;" onclick="location.href='menu.html'">‹ Lobiye Dön</button>
        <div style="font-weight:900; font-size:11px; color:#38bdf8;">🌾 Mega Çiftlik 2026</div>
        <div id="lbl-farm-gold" style="color:var(--neon-gold); font-weight:bold; font-size:11px;">🪙 150</div>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; background:#070a13; padding:2px 5px; border-radius:4px; font-size:7.5px;">
        <span>⭐ Lv.<b id="lbl-farm-lvl">1</b> (<span id="lbl-farm-xp">0/100</span>)</span>
        <span id="lbl-weather-tag" style="color:#fbbf24;">☀️ Güneşli</span>
        <span>📈 Borsa: <b id="lbl-market-mult" style="color:var(--neon-green);">x1.0</b></span>
        <span>💧 Su: <b id="lbl-water-tank">15/15</b></span>
      </div>
    </div>

    <!-- 2. ORTA KAYDIRILABİLİR ÇİFTLİK VE ÜRETİM ALANI -->
    <div class="farm-scroll-content">
      
      <!-- 15 Parselli Tarla -->
      <div class="farm-grid-15" id="plots-container"></div>

      <!-- 8'li Gelişmiş Tesis Izgarası -->
      <div class="facilities-grid-4">
        <div class="fac-box">
          <div style="display:flex; align-items:center; gap:2px;"><span style="font-size:13px;">🐔</span><div><b>Kümes</b><div id="lbl-coop-txt">20s</div></div></div>
          <button type="button" class="icon-btn" style="padding:1px 4px; font-size:7px; background:#065f46;" onclick="collectFacility('coop')">Topla</button>
        </div>
        <div class="fac-box">
          <div style="display:flex; align-items:center; gap:2px;"><span style="font-size:13px;">🐄</span><div><b>Ahır</b><div id="lbl-barn-txt">40s</div></div></div>
          <button type="button" class="icon-btn" style="padding:1px 4px; font-size:7px; background:#065f46;" onclick="collectFacility('barn')">Topla</button>
        </div>
        <div class="fac-box">
          <div style="display:flex; align-items:center; gap:2px;"><span style="font-size:13px;">🐝</span><div><b>Kovan</b><div id="lbl-hive-txt">30s</div></div></div>
          <button type="button" class="icon-btn" style="padding:1px 4px; font-size:7px; background:#065f46;" onclick="collectFacility('hive')">Bal Al</button>
        </div>
        <div class="fac-box">
          <div style="display:flex; align-items:center; gap:2px;"><span style="font-size:13px;">🐟</span><div><b>Gölet</b><div id="lbl-pond-txt">50s</div></div></div>
          <button type="button" class="icon-btn" style="padding:1px 4px; font-size:7px; background:#065f46;" onclick="collectFacility('pond')">Tut</button>
        </div>
        <div class="fac-box">
          <div style="display:flex; align-items:center; gap:2px;"><span style="font-size:13px;">🏭</span><div><b>Değirmen</b><div id="lbl-mill-txt">60s</div></div></div>
          <button type="button" class="icon-btn" style="padding:1px 4px; font-size:7px; background:#4338ca;" onclick="collectFacility('mill')">Un Al</button>
        </div>
        <div class="fac-box">
          <div style="display:flex; align-items:center; gap:2px;"><span style="font-size:13px;">💎</span><div><b>Maden</b><div id="lbl-mine-txt">90s</div></div></div>
          <button type="button" class="icon-btn" style="padding:1px 4px; font-size:7px; background:#b45309;" onclick="collectFacility('mine')">Kaz</button>
        </div>
        <div class="fac-box">
          <div style="display:flex; align-items:center; gap:2px;"><span style="font-size:13px;">🌲</span><div><b>Orman</b><div id="lbl-wood-txt">75s</div></div></div>
          <button type="button" class="icon-btn" style="padding:1px 4px; font-size:7px; background:#15803d;" onclick="collectFacility('wood')">Kes</button>
        </div>
        <div class="fac-box">
          <div style="display:flex; align-items:center; gap:2px;"><span style="font-size:13px;">🍄</span><div><b>Mahzen</b><div id="lbl-mush-txt">45s</div></div></div>
          <button type="button" class="icon-btn" style="padding:1px 4px; font-size:7px; background:#831843;" onclick="collectFacility('mush')">Topla</button>
        </div>
      </div>

      <!-- Kamyon & Görevler -->
      <div style="background:#0f172a; padding:4px; border-radius:6px; border:1px solid #1e293b; display:flex; justify-content:space-between; align-items:center; font-size:8px;">
        <div><b style="color:var(--neon-gold);">🚚 Kasaba Siparişi:</b> <span id="lbl-truck-txt">3 Safir Kasa Teslim Et</span></div>
        <button type="button" class="icon-btn" style="padding:2px 4px; font-size:7.5px; background:#0284c7;" onclick="deliverTruckOrder()">Yolla (+180🪙)</button>
      </div>

      <button type="button" class="btn-start" style="background:linear-gradient(90deg, #db2777, #f43f5e); font-size:8.5px; padding:4px;" onclick="startFestival()">🎉 1 Dk Festival Başlat (80🪙 - 3X Kazanç)</button>
    </div>

    <!-- 3. ALT ÇAKILI DOCK MENÜSÜ -->
    <div class="farm-sticky-bottom">
      <div style="display:flex; gap:3px;">
        <button type="button" class="dock-tab-btn active" id="tab-btn-seeds" onclick="switchDockTab('seeds')">🌱 Tohumlar</button>
        <button type="button" class="dock-tab-btn" id="tab-btn-tools" onclick="switchDockTab('tools')">🛠️ Alet & Bakım</button>
        <button type="button" class="dock-tab-btn" id="tab-btn-tractor" onclick="switchDockTab('tractor')">🚜 Traktör & Su</button>
      </div>

      <!-- Panel 1: 8 Farklı Tohum -->
      <div id="dock-panel-seeds" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:2px;">
        <button type="button" class="seed-btn-chip active" id="btn-seed-0" onclick="selectSeed(0)">🌱Tahta<br><small>10s</small></button>
        <button type="button" class="seed-btn-chip" id="btn-seed-1" onclick="selectSeed(1)">⚔️Demir<br><small>20s</small></button>
        <button type="button" class="seed-btn-chip" id="btn-seed-2" onclick="selectSeed(2)">💎Safir<br><small>35s</small></button>
        <button type="button" class="seed-btn-chip" id="btn-seed-3" onclick="selectSeed(3)">👑Efsane<br><small>60s</small></button>
        <button type="button" class="seed-btn-chip" id="btn-seed-4" onclick="selectSeed(4)">🔮Kozmik<br><small>100s</small></button>
        <button type="button" class="seed-btn-chip" id="btn-seed-5" onclick="selectSeed(5)">⚡Tanrısal<br><small>180s</small></button>
        <button type="button" class="seed-btn-chip" id="btn-seed-6" onclick="selectSeed(6)">🌋Magma<br><small>240s</small></button>
        <button type="button" class="seed-btn-chip" id="btn-seed-7" onclick="selectSeed(7)">🛸Mutant<br><small>300s</small></button>
      </div>

      <!-- Panel 2: Aletler -->
      <div id="dock-panel-tools" style="display:none; gap:2px; display:none; grid-template-columns: repeat(4, 1fr);">
        <button type="button" class="icon-btn" style="background:#0284c7; font-size:7.5px; padding:3px;" onclick="fillWaterTank()">💧 Su Al (10🪙)</button>
        <button type="button" class="icon-btn" style="background:#7c3aed; font-size:7.5px; padding:3px;" onclick="buySuperFertilizer()">🧪 Gübre (20🪙)</button>
        <button type="button" class="icon-btn" style="background:#b45309; font-size:7.5px; padding:3px;" onclick="installScarecrow()">🛡️ Korkuluk (50🪙)</button>
        <button type="button" class="icon-btn" style="background:#065f46; font-size:7.5px; padding:3px;" onclick="buyRainBomb()">🌧️ Yağmur (40🪙)</button>
      </div>

      <!-- Panel 3: Traktör & Kombolar -->
      <div id="dock-panel-tractor" style="display:none; gap:3px;">
        <button type="button" class="icon-btn" style="flex:1; background:#15803d; font-size:7.5px; padding:4px;" onclick="tractorPlantAll()">🚜 Toplu Ek</button>
        <button type="button" class="icon-btn" style="flex:1; background:#b91c1c; font-size:7.5px; padding:4px;" onclick="tractorHarvestAll()">⚡ Toplu Hasat</button>
        <button type="button" class="icon-btn" style="flex:1; background:#4338ca; font-size:7.5px; padding:4px;" onclick="waterAllPlots()">💦 Toplu Sula (5💧)</button>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
  <script>
    const SEEDS = [
      { id: 'wood', name: 'Tahta Kasa', cost: 0, growTime: 10, pts: 15, gold: 10, xp: 10, icon: '📦' },
      { id: 'iron', name: 'Demir Kasa', cost: 15, growTime: 20, pts: 35, gold: 25, xp: 20, icon: '⚔️' },
      { id: 'sapphire', name: 'Safir Kasa', cost: 35, growTime: 35, pts: 80, gold: 55, xp: 45, icon: '💎' },
      { id: 'legend', name: 'Efsane Kasa', cost: 70, growTime: 60, pts: 200, gold: 120, xp: 90, icon: '👑' },
      { id: 'cosmic', name: 'Kozmik Kasa', cost: 150, growTime: 100, pts: 500, gold: 270, xp: 200, icon: '🔮' },
      { id: 'godly', name: 'Tanrısal Kasa', cost: 300, growTime: 180, pts: 1200, gold: 650, xp: 450, icon: '⚡' },
      { id: 'magma', name: 'Magma Kasa', cost: 450, growTime: 240, pts: 2000, gold: 1100, xp: 700, icon: '🌋' },
      { id: 'mutant', name: 'Mutant Kasa', cost: 650, growTime: 300, pts: 3500, gold: 1800, xp: 1200, icon: '🛸' }
    ];

    let selectedSeedIdx = 0;
    let hasSuperFertilizer = false;
    let hasScarecrow = false;
    let marketMultiplier = 1.0;
    let festivalEndTime = 0;

    let farmState = {
      gold: 150,
      xp: 0,
      lvl: 1,
      totalHarvestPts: 0,
      water: 15,
      unlockedPlots: 6, // 15'e kadar açılır
      plots: Array(15).fill(null),
      coopReady: Date.now() + 20000,
      barnReady: Date.now() + 40000,
      hiveReady: Date.now() + 30000,
      pondReady: Date.now() + 50000,
      millReady: Date.now() + 60000,
      mineReady: Date.now() + 90000,
      woodReady: Date.now() + 75000,
      mushReady: Date.now() + 45000,
      sapphireHarvestCount: 0
    };

    window.onload = () => {
      loadFarmData();
      setInterval(farmEngine, 1000);
      setInterval(updateMarketRates, 40000);
    };

    function switchDockTab(tab) {
      document.getElementById("tab-btn-seeds").classList.toggle("active", tab === 'seeds');
      document.getElementById("tab-btn-tools").classList.toggle("active", tab === 'tools');
      document.getElementById("tab-btn-tractor").classList.toggle("active", tab === 'tractor');

      document.getElementById("dock-panel-seeds").style.display = tab === 'seeds' ? 'grid' : 'none';
      document.getElementById("dock-panel-tools").style.display = tab === 'tools' ? 'grid' : 'none';
      document.getElementById("dock-panel-tractor").style.display = tab === 'tractor' ? 'flex' : 'none';
    }

    function selectSeed(idx) {
      selectedSeedIdx = idx;
      for (let i = 0; i < 8; i++) {
        const b = document.getElementById(`btn-seed-${i}`);
        if (b) b.classList.toggle('active', i === idx);
      }
    }

    function renderPlots() {
      const container = document.getElementById("plots-container");
      if (!container) return;
      container.innerHTML = "";
      const now = Date.now();

      farmState.plots.forEach((p, idx) => {
        const div = document.createElement("div");
        div.className = "farm-plot";

        if (idx >= farmState.unlockedPlots) {
          div.className += " locked";
          const cost = (idx + 1) * 60;
          div.innerHTML = `<span>🔒</span><b style="font-size:7px; color:var(--neon-gold);">${cost}🪙</b>`;
          div.onclick = () => unlockPlot(idx, cost);
        } else if (!p) {
          div.innerHTML = `<span style="font-size:13px;">🟫</span><small style="font-size:6.5px; color:#a16207;">Boş</small>`;
          div.onclick = () => plantSeed(idx);
        } else if (p.pest) {
          div.className += " pest";
          div.innerHTML = `<span style="font-size:14px;">🐛</span><b style="font-size:6.5px; color:#ef4444;">TEMİZLE!</b>`;
          div.onclick = () => clearPest(idx);
        } else {
          const remSec = Math.max(0, Math.ceil((p.readyTime - now) / 1000));
          const seed = SEEDS[p.seedIdx] || SEEDS[0];

          if (remSec === 0) {
            div.className += " ready";
            div.innerHTML = `<span style="font-size:15px;">${seed.icon}</span><b style="font-size:6.5px; color:#22c55e;">TOPLA!</b>`;
            div.onclick = () => harvestPlot(idx);
          } else {
            div.innerHTML = `
              <span style="font-size:11px;">🌱</span>
              <b style="font-size:7px; color:#fbbf24;">${remSec}s</b>
              ${!p.watered ? `<button type="button" class="icon-btn" style="padding:1px 2px; font-size:6px; background:#0284c7; margin-top:1px;" onclick="event.stopPropagation(); waterPlot(${idx});">💧 Sula</button>` : `<small style="font-size:5.5px; color:#38bdf8;">Sulandı</small>`}
            `;
            div.onclick = () => {};
          }
        }
        container.appendChild(div);
      });

      document.getElementById("lbl-farm-gold").innerText = `🪙 ${farmState.gold}`;
      document.getElementById("lbl-farm-lvl").innerText = farmState.lvl;
      document.getElementById("lbl-farm-xp").innerText = `${farmState.xp}/${farmState.lvl * 120}`;
      document.getElementById("lbl-water-tank").innerText = `${farmState.water}/15`;
    }

    function plantSeed(plotIdx) {
      const seed = SEEDS[selectedSeedIdx];
      if (farmState.gold < seed.cost) return alert("Yeterli altınınız yok!");

      farmState.gold -= seed.cost;
      const now = Date.now();
      farmState.plots[plotIdx] = {
        seedIdx: selectedSeedIdx,
        plantTime: now,
        readyTime: now + (seed.growTime * 1000),
        watered: false,
        pest: false
      };

      saveFarmData();
      renderPlots();
    }

    function waterPlot(plotIdx) {
      if (farmState.water <= 0) return alert("Su tankınız boş! Aletler sekmesinden doldurun.");
      const p = farmState.plots[plotIdx];
      if (!p || p.watered) return;

      farmState.water--;
      p.watered = true;
      const rem = p.readyTime - Date.now();
      p.readyTime = Date.now() + Math.floor(rem * 0.55);

      saveFarmData();
      renderPlots();
    }

    function waterAllPlots() {
      if (farmState.water < 5) return alert("En az 5 su gerekiyor!");
      farmState.water -= 5;
      farmState.plots.forEach(p => {
        if (p && !p.watered) {
          p.watered = true;
          const rem = p.readyTime - Date.now();
          p.readyTime = Date.now() + Math.floor(rem * 0.55);
        }
      });
      saveFarmData();
      renderPlots();
    }

    function clearPest(plotIdx) {
      if (farmState.plots[plotIdx]) {
        farmState.plots[plotIdx].pest = false;
        addXP(15);
        saveFarmData();
        renderPlots();
      }
    }

    function harvestPlot(plotIdx) {
      const p = farmState.plots[plotIdx];
      if (!p) return;
      const seed = SEEDS[p.seedIdx] || SEEDS[0];

      let isFestival = Date.now() < festivalEndTime;
      let mult = (hasSuperFertilizer ? 2 : 1) * (isFestival ? 3 : 1) * marketMultiplier;

      let goldEarned = Math.floor(seed.gold * mult);
      let ptsEarned = Math.floor(seed.pts * (isFestival ? 3 : 1));

      farmState.gold += goldEarned;
      farmState.totalHarvestPts += ptsEarned;
      addXP(seed.xp);

      if (seed.id === 'sapphire') farmState.sapphireHarvestCount++;

      farmState.plots[plotIdx] = null;
      saveFarmData();
      renderPlots();

      recordGameScore('farm_mode', 'Mega Çiftlik', farmState.totalHarvestPts, [{ name: `${seed.name} Hasatı`, p: ptsEarned, c: '#22c55e' }], true);
    }

    function tractorPlantAll() {
      const seed = SEEDS[selectedSeedIdx];
      let count = 0;
      farmState.plots.forEach((p, idx) => {
        if (idx < farmState.unlockedPlots && !p && farmState.gold >= seed.cost) {
          plantSeed(idx);
          count++;
        }
      });
      if (count === 0) alert("Toplu ekim yapılamadı (Yetersiz altın veya boş tarla yok)!");
    }

    function tractorHarvestAll() {
      const now = Date.now();
      let count = 0;
      farmState.plots.forEach((p, idx) => {
        if (p && now >= p.readyTime && !p.pest) {
          harvestPlot(idx);
          count++;
        }
      });
      if (count > 0) saveFarmData();
    }

    function unlockPlot(idx, cost) {
      if (farmState.gold < cost) return alert(`Açmak için ${cost} altın gerekiyor!`);
      farmState.gold -= cost;
      farmState.unlockedPlots++;
      addXP(60);
      saveFarmData();
      renderPlots();
    }

    function collectFacility(type) {
      const now = Date.now();
      if (type === 'coop') {
        if (now < farmState.coopReady) return alert("Yumurtalar henüz hazır değil!");
        farmState.gold += 25; addXP(20); farmState.coopReady = now + 20000;
        alert("🥚 Altın Yumurtalar toplandı! (+25🪙)");
      } else if (type === 'barn') {
        if (now < farmState.barnReady) return alert("Süt henüz hazır değil!");
        farmState.gold += 50; addXP(35); farmState.barnReady = now + 40000;
        alert("🥛 Taze Süt sağıldı! (+50🪙)");
      } else if (type === 'hive') {
        if (now < farmState.hiveReady) return alert("Bal peteği henüz dolmadı!");
        farmState.gold += 35; addXP(25); farmState.hiveReady = now + 30000;
        alert("🍯 Şifalı Bal alındı! (+35🪙)");
      } else if (type === 'pond') {
        if (now < farmState.pondReady) return alert("Balıklar henüz büyümedi!");
        farmState.gold += 65; addXP(45); farmState.pondReady = now + 50000;
        alert("🐟 Efsanevi Balık tutuldu! (+65🪙)");
      } else if (type === 'mill') {
        if (now < farmState.millReady) return alert("Değirmen henüz öğütmedi!");
        farmState.gold += 80; addXP(55); farmState.millReady = now + 60000;
        alert("🌾 Altın Un üretildi! (+80🪙)");
      } else if (type === 'mine') {
        if (now < farmState.mineReady) return alert("Maden damarı hazır değil!");
        farmState.gold += 120; addXP(80); farmState.mineReady = now + 90000;
        alert("💎 Safir Cevheri çıkarıldı! (+120🪙)");
      } else if (type === 'wood') {
        if (now < farmState.woodReady) return alert("Ağaçlar henüz büyümedi!");
        farmState.gold += 90; addXP(60); farmState.woodReady = now + 75000;
        alert("🌲 Kereste Odunu kesildi! (+90🪙)");
      } else if (type === 'mush') {
        if (now < farmState.mushReady) return alert("Mantarlar henüz olgunlaşmadı!");
        farmState.gold += 60; addXP(40); farmState.mushReady = now + 45000;
        alert("🍄 Karanlık Mantar toplandı! (+60🪙)");
      }
      saveFarmData();
    }

    function deliverTruckOrder() {
      if (farmState.sapphireHarvestCount >= 3) {
        farmState.gold += 180;
        addXP(300);
        farmState.sapphireHarvestCount = 0;
        alert("🚚 Kasaba siparişi teslim edildi! +180🪙 ve +300 XP!");
        saveFarmData();
      } else {
        alert(`Sipariş tamamlanmadı! Hasat edilen Safir: ${farmState.sapphireHarvestCount}/3`);
      }
    }

    function startFestival() {
      if (farmState.gold < 80) return alert("Festival için 80 altın gerekiyor!");
      farmState.gold -= 80;
      festivalEndTime = Date.now() + 60000;
      alert("🎉 ÇİFTLİK FESTİVALİ BAŞLADI! 1 Dakika boyunca tüm hasatlar 3X kazanç veriyor!");
      saveFarmData();
    }

    function fillWaterTank() {
      if (farmState.gold < 10) return alert("10 altın gerekiyor!");
      farmState.gold -= 10;
      farmState.water = 15;
      saveFarmData();
      renderPlots();
    }

    function buySuperFertilizer() {
      if (farmState.gold < 20) return alert("20 altın gerekiyor!");
      farmState.gold -= 20;
      hasSuperFertilizer = true;
      saveFarmData();
      alert("🧪 Süper Gübre aktif! Hasatlarda 2x kazanç.");
    }

    function installScarecrow() {
      if (farmState.gold < 50) return alert("50 altın gerekiyor!");
      farmState.gold -= 50;
      hasScarecrow = true;
      saveFarmData();
      alert("🛡️ Lazerli Korkuluk kuruldu! Zararlılar engellendi.");
    }

    function buyRainBomb() {
      if (farmState.gold < 40) return alert("40 altın gerekiyor!");
      farmState.gold -= 40;
      farmState.plots.forEach(p => {
        if (p) {
          p.watered = true;
          const rem = p.readyTime - Date.now();
          p.readyTime = Date.now() + Math.floor(rem * 0.5);
        }
      });
      saveFarmData();
      renderPlots();
      alert("🌧️ Yağmur Bombası patlatıldı! Tüm tarlalar sulandı.");
    }

    function updateMarketRates() {
      const rates = [0.8, 1.0, 1.2, 1.5, 2.0, 2.5];
      marketMultiplier = rates[Math.floor(Math.random() * rates.length)];
      const el = document.getElementById("lbl-market-mult");
      if (el) el.innerText = `x${marketMultiplier.toFixed(1)}`;
    }

    function addXP(amount) {
      farmState.xp += amount;
      const req = farmState.lvl * 120;
      if (farmState.xp >= req) {
        farmState.xp -= req;
        farmState.lvl++;
        farmState.gold += (farmState.lvl * 60);
        alert(`🎉 TEBRİKLER! Çiftlik Seviye ${farmState.lvl} oldu! Bonus +${farmState.lvl * 60} Altın kazandınız!`);
      }
    }

    function farmEngine() {
      const now = Date.now();

      if (!hasScarecrow && Math.random() < 0.02) {
        const planted = farmState.plots.filter(p => p && now < p.readyTime && !p.pest);
        if (planted.length > 0) planted[Math.floor(Math.random() * planted.length)].pest = true;
      }

      const coopRem = Math.max(0, Math.ceil((farmState.coopReady - now) / 1000));
      const barnRem = Math.max(0, Math.ceil((farmState.barnReady - now) / 1000));
      const hiveRem = Math.max(0, Math.ceil((farmState.hiveReady - now) / 1000));
      const pondRem = Math.max(0, Math.ceil((farmState.pondReady - now) / 1000));
      const millRem = Math.max(0, Math.ceil((farmState.millReady - now) / 1000));
      const mineRem = Math.max(0, Math.ceil((farmState.mineReady - now) / 1000));
      const woodRem = Math.max(0, Math.ceil((farmState.woodReady - now) / 1000));
      const mushRem = Math.max(0, Math.ceil((farmState.mushReady - now) / 1000));

      const setTxt = (id, rem, icon) => {
        const el = document.getElementById(id);
        if (el) el.innerText = rem === 0 ? `${icon} Hazır!` : `${rem}s`;
      };

      setTxt("lbl-coop-txt", coopRem, "🥚");
      setTxt("lbl-barn-txt", barnRem, "🥛");
      setTxt("lbl-hive-txt", hiveRem, "🍯");
      setTxt("lbl-pond-txt", pondRem, "🐟");
      setTxt("lbl-mill-txt", millRem, "🌾");
      setTxt("lbl-mine-txt", mineRem, "💎");
      setTxt("lbl-wood-txt", woodRem, "🌲");
      setTxt("lbl-mush-txt", mushRem, "🍄");

      renderPlots();
    }

    function saveFarmData() {
      localStorage.setItem("kutu_farm_god_save", JSON.stringify(farmState));
      const u = getActiveUser();
      if (u && u.uid && u.uid !== "ADMIN_ROOT") {
        db.ref(`users/${u.uid}/farm_god`).set(farmState);
      }
    }

    function loadFarmData() {
      const local = localStorage.getItem("kutu_farm_god_save");
      if (local) {
        try { farmState = Object.assign(farmState, JSON.parse(local)); } catch (e) {}
      }

      const u = getActiveUser();
      if (u && u.uid && u.uid !== "ADMIN_ROOT") {
        db.ref(`users/${u.uid}/farm_god`).once("value", snap => {
          if (snap.exists()) {
            farmState = Object.assign(farmState, snap.val());
          }
          renderPlots();
        });
      } else {
        renderPlots();
      }
    }
  </script>
</body>
</html>
