<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kasa Çiftliği</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="app.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    
    /* Apple iPad / Tablet Ekran Kırpılma Önleyici CSS */
    html, body {
      width: 100% !important; height: 100% !important; height: 100dvh !important;
      min-height: -webkit-fill-available; overflow: hidden !important;
      background: #020617; font-family: system-ui, sans-serif; color: #fff;
    }

    .farm-layout {
      width: 100% !important; max-width: 480px !important; height: 100dvh !important;
      margin: 0 auto !important; background: #01140b; display: flex !important;
      flex-direction: column !important; position: relative;
    }

    .farm-header {
      flex-shrink: 0; background: #064e3b; border-bottom: 2px solid #047857;
      padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 10;
    }

    .farm-content {
      flex: 1; min-height: 0; overflow-y: auto; padding: 8px;
      display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch;
    }
    .farm-content::-webkit-scrollbar { width: 3px; }
    .farm-content::-webkit-scrollbar-thumb { background: #047857; border-radius: 4px; }

    /* Tarla Parselleri */
    .farm-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      background: #062e20; border: 1px solid #047857; border-radius: 8px; padding: 8px;
    }
    .plot-card {
      background: #064e3b; border: 1px solid #10b981; border-radius: 6px;
      aspect-ratio: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; font-size: 10px; cursor: pointer; text-align: center;
      transition: transform 0.1s ease;
    }
    .plot-card:active { transform: scale(0.96); }

    /* Ahır Kartları */
    .barn-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    }
    .barn-card {
      background: #0f291e; border: 1px solid #059669; border-radius: 8px;
      padding: 8px; display: flex; align-items: center; justify-content: space-between;
    }

    .section-title {
      font-size: 8.5px; font-weight: 800; color: #6ee7b7; text-transform: uppercase;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="farm-layout">
    
    <!-- Üst Bar -->
    <div class="farm-header">
      <a href="menu.html" class="icon-btn" style="border-color:var(--danger); padding:2px 6px; font-size:9.5px; text-decoration:none;">‹ Lobi</a>
      <div style="font-weight:900; font-size:12px; color:#34d399;">🌾 Kasa Çiftliği</div>
      <div id="farm-gold" style="font-size:9.5px; color:var(--neon-gold); font-weight:bold;">💰 100 Altın</div>
    </div>

    <div class="farm-content">
      
      <!-- 1. BÖLÜM: TARLA PARSELLERİ -->
      <div class="section-title">🌱 Ekim Tarlası (Tıkla ve Hasat Et / Ek)</div>
      <div class="farm-grid" id="plots-container"></div>

      <!-- 2. BÖLÜM: HAYVANCILIK & AHIR -->
      <div class="section-title">🐄 Çiftlik Hayvanları (Ürün Topla)</div>
      <div class="barn-row">
        <div class="barn-card">
          <div style="display:flex; align-items:center; gap:6px;">
            <span style="font-size:22px;">🐔</span>
            <div>
              <b style="font-size:10px; color:#fff;">Tavuk</b>
              <div style="font-size:7px; color:#94a3b8;" id="chicken-status">Yumurta Hazır!</div>
            </div>
          </div>
          <button type="button" class="icon-btn" style="background:#047857; font-size:8px; padding:3px 6px;" onclick="collectBarn('chicken')">Topla</button>
        </div>

        <div class="barn-card">
          <div style="display:flex; align-items:center; gap:6px;">
            <span style="font-size:22px;">🐮</span>
            <div>
              <b style="font-size:10px; color:#fff;">İnek</b>
              <div style="font-size:7px; color:#94a3b8;" id="cow-status">Süt Hazır!</div>
            </div>
          </div>
          <button type="button" class="icon-btn" style="background:#047857; font-size:8px; padding:3px 6px;" onclick="collectBarn('cow')">Topla</button>
        </div>
      </div>

      <!-- 3. BÖLÜM: PAZAR YERİ VE KASA DÖNÜŞTÜRÜCÜ -->
      <div style="background:#062e20; border:1px solid #047857; border-radius:8px; padding:8px; display:flex; justify-content:space-between; align-items:center; margin-top:auto;">
        <div>
          <b style="font-size:10px; color:#34d399;">🏪 Köy Pazarı</b>
          <div style="font-size:7.5px; color:#94a3b8;">Hasatları sat, altınları puana çevir</div>
        </div>
        <div style="display:flex; gap:4px;">
          <button type="button" class="btn-start" style="background:#059669; font-size:8.5px; padding:6px 8px; width:auto;" onclick="sellAllCrops()">Hasadı Sat</button>
          <button type="button" class="btn-start" style="background:#d97706; font-size:8.5px; padding:6px 8px; width:auto;" onclick="buyFarmCrate()">🎁 Kasa Aç (100A)</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    let activeUser = null;
    let gold = 100;
    let cropsInStorage = 0;

    let plots = [
      { id: 1, crop: "Buğday", state: "Hazır", icon: "🌾", yield: 15 },
      { id: 2, crop: "Mısır", state: "Büyüyor", icon: "🌱", yield: 25 },
      { id: 3, crop: "Havuç", state: "Hazır", icon: "🥕", yield: 35 },
      { id: 4, crop: "Boş", state: "Ekilmedi", icon: "🟫", yield: 0 },
      { id: 5, crop: "Boş", state: "Ekilmedi", icon: "🟫", yield: 0 },
      { id: 6, crop: "Boş", state: "Ekilmedi", icon: "🟫", yield: 0 }
    ];

    window.onload = () => {
      activeUser = getActiveUser();
      loadFarmData();
      renderFarm();
    };

    function loadFarmData() {
      try {
        const saved = localStorage.getItem("kutu_farm_state");
        if (saved) {
          const d = JSON.parse(saved);
          gold = d.gold || 100;
          if (d.plots) plots = d.plots;
        }
      } catch (e) {}
    }

    function saveFarmData() {
      try {
        localStorage.setItem("kutu_farm_state", JSON.stringify({ gold: gold, plots: plots }));
      } catch (e) {}
      document.getElementById("farm-gold").innerText = `💰 ${gold} Altın`;
    }

    function renderFarm() {
      const box = document.getElementById("plots-container");
      box.innerHTML = "";
      plots.forEach((p, idx) => {
        const card = document.createElement("div");
        card.className = "plot-card";
        card.innerHTML = `
          <span style="font-size:22px;">${p.icon}</span>
          <b style="color:#fff; margin-top:2px;">${p.crop}</b>
          <small style="color:${p.state === 'Hazır' ? '#34d399' : '#94a3b8'}; font-size:7px; font-weight:bold;">${p.state}</small>
        `;
        card.onclick = () => interactPlot(idx);
        box.appendChild(card);
      });
      document.getElementById("farm-gold").innerText = `💰 ${gold} Altın`;
    }

    function interactPlot(idx) {
      let p = plots[idx];
      if (p.state === "Hazır") {
        SoundFX.play('win');
        cropsInStorage += p.yield;
        gold += p.yield;
        p.state = "Boş";
        p.crop = "Boş";
        p.icon = "🟫";
        saveFarmData();
        renderFarm();
      } else if (p.crop === "Boş") {
        SoundFX.play('click');
        const seedTypes = [
          { name: "Buğday", icon: "🌾", yield: 15 },
          { name: "Mısır", icon: "🌽", yield: 25 },
          { name: "Havuç", icon: "🥕", yield: 35 }
        ];
        const chosen = seedTypes[Math.floor(Math.random() * seedTypes.length)];
        p.crop = chosen.name;
        p.yield = chosen.yield;
        p.state = "Büyüyor";
        p.icon = "🌱";
        renderFarm();

        // 3 saniyede büyüme simülasyonu
        setTimeout(() => {
          p.state = "Hazır";
          p.icon = chosen.icon;
          saveFarmData();
          renderFarm();
        }, 3000);
      }
    }

    function collectBarn(type) {
      SoundFX.play('win');
      if (type === 'chicken') {
        gold += 20;
        document.getElementById("chicken-status").innerText = "Bekliyor...";
        setTimeout(() => { document.getElementById("chicken-status").innerText = "Yumurta Hazır!"; }, 4000);
      } else if (type === 'cow') {
        gold += 40;
        document.getElementById("cow-status").innerText = "Bekliyor...";
        setTimeout(() => { document.getElementById("cow-status").innerText = "Süt Hazır!"; }, 6000);
      }
      saveFarmData();
    }

    function sellAllCrops() {
      SoundFX.play('win');
      gold += 60;
      saveFarmData();
      alert("Depodaki tüm ürünler satıldı! +60 Altın");
    }

    function buyFarmCrate() {
      if (gold < 100) return alert("Kasa açmak için en az 100 Altın gerekli!");
      gold -= 100;
      saveFarmData();
      SoundFX.play('open');

      const pts = Math.floor(Math.random() * 80) + 20;
      recordGameScore('farm_mode', 'Kasa Çiftliği', pts, [{ tier: "Çiftlik Sandığı", item: "Bereketli Hasat", pts: pts, c: "#10b981" }], true);
      alert(`🎁 Çiftlik Sandığı Açıldı! +${pts} Puan kazandınız ve liderlik tablosuna eklendi!`);
    }
  </script>
</body>
</html>
