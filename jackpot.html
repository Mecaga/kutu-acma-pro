<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Çarkıfelek Modu</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-jackpot_mode">
  <div class="app-container" style="justify-content:space-between;">
    <div>
      <div class="top-header">
        <a href="menu.html" class="icon-btn" style="border-color:var(--danger);">‹ Çıkış</a>
        <div style="font-weight:bold; font-size:12px;">🎡 Çarkıfelek Modu</div>
        <div id="score-badge" style="color:var(--neon-gold); font-weight:bold; font-size:12px;">0 P</div>
      </div>
      <div class="game-stats-top" style="display:flex; justify-content:space-between; margin-bottom:6px;">
        <div class="stat-card timer" style="border:1px solid #ef4444; background:#0d1527; padding:4px 8px; border-radius:8px;">
          <div style="font-size:9px; color:#94a3b8;">HAK</div>
          <div style="font-size:14px; font-weight:bold; color:#f87171;" id="lbl-spin-hak">1 Çevirme</div>
          <div style="font-size:10px; color:#38bdf8;" id="lbl-user-tag">@User</div>
        </div>
        <div class="stat-card score" style="border:1px solid #10b981; background:#0d1527; padding:4px 8px; border-radius:8px; text-align:right;">
          <div style="font-size:9px; color:#94a3b8;">BÜYÜK ÖDÜL</div>
          <div style="font-size:14px; font-weight:bold; color:#fbbf24;">2500 P</div>
        </div>
      </div>
    </div>

    <!-- Çark Alanı -->
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#060b17; border-radius:12px; border:1px solid #1e293b; margin:6px 0; position:relative;">
      <div style="position:absolute; top:8px; font-size:20px; z-index:10; color:var(--danger);">🔻</div>
      <div id="wheel-circle" style="width:180px; height:180px; border-radius:50%; border:4px solid var(--neon-purple); display:flex; justify-content:center; align-items:center; font-size:14px; font-weight:900; background:conic-gradient(#ef4444 0% 30%, #38bdf8 30% 60%, #10b981 60% 85%, #fbbf24 85% 100%); transition:transform 4s cubic-bezier(0.12, 0.8, 0.2, 1);">
        <span id="wheel-center-txt" style="background:#070212; padding:8px; border-radius:50%; border:2px solid #fff; font-size:11px;">ÇARK</span>
      </div>
    </div>

    <button id="btn-spin-wheel" class="btn-start" style="background:#d946ef;" onclick="spinJackpotWheel()">ÇARKI ÇEVİR</button>

    <div id="summary-overlay" class="modal-overlay">
      <div class="modal-card" style="background:#0b1329;">
        <div id="summary-title" style="font-size:14px; font-weight:bold; color:var(--neon-gold); text-align:center; margin-bottom:8px;">SONUÇ</div>
        <div style="display:flex; justify-content:space-around; margin-bottom:8px; background:#070212; padding:6px; border-radius:6px;">
          <div>Kazanılan: <b id="sum-score" style="color:var(--neon-green);">0 P</b></div>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="icon-btn" style="flex:1; background:var(--btn-blue); justify-content:center;" onclick="location.reload()">🔄 Tekrar</button>
          <a href="menu.html" class="icon-btn" style="flex:1; background:var(--danger); justify-content:center;">🚪 Lobi</a>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    window.onload = () => {
      const u = getActiveUser();
      document.getElementById("lbl-user-tag").innerText = u ? `@${u.name}${u.tag}` : "@Misafir";
    };

    function spinJackpotWheel() {
      document.getElementById("btn-spin-wheel").disabled = true;
      const randDeg = Math.floor(Math.random() * 360) + 1440; // En az 4 tur döner
      document.getElementById("wheel-circle").style.transform = `rotate(${randDeg}deg)`;

      setTimeout(() => {
        const finalAngle = randDeg % 360;
        let pts = 0, isWin = false, text = "";

        // İbrenin denk geldiği dilim kontrolü
        if (finalAngle <= 108) {
          pts = 0; isWin = false; text = "💀 PAS (0 Puan)";
        } else if (finalAngle <= 216) {
          pts = 100; isWin = true; text = "💎 100 Puan";
        } else if (finalAngle <= 306) {
          pts = 500; isWin = true; text = "🎉 500 Puan";
        } else {
          pts = 2500; isWin = true; text = "👑 BÜYÜK JACKPOT (+2500P)";
        }

        document.getElementById("score-badge").innerText = `${pts} P`;
        document.getElementById("summary-title").innerText = text;
        document.getElementById("sum-score").innerText = `${pts} P`;
        document.getElementById("summary-overlay").style.display = "flex";

        recordGameScore('jackpot_mode', 'Çarkıfelek', pts, [{ tier: "Çark", item: text, pts: pts, c: "#fbbf24" }], isWin);
      }, 4200);
    }
  </script>
</body>
</html>
