<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kutu Açma Pro - Lobi</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-standard">
  <div class="app-container">
    <div class="top-header">
      <div class="app-title" onclick="location.href='user.html'">
        👤 <span id="lbl-username">...</span>
      </div>
      <div style="display:flex; gap:4px;">
        <a href="leaderboard.html" class="icon-btn">🏆 Sıralama</a>
        <button class="icon-btn" onclick="openSettingsModal()">⚙️ Ayarlar</button>
        <button class="icon-btn" onclick="logout()" style="border-color:var(--danger);">🚪 Çıkış</button>
      </div>
    </div>

    <!-- Sohbetler ve Arkadaşlar -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px;">
      <a href="chat.html" class="mode-btn" style="text-align:center; font-weight:bold; color:#fff;">💬 Sohbetler</a>
      <a href="friends.html" class="mode-btn" style="text-align:center; font-weight:bold; color:#fff;">👥 Arkadaşlar</a>
    </div>

    <!-- 6 Farklı Mod -->
    <div class="mode-grid">
      <button class="mode-btn active" onclick="selectGameMode('standard', this)">
        ⚔️ Normal Kasa (30s)
        <div style="font-size:9px; color:#94a3b8;">Dengeli klasik oranlar</div>
      </button>
      <button class="mode-btn" onclick="selectGameMode('ten_cases', this)">
        📦 10 Kutu Modu (Süresiz)
        <div style="font-size:9px; color:#94a3b8;">Tam 10 kutu açma hakkı</div>
      </button>
      <button class="mode-btn" onclick="selectGameMode('catch_open', this)">
        🎯 Yakala & Aç Modu (15s)
        <div style="font-size:9px; color:#94a3b8;">Kutuları yakala, CS ruletinde aç</div>
      </button>
      <button class="mode-btn" onclick="selectGameMode('upgrade_mode', this)">
        📈 Şans Yükseltme Modu (7 Kutu)
        <div style="font-size:9px; color:#94a3b8;">Her kutuda Godly şansı katlanır</div>
      </button>
      <button class="mode-btn" onclick="selectGameMode('mines_mode', this)">
        💣 Mayınlı Kasa Modu (Risk / Çıkış)
        <div style="font-size:9px; color:#94a3b8;">Mayına basarsan puanlar gider!</div>
      </button>
      <button class="mode-btn" onclick="selectGameMode('pvp_mode', this)">
        🔥 Online PvP Arenası (Çok Oyunculu)
        <div style="font-size:9px; color:#38bdf8;">1v1, 1v1v1, 1v1v1v1 kişi başı 5 kutu</div>
      </button>
    </div>

    <!-- Renkli Nadirlik Tablosu -->
    <div class="menu-preview-box" id="rates-preview-box"></div>

    <button class="btn-start" onclick="launchGame()">OYUNA BAŞLA</button>
  </div>

  <!-- Ayarlar Modalı -->
  <div id="modal-settings" class="modal-overlay">
    <div class="modal-card">
      <div style="font-size:14px; font-weight:bold; color:var(--neon-gold); text-align:center; margin-bottom:10px;">⚙️ Oyun Ayarları</div>
      <button id="btn-sound-toggle" class="mode-btn" style="margin-bottom:8px; text-align:center; color:#fff;" onclick="toggleSound()">🔊 Ses: Açık</button>
      <div style="font-size:11px; color:var(--text-dim); margin-bottom:4px;">Unvan Seç:</div>
      <select id="sel-title" class="input-field" onchange="changeTitle(this.value)">
        <option value="Çaylak">Çaylak</option>
        <option value="Usta">Usta</option>
        <option value="Efsane">Efsane</option>
        <option value="Kral">Kral</option>
      </select>

      <button class="btn-start" style="background:var(--danger); margin-top:12px; font-size:12px;" onclick="deleteAccountPermanently()">🗑️ Hesabı Kalıcı Olarak Sil</button>
      <button class="btn-close" onclick="closeSettingsModal()">Kapat</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let activeMode = 'standard';
    const MODE_RATES = {
      standard: {
        bgClass: "bg-standard",
        title: "NORMAL KASA ORANLARI",
        tiers: [
          { name: "Classic (%58)", pts: "1-3 P", c: "#ffffff" },
          { name: "Super (%29)", pts: "4-10 P", c: "#38bdf8" },
          { name: "Ultra (%10)", pts: "12-30 P", c: "#c084fc" },
          { name: "Omega (%2.8)", pts: "35-120 P", c: "#fb923c" },
          { name: "Godly (%0.2)", pts: "500-1000 P", c: "#f43f5e" }
        ]
      },
      ten_cases: {
        bgClass: "bg-ten_cases",
        title: "10 KUTU MODU ORANLARI",
        tiers: [
          { name: "Classic (%35)", pts: "2-5 P", c: "#ffffff" },
          { name: "Super (%35)", pts: "6-15 P", c: "#38bdf8" },
          { name: "Ultra (%20)", pts: "20-50 P", c: "#c084fc" },
          { name: "Omega (%8.5)", pts: "60-200 P", c: "#fb923c" },
          { name: "Godly (%1.5)", pts: "600-1200 P", c: "#f43f5e" }
        ]
      },
      catch_open: {
        bgClass: "bg-catch_open",
        title: "YAKALA & AÇ ORANLARI",
        tiers: [
          { name: "Classic Kasa (%45)", pts: "2-5 P", c: "#ffffff" },
          { name: "Super Kasa (%30)", pts: "6-18 P", c: "#38bdf8" },
          { name: "Ultra Kasa (%15)", pts: "25-60 P", c: "#c084fc" },
          { name: "Omega Kasa (%8)", pts: "80-250 P", c: "#fb923c" },
          { name: "Godly Kasa (%2)", pts: "750-1500 P", c: "#f43f5e" }
        ]
      },
      upgrade_mode: {
        bgClass: "bg-upgrade_mode",
        title: "ŞANS YÜKSELTME ORANLARI",
        tiers: [
          { name: "Kademe 1 (%60)", pts: "5-15 P", c: "#ffffff" },
          { name: "Kademe 2 (%25)", pts: "20-60 P", c: "#38bdf8" },
          { name: "Kademe 3 (%10)", pts: "70-180 P", c: "#c084fc" },
          { name: "Kozmik (%5)", pts: "250-800 P", c: "#f43f5e" }
        ]
      },
      mines_mode: {
        bgClass: "bg-mines_mode",
        title: "MAYINLI KASA ORANLARI",
        tiers: [
          { name: "Güvenli Kasa (%70)", pts: "15-45 P", c: "#10b981" },
          { name: "Büyük Hazine (%30)", pts: "60-160 P", c: "#fbbf24" }
        ]
      },
      pvp_mode: {
        bgClass: "bg-pvp_mode",
        title: "ONLINE PVP ORANLARI",
        tiers: [
          { name: "Bronz (%50)", pts: "2-6 P", c: "#ffffff" },
          { name: "Gümüş (%30)", pts: "8-20 P", c: "#38bdf8" },
          { name: "Altın (%15)", pts: "25-70 P", c: "#fbbf24" },
          { name: "Elmas (%5)", pts: "80-300 P", c: "#f43f5e" }
        ]
      }
    };

    window.onload = () => {
      const u = getActiveUser();
      if (!u) return window.location.href = "index.html";
      document.getElementById("lbl-username").innerText = `${u.name}${u.tag}`;
      document.getElementById("sel-title").value = u.title || "Çaylak";
      document.getElementById("btn-sound-toggle").innerText = u.sound ? "🔊 Ses: Açık" : "🔇 Ses: Kapalı";
      renderRatesPreview('standard');
    };

    function selectGameMode(key, btn) {
      activeMode = key;
      document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      
      // Arka plan rengini seçilen moda göre değiştir
      document.body.className = MODE_RATES[key].bgClass;
      renderRatesPreview(key);
    }

    function renderRatesPreview(key) {
      const info = MODE_RATES[key];
      let html = `<div style="color:var(--neon-gold); font-weight:bold; margin-bottom:4px;">📊 ${info.title}</div>`;
      info.tiers.forEach(t => {
        html += `<div style="display:flex; justify-content:space-between; color:${t.c};"><span>${t.name}</span><span>${t.pts}</span></div>`;
      });
      document.getElementById("rates-preview-box").innerHTML = html;
    }

    function launchGame() {
      if (activeMode === 'pvp_mode') window.location.href = "pvp.html";
      else window.location.href = "game1.html?mode=" + activeMode;
    }

    function openSettingsModal() { document.getElementById("modal-settings").style.display = "flex"; }
    function closeSettingsModal() { document.getElementById("modal-settings").style.display = "none"; }
    function toggleSound() {
      let u = getActiveUser();
      u.sound = !u.sound;
      setActiveUser(u);
      document.getElementById("btn-sound-toggle").innerText = u.sound ? "🔊 Ses: Açık" : "🔇 Ses: Kapalı";
    }
    function changeTitle(val) {
      let u = getActiveUser();
      u.title = val;
      setActiveUser(u);
    }

    function logout() {
      localStorage.removeItem("kutu_active_session");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
