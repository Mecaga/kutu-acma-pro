<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nadirlik Birleştirme</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    .merge-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: auto;
      width: 100%;
      max-width: 290px;
      background: #090314;
      padding: 6px;
      border-radius: 12px;
      border: 2px solid var(--neon-purple);
    }
    .merge-cell {
      height: 60px;
      background: #15082e;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s;
    }
    .merge-cell:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body class="bg-standard">
  <div class="app-container" style="justify-content:space-between;">
    <div>
      <div class="top-header">
        <a href="menu.html" class="icon-btn" style="border-color:var(--danger); z-index:999;">‹ Lobi</a>
        <div style="font-weight:bold; font-size:12px;">♾️ Nadirlik Birleştirme</div>
        <div id="lbl-score" style="color:var(--neon-gold); font-weight:bold; font-size:12px;">0 P</div>
      </div>
      <div style="font-size:10px; color:var(--text-dim); text-align:center;">Aynı seviyedeki iki bloğa sırayla dokunup birleştir!</div>
    </div>

    <div class="merge-grid" id="merge-board"></div>

    <div style="display:flex; gap:6px;">
      <button class="btn-start" style="flex:1; background:var(--neon-purple);" onclick="spawnBlock()">➕ Yeni Blok Ekle</button>
      <button class="btn-start" style="flex:1; background:#0284c7;" onclick="saveAndRecordMerge()">💾 Puanı Kaydet</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const TIERS = [
      { lvl: 1, name: "Tahta", c: "#94a3b8", pts: 2 },
      { lvl: 2, name: "Demir", c: "#38bdf8", pts: 6 },
      { lvl: 3, name: "Altın", c: "#fbbf24", pts: 18 },
      { lvl: 4, name: "Safir", c: "#818cf8", pts: 50 },
      { lvl: 5, name: "Zümrüt", c: "#10b981", pts: 150 },
      { lvl: 6, name: "Mistik", c: "#c084fc", pts: 400 },
      { lvl: 7, name: "Tanrısal", c: "#f43f5e", pts: 1200 }
    ];

    let grid = Array(16).fill(null);
    let selectedIdx = null;
    let totalScore = 0;

    window.onload = () => {
      // Başlangıçta 4 rastgele blok ekle
      spawnBlock();
      spawnBlock();
      spawnBlock();
      spawnBlock();
    };

    function renderGrid() {
      const board = document.getElementById("merge-board");
      board.innerHTML = "";

      grid.forEach((item, idx) => {
        const cell = document.createElement("div");
        cell.className = "merge-cell";

        if (item) {
          cell.style.background = item.c;
          cell.style.color = "#000";
          if (selectedIdx === idx) cell.style.outline = "3px solid #fff";
          cell.innerHTML = `<span style="font-size:13px;">📦</span><span>${item.name}</span>`;
        } else {
          cell.style.background = "#15082e";
          cell.innerText = "";
        }

        cell.onclick = () => handleCellClick(idx);
        board.appendChild(cell);
      });
    }

    function spawnBlock() {
      const emptySlots = [];
      grid.forEach((val, i) => { if (!val) emptySlots.push(i); });
      if (emptySlots.length === 0) return alert("Tahta tamamen dolu! Blokları birleştir.");

      const target = emptySlots[Math.floor(Math.random() * emptySlots.length)];
      grid[target] = TIERS[0];
      renderGrid();
    }

    function handleCellClick(idx) {
      if (!grid[idx] && selectedIdx === null) return;

      if (selectedIdx === null) {
        selectedIdx = idx;
      } else if (selectedIdx === idx) {
        selectedIdx = null; // Seçimi kaldır
      } else {
        const first = grid[selectedIdx];
        const second = grid[idx];

        if (first && second && first.lvl === second.lvl && first.lvl < TIERS.length) {
          // Birleştirme!
          const nextTier = TIERS[first.lvl]; // bir üst seviye
          grid[idx] = nextTier;
          grid[selectedIdx] = null;
          totalScore += nextTier.pts;
          document.getElementById("lbl-score").innerText = `${totalScore} P`;
          selectedIdx = null;
        } else {
          selectedIdx = idx; // Farklı bloğu seç
        }
      }
      renderGrid();
    }

    function saveAndRecordMerge() {
      recordGameScore('merge_mode', 'Nadirlik Birleştirme', totalScore, [{ name: "Merge Seansı", p: totalScore, c: "#a855f7" }], true);
      alert(`Skorunuz kaydedildi: ${totalScore} P`);
    }
  </script>
</body>
</html>
