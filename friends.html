<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkadaşlar</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="top-header">
      <a href="menu.html" class="icon-btn" style="border-color:var(--danger);">‹ Lobi</a>
      <div style="font-weight:bold; font-size:12px;">👥 Arkadaşlar</div>
      <button class="icon-btn" style="border-color:var(--gold);" onclick="openRequestsModal()">📩 İstekler</button>
    </div>

    <div style="display:flex; gap:4px; margin-bottom:8px;">
      <input type="text" id="in-tag-search" class="input-field" style="margin:0; font-size:11px; padding:6px;" placeholder="KullanıcıAdı#12345">
      <button class="icon-btn" style="background:var(--btn-green); white-space:nowrap;" onclick="sendFriendRequest()">Ekle</button>
    </div>

    <div style="font-size:11px; font-weight:bold; color:var(--gold); margin-bottom:4px;">Kayıtlı Tüm Oyuncular</div>
    <div id="users-list-container" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px;"></div>
  </div>

  <div id="modal-reqs" class="modal-overlay">
    <div class="modal-card">
      <div style="font-size:13px; font-weight:bold; color:var(--gold); text-align:center; margin-bottom:8px;">Gelen İstekler</div>
      <div id="reqs-list-box" style="display:flex; flex-direction:column; gap:4px;"></div>
      <button class="btn-close" onclick="document.getElementById('modal-reqs').style.display='none'">Kapat</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    window.onload = () => {
      const u = getActiveUser();
      db.ref("users").on("value", snap => {
        const box = document.getElementById("users-list-container");
        box.innerHTML = "";
        snap.forEach(c => {
          const reg = c.val();
          if (!reg || reg.uid === u.uid) return;
          box.innerHTML += `
            <div class="quest-box" style="align-items:center;">
              <span>👤 ${reg.fullName} <small style="color:var(--gold);">[${reg.title || 'Çaylak'}]</small></span>
              <div style="display:flex; gap:4px;">
                <button class="icon-btn" style="border-color:var(--btn-green);" onclick="requestUser('${reg.uid}', '${reg.fullName}')">➕</button>
                <button class="icon-btn" style="border-color:var(--neon-blue);" onclick="directMessageUser('${reg.uid}', '${reg.fullName}')">💬</button>
              </div>
            </div>
          `;
        });
      });
    };

    function sendFriendRequest() {
      const tag = document.getElementById("in-tag-search").value.trim();
      if (!tag) return;
      const u = getActiveUser();
      db.ref("users").orderByChild("fullName").equalTo(tag).once("value", snap => {
        if (!snap.exists()) return alert("Bu etikete sahip kullanıcı bulunamadı!");
        snap.forEach(c => {
          requestUser(c.val().uid, c.val().fullName);
        });
      });
      document.getElementById("in-tag-search").value = "";
    }

    function requestUser(targetUID, targetName) {
      const u = getActiveUser();
      db.ref(`friend_requests/${targetUID}/${u.uid}`).set({ fromUID: u.uid, fromName: `${u.name}${u.tag}` });
      alert(`${targetName} kullanıcısına istek gönderildi!`);
    }

    function directMessageUser(targetUID, targetName) {
      localStorage.setItem("active_dm_target", targetUID);
      localStorage.setItem("active_dm_name", targetName);
      window.location.href = "chat.html";
    }

    function openRequestsModal() {
      const u = getActiveUser();
      db.ref("friend_requests/" + u.uid).once("value", snap => {
        const box = document.getElementById("reqs-list-box");
        box.innerHTML = "";
        snap.forEach(c => {
          const r = c.val();
          box.innerHTML += `
            <div class="quest-box" style="align-items:center;">
              <span>${r.fromName}</span>
              <div style="display:flex; gap:4px;">
                <button class="icon-btn" style="border-color:var(--btn-green);" onclick="acceptReq('${r.fromUID}', '${r.fromName}')">Kabul</button>
                <button class="icon-btn" style="border-color:var(--danger);" onclick="rejectReq('${r.fromUID}', '${r.fromName}')">Reddet</button>
              </div>
            </div>
          `;
        });
        document.getElementById("modal-reqs").style.display = "flex";
      });
    }

    function acceptReq(uid, name) {
      const u = getActiveUser();
      db.ref(`friends/${u.uid}/${uid}`).set({ fullName: name });
      db.ref(`friends/${uid}/${u.uid}`).set({ fullName: `${u.name}${u.tag}` });
      db.ref(`friend_requests/${u.uid}/${uid}`).remove();
      alert(`${name} arkadaş olarak eklendi!`);
      document.getElementById("modal-reqs").style.display = "none";
    }

    function rejectReq(uid, name) {
      const u = getActiveUser();
      db.ref(`friend_requests/${u.uid}/${uid}`).remove();
      alert(`${name} kullanıcısına gönderdiğiniz arkadaşlık isteğini kabul etmedi.`);
      document.getElementById("modal-reqs").style.display = "none";
    }
  </script>
</body>
</html>
