<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Arkadaş Merkezi & Çiftlik Ziyareti</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #020617; font-family: system-ui, sans-serif; color: #fff; }

    .friends-layout {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      background: #030712;
      display: flex;
      flex-direction: column;
    }

    .friends-header {
      flex-shrink: 0;
      background: #090d1a;
      border-bottom: 2px solid #1e293b;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .friends-tab-bar {
      flex-shrink: 0;
      background: #0b1120;
      border-bottom: 1px solid #1e293b;
      display: flex;
      gap: 3px;
      padding: 4px 8px;
    }

    .f-tab-btn {
      flex: 1;
      padding: 4px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 8.5px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .f-tab-btn.active { background: #4338ca; border-color: var(--neon-gold); color: #fff; }

    .friends-scroll-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      -webkit-overflow-scrolling: touch;
    }

    .friend-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 8.5px;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100000;
      padding: 12px;
    }
    .modal-card {
      background: #0f172a;
      border: 2px solid var(--neon-purple);
      border-radius: 10px;
      padding: 10px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="friends-layout">
    
    <!-- Üst Başlık -->
    <div class="friends-header">
      <a href="menu.html" class="icon-btn" style="border-color:var(--danger); padding:2px 8px; font-size:9.5px; text-decoration:none;">‹ Lobi</a>
      <div style="font-weight:900; font-size:11px; color:#38bdf8;">👥 Arkadaş Merkezi</div>
      <a href="chat.html" class="icon-btn" style="background:#0284c7; padding:2px 8px; font-size:9.5px; text-decoration:none;">💬 Sohbet</a>
    </div>

    <!-- Sekmeler -->
    <div class="friends-tab-bar">
      <button type="button" class="f-tab-btn active" id="ftab-list" onclick="switchTab('list')">👥 Arkadaşlarım (<span id="lbl-f-count">0</span>)</button>
      <button type="button" class="f-tab-btn" id="ftab-reqs" onclick="switchTab('reqs')">📬 İstekler (<span id="lbl-r-count">0</span>)</button>
      <button type="button" class="f-tab-btn" id="ftab-add" onclick="switchTab('add')">➕ Arkadaş Ekle</button>
    </div>

    <!-- İçerik -->
    <div class="friends-scroll-area">
      
      <!-- Panel 1: Arkadaşlar -->
      <div id="pnl-list" style="display:flex; flex-direction:column; gap:4px;">
        <div id="friends-list-box" style="display:flex; flex-direction:column; gap:4px;"></div>
      </div>

      <!-- Panel 2: İstekler -->
      <div id="pnl-reqs" style="display:none; flex-direction:column; gap:4px;">
        <div id="requests-list-box" style="display:flex; flex-direction:column; gap:4px;"></div>
      </div>

      <!-- Panel 3: Arkadaş Ekle (Hatasız İstek Gönderme) -->
      <div id="pnl-add" style="display:none; flex-direction:column; gap:6px; background:#0f172a; padding:10px; border-radius:8px; border:1px solid #1e293b;">
        <div style="font-size:9.5px; font-weight:bold; color:var(--neon-gold);">🏷️ Oyuncu İsmi veya Etiketiyle Ekle:</div>
        <div style="display:flex; gap:4px;">
          <input type="text" id="in-player-tag" class="input-field" style="margin:0; font-size:10px; padding:6px;" placeholder="Örn: Oyuncu#1234">
          <button type="button" class="icon-btn" style="background:#16a34a; padding:6px 12px; font-size:9.5px;" onclick="sendFriendRequest()">İstek Yolla</button>
        </div>
        <div style="font-size:7.5px; color:#94a3b8; line-height:1.4;">
          Arkadaşının tam etiketini (#0000) yazarak doğrudan istek yollayabilirsin. İstek onaylanınca tarlalarını ziyaret edebilir ve özel DM atabilirsin.
        </div>
      </div>

    </div>

  </div>

  <!-- SADECE ARKADAŞ SEÇİLİNCE AÇILAN DM MODALI -->
  <div id="modal-dm" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div style="font-size:11px; font-weight:bold; color:var(--neon-blue);" id="lbl-dm-target">💬 Özel Sohbet</div>
        <button type="button" class="icon-btn" style="background:var(--danger); padding:2px 6px; font-size:8px;" onclick="closeDM()">Kapat</button>
      </div>

      <div id="dm-box" style="height:200px; overflow-y:auto; background:#070a13; padding:6px; border-radius:6px; display:flex; flex-direction:column; gap:4px; font-size:8.5px;"></div>

      <div style="display:flex; gap:4px;">
        <input type="text" id="in-dm-msg" class="input-field" style="margin:0; flex:1; font-size:9px; padding:4px;" placeholder="Mesajınızı yazın..." onkeydown="if(event.key==='Enter') sendDMSingle()">
        <button type="button" class="icon-btn" style="background:#16a34a; font-size:9px; padding:4px 8px;" onclick="sendDMSingle()">Gönder</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let activeDMTargetUID = null;
    let dmListenerRef = null;

    window.onload = () => {
      const u = getActiveUser();
      if (!u) return location.href = "index.html";
      loadFriendsData();
    };

    function switchTab(tKey) {
      ['list', 'reqs', 'add'].forEach(k => {
        document.getElementById(`ftab-${k}`).classList.toggle('active', k === tKey);
        document.getElementById(`pnl-${k}`).style.display = (k === tKey ? 'flex' : 'none');
      });
    }

    function loadFriendsData() {
      const u = getActiveUser();
      const myUID = String(u.uid).replace(/[.#$\[\]]/g, "_");

      // İstekler
      db.ref("friend_requests/" + myUID).on("value", snap => {
        const reqBox = document.getElementById("requests-list-box");
        reqBox.innerHTML = "";
        const reqs = snap.val() || {};
        const count = Object.keys(reqs).length;
        document.getElementById("lbl-r-count").innerText = count;

        if (count === 0) {
          reqBox.innerHTML = "<div style='color:#64748b; font-size:8px; text-align:center; padding:15px;'>Bekleyen istek yok.</div>";
          return;
        }

        for (let sUID in reqs) {
          const r = reqs[sUID];
          const div = document.createElement("div");
          div.className = "friend-card";
          div.innerHTML = `
            <div><b>${r.fromAvatar || '👤'} ${r.fromName}</b></div>
            <div style="display:flex; gap:2px;">
              <button type="button" class="icon-btn" style="background:#16a34a; padding:2px 6px; font-size:7.5px;" onclick="acceptRequest('${sUID}', '${r.fromName}')">Kabul</button>
              <button type="button" class="icon-btn" style="background:var(--danger); padding:2px 6px; font-size:7.5px;" onclick="rejectRequest('${sUID}')">Reddet</button>
            </div>
          `;
          reqBox.appendChild(div);
        }
      });

      // Arkadaşlar
      db.ref("user_friends/" + myUID).on("value", snap => {
        const listBox = document.getElementById("friends-list-box");
        listBox.innerHTML = "";
        const friends = snap.val() || {};
        const count = Object.keys(friends).length;
        document.getElementById("lbl-f-count").innerText = count;

        if (count === 0) {
          listBox.innerHTML = "<div style='color:#64748b; font-size:8px; text-align:center; padding:15px;'>Henüz arkadaşın yok. 'Arkadaş Ekle' sekmesinden ekle!</div>";
          return;
        }

        for (let fUID in friends) {
          const f = friends[fUID];
          const div = document.createElement("div");
          div.className = "friend-card";
          div.innerHTML = `
            <div style="display:flex; align-items:center; gap:4px;">
              <span>${f.avatar || '👤'}</span>
              <b>${f.name}</b>
            </div>
            <div style="display:flex; gap:3px;">
              <button type="button" class="icon-btn" style="background:#0284c7; padding:2px 6px; font-size:7.5px;" onclick="openDMModal('${fUID}', '${f.name}')">💬 DM</button>
              <button type="button" class="icon-btn" style="background:#15803d; padding:2px 6px; font-size:7.5px;" onclick="location.href='farm.html'">🌾 Çiftlik</button>
            </div>
          `;
          listBox.appendChild(div);
        }
      });
    }

    function sendFriendRequest() {
      const input = document.getElementById("in-player-tag");
      const targetQuery = input.value.trim();
      if (!targetQuery) return alert("Lütfen bir kullanıcı adı veya etiket yazın!");

      const u = getActiveUser();
      const myUID = String(u.uid).replace(/[.#$\[\]]/g, "_");

      db.ref("users").once("value").then(snap => {
        let targetUID = null;
        let targetName = null;

        snap.forEach(child => {
          const val = child.val();
          const fullTag = `${val.name}${val.tag || ''}`;
          if (fullTag.toLowerCase() === targetQuery.toLowerCase() || (val.name && val.name.toLowerCase() === targetQuery.toLowerCase())) {
            targetUID = child.key;
            targetName = fullTag;
          }
        });

        if (!targetUID) return alert("Böyle bir oyuncu bulunamadı!");
        if (targetUID === myUID) return alert("Kendine istek atamazsın!");

        db.ref(`friend_requests/${targetUID}/${myUID}`).set({
          fromUID: myUID,
          fromName: `${u.name}${u.tag || ''}`,
          fromAvatar: u.avatar || '👤',
          timestamp: Date.now()
        }).then(() => {
          alert(`${targetName} oyuncusuna arkadaşlık isteği gönderildi!`);
          input.value = "";
        });
      });
    }

    function acceptRequest(senderUID, senderName) {
      const u = getActiveUser();
      const myUID = String(u.uid).replace(/[.#$\[\]]/g, "_");

      db.ref(`user_friends/${myUID}/${senderUID}`).set({ uid: senderUID, name: senderName, avatar: '👤' });
      db.ref(`user_friends/${senderUID}/${myUID}`).set({ uid: myUID, name: `${u.name}${u.tag || ''}`, avatar: u.avatar || '👤' });
      db.ref(`friend_requests/${myUID}/${senderUID}`).remove();
      alert(`${senderName} arkadaş olarak eklendi!`);
    }

    function rejectRequest(senderUID) {
      const u = getActiveUser();
      const myUID = String(u.uid).replace(/[.#$\[\]]/g, "_");
      db.ref(`friend_requests/${myUID}/${senderUID}`).remove();
    }

    /* DM Modal Açma */
    function openDMModal(targetUID, targetName) {
      activeDMTargetUID = targetUID;
      document.getElementById("lbl-dm-target").innerText = `💬 ${targetName}`;
      document.getElementById("modal-dm").style.display = "flex";

      const u = getActiveUser();
      const myUID = String(u.uid).replace(/[.#$\[\]]/g, "_");
      const chatID = myUID < targetUID ? `${myUID}_${targetUID}` : `${targetUID}_${myUID}`;

      if (dmListenerRef) db.ref("direct_messages/" + chatID).off();

      const container = document.getElementById("dm-box");
      container.innerHTML = "";

      dmListenerRef = db.ref("direct_messages/" + chatID).limitToLast(30);
      dmListenerRef.on("value", snap => {
        container.innerHTML = "";
        if (!snap.exists()) {
          container.innerHTML = "<div style='color:#64748b; font-size:8px; text-align:center; padding:10px;'>Henüz mesaj yok. Merhaba de!</div>";
          return;
        }

        snap.forEach(child => {
          const m = child.val();
          const isMe = m.senderUID === myUID;
          const div = document.createElement("div");
          div.style.cssText = `max-width:80%; padding:3px 6px; border-radius:6px; font-size:8px; word-break:break-word; align-self:${isMe ? 'flex-end' : 'flex-start'}; background:${isMe ? '#4338ca' : '#1e293b'}; color:#fff;`;
          div.innerHTML = `<b>${isMe ? 'Sen' : targetName}:</b> ${escapeHtml(m.text)}`;
          container.appendChild(div);
        });

        container.scrollTop = container.scrollHeight;
      });
    }

    function sendDMSingle() {
      const input = document.getElementById("in-dm-msg");
      const text = input.value.trim();
      if (!text || !activeDMTargetUID) return;

      const u = getActiveUser();
      const myUID = String(u.uid).replace(/[.#$\[\]]/g, "_");
      const chatID = myUID < activeDMTargetUID ? `${myUID}_${activeDMTargetUID}` : `${activeDMTargetUID}_${myUID}`;

      db.ref("direct_messages/" + chatID).push({
        senderUID: myUID,
        text: text,
        timestamp: Date.now()
      });

      input.value = "";
    }

    function closeDM() {
      document.getElementById("modal-dm").style.display = "none";
      activeDMTargetUID = null;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
  </script>
</body>
</html>
