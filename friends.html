<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Arkadaş Listesi & Çiftlik Ziyareti</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #020617;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }

    .friends-layout {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      background: #030712;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .friends-top-header {
      flex-shrink: 0;
      background: #090d1a;
      border-bottom: 2px solid #1e293b;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    .friends-tab-bar {
      flex-shrink: 0;
      background: #0b1120;
      border-bottom: 1px solid #1e293b;
      display: flex;
      gap: 3px;
      padding: 4px 8px;
    }

    .f-tab-btn {
      flex: 1;
      padding: 4px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 8.5px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .f-tab-btn.active {
      background: #4338ca;
      border-color: var(--neon-gold);
      color: #fff;
    }

    .friends-scroll-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      -webkit-overflow-scrolling: touch;
    }
    .friends-scroll-area::-webkit-scrollbar { width: 3px; }
    .friends-scroll-area::-webkit-scrollbar-thumb { background: #3b1d6e; border-radius: 4px; }

    .friend-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 8.5px;
    }

    /* Birebir DM Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100000;
      padding: 12px;
    }
    .modal-card {
      background: #0f172a;
      border: 2px solid var(--neon-purple);
      border-radius: 10px;
      padding: 10px;
      width: 100%;
      max-width: 400px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="friends-layout">
    
    <!-- 1. Üst Başlık -->
    <div class="friends-top-header">
      <a href="menu.html" class="icon-btn" style="border-color:var(--danger); padding:2px 8px; font-size:9.5px; text-decoration:none;">‹ Lobi</a>
      <div style="font-weight:900; font-size:11px; color:#38bdf8;">👥 Arkadaş Merkezi</div>
      <a href="chat.html" class="icon-btn" style="background:#0284c7; padding:2px 8px; font-size:9.5px; text-decoration:none;">💬 Sohbet</a>
    </div>

    <!-- 2. Sekmeler -->
    <div class="friends-tab-bar">
      <button type="button" class="f-tab-btn active" id="ftab-list" onclick="switchFriendsTab('list')">👥 Arkadaşlarım (<span id="lbl-friend-count">0</span>)</button>
      <button type="button" class="f-tab-btn" id="ftab-requests" onclick="switchFriendsTab('requests')">📬 İstekler (<span id="lbl-request-count">0</span>)</button>
      <button type="button" class="f-tab-btn" id="ftab-add" onclick="switchFriendsTab('add')">➕ Arkadaş Ekle</button>
    </div>

    <!-- 3. İçerik Alanı -->
    <div class="friends-scroll-area">
      
      <!-- Panel 1: Arkadaş Listesi -->
      <div id="pnl-friends-list" style="display:flex; flex-direction:column; gap:4px;">
        <div id="friends-list-box" style="display:flex; flex-direction:column; gap:4px;"></div>
      </div>

      <!-- Panel 2: İstekler -->
      <div id="pnl-friends-requests" style="display:none; flex-direction:column; gap:4px;">
        <div id="requests-list-box" style="display:flex; flex-direction:column; gap:4px;"></div>
      </div>

      <!-- Panel 3: Arkadaş Ekle -->
      <div id="pnl-friends-add" style="display:none; flex-direction:column; gap:6px; background:#0f172a; padding:10px; border-radius:8px; border:1px solid #1e293b;">
        <div style="font-size:9.5px; font-weight:bold; color:var(--neon-gold);">🏷️ Kullanıcı Adı veya Etiketiyle Ekle:</div>
        <div style="display:flex; gap:4px;">
          <input type="text" id="in-target-tag" class="input-field" style="margin:0; font-size:10px; padding:6px;" placeholder="Örn: Oyuncu#1234">
          <button type="button" class="icon-btn" style="background:#16a34a; padding:6px 12px; font-size:9.5px;" onclick="sendFriendRequestByInput()">İstek Gönder</button>
        </div>
        <div style="font-size:8px; color:#94a3b8; line-height:1.4;">
          Arkadaşının tam profil etiketini (#1234) yazarak doğrudan istek yollayabilirsin. İstek onaylandığında çiftliklerini ziyaret edebilir ve hediyeleşebilirsiniz.
        </div>
      </div>

    </div>

  </div>

  <!-- DM ÖZEL MESAJLAŞMA MODALI -->
  <div id="modal-dm" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div style="font-size:11px; font-weight:bold; color:var(--neon-blue);" id="lbl-dm-target-name">💬 Özel Sohbet</div>
        <button type="button" class="icon-btn" style="background:var(--danger); padding:2px 6px; font-size:8px;" onclick="closeDM()">Kapat</button>
      </div>

      <div id="dm-messages-box" style="height:200px; overflow-y:auto; background:#070a13; padding:6px; border-radius:6px; display:flex; flex-direction:column; gap:4px; font-size:8.5px;"></div>

      <div style="display:flex; gap:4px;">
        <input type="text" id="in-dm-text" class="input-field" style="margin:0; flex:1; font-size:9px; padding:4px;" placeholder="Özel mesaj..." onkeydown="if(event.key==='Enter') sendDMMessage()">
        <button type="button" class="icon-btn" style="background:#16a34a; font-size:9px; padding:4px 8px;" onclick="sendDMMessage()">Gönder</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let activeFriendsTab = 'list';
    let currentDMTargetUID = null;
    let dmListener = null;

    window.onload = () => {
      const u = getActiveUser();
      if (!u) return location.href = "index.html";
      loadFriendsAndRequests();
    };

    function switchFriendsTab(tab) {
      activeFriendsTab = tab;
      ['list', 'requests', 'add'].forEach(t => {
        document.getElementById(`ftab-${t}`).classList.toggle('active', t === tab);
        document.getElementById(`pnl-friends-${t}`).style.display = (t === tab ? 'flex' : 'none');
      });
    }

    function loadFriendsAndRequests() {
      const u = getActiveUser();
      if (!u) return;
      const cleanUID = String(u.uid).replace(/[.#$\[\]]/g, "_");

      // 1. İstekleri Dinle
      db.ref("friend_requests/" + cleanUID).on("value", snap => {
        const reqBox = document.getElementById("requests-list-box");
        reqBox.innerHTML = "";
        const requests = snap.val() || {};
        const count = Object.keys(requests).length;
        document.getElementById("lbl-request-count").innerText = count;

        if (count === 0) {
          reqBox.innerHTML = "<div style='color:#64748b; font-size:8px; text-align:center; padding:15px;'>Bekleyen arkadaşlık isteği yok.</div>";
          return;
        }

        for (let senderUID in requests) {
          const req = requests[senderUID];
          const div = document.createElement("div");
          div.className = "friend-card";
          div.innerHTML = `
            <div style="display:flex; align-items:center; gap:4px;">
              <span>${req.fromAvatar || '👤'}</span>
              <b>${req.fromName}</b>
            </div>
            <div style="display:flex; gap:3px;">
              <button type="button" class="icon-btn" style="background:#16a34a; padding:2px 6px; font-size:8px;" onclick="acceptFriendRequest('${senderUID}', '${req.fromName}')">Kabul Et</button>
              <button type="button" class="icon-btn" style="background:var(--danger); padding:2px 6px; font-size:8px;" onclick="rejectFriendRequest('${senderUID}')">Reddet</button>
            </div>
          `;
          reqBox.appendChild(div);
        }
      });

      // 2. Arkadaşlarımı Dinle
      db.ref("user_friends/" + cleanUID).on("value", snap => {
        const listBox = document.getElementById("friends-list-box");
        listBox.innerHTML = "";
        const friends = snap.val() || {};
        const count = Object.keys(friends).length;
        document.getElementById("lbl-friend-count").innerText = count;

        if (count === 0) {
          listBox.innerHTML = "<div style='color:#64748b; font-size:8px; text-align:center; padding:15px;'>Henüz arkadaş eklemedin. 'Arkadaş Ekle' sekmesinden ekleyebilirsin!</div>";
          return;
        }

        for (let fUID in friends) {
          const f = friends[fUID];
          const div = document.createElement("div");
          div.className = "friend-card";
          div.innerHTML = `
            <div style="display:flex; align-items:center; gap:4px;">
              <span style="font-size:12px;">${f.avatar || '👤'}</span>
              <div>
                <b>${f.name}</b>
                <div style="color:var(--neon-green); font-size:6.5px;">🟢 Çevrimiçi</div>
              </div>
            </div>
            <div style="display:flex; gap:3px;">
              <button type="button" class="icon-btn" style="background:#0284c7; padding:2px 5px; font-size:7.5px;" onclick="openDM('${fUID}', '${f.name}')">💬 DM</button>
              <button type="button" class="icon-btn" style="background:#15803d; padding:2px 5px; font-size:7.5px;" onclick="location.href='farm.html'">🌾 Çiftlik</button>
              <button type="button" class="icon-btn" style="background:#d97706; padding:2px 5px; font-size:7.5px;" onclick="sendDailyGift('${fUID}', '${f.name}')">🎁 Hediye</button>
            </div>
          `;
          listBox.appendChild(div);
        }
      });
    }

    function sendFriendRequestByInput() {
      const tag = document.getElementById("in-target-tag").value.trim();
      if (!tag) return alert("Lütfen bir kullanıcı etiketi girin!");

      const u = getActiveUser();
      const myUID = String(u.uid).replace(/[.#$\[\]]/g, "_");

      db.ref("users").once("value").then(snap => {
        let foundUID = null;
        let foundName = null;

        snap.forEach(child => {
          const val = child.val();
          const fullTag = `${val.name}${val.tag}`;
          if (fullTag.toLowerCase() === tag.toLowerCase() || (val.name && val.name.toLowerCase() === tag.toLowerCase())) {
            foundUID = child.key;
            foundName = fullTag;
          }
        });

        if (!foundUID) return alert("Böyle bir oyuncu bulunamadı!");
        if (foundUID === myUID) return alert("Kendine istek atamazsın!");

        db.ref(`friend_requests/${foundUID}/${myUID}`).set({
          fromUID: myUID,
          fromName: `${u.name}${u.tag || ''}`,
          fromAvatar: u.avatar || '👤',
          timestamp: Date.now()
        }).then(() => {
          alert(`${foundName} oyuncusuna arkadaşlık isteği gönderildi!`);
          document.getElementById("in-target-tag").value = "";
        });
      });
    }

    function acceptFriendRequest(senderUID, senderName) {
      const u = getActiveUser();
      const myUID = String(u.uid).replace(/[.#$\[\]]/g, "_");

      // İki tarafa da arkadaşlığı ekle
      db.ref(`user_friends/${myUID}/${senderUID}`).set({
        uid: senderUID,
        name: senderName,
        avatar: '👤'
      });

      db.ref(`user_friends/${senderUID}/${myUID}`).set({
        uid: myUID,
        name: `${u.name}${u.tag || ''}`,
        avatar: u.avatar || '👤'
      });

      // İsteği sil
      db.ref(`friend_requests/${myUID}/${senderUID}`).remove();
      alert(`${senderName} ile artık arkadaşsınız!`);
    }

    function rejectFriendRequest(senderUID) {
      const u = getActiveUser();
      const myUID = String(u.uid).replace(/[.#$\[\]]/g, "_");
      db.ref(`friend_requests/${myUID}/${senderUID}`).remove();
    }

    function sendDailyGift(targetUID, targetName) {
      const u = getActiveUser();
      const myUID = String(u.uid).replace(/[.#$\[\]]/g, "_");

      // Günlük hediye kaydı kontrolü
      const lastGiftKey = `last_gift_${targetUID}`;
      const lastGiftTime = localStorage.getItem(lastGiftKey) || 0;
      if (Date.now() - lastGiftTime < 86400000) {
        return alert("Bu arkadaşına bugün zaten hediye gönderdin! (Günde 1 kez)");
      }

      db.ref(`users/${targetUID}/farm_hayday_v7/gold`).transaction(g => (g || 0) + 50);
      localStorage.setItem(lastGiftKey, Date.now());
      alert(`🎁 ${targetName} adlı arkadaşına +50 Altın hediye gönderildi!`);
    }

    /* DM ÖZEL MESAJLAŞMA MOTORU */
    function openDM(targetUID, targetName) {
      currentDMTargetUID = targetUID;
      document.getElementById("lbl-dm-target-name").innerText = `💬 ${targetName}`;
      document.getElementById("modal-dm").style.display = "flex";

      const u = getActiveUser();
      const myUID = String(u.uid).replace(/[.#$\[\]]/g, "_");
      const chatID = myUID < targetUID ? `${myUID}_${targetUID}` : `${targetUID}_${myUID}`;

      if (dmListener) db.ref("direct_messages/" + chatID).off();

      const container = document.getElementById("dm-messages-box");
      container.innerHTML = "";

      dmListener = db.ref("direct_messages/" + chatID).limitToLast(40);
      dmListener.on("value", snap => {
        container.innerHTML = "";
        if (!snap.exists()) {
          container.innerHTML = "<div style='color:#64748b; font-size:8px; text-align:center; padding:10px;'>Henüz özel mesaj yok. Merhaba de!</div>";
          return;
        }

        snap.forEach(child => {
          const m = child.val();
          const isMe = m.senderUID === myUID;
          const div = document.createElement("div");
          div.style.cssText = `max-width:80%; padding:3px 6px; border-radius:6px; font-size:8px; word-break:break-word; align-self:${isMe ? 'flex-end' : 'flex-start'}; background:${isMe ? '#4338ca' : '#1e293b'}; color:#fff;`;
          div.innerHTML = `<b>${isMe ? 'Sen' : targetName}:</b> ${escapeHtml(m.text)}`;
          container.appendChild(div);
        });

        container.scrollTop = container.scrollHeight;
      });
    }

    function sendDMMessage() {
      const input = document.getElementById("in-dm-text");
      const text = input.value.trim();
      if (!text || !currentDMTargetUID) return;

      const u = getActiveUser();
      const myUID = String(u.uid).replace(/[.#$\[\]]/g, "_");
      const chatID = myUID < currentDMTargetUID ? `${myUID}_${currentDMTargetUID}` : `${currentDMTargetUID}_${myUID}`;

      db.ref("direct_messages/" + chatID).push({
        senderUID: myUID,
        text: text,
        timestamp: Date.now()
      });

      input.value = "";
    }

    function closeDM() {
      if (dmListener && currentDMTargetUID) {
        const u = getActiveUser();
        const myUID = String(u.uid).replace(/[.#$\[\]]/g, "_");
        const chatID = myUID < currentDMTargetUID ? `${myUID}_${currentDMTargetUID}` : `${currentDMTargetUID}_${myUID}`;
        db.ref("direct_messages/" + chatID).off();
      }
      document.getElementById("modal-dm").style.display = "none";
      currentDMTargetUID = null;
    }

    function escapeHtml(string) {
      return String(string).replace(/[&<>"']/g, function (s) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s];
      });
    }
  </script>
</body>
</html>
