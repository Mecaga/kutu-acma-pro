<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PvP Arenası - Kutu Açma Pro</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="app.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    html, body {
      width: 100%; height: 100dvh; overflow: hidden;
      background: #020617; font-family: system-ui, sans-serif; color: #fff;
    }
    .arena-shell {
      max-width: 650px; height: 100dvh; margin: 0 auto;
      background: #030712; display: flex; flex-direction: column;
      border-left: 1px solid #1e293b; border-right: 1px solid #1e293b;
    }
    .top-bar {
      padding: 10px 14px; background: #090d1a; border-bottom: 2px solid #1e293b;
      display: flex; justify-content: space-between; align-items: center;
    }
    .scoreboard {
      display: grid; grid-template-columns: 1fr auto 1fr;
      padding: 10px; gap: 8px; background: #070d1e; align-items: center;
      border-bottom: 1px solid #1e293b;
    }
    .player-card {
      background: #0b1329; border: 1px solid #1e293b; border-radius: 8px;
      padding: 8px; text-align: center;
    }
    .player-card.active-turn { border-color: #38bdf8; box-shadow: 0 0 12px rgba(56,189,248,0.4); }
    .vs-badge { font-weight: 900; color: #ef4444; font-size: 13px; }
    
    .arena-main {
      flex: 1; min-height: 0; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .btn-action {
      background: #0284c7; color: #fff; border: none; border-radius: 8px;
      padding: 12px 24px; font-weight: bold; font-size: 13px; cursor: pointer;
    }
    .ship-grid {
      display: grid; grid-template-columns: repeat(5, 48px); gap: 5px; margin: 8px auto;
    }
    .grid-cell {
      width: 48px; height: 48px; background: #0f172a; border: 1px solid #334155;
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-size: 18px; cursor: pointer; user-select: none;
    }
    .grid-cell.hit { background: #ef4444 !important; border-color: #f87171 !important; }
    .grid-cell.miss { background: #1e293b !important; border-color: #475569 !important; }
  </style>
</head>
<body>
  <div class="arena-shell">
    <div class="top-bar">
      <button onclick="leaveArena()" style="background:#ef4444; border:none; color:#fff; padding:4px 10px; border-radius:4px; font-size:10px; cursor:pointer;">‹ Çıkış</button>
      <div id="ui-room-name" style="font-size:12px; font-weight:bold; color:#f59e0b;">Bağlanıyor...</div>
      <div id="ui-room-tag" style="font-size:9px; color:#94a3b8;">#0000</div>
    </div>

    <!-- Skor Paneli -->
    <div class="scoreboard">
      <div class="player-card" id="card-p1">
        <div id="p1-name" style="font-size:11px; font-weight:bold; color:#38bdf8;">Oyuncu 1</div>
        <div id="p1-score" style="font-size:18px; font-weight:900; color:#fff;">0</div>
      </div>
      <div class="vs-badge">VS</div>
      <div class="player-card" id="card-p2">
        <div id="p2-name" style="font-size:11px; font-weight:bold; color:#f87171;">Bekleniyor...</div>
        <div id="p2-score" style="font-size:18px; font-weight:900; color:#fff;">0</div>
      </div>
    </div>

    <!-- Mod Alanı -->
    <div class="arena-main" id="arena-content">
      <div style="color:#94a3b8; font-size:11px;">Oda verileri senkronize ediliyor...</div>
    </div>
  </div>

  <script>
    // GitHub Repo Ayarın (Kendi GitHub kullanıcı adın ve repo adınla güncelle)
    const GITHUB_BASE_URL = "https://raw.githubusercontent.com/Mecaga/KutuAcmaPro/main/modes/";

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get("roomId");
    let activeUser = null;
    let roomRef = null;
    let roomData = null;
    let modeScriptLoaded = false;

    window.onload = () => {
      activeUser = (typeof getActiveUser === "function") ? getActiveUser() : JSON.parse(localStorage.getItem("active_user") || "null");
      if (!activeUser || !roomId) return location.href = "pvp-lobby.html";

      roomRef = db.ref("pvp_rooms/" + roomId);
      joinRoom();
      listenRoom();
    };

    function joinRoom() {
      const myKey = String(activeUser.username).toLowerCase();
      roomRef.child("players/" + myKey).update({
        name: activeUser.displayName || activeUser.username,
        avatar: activeUser.avatar || "👤",
        score: 0,
        ready: true
      });
      roomRef.child("players/" + myKey).onDisconnect().remove();
    }

    function listenRoom() {
      roomRef.on("value", snap => {
        if (!snap.exists()) {
          alert("Oda kapatıldı!");
          return location.href = "pvp-lobby.html";
        }

        roomData = snap.val();
        renderHeader();

        // İki oyuncu tamam olunca ilgili oyun modunu GitHub'dan yükle
        const pKeys = Object.keys(roomData.players || {});
        if (pKeys.length >= 2 && !modeScriptLoaded) {
          loadModeFromGitHub(roomData.mode);
        } else if (pKeys.length < 2) {
          showWaitingScreen();
        } else if (modeScriptLoaded && window.onRoomDataUpdate) {
          window.onRoomDataUpdate(roomData);
        }
      });
    }

    function renderHeader() {
      document.getElementById("ui-room-name").innerText = roomData.roomName || "PvP Arenası";
      document.getElementById("ui-room-tag").innerText = roomData.roomTag || "";

      const pKeys = Object.keys(roomData.players || {});
      const p1 = roomData.players[pKeys[0]] || { name: "Boş", score: 0 };
      const p2 = roomData.players[pKeys[1]] || { name: "Bekleniyor...", score: 0 };

      document.getElementById("p1-name").innerText = p1.name;
      document.getElementById("p1-score").innerText = p1.score;
      document.getElementById("p2-name").innerText = p2.name;
      document.getElementById("p2-score").innerText = p2.score;
    }

    function showWaitingScreen() {
      const main = document.getElementById("arena-content");
      main.innerHTML = `
        <div style="text-align:center;">
          <div style="font-size:32px; margin-bottom:8px;">⏳</div>
          <div style="font-size:12px; color:#94a3b8;">Rakip bekleniyor...</div>
          <div style="font-size:11px; color:#f59e0b; margin-top:6px;">Oda Kodu: <b>${roomData.roomTag}</b></div>
        </div>
      `;
    }

    // GitHub'dan Modu Çeken Dinamik Yükleyici
    function loadModeFromGitHub(mode) {
      modeScriptLoaded = true;
      const scriptUrl = `${GITHUB_BASE_URL}mode-${mode}.js`;

      const script = document.createElement("script");
      script.src = scriptUrl;
      script.onload = () => {
        if (window.initGameMode) {
          window.initGameMode(roomRef, activeUser, roomData);
        }
      };
      script.onerror = () => {
        // GitHub fallback (Local mod yükleme garantisi)
        console.warn("GitHub modu çekilemedi, yerel fallback çalıştırılıyor.");
        loadLocalFallbackMode(mode);
      };
      document.body.appendChild(script);
    }

    function loadLocalFallbackMode(mode) {
      const script = document.createElement("script");
      script.src = `mode-${mode}.js`;
      script.onload = () => {
        if (window.initGameMode) window.initGameMode(roomRef, activeUser, roomData);
      };
      document.body.appendChild(script);
    }

    function leaveArena() {
      if (confirm("Odadan çıkmak istiyor musunuz?")) {
        const myKey = String(activeUser.username).toLowerCase();
        roomRef.child("players/" + myKey).remove().then(() => {
          location.href = "pvp-lobby.html";
        });
      }
    }
  </script>
</body>
</html>
