<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altın Kazı Kazan</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    .scratch-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: auto;
      width: 100%;
      max-width: 290px;
    }
    .scratch-card {
      background: linear-gradient(135deg, #fbbf24, #b45309);
      border: 2px solid #fff;
      border-radius: 8px;
      height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 900;
      color: #000;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
      user-select: none;
    }
    .scratch-card.scratched {
      background: #090d16 !important;
      border-color: #334155 !important;
      color: #fff !important;
      cursor: default;
    }
  </style>
</head>
<body class="bg-standard">
  <div class="app-container" style="justify-content:space-between;">
    <div>
      <div class="top-header">
        <a href="menu.html" class="icon-btn" style="border-color:var(--danger); z-index:999;">‹ Çıkış</a>
        <div style="font-weight:bold; font-size:12px;">🪙 Altın Kazı Kazan</div>
        <div id="lbl-score" style="color:var(--neon-gold); font-weight:bold; font-size:12px;">0 P</div>
      </div>
      <div style="font-size:10px; color:var(--text-dim); text-align:center;">6 karttan istediğin 3 tanesini kazı!</div>
    </div>

    <div class="scratch-grid" id="scratch-board"></div>

    <div>
      <div style="text-align:center; font-size:11px; color:#38bdf8; margin-bottom:6px;">Kalan Kazıma: <b id="lbl-scratches">3</b></div>
    </div>

    <!-- Özet Ekranı -->
    <div id="summary-overlay" class="modal-overlay">
      <div class="modal-card">
        <div style="font-size:14px; font-weight:bold; color:var(--neon-gold); text-align:center; margin-bottom:8px;">🪙 KAZIMA BİTTİ</div>
        <div style="text-align:center; margin-bottom:8px; font-size:13px;">Kazanılan: <b id="sum-score" style="color:var(--neon-green);">0 P</b></div>
        <div style="display:flex; gap:6px;">
          <button class="icon-btn" style="flex:1; background:var(--btn-blue); justify-content:center;" onclick="location.reload()">🔄 Yeni Kart</button>
          <a href="menu.html" class="icon-btn" style="flex:1; background:var(--danger); justify-content:center;">🚪 Lobi</a>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const REWARDS = [20, 50, 100, 250, 400, 15];
    let totalScore = 0, remScratches = 3, drops = [];

    window.onload = initScratch;

    function initScratch() {
      const board = document.getElementById("scratch-board");
      board.innerHTML = "";
      const shuffled = [...REWARDS].sort(() => Math.random() - 0.5);

      shuffled.forEach(pts => {
        const card = document.createElement("div");
        card.className = "scratch-card";
        card.innerHTML = "<span>🪙 KAZI</span>";

        card.onclick = () => {
          if (card.classList.contains("scratched") || remScratches <= 0) return;
          card.classList.add("scratched");
          card.innerHTML = `<span style="font-size:10px; color:#94a3b8;">Ödül:</span><b style="color:var(--neon-green); font-size:14px;">+${pts}P</b>`;
          totalScore += pts;
          remScratches--;
          drops.push({ name: `Kazıma (+${pts}P)`, p: pts, c: "#fbbf24" });

          document.getElementById("lbl-score").innerText = `${totalScore} P`;
          document.getElementById("lbl-scratches").innerText = remScratches;

          if (remScratches <= 0) setTimeout(showSummary, 700);
        };

        board.appendChild(card);
      });
    }

    function showSummary() {
      document.getElementById("sum-score").innerText = `${totalScore} P`;
      document.getElementById("summary-overlay").style.display = "flex";
      recordGameScore('scratch_mode', 'Altın Kazı Kazan', totalScore, drops, totalScore > 0);
    }
  </script>
</body>
</html>
