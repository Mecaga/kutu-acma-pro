<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şans Yükseltme Modu</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-upgrade_mode">
  <div class="app-container">
    <div class="top-header">
      <a href="menu.html" class="icon-btn" style="border-color:var(--danger);">‹ Çıkış</a>
      <div style="font-weight:bold; font-size:12px;">Şans Yükseltme (7 Kutu)</div>
      <div id="score-badge" style="color:var(--neon-gold); font-weight:bold; font-size:12px;">0 P</div>
    </div>

    <!-- Ortak Stat Bar -->
    <div class="game-stats-top" style="margin-bottom:6px;">
      <div class="stat-card timer">
        <div class="stat-title">KALAN HAK</div>
        <div class="stat-val timer-val" id="rem-boxes-txt">7 Kutu</div>
        <div class="user-tag" id="upgrade-tier-txt">Kademe 1 (Şans x1)</div>
      </div>
      <div class="stat-card score">
        <div class="stat-title">PUAN</div>
        <div class="stat-val score-val" id="stat-score-txt">0</div>
      </div>
    </div>

    <!-- Oranlar Tablosu -->
    <div class="rates-box" id="rates-box">
      <div class="rate-row" style="color:#ffffff;"><span>Kademe 1 (%60)</span><span>5-15 P</span></div>
      <div class="rate-row" style="color:#38bdf8;"><span>Kademe 2 (%25)</span><span>20-60 P</span></div>
      <div class="rate-row" style="color:#c084fc;"><span>Kademe 3 (%10)</span><span>70-180 P</span></div>
      <div class="rate-row" style="color:#f43f5e;"><span>Kozmik Güç (%5)</span><span>250-800 P</span></div>
    </div>

    <!-- Kasa Alanı & CS Ruleti -->
    <div id="game-panel" style="display:flex; flex-direction:column; flex:1; justify-content:space-between;">
      <div class="case-container">
        <div id="ready-view">
          <div class="ready-banner">HAZIR!</div>
          <div class="ready-sub">Şans Yükseltme Modu</div>
        </div>
        <div id="roulette-view" class="roulette-wrapper">
          <div class="roulette-needle"></div>
          <div id="roulette-track" class="roulette-track"></div>
        </div>
      </div>

      <div class="drop-info-panel">
        <div class="drop-result-badge" id="drop-result-txt">
          Son Düşen: <span style="color:#64748b;">-</span>
        </div>
      </div>

      <button id="btn-spin" class="btn-action" onclick="spinUpgradeCase()">KASAYI AÇ (3s)</button>
    </div>

    <!-- Özet Ekranı -->
    <div id="summary-panel" style="display:none; flex-direction:column; flex:1; background:#120826; padding:12px; border-radius:8px; border:1px solid var(--neon-purple);">
      <div style="text-align:center; font-size:14px; font-weight:bold; color:var(--neon-gold); margin-bottom:8px;">TÜM KUTULAR AÇILDI</div>
      <div style="display:flex; justify-content:space-around; margin-bottom:8px; background:#070212; padding:6px; border-radius:6px;">
        <div>Toplam Puan: <b id="sum-score" style="color:var(--neon-green);">0</b></div>
        <div>Açılan: <b id="sum-count" style="color:var(--neon-blue);">7</b></div>
      </div>
      <div id="summary-drops" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px; margin-bottom:8px;"></div>
      <div style="display:flex; gap:6px;">
        <button class="icon-btn" style="flex:1; background:var(--btn-blue); justify-content:center;" onclick="location.reload()">🔄 Tekrar Oyna</button>
        <a href="menu.html" class="icon-btn" style="flex:1; background:var(--danger); justify-content:center;">🚪 Ana Menü</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const TIERS = [
      { name: 'Kademe 1', rate: 60.0, minP: 5, maxP: 15, c: '#ffffff', items: ['Gelişen Kılıç', 'Dinamik Zırh'] },
      { name: 'Kademe 2', rate: 25.0, minP: 20, maxP: 60, c: '#38bdf8', items: ['Aura Yayı', 'Işık Kristali'] },
      { name: 'Kademe 3', rate: 10.0, minP: 70, maxP: 180, c: '#c084fc', items: ['Yükseltilmiş Asa', 'Hiçlik Kalkanı'] },
      { name: 'Kozmik Güç', rate: 5.0, minP: 250, maxP: 800, c: '#f43f5e', items: ['Sonsuzluk Matrisi', 'Tanrı Katili'] }
    ];

    let totalScore = 0;
    let drops = [];
    let remCount = 7;
    let upgradeStep = 1;
    let isSpinning = false;

    function getRandomItem() {
      const bonusChance = (upgradeStep - 1) * 6;
      let rand = Math.max(0, (Math.random() * 100) - bonusChance);
      let cum = 0;
      for (let t of TIERS) {
        cum += t.rate;
        if (rand <= cum) {
          let it = t.items[Math.floor(Math.random() * t.items.length)];
          let pts = Math.floor(Math.random() * (t.maxP - t.minP + 1)) + t.minP;
          return { tier: t.name, item: it, pts: pts, c: t.c };
        }
      }
      return { tier: TIERS[0].name, item: TIERS[0].items[0], pts: TIERS[0].minP, c: TIERS[0].c };
    }

    function spinUpgradeCase() {
      if (isSpinning || remCount <= 0) return;
      isSpinning = true;
      remCount--;
      upgradeStep++;

      document.getElementById("rem-boxes-txt").innerText = `${remCount} Kutu`;
      document.getElementById("upgrade-tier-txt").innerText = `Kademe ${upgradeStep} (Şans x${upgradeStep})`;
      document.getElementById("btn-spin").disabled = true;

      document.getElementById("ready-view").style.display = "none";
      const rouletteView = document.getElementById("roulette-view");
      const track = document.getElementById("roulette-track");
      rouletteView.style.display = "block";

      track.style.transition = "none";
      track.style.transform = "translateX(0px)";
      track.innerHTML = "";

      const totalItems = 30, winIdx = 24;
      let winDrop = null;

      for (let i = 0; i < totalItems; i++) {
        let d = getRandomItem();
        if (i === winIdx) winDrop = d;
        track.innerHTML += `
          <div class="roulette-item" style="border-bottom:3px solid ${d.c};">
            <span style="color:${d.c}; font-weight:bold;">${d.tier}</span>
            <span style="font-size:8px; margin:2px 0;">${d.item}</span>
            <span style="color:var(--neon-green);">+${d.pts}P</span>
          </div>
        `;
      }

      setTimeout(() => {
        track.style.transition = "transform 3s cubic-bezier(0.12, 0.8, 0.2, 1)";
        const itemWidth = 80;
        const targetX = -(winIdx * itemWidth) + (rouletteView.offsetWidth / 2) - (itemWidth / 2) + (Math.random() * 20 - 10);
        track.style.transform = `translateX(${targetX}px)`;
      }, 20);

      setTimeout(() => {
        totalScore += winDrop.pts;
        drops.push(winDrop);
        document.getElementById("score-badge").innerText = `${totalScore} P`;
        document.getElementById("stat-score-txt").innerText = totalScore;
        document.getElementById("drop-result-txt").innerHTML = `
          <span style="color:${winDrop.c}; font-weight:bold;">${winDrop.tier}</span> - 
          <span>${winDrop.item}</span> - 
          <span style="color:#34d399; font-weight:bold;">+${winDrop.pts} P</span>
        `;

        isSpinning = false;
        if (remCount <= 0) {
          setTimeout(showSummary, 1500);
        } else {
          document.getElementById("btn-spin").disabled = false;
        }
      }, 3100);
    }

    function showSummary() {
      document.getElementById("game-panel").style.display = "none";
      document.getElementById("summary-panel").style.display = "flex";
      document.getElementById("sum-score").innerText = totalScore;

      const dBox = document.getElementById("summary-drops");
      dBox.innerHTML = "";
      drops.forEach(d => {
        dBox.innerHTML += `
          <div style="background:#070212; padding:4px 8px; border-radius:4px; display:flex; justify-content:space-between; font-size:10px; border:1px solid #3b1d6e;">
            <span><b style="color:${d.c};">[${d.tier}]</b> ${d.item}</span>
            <b style="color:var(--neon-green);">+${d.pts} P</b>
          </div>
        `;
      });

      recordGameScore('upgrade_mode', 'Şans Yükseltme Modu', totalScore, drops);
    }
  </script>
</body>
</html>
