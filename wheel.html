<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şanslı Çarkıfelek</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    .wheel-wrap {
      position: relative;
      width: 260px;
      height: 260px;
      margin: auto;
    }
    #wheel-canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid var(--neon-purple);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
      transition: transform 3.5s cubic-bezier(0.12, 0.8, 0.15, 1);
    }
    .wheel-pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 24px solid var(--danger);
      z-index: 10;
      filter: drop-shadow(0 0 6px var(--danger));
    }
  </style>
</head>
<body class="bg-standard">
  <div class="app-container" style="justify-content:space-between;">
    <div>
      <div class="top-header">
        <a href="menu.html" class="icon-btn" style="border-color:var(--danger); z-index:999;">‹ Çıkış</a>
        <div style="font-weight:bold; font-size:12px;">🎡 Şanslı Çarkıfelek</div>
        <div id="lbl-score" style="color:var(--neon-gold); font-weight:bold; font-size:12px;">0 P</div>
      </div>
      <div style="font-size:10px; color:var(--text-dim); text-align:center;">Kalan Hak: <b id="lbl-spins" style="color:#38bdf8;">5</b></div>
    </div>

    <div class="wheel-wrap">
      <div class="wheel-pointer"></div>
      <canvas id="wheel-canvas" width="300" height="300"></canvas>
    </div>

    <div>
      <div id="drop-badge" style="background:#0b1329; border:1px solid #334155; border-radius:6px; padding:6px; font-size:11px; text-align:center; margin-bottom:6px;">
        Son Çevirme: <span style="color:#64748b;">-</span>
      </div>
      <button id="btn-spin" class="btn-start" style="background:linear-gradient(90deg, #9333ea, #c084fc);" onclick="spinWheel()">🎡 ÇARKI ÇEVİR</button>
    </div>

    <!-- Özet Ekranı -->
    <div id="summary-overlay" class="modal-overlay">
      <div class="modal-card">
        <div style="font-size:14px; font-weight:bold; color:var(--neon-gold); text-align:center; margin-bottom:8px;">🎡 ÇARK TAMAMLANDI</div>
        <div style="text-align:center; margin-bottom:8px; font-size:13px;">Toplam Puan: <b id="sum-score" style="color:var(--neon-green);">0 P</b></div>
        <div id="summary-drops-list" style="max-height:140px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; margin-bottom:8px;"></div>
        <div style="display:flex; gap:6px;">
          <button class="icon-btn" style="flex:1; background:var(--btn-blue); justify-content:center;" onclick="location.reload()">🔄 Tekrar</button>
          <a href="menu.html" class="icon-btn" style="flex:1; background:var(--danger); justify-content:center;">🚪 Lobi</a>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const SLICES = [
      { name: "20 P", p: 20, color: "#1e1b4b" },
      { name: "50 P", p: 50, color: "#312e81" },
      { name: "15 P", p: 15, color: "#1e293b" },
      { name: "100 P", p: 100, color: "#4c1d95" },
      { name: "30 P", p: 30, color: "#065f46" },
      { name: "250 P", p: 250, color: "#b45309" },
      { name: "10 P", p: 10, color: "#334155" },
      { name: "500 P", p: 500, color: "#9f1239" }
    ];

    let totalScore = 0, remSpins = 5, isSpinning = false, drops = [], currentRotation = 0;

    window.onload = drawWheel;

    function drawWheel() {
      const canvas = document.getElementById("wheel-canvas");
      const ctx = canvas.getContext("2d");
      const num = SLICES.length;
      const arc = (2 * Math.PI) / num;

      ctx.clearRect(0, 0, 300, 300);

      for (let i = 0; i < num; i++) {
        const angle = i * arc;
        ctx.beginPath();
        ctx.fillStyle = SLICES[i].color;
        ctx.strokeStyle = "#ffffff22";
        ctx.lineWidth = 2;
        ctx.moveTo(150, 150);
        ctx.arc(150, 150, 148, angle, angle + arc);
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.translate(150, 150);
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 13px sans-serif";
        ctx.fillText(SLICES[i].name, 130, 5);
        ctx.restore();
      }
    }

    function spinWheel() {
      if (isSpinning || remSpins <= 0) return;
      isSpinning = true;
      document.getElementById("btn-spin").disabled = true;

      const winIdx = Math.floor(Math.random() * SLICES.length);
      const sliceDeg = 360 / SLICES.length;
      
      // Tepe noktası 270 dereceye denk geldiği için tam merkez hizalaması:
      const targetSliceCenterDeg = (winIdx * sliceDeg) + (sliceDeg / 2);
      const desiredAngle = (270 - targetSliceCenterDeg + 360) % 360;
      
      const fullRotations = 5 * 360;
      const currentMod = currentRotation % 360;
      const delta = (desiredAngle - currentMod + 360) % 360;
      
      currentRotation += fullRotations + delta;

      const wheelEl = document.getElementById("wheel-canvas");
      wheelEl.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        const drop = SLICES[winIdx];
        totalScore += drop.p;
        remSpins--;
        drops.push({ name: `${drop.p} Puan Dilimi`, p: drop.p, c: drop.color });

        document.getElementById("lbl-score").innerText = `${totalScore} P`;
        document.getElementById("lbl-spins").innerText = remSpins;
        document.getElementById("drop-badge").innerHTML = `Kazandın: <b style="color:var(--neon-green);">+${drop.p} P</b>`;
        isSpinning = false;

        if (remSpins <= 0) {
          setTimeout(showSummary, 700);
        } else {
          document.getElementById("btn-spin").disabled = false;
        }
      }, 3600);
    }

    function showSummary() {
      document.getElementById("sum-score").innerText = `${totalScore} P`;
      const list = document.getElementById("summary-drops-list");
      list.innerHTML = "";
      drops.forEach(d => {
        list.innerHTML += `<div style="background:#070212; padding:4px 8px; border-radius:4px; display:flex; justify-content:space-between; font-size:10px;"><span>${d.name}</span><b style="color:var(--neon-green);">+${d.p}P</b></div>`;
      });
      document.getElementById("summary-overlay").style.display = "flex";
      recordGameScore('wheel_mode', 'Şanslı Çarkıfelek', totalScore, drops, totalScore > 0);
    }
  </script>
</body>
</html>
