<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oyun Modu</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="lobby-header">
      <a href="menu.html" class="btn-sm" style="background:var(--danger);">‹ Çıkış</a>
      <div id="game-mode-name" style="font-weight:bold; font-size:12px;">Normal Kasa</div>
      <div id="game-timer" style="color:var(--gold); font-weight:bold;">30s</div>
    </div>

    <div style="padding:15px; display:flex; justify-content:space-between;">
      <div>Puan: <b id="g-score" style="color:var(--btn-green); font-size:18px;">0</b></div>
      <div>Kalan: <b id="g-rem" style="color:var(--gold);">10</b></div>
    </div>

    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:15px;">
      <div id="box-visual" style="font-size:70px; margin-bottom:10px;">📦</div>
      <div id="drop-result" style="font-size:14px; font-weight:bold; color:#60a5fa; text-align:center;">Kasayı Açmak İçin Dokun!</div>
    </div>

    <button id="open-btn" class="btn-play-main" onclick="openBox()">KASAYI AÇ</button>
  </div>

  <script src="app.js"></script>
  <script>
    let score = 0;
    let rem = 10;
    const drops = [
      { name: "Tahta Kılıç", pts: 2, r: "Classic" },
      { name: "Demir Balta", pts: 6, r: "Super" },
      { name: "Büyülü Asa", pts: 20, r: "Ultra" },
      { name: "Ejder Baltası", pts: 80, r: "Omega" },
      { name: "Kristal Kılıç", pts: 750, r: "Godly" }
    ];

    function openBox() {
      if (rem <= 0) return;
      rem--;
      let d = drops[Math.floor(Math.random() * drops.length)];
      score += d.pts;
      document.getElementById("g-score").innerText = score;
      document.getElementById("g-rem").innerText = rem;
      document.getElementById("drop-result").innerHTML = `<span style="color:var(--gold);">[${d.r}]</span> ${d.name} (+${d.pts}P)`;

      let u = getUser();
      u.dailyQuest = Math.min(3, u.dailyQuest + 1);
      addXP(15);
      saveUser(u);

      if (rem === 0) {
        document.getElementById("open-btn").disabled = true;
        document.getElementById("open-btn").innerText = "TAMAMLANDI!";
        setTimeout(() => { alert("Oyun Bitti! Puanınız: " + score); window.location.href="menu.html"; }, 1000);
      }
    }
  </script>
</body>
</html>
