<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kutu Açma Pro - Oyun</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="top-header">
      <a href="menu.html" class="icon-btn" style="border-color:var(--danger);">‹ Çıkış</a>
      <div id="game-header-title" style="font-weight:bold; font-size:12px;">Yükleniyor...</div>
      <div id="game-stat-badge" style="color:var(--gold); font-weight:bold; font-size:12px;">0 P</div>
    </div>

    <!-- 1. KLASİK / 10 KUTU / ŞANS YÜKSELTME EKRANI -->
    <div id="screen-classic" style="display:none; flex-direction:column; flex:1;">
      <div class="roulette-container" id="roulette-wrap">
        <div class="roulette-needle"></div>
        <div class="roulette-track" id="roulette-track"></div>
      </div>
      <div id="status-text" style="text-align:center; font-size:12px; font-weight:bold; color:var(--neon-blue); margin:8px 0;">
        Kasayı açmak için butona bas!
      </div>
      <div style="font-size:11px; color:#94a3b8; margin-bottom:8px; text-align:center;" id="lbl-classic-info">Kalan: 10</div>
      <button id="btn-classic-open" class="btn-start" style="margin-top:auto;" onclick="spinClassicCase()">KASAYI AÇ (3s)</button>
    </div>

    <!-- 2. YAKALA & AÇ 1. AŞAMA (ARENA) -->
    <div id="screen-catch-p1" style="display:none; flex-direction:column; flex:1;">
      <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--gold); margin-bottom:4px;">
        <span>Süre: <b id="lbl-catch-timer">15s</b></span>
        <span>Toplanan: <b id="lbl-caught-count">0</b></span>
      </div>
      <div id="catch-arena" style="flex:1; background:#050a14; border:2px dashed #1e293b; border-radius:8px; position:relative; overflow:hidden;"></div>
      <div style="text-align:center; font-size:10px; color:#fbbf24; margin-top:4px;">⚡ Düşen kutulara dokunarak topla!</div>
    </div>

    <!-- 2. YAKALA & AÇ 2. AŞAMA (KUTULARI AÇMA) -->
    <div id="screen-catch-p2" style="display:none; flex-direction:column; flex:1;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span style="font-size:11px; color:#38bdf8;">📦 Yakalanan Kutular (<span id="lbl-catch-rem">0</span>)</span>
        <button id="btn-open-all" class="icon-btn" style="background:var(--neon-purple);" onclick="openAllCaughtBoxes()">⚡ Tümünü Aç</button>
      </div>
      <div id="catch-inv-grid" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; flex:1; overflow-y:auto;"></div>
    </div>

    <!-- 3. MAYINLI KASA MODU EKRANI -->
    <div id="screen-mines" style="display:none; flex-direction:column; flex:1;">
      <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--gold); margin-bottom:6px;">
        <span id="lbl-mine-status">9 Kutuda 1 Mayın!</span>
        <span>Kasa: <b id="lbl-mine-score">0 P</b></span>
      </div>
      <div id="mines-grid" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; flex:1; align-content:center;"></div>
      <button id="btn-cashout" class="btn-start" style="margin-top:auto;" onclick="cashoutMines()">💰 Puanı Al ve Çık</button>
    </div>

    <!-- 4. ORTAK OYUN SONU ÖZET EKRANI -->
    <div id="screen-summary" style="display:none; flex-direction:column; flex:1; background:#0b1329; padding:12px; border-radius:8px;">
      <div style="text-align:center; font-size:14px; font-weight:bold; color:var(--gold); margin-bottom:8px;" id="lbl-summary-title">OYUN ÖZETİ</div>
      <div style="display:flex; justify-content:space-around; margin-bottom:8px; background:#070d1a; padding:6px; border-radius:6px;">
        <div>Toplam Puan: <b id="sum-score" style="color:var(--btn-green);">0</b></div>
        <div>Açılan: <b id="sum-count" style="color:var(--neon-blue);">0</b></div>
      </div>
      <div style="font-size:11px; color:var(--gold); font-weight:bold; margin-bottom:4px;">📋 Çıkan Eşyalar:</div>
      <div id="summary-drops-box" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px; margin-bottom:8px;"></div>
      <div style="display:flex; gap:6px;">
        <button class="nav-action-btn" style="flex:1; background:var(--btn-blue);" onclick="location.reload()">🔄 Tekrar Oyna</button>
        <a href="menu.html" class="nav-action-btn" style="flex:1; background:var(--danger);">🚪 Ana Menü</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const modeKey = urlParams.get('mode') || 'standard';

    const GAME_MODES = {
      standard: { name: "Normal Kasa (30s)", tiers: [
        { name: 'Classic', rate: 58, minP: 1, maxP: 3, c: '#fff', items: ['Tahta Kılıç', 'Deri Kask'] },
        { name: 'Super', rate: 29, minP: 4, maxP: 10, c: '#38bdf8', items: ['Demir Balta', 'Gümüş Yüzük'] },
        { name: 'Ultra', rate: 10, minP: 12, maxP: 30, c: '#c084fc', items: ['Büyülü Asa', 'Ateş Pelerini'] },
        { name: 'Omega', rate: 2.8, minP: 35, maxP: 120, c: '#fb923c', items: ['Ejder Baltası'] },
        { name: 'Godly', rate: 0.2, minP: 500, maxP: 1000, c: '#f43f5e', items: ['Ebedi Kristal Kılıç'] }
      ]},
      ten_cases: { name: "10 Kutu Modu", tiers: [
        { name: 'Classic', rate: 35, minP: 2, maxP: 5, c: '#fff', items: ['Gelişmiş Kalkan'] },
        { name: 'Super', rate: 35, minP: 6, maxP: 15, c: '#38bdf8', items: ['Safir Kılıç'] },
        { name: 'Ultra', rate: 20, minP: 20, maxP: 50, c: '#c084fc', items: ['Karanlık Asa'] },
        { name: 'Omega', rate: 8.5, minP: 60, maxP: 200, c: '#fb923c', items: ['Kıyamet Baltası'] },
        { name: 'Godly', rate: 1.5, minP: 600, maxP: 1200, c: '#f43f5e', items: ['Tanrısal Hüküm'] }
      ]},
      catch_open: { name: "Yakala & Aç Modu", tiers: [
        { name: 'Classic Kasa', rate: 45, minP: 2, maxP: 5, c: '#fff', items: ['Deri Çanta'] },
        { name: 'Super Kasa', rate: 30, minP: 6, maxP: 18, c: '#38bdf8', items: ['Buz Asası'] },
        { name: 'Ultra Kasa', rate: 15, minP: 25, maxP: 60, c: '#c084fc', items: ['Gök Gürültüsü Baltası'] },
        { name: 'Omega Kasa', rate: 8, minP: 80, maxP: 250, c: '#fb923c', items: ['Ejderha Kalbi'] },
        { name: 'Godly Kasa', rate: 2, minP: 750, maxP: 1500, c: '#f43f5e', items: ['Kainatın Asası'] }
      ]},
      upgrade_mode: { name: "Şans Yükseltme Modu", tiers: [
        { name: 'Kademe 1', rate: 60, minP: 5, maxP: 15, c: '#fff', items: ['Gelişen Kılıç'] },
        { name: 'Kademe 2', rate: 25, minP: 20, maxP: 60, c: '#38bdf8', items: ['Aura Yayı'] },
        { name: 'Kademe 3', rate: 10, minP: 70, maxP: 180, c: '#c084fc', items: ['Hiçlik Kalkanı'] },
        { name: 'Kozmik', rate: 5, minP: 250, maxP: 800, c: '#f43f5e', items: ['Tanrı Katili'] }
      ]},
      mines_mode: { name: "Mayınlı Kasa", tiers: [
        { name: 'Güvenli Kasa', rate: 70, minP: 15, maxP: 45, c: '#10b981', items: ['Elmas Külçesi', 'Zümrüt Heykel'] },
        { name: 'Büyük Hazine', rate: 30, minP: 60, maxP: 160, c: '#fbbf24', items: ['Kraliyet Tacı', 'Kutsal Kupa'] }
      ]}
    };

    let totalScore = 0;
    let sessionDrops = [];
    let isOpening = false;

    // Mod Durum Değişkenleri
    let timeLeft = 30;
    let timerInt = null;
    let remCount = 10;
    let upgradeLvl = 1;
    let caughtBoxes = [];
    let safeMineCount = 0;

    window.onload = () => {
      const mode = GAME_MODES[modeKey] || GAME_MODES.standard;
      document.getElementById("game-header-title").innerText = mode.name;

      if (modeKey === 'catch_open') startCatchPhase1();
      else if (modeKey === 'mines_mode') startMines();
      else startClassicMode();
    };

    function getRandomItem(mKey = modeKey) {
      const tiers = GAME_MODES[mKey].tiers;
      let rand = Math.random() * 100;
      if (mKey === 'upgrade_mode') rand = Math.max(0, rand - ((upgradeLvl - 1) * 8));

      let cum = 0;
      for (let t of tiers) {
        cum += t.rate;
        if (rand <= cum) {
          let it = t.items[Math.floor(Math.random() * t.items.length)];
          let pts = Math.floor(Math.random() * (t.maxP - t.minP + 1)) + t.minP;
          return { tier: t.name, item: it, pts: pts, c: t.c };
        }
      }
      return { tier: tiers[0].name, item: tiers[0].items[0], pts: tiers[0].minP, c: tiers[0].c };
    }

    // --- 1. KLASİK / 10 KUTU / ŞANS YÜKSELTME ---
    function startClassicMode() {
      document.getElementById("screen-classic").style.display = "flex";
      if (modeKey === 'standard') {
        remCount = 999;
        document.getElementById("lbl-classic-info").innerText = "Süre: 30s";
        timerInt = setInterval(() => {
          timeLeft--;
          document.getElementById("lbl-classic-info").innerText = `Süre: ${timeLeft}s`;
          if (timeLeft <= 0) {
            clearInterval(timerInt);
            document.getElementById("btn-classic-open").disabled = true;
            if (!isOpening) showSummary("Normal Kasa Bitti!");
          }
        }, 1000);
      } else if (modeKey === 'ten_cases') {
        remCount = 10;
        document.getElementById("lbl-classic-info").innerText = "Kalan Kutu: 10";
      } else if (modeKey === 'upgrade_mode') {
        remCount = 7;
        document.getElementById("lbl-classic-info").innerText = "Kalan: 7 (Kademe 1)";
      }
    }

    function spinClassicCase() {
      if (isOpening || remCount <= 0) return;
      isOpening = true;
      document.getElementById("btn-classic-open").disabled = true;

      if (modeKey === 'ten_cases') {
        remCount--;
        document.getElementById("lbl-classic-info").innerText = `Kalan Kutu: ${remCount}`;
      } else if (modeKey === 'upgrade_mode') {
        remCount--;
        upgradeLvl++;
        document.getElementById("lbl-classic-info").innerText = `Kalan: ${remCount} (Kademe ${upgradeLvl})`;
      }

      const track = document.getElementById("roulette-track");
      track.style.transition = "none";
      track.style.transform = "translateX(0px)";
      track.innerHTML = "";

      const totalCards = 30, winIdx = 24;
      let winDrop = null;

      for (let i = 0; i < totalCards; i++) {
        let d = getRandomItem();
        if (i === winIdx) winDrop = d;
        track.innerHTML += `
          <div class="roulette-item" style="border-bottom:3px solid ${d.c};">
            <span style="color:${d.c}; font-weight:bold;">${d.tier}</span>
            <span style="font-size:8px; margin:2px 0;">${d.item}</span>
            <span style="color:var(--btn-green);">+${d.pts}P</span>
          </div>
        `;
      }

      setTimeout(() => {
        track.style.transition = "transform 3s cubic-bezier(0.12, 0.8, 0.2, 1)";
        const itemWidth = 80;
        const targetX = -(winIdx * itemWidth) + (document.getElementById("roulette-wrap").offsetWidth / 2) - (itemWidth / 2) + (Math.random() * 20 - 10);
        track.style.transform = `translateX(${targetX}px)`;
      }, 20);

      setTimeout(() => {
        totalScore += winDrop.pts;
        sessionDrops.push(winDrop);
        document.getElementById("game-stat-badge").innerText = `${totalScore} P`;
        document.getElementById("status-text").innerHTML = `🎉 <span style="color:${winDrop.c};">${winDrop.tier}</span> - ${winDrop.item} (+${winDrop.pts}P)`;

        addXP(15);
        isOpening = false;

        if (remCount === 0 || (modeKey === 'standard' && timeLeft <= 0)) {
          setTimeout(() => showSummary(`${GAME_MODES[modeKey].name} Sonu`), 2000);
        } else {
          document.getElementById("btn-classic-open").disabled = false;
        }
      }, 3100);
    }

    // --- 2. YAKALA & AÇ ---
    function startCatchPhase1() {
      document.getElementById("screen-catch-p1").style.display = "flex";
      let cTime = 15;
      const arena = document.getElementById("catch-arena");

      const spawnInt = setInterval(() => {
        if (cTime <= 0) return clearInterval(spawnInt);
        const d = getRandomItem('catch_open');
        const box = document.createElement("div");
        box.style.cssText = `position:absolute; width:45px; height:45px; border-radius:8px; border:2px solid ${d.c}; background:#0d1b2a; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:9px; cursor:pointer; left:${Math.random() * (arena.offsetWidth - 55 || 250)}px; top:-50px; transition:top 2s linear;`;
        box.innerHTML = `<span>📦</span><span style="color:${d.c}; font-size:7px;">${d.tier}</span>`;
        box.onclick = (e) => {
          e.stopPropagation();
          caughtBoxes.push({ ...d, opened: false });
          document.getElementById("lbl-caught-count").innerText = caughtBoxes.length;
          box.remove();
        };
        arena.appendChild(box);
        setTimeout(() => box.style.top = "380px", 20);
        setTimeout(() => { if (box.parentNode) box.remove(); }, 2100);
      }, 850);

      const cd = setInterval(() => {
        cTime--;
        document.getElementById("lbl-catch-timer").innerText = `${cTime}s`;
        if (cTime <= 0) {
          clearInterval(cd);
          clearInterval(spawnInt);
          setTimeout(startCatchPhase2, 2000);
        }
      }, 1000);
    }

    function startCatchPhase2() {
      document.getElementById("screen-catch-p1").style.display = "none";
      document.getElementById("screen-catch-p2").style.display = "flex";
      renderCatchGrid();
    }

    function renderCatchGrid() {
      const grid = document.getElementById("catch-inv-grid");
      grid.innerHTML = "";
      const remaining = caughtBoxes.filter(b => !b.opened).length;
      document.getElementById("lbl-catch-rem").innerText = remaining;

      if (caughtBoxes.length === 0) {
        grid.innerHTML = "<div style='grid-column:span 3; text-align:center; color:#666; padding:20px;'>Hiç kutu toplayamadın!</div>";
        setTimeout(() => showSummary("Yakala & Aç Sonu"), 1500);
        return;
      }

      caughtBoxes.forEach((b, idx) => {
        const itemBox = document.createElement("div");
        itemBox.className = "roulette-item";
        itemBox.style.cssText = `width:100%; height:70px; border:1px solid ${b.opened ? '#334155' : b.c}; opacity:${b.opened ? '0.4' : '1'}; cursor:${b.opened ? 'default' : 'pointer'};`;
        itemBox.innerHTML = `
          <span>📦</span>
          <span style="color:${b.c}; font-size:8px;">${b.tier}</span>
          <span style="font-size:7px;">${b.opened ? '+'+b.pts+'P' : 'DOKUN AÇ'}</span>
        `;
        if (!b.opened) {
          itemBox.onclick = () => openSingleCaught(idx);
        }
        grid.appendChild(itemBox);
      });
    }

    function openSingleCaught(idx) {
      if (caughtBoxes[idx].opened) return;
      caughtBoxes[idx].opened = true;
      totalScore += caughtBoxes[idx].pts;
      sessionDrops.push(caughtBoxes[idx]);
      document.getElementById("game-stat-badge").innerText = `${totalScore} P`;
      renderCatchGrid();

      if (caughtBoxes.every(b => b.opened)) {
        setTimeout(() => showSummary("Yakala & Aç Tamamlandı!"), 2000);
      }
    }

    function openAllCaughtBoxes() {
      document.getElementById("btn-open-all").disabled = true;
      caughtBoxes.forEach(b => {
        if (!b.opened) {
          b.opened = true;
          totalScore += b.pts;
          sessionDrops.push(b);
        }
      });
      document.getElementById("game-stat-badge").innerText = `${totalScore} P`;
      renderCatchGrid();
      setTimeout(() => showSummary("Yakala & Aç - Tüm Kutular Açıldı"), 2000);
    }

    // --- 3. MAYINLI KASA (TAMAMEN ONARILDI) ---
    function startMines() {
      document.getElementById("screen-mines").style.display = "flex";
      const grid = document.getElementById("mines-grid");
      grid.innerHTML = "";
      totalScore = 0;
      safeMineCount = 0;
      sessionDrops = [];

      document.getElementById("lbl-mine-score").innerText = "0 P";
      document.getElementById("lbl-mine-status").innerText = "9 Kutuda 1 Mayın!";
      document.getElementById("btn-cashout").disabled = false;

      const bombIdx = Math.floor(Math.random() * 9);

      for (let i = 0; i < 9; i++) {
        const tile = document.createElement("div");
        tile.className = "roulette-item";
        tile.style.cssText = "width:100%; height:80px; cursor:pointer; background:#0d1527; border:2px solid #334155; border-radius:8px;";
        tile.innerHTML = `<span style="font-size:24px;">📦</span>`;

        tile.onclick = () => {
          if (tile.dataset.opened) return;
          tile.dataset.opened = "1";

          if (i === bombIdx) {
            tile.style.background = "#7f1d1d";
            tile.style.borderColor = "var(--danger)";
            tile.innerHTML = `💣<br><span style="font-size:9px; color:#fca5a5; font-weight:bold;">PATLADIN!</span>`;
            document.getElementById("btn-cashout").disabled = true;
            document.getElementById("lbl-mine-status").innerText = "BOMBA PATLADI!";
            totalScore = 0;
            sessionDrops = [{ tier: "Mayın", item: "Bomba Patladı (Puan Sıfırlandı)", pts: 0, c: "#ef4444" }];
            setTimeout(() => showSummary("💣 MAYINA BASTIN - 0 PUAN"), 2000);
          } else {
            safeMineCount++;
            const d = getRandomItem('mines_mode');
            totalScore += d.pts;
            sessionDrops.push(d);

            tile.style.background = "#064e3b";
            tile.style.borderColor = "var(--btn-green)";
            tile.innerHTML = `💎<br><b style="font-size:9px; color:#34d399;">+${d.pts}P</b>`;

            document.getElementById("lbl-mine-score").innerText = `${totalScore} P`;
            document.getElementById("game-stat-badge").innerText = `${totalScore} P`;
            document.getElementById("lbl-mine-status").innerText = `Güvenli: ${safeMineCount}/8`;

            if (safeMineCount === 8) {
              cashoutMines();
            }
          }
        };
        grid.appendChild(tile);
      }
    }

    function cashoutMines() {
      document.getElementById("btn-cashout").disabled = true;
      showSummary("💰 KASADAN BAŞARIYLA ÇEKİLDİN!");
    }

    // --- ORTAK ÖZET & SIRALAMAYA EN İYİ SKORU YAZMA ---
    function showSummary(title) {
      document.getElementById("screen-classic").style.display = "none";
      document.getElementById("screen-catch-p1").style.display = "none";
      document.getElementById("screen-catch-p2").style.display = "none";
      document.getElementById("screen-mines").style.display = "none";
      document.getElementById("screen-summary").style.display = "flex";

      document.getElementById("lbl-summary-title").innerText = title;
      document.getElementById("sum-score").innerText = totalScore;
      document.getElementById("sum-count").innerText = sessionDrops.length;

      const dBox = document.getElementById("summary-drops-box");
      dBox.innerHTML = "";
      sessionDrops.forEach(d => {
        dBox.innerHTML += `
          <div style="background:#070c18; padding:4px 8px; border-radius:4px; display:flex; justify-content:space-between; font-size:10px;">
            <span><b style="color:${d.c};">[${d.tier}]</b> ${d.item}</span>
            <b style="color:var(--btn-green);">+${d.pts} P</b>
          </div>
        `;
      });

      const u = getActiveUser();
      if (u) {
        const recRef = db.ref(`leaderboards/${modeKey}/${u.uid}`);
        recRef.once("value", snap => {
          const old = snap.val();
          if (!old || totalScore > old.score) {
            recRef.set({
              uid: u.uid,
              fullName: `${u.name}${u.tag}`,
              title: u.title || "Çaylak",
              modeKey: modeKey,
              modeName: GAME_MODES[modeKey].name,
              score: totalScore,
              date: new Date().toLocaleString("tr-TR"),
              drops: sessionDrops
            });
          }
        });
      }
    }
  </script>
</body>
</html>
