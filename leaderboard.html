<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Liderlik Tablosu & Sıralama</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="app.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #020617; font-family: system-ui, sans-serif; color: #fff; }

    .lb-layout {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      background: #030712;
      display: flex;
      flex-direction: column;
    }

    .lb-header {
      flex-shrink: 0;
      background: #090d1a;
      border-bottom: 2px solid #1e293b;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .lb-modes-scroll {
      flex-shrink: 0;
      background: #0b1120;
      border-bottom: 1px solid #1e293b;
      display: flex;
      gap: 4px;
      padding: 5px 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .lb-modes-scroll::-webkit-scrollbar { display: none; }

    .lb-chip {
      flex: 0 0 auto;
      padding: 4px 8px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 8px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }
    .lb-chip.active { background: #4338ca; border-color: var(--neon-gold); color: #fff; }

    .lb-list-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .lb-list-area::-webkit-scrollbar { width: 3px; }
    .lb-list-area::-webkit-scrollbar-thumb { background: #3b1d6e; border-radius: 4px; }

    .rank-item-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 8.5px;
    }
  </style>
</head>
<body>
  <div class="lb-layout">
    
    <!-- Üst Başlık -->
    <div class="lb-header">
      <a href="menu.html" class="icon-btn" style="border-color:var(--danger); padding:2px 8px; font-size:9.5px; text-decoration:none;">‹ Lobi</a>
      <div style="font-weight:900; font-size:11px; color:#38bdf8;">🏆 Liderlik Sıralamaları</div>
      <div id="lbl-my-current-score" style="font-size:8.5px; color:var(--neon-gold); font-weight:bold;">Durumum: -</div>
    </div>

    <!-- Mod Kategorileri Şeridi -->
    <div class="lb-modes-scroll">
      <button type="button" class="lb-chip active" id="chip-all" onclick="switchLB('all')">🌟 Genel (Tümü)</button>
      <button type="button" class="lb-chip" id="chip-standard" onclick="switchLB('standard')">⚔️ Normal Kasa</button>
      <button type="button" class="lb-chip" id="chip-catch_open" onclick="switchLB('catch_open')">🎯 Yakala & Aç</button>
      <button type="button" class="lb-chip" id="chip-mines_mode" onclick="switchLB('mines_mode')">💣 Mayın Tarlası</button>
      <button type="button" class="lb-chip" id="chip-speedrun_mode" onclick="switchLB('speedrun_mode')">⚡ Speedrun (Süre)</button>
      <button type="button" class="lb-chip" id="chip-double_mode" onclick="switchLB('double_mode')">🎰 Çift Rulet</button>
    </div>

    <!-- Sıralama Listesi -->
    <div class="lb-list-area" id="leaderboard-container">
      <div style="color:#64748b; font-size:8px; text-align:center; padding:15px;">Sıralama yükleniyor...</div>
    </div>

  </div>

  <script>
    let currentFilter = 'all';

    window.onload = () => {
      switchLB('all');
    };

    function switchLB(filterKey) {
      currentFilter = filterKey;
      document.querySelectorAll(".lb-chip").forEach(c => c.classList.remove("active"));
      const activeBtn = document.getElementById(`chip-${filterKey}`);
      if (activeBtn) activeBtn.classList.add("active");

      renderLeaderboard(filterKey);
    }

    function renderLeaderboard(filterKey) {
      const container = document.getElementById("leaderboard-container");
      container.innerHTML = "<div style='color:#64748b; font-size:8px; text-align:center; padding:15px;'>Yükleniyor...</div>";

      const u = getActiveUser();
      const myUID = u ? String(u.uid || u.name).replace(/[.#$\[\]]/g, "_") : "";

      if (!db) {
        container.innerHTML = "<div style='color:var(--danger); font-size:8px; text-align:center; padding:15px;'>Veritabanı bağlantısı yok.</div>";
        return;
      }

      // Hem leaderboards hem de game_scores düğümlerini birlikte çekiyoruz
      Promise.all([
        db.ref("leaderboards").once("value"),
        db.ref("game_scores").once("value")
      ]).then(([snapLB, snapGS]) => {
        container.innerHTML = "";
        let usersMap = {};

        function processRecord(rec) {
          if (!rec || typeof rec !== "object") return;
          const uid = String(rec.uid || rec.fullName || 'guest').replace(/[.#$\[\]]/g, "_");
          const name = rec.fullName || rec.username || rec.name || 'Oyuncu';
          const avatar = rec.avatar || '👤';
          const title = rec.title || 'Çaylak';

          let mode = String(rec.gameMode || rec.mode || 'standard').toLowerCase().trim();
          if (mode === "normal" || mode === "klasik") mode = "standard";
          if (mode === "catch" || mode === "yakala") mode = "catch_open";
          if (mode === "mines" || mode === "mayin") mode = "mines_mode";
          if (mode === "speedrun") mode = "speedrun_mode";
          if (mode === "double" || mode === "rulet") mode = "double_mode";

          if (!usersMap[uid]) {
            usersMap[uid] = {
              uid: uid,
              name: name,
              avatar: avatar,
              title: title,
              modes: {}
            };
          }

          if (mode === "speedrun_mode") {
            let t = parseFloat(rec.time !== undefined ? rec.time : rec.score) || 0;
            // Eski hatalı 1 saniyelik veya imkansız kayıtları yoksay
            if (t > 4.0) {
              if (!usersMap[uid].modes[mode] || t < usersMap[uid].modes[mode]) {
                usersMap[uid].modes[mode] = t;
              }
            }
          } else {
            let p = parseFloat(rec.score !== undefined ? rec.score : rec.points) || 0;
            if (p > 0) {
              if (!usersMap[uid].modes[mode] || p > usersMap[uid].modes[mode]) {
                usersMap[uid].modes[mode] = p;
              }
            }
          }
        }

        if (snapLB.exists()) {
          snapLB.forEach(mSnap => {
            mSnap.forEach(uSnap => processRecord(uSnap.val()));
          });
        }

        if (snapGS.exists()) {
          snapGS.forEach(gSnap => processRecord(gSnap.val()));
        }

        let userList = Object.keys(usersMap).map(id => {
          const d = usersMap[id];
          const normP = d.modes["standard"] || 0;
          const catchP = d.modes["catch_open"] || 0;
          const minesP = d.modes["mines_mode"] || 0;
          const top3Sum = normP + catchP + minesP;

          return {
            uid: id,
            name: d.name,
            avatar: d.avatar,
            title: d.title,
            normP: normP,
            catchP: catchP,
            minesP: minesP,
            top3Sum: top3Sum,
            speedrunTime: d.modes["speedrun_mode"] || 0,
            singleScore: d.modes[filterKey] || 0
          };
        });

        // SIRALAMA MANTIĞI
        if (filterKey === 'all') {
          userList = userList.filter(u => u.top3Sum > 0);
          userList.sort((a, b) => b.top3Sum - a.top3Sum);
        } else if (filterKey === 'speedrun_mode') {
          userList = userList.filter(u => u.speedrunTime > 0);
          userList.sort((a, b) => a.speedrunTime - b.speedrunTime); // En kısa süre birinci
        } else {
          userList = userList.filter(u => u.singleScore > 0);
          userList.sort((a, b) => b.singleScore - a.singleScore);
        }

        // Oyuncunun kendi durumunu üstte göster
        const me = userList.find(u => u.uid === myUID);
        const myScoreEl = document.getElementById("lbl-my-current-score");
        if (me) {
          if (filterKey === 'all') myScoreEl.innerText = `Toplamım: ${me.top3Sum} P`;
          else if (filterKey === 'speedrun_mode') myScoreEl.innerText = `Sürem: ${me.speedrunTime.toFixed(1)} sn`;
          else myScoreEl.innerText = `Puanım: ${me.singleScore} P`;
        } else {
          myScoreEl.innerText = "Durumum: -";
        }

        if (userList.length === 0) {
          container.innerHTML = "<div style='color:#64748b; font-size:8px; text-align:center; padding:15px;'>Bu kategoride kayıt bulunamadı.</div>";
          return;
        }

        userList.slice(0, 50).forEach((item, idx) => {
          const div = document.createElement("div");
          div.className = "rank-item-card";
          if (item.uid === myUID) div.style.borderColor = "var(--neon-gold)";

          let badge = `#${idx + 1}`;
          if (idx === 0) badge = "🥇 1.";
          else if (idx === 1) badge = "🥈 2.";
          else if (idx === 2) badge = "🥉 3.";

          if (filterKey === 'all') {
            // TÜMÜ KATEGORİSİ (Normal + Yakala + Mayın Dökümü)
            div.innerHTML = `
              <div style="display:flex; align-items:center; gap:5px;">
                <span style="font-weight:bold; color:#38bdf8; width:22px;">${badge}</span>
                <span>${item.avatar}</span>
                <div>
                  <b style="color:#fff;">${item.name}</b>
                  <div style="color:#94a3b8; font-size:6.5px;">
                    ⚔️ Normal: <span style="color:#38bdf8;">${item.normP}</span> | 
                    🎯 Yakala: <span style="color:#c084fc;">${item.catchP}</span> | 
                    💣 Mayın: <span style="color:#f87171;">${item.minesP}</span>
                  </div>
                </div>
              </div>
              <div style="text-align:right;">
                <div style="font-weight:900; color:var(--neon-green); font-size:10.5px;">${item.top3Sum} P</div>
                <small style="color:#64748b; font-size:6px;">Genel Toplam</small>
              </div>
            `;
          } else if (filterKey === 'speedrun_mode') {
            // SPEEDRUN KATEGORİSİ (Süre Bazlı)
            div.innerHTML = `
              <div style="display:flex; align-items:center; gap:5px;">
                <span style="font-weight:bold; color:#38bdf8; width:22px;">${badge}</span>
                <span>${item.avatar}</span>
                <div>
                  <b style="color:#fff;">${item.name}</b>
                  <div style="color:#94a3b8; font-size:6.5px;">${item.title}</div>
                </div>
              </div>
              <div style="font-weight:bold; color:var(--neon-gold); font-size:10px;">⚡ ${item.speedrunTime.toFixed(1)} sn</div>
            `;
          } else {
            // DİĞER TEKLİ MODLAR
            div.innerHTML = `
              <div style="display:flex; align-items:center; gap:5px;">
                <span style="font-weight:bold; color:#38bdf8; width:22px;">${badge}</span>
                <span>${item.avatar}</span>
                <div>
                  <b style="color:#fff;">${item.name}</b>
                  <div style="color:#94a3b8; font-size:6.5px;">${item.title}</div>
                </div>
              </div>
              <div style="font-weight:bold; color:var(--neon-green); font-size:10px;">${item.singleScore} P</div>
            `;
          }

          container.appendChild(div);
        });

      }).catch(err => {
        container.innerHTML = `<div style='color:var(--danger); font-size:8px; text-align:center; padding:15px;'>Hata: ${err.message}</div>`;
      });
    }
  </script>
</body>
</html>
