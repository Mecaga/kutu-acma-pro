<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sıralama Tablosu</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="lobby-header">
        <button class="btn btn-purple" onclick="location.href='menu.html'">‹ Lobi</button>
        <span id="header-user-tag"></span>
    </div>

    <div class="content-box">
        <h2>🏆 En İyi Oyuncular Sıralaması</h2>
        <div class="mode-card" style="margin-top: 15px;">
            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr style="border-bottom: 1px solid #3b206b; color: var(--gold); font-size: 14px;">
                        <th style="padding: 10px;">#</th>
                        <th style="padding: 10px;">Oyuncu</th>
                        <th style="padding: 10px;">Unvan</th>
                        <th style="padding: 10px;">Seviye</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-rows"></tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        window.onload = () => {
            renderHeader();
            db.ref("leaderboard").orderByChild("level").limitToLast(15).on("value", snap => {
                let tbody = document.getElementById("leaderboard-rows");
                tbody.innerHTML = "";
                let list = [];
                snap.forEach(c => list.push(c.val()));
                list.reverse();

                list.forEach((p, idx) => {
                    tbody.innerHTML += `
                        <tr style="border-bottom: 1px solid #241349; font-size: 14px;">
                            <td style="padding: 10px; font-weight: bold; color: var(--neon-purple);">${idx + 1}</td>
                            <td style="padding: 10px;">${p.fullName}</td>
                            <td style="padding: 10px; color: #c084fc;">[${p.title}]</td>
                            <td style="padding: 10px; font-weight: bold; color: var(--gold);">Lvl ${p.level}</td>
                        </tr>
                    `;
                });
            });
        };
    </script>
</body>
</html>
