<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sıralama Tablosu</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="app-container" style="justify-content:space-between;">
    <div>
      <div class="top-header">
        <a href="menu.html" class="icon-btn" style="border-color:var(--danger);">‹ Lobi</a>
        <div style="font-weight:bold; font-size:12px;">🏆 Sıralama Tablosu</div>
        <div></div>
      </div>

      <!-- Filtre Sekmeleri -->
      <div style="display:flex; gap:4px; overflow-x:auto; padding-bottom:4px; margin-bottom:6px;">
        <button class="icon-btn" id="flt-all" style="background:var(--btn-blue);" onclick="loadLB('all', this)">Tümü</button>
        <button class="icon-btn" onclick="loadLB('standard', this)">Normal</button>
        <button class="icon-btn" onclick="loadLB('ten_cases', this)">10 Kutu</button>
        <button class="icon-btn" onclick="loadLB('catch_open', this)">Yakala & Aç</button>
        <button class="icon-btn" onclick="loadLB('upgrade_mode', this)">Yükseltme</button>
        <button class="icon-btn" onclick="loadLB('mines_mode', this)">Mayın</button>
        <button class="icon-btn" onclick="loadLB('mega_mode', this)">Mega</button>
        <button class="icon-btn" onclick="loadLB('dice_mode', this)">Zar</button>
        <button class="icon-btn" style="border-color:var(--danger);" onclick="loadLB('speedrun_mode', this)">⚡ Speedrun</button>
      </div>
    </div>

    <!-- Sıralama Listesi -->
    <div id="lb-records-list" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px;"></div>
  </div>

  <!-- Detay Modalı -->
  <div id="modal-lb-details" class="modal-overlay">
    <div class="modal-card panel-theme-profile">
      <div style="text-align:center;">
        <div style="font-size:36px;" id="det-prof-avatar">👤</div>
        <h3 id="det-prof-name" style="color:var(--neon-blue);">Oyuncu</h3>
        <div id="det-prof-title" style="color:var(--neon-gold); font-size:11px; margin-bottom:6px;">[Çaylak]</div>
      </div>
      <div class="profile-stats-grid">
        <div class="stat-mini-box"><span class="stat-mini-val" id="det-played" style="color:var(--neon-blue);">0</span><span class="stat-mini-lbl">Oyun</span></div>
        <div class="stat-mini-box"><span class="stat-mini-val" id="det-wins" style="color:var(--neon-green);">0</span><span class="stat-mini-lbl">Kazanma</span></div>
        <div class="stat-mini-box"><span class="stat-mini-val" id="det-losses" style="color:var(--danger);">0</span><span class="stat-mini-lbl">Kaybetme</span></div>
        <div class="stat-mini-box"><span class="stat-mini-val" id="det-winrate" style="color:var(--neon-gold);">%0</span><span class="stat-mini-lbl">Oran</span></div>
      </div>
      <button class="btn-close" onclick="document.getElementById('modal-lb-details').style.display='none'">Kapat</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let activeFilter = 'all';

    window.onload = () => {
      loadLB('all', document.getElementById("flt-all"));
    };

    function loadLB(filter, btn) {
      if (btn) {
        document.querySelectorAll(".icon-btn").forEach(b => b.style.background = "#1b263b");
        btn.style.background = "var(--btn-blue)";
      }
      activeFilter = filter;
      const listContainer = document.getElementById("lb-records-list");
      listContainer.innerHTML = "<div style='text-align:center; font-size:11px; color:#888; padding:15px;'>Yükleniyor...</div>";

      db.ref("leaderboards").once("value", snap => {
        listContainer.innerHTML = "";
        let allScores = [];

        snap.forEach(modeSnap => {
          // Speedrun modu genel tümü sekmesinde görünmez, sadece kendi sekmesinde görünür
          if (filter === 'all' && modeSnap.key === 'speedrun_mode') return;

          if (filter === 'all' || modeSnap.key === filter) {
            modeSnap.forEach(userRecord => {
              const r = userRecord.val();
              if (r) allScores.push(r);
            });
          }
        });

        // Speedrun modunda en düşük süre üstte, diğerlerinde en yüksek puan üstte
        if (filter === 'speedrun_mode') {
          allScores.sort((a, b) => (a.time || 999) - (b.time || 999));
        } else {
          allScores.sort((a, b) => (b.score || 0) - (a.score || 0));
        }

        if (allScores.length === 0) {
          listContainer.innerHTML = "<div style='text-align:center; font-size:11px; color:#888; padding:20px;'>Kayıt bulunamadı.</div>";
          return;
        }

        allScores.forEach((rec, idx) => {
          const itemRow = document.createElement("div");
          let rankClass = "rank-card";
          if (idx === 0) rankClass += " rank-1";
          else if (idx === 1) rankClass += " rank-2";
          else if (idx === 2) rankClass += " rank-3";

          const valDisplay = filter === 'speedrun_mode' 
            ? `<b style="color:var(--neon-green); font-size:13px;">${parseFloat(rec.time).toFixed(1)} sn</b>` 
            : `<b style="color:var(--neon-green); font-size:13px;">${rec.score} P</b>`;

          itemRow.className = rankClass;
          itemRow.innerHTML = `
            <span><b>${idx+1}.</b> ${rec.avatar || '👤'} ${rec.fullName} <small style="color:var(--neon-gold);">[${rec.modeName}]</small></span>
            ${valDisplay}
          `;
          itemRow.onclick = () => openPlayerProfile(rec);
          listContainer.appendChild(itemRow);
        });
      });
    }

    function openPlayerProfile(rec) {
      db.ref("users/" + rec.uid).once("value", snap => {
        const fullUser = snap.val() || {};
        const stats = fullUser.stats || {};
        let totalGames = 0, totalWins = 0, totalLosses = 0;
        for (let k in stats) {
          totalGames += stats[k].played || 0;
          totalWins += stats[k].wins || 0;
          totalLosses += stats[k].losses || 0;
        }

        document.getElementById("det-prof-avatar").innerText = fullUser.avatar || "👤";
        document.getElementById("det-prof-name").innerText = rec.fullName;
        document.getElementById("det-prof-title").innerText = `[${fullUser.title || 'Çaylak'}]`;
        document.getElementById("det-played").innerText = totalGames;
        document.getElementById("det-wins").innerText = totalWins;
        document.getElementById("det-losses").innerText = totalLosses;
        document.getElementById("det-winrate").innerText = totalGames > 0 ? `%${Math.round((totalWins / totalGames) * 100)}` : "%0";
        document.getElementById("modal-lb-details").style.display = "flex";
      });
    }
  </script>
</body>
</html>
