<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sıralama Tablosu</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="app-container" style="justify-content:space-between;">
    <div>
      <div class="top-header">
        <a href="menu.html" class="icon-btn" style="border-color:var(--danger); z-index:999;">‹ Lobi</a>
        <div style="font-weight:bold; font-size:12px;">🏆 Sıralama Tablosu</div>
        <div></div>
      </div>

      <!-- Filtre Sekmeleri -->
      <div style="display:flex; gap:4px; overflow-x:auto; padding-bottom:4px; margin-bottom:6px;">
        <button class="icon-btn" id="flt-all" style="background:var(--btn-blue);" onclick="loadLB('all', this)">Tümü</button>
        <button class="icon-btn" onclick="loadLB('standard', this)">Normal</button>
        <button class="icon-btn" onclick="loadLB('ten_cases', this)">10 Kutu</button>
        <button class="icon-btn" onclick="loadLB('catch_basket', this)">🧺 Tut & Aç</button>
        <button class="icon-btn" onclick="loadLB('catch_open', this)">🎯 Yakala & Aç</button>
        <button class="icon-btn" onclick="loadLB('mines_mode', this)">💣 Mayınlı</button>
        <button class="icon-btn" onclick="loadLB('mega_mode', this)">💎 Mega</button>
        <button class="icon-btn" style="border-color:var(--danger);" onclick="loadLB('speedrun_mode', this)">⚡ Speedrun</button>
        <button class="icon-btn" onclick="loadLB('temple_mode', this)">🏛️ Tapınak</button>
        <button class="icon-btn" onclick="loadLB('double_mode', this)">🎰 Çift Rulet</button>
      </div>
    </div>

    <!-- Sıralama Listesi -->
    <div id="lb-records-list" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px;"></div>
  </div>

  <!-- Oyun Detay Modalı -->
  <div id="modal-lb-game-info" class="modal-overlay">
    <div class="modal-card">
      <div style="font-size:10px; color:var(--text-dim); margin-bottom:4px;">Oyuncunun profiline gitmek için dokunun:</div>
      <h3 id="det-user-clickable" style="color:var(--neon-blue); font-size:14px; cursor:pointer; text-decoration:underline; margin-bottom:4px;">Oyuncu#12345</h3>
      <div id="det-mode-info" style="font-size:10px; color:var(--neon-gold); margin-bottom:2px;">Mod: Normal Kasa</div>
      <div id="det-date" style="font-size:9px; color:#94a3b8; margin-bottom:6px;">Tarih: -</div>

      <div style="font-size:10px; font-weight:bold; color:#fff; margin-bottom:4px;">📦 Çıkan Eşyalar:</div>
      <div id="det-drops-list" style="max-height:120px; overflow-y:auto; display:flex; flex-direction:column; gap:3px; margin-bottom:6px;"></div>
      <button class="btn-close" onclick="document.getElementById('modal-lb-game-info').style.display='none'">Kapat</button>
    </div>
  </div>

  <!-- Tam Profil Modalı -->
  <div id="modal-full-profile" class="modal-overlay">
    <div class="modal-card panel-theme-profile" style="max-height:90vh;">
      <div class="profile-badge-card" style="margin-bottom:6px;">
        <div style="font-size:36px; margin-bottom:2px;" id="prof-modal-avatar">👤</div>
        <h2 id="prof-modal-name" style="color:var(--neon-blue); font-size:14px;">Oyuncu</h2>
        <div id="prof-modal-title" style="color:var(--neon-gold); font-size:10px;">[Çaylak]</div>
        <div style="font-size:9px; color:#94a3b8; margin-top:3px;" id="prof-modal-created">Hesap: -</div>
        
        <div class="profile-stats-grid">
          <div class="stat-mini-box"><span class="stat-mini-val" id="prof-modal-played" style="color:var(--neon-blue);">0</span><span class="stat-mini-lbl">Oynanan</span></div>
          <div class="stat-mini-box"><span class="stat-mini-val" id="prof-modal-wins" style="color:var(--neon-green);">0</span><span class="stat-mini-lbl">Kazanma</span></div>
          <div class="stat-mini-box"><span class="stat-mini-val" id="prof-modal-losses" style="color:var(--danger);">0</span><span class="stat-mini-lbl">Kaybetme</span></div>
          <div class="stat-mini-box"><span class="stat-mini-val" id="prof-modal-winrate" style="color:var(--neon-gold);">%0</span><span class="stat-mini-lbl">Genel Oran</span></div>
        </div>
      </div>

      <div style="font-size:10px; font-weight:bold; color:var(--neon-gold); margin-bottom:4px;">📊 Mod Bazlı İstatistikler & Oranlar:</div>
      <div id="prof-modal-stats-list" style="display:flex; flex-direction:column; gap:3px; max-height:160px; overflow-y:auto; margin-bottom:6px;"></div>

      <button class="btn-close" onclick="document.getElementById('modal-full-profile').style.display='none'">Geri Dön</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let activeFilter = 'all';
    const EXCLUDED_FROM_ALL = ['speedrun_mode', 'temple_mode'];

    window.onload = () => {
      loadLB('all', document.getElementById("flt-all"));
    };

    function loadLB(filter, btn) {
      if (btn) {
        document.querySelectorAll(".icon-btn").forEach(b => b.style.background = "#1b263b");
        btn.style.background = "var(--btn-blue)";
      }
      activeFilter = filter;
      const listContainer = document.getElementById("lb-records-list");
      listContainer.innerHTML = "<div style='text-align:center; font-size:11px; color:#888; padding:15px;'>Yükleniyor...</div>";

      db.ref("leaderboards").on("value", snap => {
        listContainer.innerHTML = "";
        let allScores = [];

        if (snap.exists()) {
          snap.forEach(modeSnap => {
            if (filter === 'all' && EXCLUDED_FROM_ALL.includes(modeSnap.key)) return;

            if (filter === 'all' || modeSnap.key === filter) {
              modeSnap.forEach(userRecord => {
                const r = userRecord.val();
                if (r) allScores.push(r);
              });
            }
          });
        }

        if (filter === 'speedrun_mode') {
          allScores.sort((a, b) => (parseFloat(a.time) || 999) - (parseFloat(b.time) || 999));
        } else {
          allScores.sort((a, b) => (parseInt(b.score, 10) || 0) - (parseInt(a.score, 10) || 0));
        }

        if (allScores.length === 0) {
          listContainer.innerHTML = "<div style='text-align:center; font-size:11px; color:#888; padding:20px;'>Kayıt bulunamadı.</div>";
          return;
        }

        allScores.forEach((rec, idx) => {
          const itemRow = document.createElement("div");
          let rankClass = "rank-card";
          if (idx === 0) rankClass += " rank-1";
          else if (idx === 1) rankClass += " rank-2";
          else if (idx === 2) rankClass += " rank-3";

          const valDisplay = (filter === 'speedrun_mode' || rec.modeKey === 'speedrun_mode')
            ? `<b style="color:var(--neon-green); font-size:13px;">⚡ ${parseFloat(rec.time).toFixed(1)} sn</b>` 
            : `<b style="color:var(--neon-green); font-size:13px;">${rec.score} P</b>`;

          itemRow.className = rankClass;
          itemRow.innerHTML = `
            <span><b>${idx+1}.</b> ${rec.avatar || '👤'} ${rec.fullName} <small style="color:var(--neon-gold);">[${rec.modeName}]</small></span>
            ${valDisplay}
          `;
          itemRow.onclick = () => openGameInfoModal(rec);
          listContainer.appendChild(itemRow);
        });
      });
    }

    function openGameInfoModal(rec) {
      document.getElementById("det-user-clickable").innerText = rec.fullName;
      document.getElementById("det-mode-info").innerText = `Mod: ${rec.modeName}`;
      document.getElementById("det-date").innerText = `Tarih: ${rec.date || 'Bilinmiyor'}`;

      document.getElementById("det-user-clickable").onclick = () => {
        document.getElementById("modal-lb-game-info").style.display = "none";
        openPlayerProfile(rec.uid, rec.fullName);
      };

      const dropsBox = document.getElementById("det-drops-list");
      dropsBox.innerHTML = "";
      if (rec.drops && rec.drops.length > 0) {
        rec.drops.forEach(d => {
          dropsBox.innerHTML += `
            <div style="background:#070212; padding:3px 6px; border-radius:4px; display:flex; justify-content:space-between; font-size:9px;">
              <span><b style="color:${d.c || '#fff'};">[${d.tier}]</b> ${d.item}</span>
              <b style="color:var(--neon-green);">+${d.pts}P</b>
            </div>
          `;
        });
      } else {
        dropsBox.innerHTML = "<div style='color:#666; font-size:9px;'>Eşya dökümü yok.</div>";
      }

      document.getElementById("modal-lb-game-info").style.display = "flex";
    }

    function openPlayerProfile(uid, fullName) {
      db.ref("users/" + uid).once("value", snap => {
        const fullUser = snap.val() || {};
        const stats = fullUser.stats || {};
        let totalGames = 0, totalWins = 0, totalLosses = 0;

        const modNames = {
          standard: "Normal Kasa",
          ten_cases: "10 Kutu Modu",
          catch_basket: "Tut & Aç",
          catch_open: "Yakala & Aç",
          mines_mode: "Mayınlı Kasa",
          mega_mode: "Mega Kasa",
          speedrun_mode: "Speedrun",
          temple_mode: "Gizli Tapınak",
          double_mode: "Çift Rulet"
        };

        const box = document.getElementById("prof-modal-stats-list");
        box.innerHTML = "";

        for (let k in modNames) {
          const s = stats[k] || { played: 0, wins: 0, losses: 0, best: 0, bestTime: null };
          totalGames += s.played || 0;
          totalWins += s.wins || 0;
          totalLosses += s.losses || 0;

          const modeWinRate = s.played > 0 ? Math.round((s.wins / s.played) * 100) : 0;
          const recVal = k === 'speedrun_mode' 
            ? (s.bestTime ? `${s.bestTime}s` : "-") 
            : `${s.best || 0} P`;

          box.innerHTML += `
            <div class="rank-card" style="font-size:9px; min-height:36px; padding:4px 8px; margin-bottom:3px;">
              <div>
                <b>${modNames[k]}</b> <span style="color:#94a3b8;">(${s.played} Maç)</span><br>
                <small style="color:var(--neon-green);">Oran: %${modeWinRate}</small> <small style="color:#94a3b8;">(${s.wins}G / ${s.losses || 0}M)</small>
              </div>
              <b style="color:var(--neon-gold);">${recVal}</b>
            </div>
          `;
        }

        document.getElementById("prof-modal-avatar").innerText = fullUser.avatar || "👤";
        document.getElementById("prof-modal-name").innerText = fullName;
        document.getElementById("prof-modal-title").innerText = `[${fullUser.title || 'Çaylak'}]`;
        document.getElementById("prof-modal-created").innerText = `Hesap: ${fullUser.createdAt || '-'}`;
        document.getElementById("prof-modal-played").innerText = totalGames;
        document.getElementById("prof-modal-wins").innerText = totalWins;
        document.getElementById("prof-modal-losses").innerText = totalLosses;
        document.getElementById("prof-modal-winrate").innerText = totalGames > 0 ? `%${Math.round((totalWins / totalGames) * 100)}` : "%0";

        document.getElementById("modal-full-profile").style.display = "flex";
      });
    }
  </script>
</body>
</html>
