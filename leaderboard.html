<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Liderlik Tablosu & Sıralama</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="app.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #020617; font-family: system-ui, sans-serif; color: #fff; }

    .lb-layout {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      background: #030712;
      display: flex;
      flex-direction: column;
    }

    .lb-header {
      flex-shrink: 0;
      background: #090d1a;
      border-bottom: 2px solid #1e293b;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .lb-modes-scroll {
      flex-shrink: 0;
      background: #0b1120;
      border-bottom: 1px solid #1e293b;
      display: flex;
      gap: 4px;
      padding: 5px 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .lb-modes-scroll::-webkit-scrollbar { display: none; }

    .lb-chip {
      flex: 0 0 auto;
      padding: 4px 8px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 8px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }
    .lb-chip.active { background: #4338ca; border-color: var(--neon-gold); color: #fff; }

    .lb-list-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .lb-list-area::-webkit-scrollbar { width: 3px; }
    .lb-list-area::-webkit-scrollbar-thumb { background: #3b1d6e; border-radius: 4px; }

    .rank-item-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 8.5px;
    }
  </style>
</head>
<body>
  <div class="lb-layout">
    
    <!-- Üst Başlık -->
    <div class="lb-header">
      <a href="menu.html" class="icon-btn" style="border-color:var(--danger); padding:2px 8px; font-size:9.5px; text-decoration:none;">‹ Lobi</a>
      <div style="font-weight:900; font-size:11px; color:#38bdf8;">🏆 Liderlik Sıralamaları</div>
      <div id="lbl-my-current-score" style="font-size:8.5px; color:var(--neon-gold); font-weight:bold;">Durumum: -</div>
    </div>

    <!-- Mod Kategorileri Şeridi -->
    <div class="lb-modes-scroll">
      <button type="button" class="lb-chip active" id="chip-all_top3" onclick="switchLBMode('all_top3')">🌟 Genel (Tümü)</button>
      <button type="button" class="lb-chip" id="chip-standard" onclick="switchLBMode('standard')">⚔️ Normal Kasa</button>
      <button type="button" class="lb-chip" id="chip-catch_open" onclick="switchLBMode('catch_open')">🎯 Yakala & Aç</button>
      <button type="button" class="lb-chip" id="chip-mines_mode" onclick="switchLBMode('mines_mode')">💣 Mayın Tarlası</button>
      <button type="button" class="lb-chip" id="chip-speedrun_mode" onclick="switchLBMode('speedrun_mode')">⚡ Speedrun (Süre)</button>
      <button type="button" class="lb-chip" id="chip-double_mode" onclick="switchLBMode('double_mode')">🎰 Çift Rulet</button>
    </div>

    <!-- Sıralama Listesi -->
    <div class="lb-list-area" id="leaderboard-container">
      <div style="color:#64748b; font-size:8px; text-align:center; padding:15px;">Sıralama yükleniyor...</div>
    </div>

  </div>

  <script>
    let currentMode = 'all_top3';

    // Speedrun süresini ondalıklı saniyeye çeviren yardımcı fonksiyon
    function formatSpeedrunTime(val) {
      let num = parseFloat(val) || 0;
      if (num <= 0) return "-";
      // Eğer süre 100'den büyük geliyorsa milisaniyedir (örn: 11330 ms veya 1133 ms)
      if (num > 100) {
        num = num / 100; // veya 1000'e göre ölçekle
        if (num > 100) num = num / 10;
      }
      return num.toFixed(1) + "s";
    }

    window.onload = () => {
      switchLBMode('all_top3');
    };

    function switchLBMode(modeKey) {
      currentMode = modeKey;
      document.querySelectorAll(".lb-chip").forEach(c => c.classList.remove("active"));
      const activeEl = document.getElementById(`chip-${modeKey}`);
      if (activeEl) activeEl.classList.add("active");

      loadLeaderboard(modeKey);
    }

    function loadLeaderboard(modeKey) {
      const container = document.getElementById("leaderboard-container");
      container.innerHTML = "<div style='color:#64748b; font-size:8px; text-align:center; padding:15px;'>Yükleniyor...</div>";

      const u = getActiveUser();
      const myUID = u ? String(u.uid || u.name).replace(/[.#$\[\]]/g, "_") : "";

      if (!db) {
        container.innerHTML = "<div style='color:var(--danger); font-size:8px; text-align:center; padding:15px;'>Veritabanı bağlantısı kurulamadı.</div>";
        return;
      }

      db.ref("game_scores").on("value", snap => {
        container.innerHTML = "";
        let rawRecords = [];

        if (snap.exists()) {
          snap.forEach(c => {
            const val = c.val();
            if (typeof val === "object" && val !== null) {
              rawRecords.push(val);
            }
          });
        }

        if (rawRecords.length === 0) {
          container.innerHTML = "<div style='color:#64748b; font-size:8px; text-align:center; padding:15px;'>Kayıtlı skor bulunamadı.</div>";
          document.getElementById("lbl-my-current-score").innerText = "Durumum: -";
          return;
        }

        let userMap = {};

        rawRecords.forEach(s => {
          if (!s || typeof s !== "object") return;
          const uid = String(s.uid || s.username || 'guest').replace(/[.#$\[\]]/g, "_");
          const username = String(s.username || s.name || 'Oyuncu').replace(/true|false/gi, "Oyuncu");
          
          let scoreRaw = s.score !== undefined ? s.score : (s.points !== undefined ? s.points : s.time);
          let score = parseFloat(scoreRaw) || 0;
          let mode = String(s.gameMode || s.mode || 'standard').toLowerCase().trim();

          // Mod isim eşitleme
          if (mode === "normal" || mode === "klasik") mode = "standard";
          if (mode === "catch" || mode === "yakala") mode = "catch_open";
          if (mode === "mines" || mode === "mayin") mode = "mines_mode";
          if (mode === "speedrun") mode = "speedrun_mode";
          if (mode === "double" || mode === "rulet") mode = "double_mode";

          if (!userMap[uid]) {
            userMap[uid] = {
              name: username,
              avatar: s.avatar || '👤',
              title: s.title || 'Çaylak',
              modeScores: {}
            };
          }

          if (mode === 'speedrun_mode') {
            if (score > 0) {
              if (!userMap[uid].modeScores[mode] || score < userMap[uid].modeScores[mode]) {
                userMap[uid].modeScores[mode] = score;
              }
            }
          } else {
            if (!userMap[uid].modeScores[mode] || score > userMap[uid].modeScores[mode]) {
              userMap[uid].modeScores[mode] = score;
            }
          }
        });

        let list = Object.keys(userMap).map(uid => {
          const d = userMap[uid];
          const std = d.modeScores['standard'] || 0;
          const catchOp = d.modeScores['catch_open'] || 0;
          const mines = d.modeScores['mines_mode'] || 0;
          const top3Total = std + catchOp + mines;

          return {
            uid: uid,
            name: d.name,
            avatar: d.avatar,
            title: d.title,
            stdScore: std,
            catchScore: catchOp,
            minesScore: mines,
            top3Total: top3Total,
            modeScore: d.modeScores[modeKey] || 0
          };
        });

        if (modeKey === 'all_top3') {
          list = list.filter(item => item.top3Total > 0);
          list.sort((a, b) => b.top3Total - a.top3Total);
        } else if (modeKey === 'speedrun_mode') {
          list = list.filter(item => item.modeScore > 0);
          list.sort((a, b) => a.modeScore - b.modeScore);
        } else {
          list = list.filter(item => item.modeScore > 0);
          list.sort((a, b) => b.modeScore - a.modeScore);
        }

        const myItem = list.find(l => l.uid === myUID);
        if (myItem) {
          if (modeKey === 'all_top3') {
            document.getElementById("lbl-my-current-score").innerText = `Toplam: ${myItem.top3Total} P`;
          } else if (modeKey === 'speedrun_mode') {
            document.getElementById("lbl-my-current-score").innerText = `Sürem: ${formatSpeedrunTime(myItem.modeScore)}`;
          } else {
            document.getElementById("lbl-my-current-score").innerText = `Puanım: ${myItem.modeScore} P`;
          }
        } else {
          document.getElementById("lbl-my-current-score").innerText = `Durumum: -`;
        }

        if (list.length === 0) {
          container.innerHTML = "<div style='color:#64748b; font-size:8px; text-align:center; padding:15px;'>Bu kategoride henüz skor kaydedilmemiş.</div>";
          return;
        }

        list.slice(0, 50).forEach((item, idx) => {
          const isMe = item.uid === myUID;
          const div = document.createElement("div");
          div.className = "rank-item-card";
          if (isMe) div.style.borderColor = "var(--neon-gold)";

          let rankBadge = `#${idx + 1}`;
          if (idx === 0) rankBadge = "🥇 1.";
          else if (idx === 1) rankBadge = "🥈 2.";
          else if (idx === 2) rankBadge = "🥉 3.";

          if (modeKey === 'all_top3') {
            div.innerHTML = `
              <div style="display:flex; align-items:center; gap:5px;">
                <span style="font-weight:bold; color:#38bdf8; width:22px;">${rankBadge}</span>
                <span>${item.avatar}</span>
                <div>
                  <b style="color:#fff;">${item.name}</b>
                  <div style="color:#94a3b8; font-size:6.5px;">
                    ⚔️ Normal: <span style="color:#38bdf8;">${item.stdScore}</span> | 
                    🎯 Yakala: <span style="color:#c084fc;">${item.catchScore}</span> | 
                    💣 Mayın: <span style="color:#f87171;">${item.minesScore}</span>
                  </div>
                </div>
              </div>
              <div style="text-align:right;">
                <div style="font-weight:900; color:var(--neon-green); font-size:10.5px;">${item.top3Total} P</div>
                <small style="color:#64748b; font-size:6px;">Genel Toplam</small>
              </div>
            `;
          } else if (modeKey === 'speedrun_mode') {
            div.innerHTML = `
              <div style="display:flex; align-items:center; gap:5px;">
                <span style="font-weight:bold; color:#38bdf8; width:22px;">${rankBadge}</span>
                <span>${item.avatar}</span>
                <div>
                  <b>${item.name}</b>
                  <div style="color:#94a3b8; font-size:6.5px;">${item.title}</div>
                </div>
              </div>
              <div style="font-weight:bold; color:var(--neon-gold); font-size:10px;">⚡ ${formatSpeedrunTime(item.modeScore)}</div>
            `;
          } else {
            div.innerHTML = `
              <div style="display:flex; align-items:center; gap:5px;">
                <span style="font-weight:bold; color:#38bdf8; width:22px;">${rankBadge}</span>
                <span>${item.avatar}</span>
                <div>
                  <b>${item.name}</b>
                  <div style="color:#94a3b8; font-size:6.5px;">${item.title}</div>
                </div>
              </div>
              <div style="font-weight:bold; color:var(--neon-green); font-size:10px;">${item.modeScore} P</div>
            `;
          }

          container.appendChild(div);
        });
      }, err => {
        container.innerHTML = `<div style='color:var(--danger); font-size:8px; text-align:center; padding:15px;'>Hata: ${err.message}</div>`;
      });
    }
  </script>
</body>
</html>
