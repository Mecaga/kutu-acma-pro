<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Liderlik Tablosu & Sıralama</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #020617; font-family: system-ui, sans-serif; color: #fff; }

    .lb-layout {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      background: #030712;
      display: flex;
      flex-direction: column;
    }

    .lb-header {
      flex-shrink: 0;
      background: #090d1a;
      border-bottom: 2px solid #1e293b;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .lb-modes-scroll {
      flex-shrink: 0;
      background: #0b1120;
      border-bottom: 1px solid #1e293b;
      display: flex;
      gap: 3px;
      padding: 4px 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .lb-modes-scroll::-webkit-scrollbar { display: none; }

    .lb-chip {
      flex: 0 0 auto;
      padding: 3px 7px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 7.5px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }
    .lb-chip.active { background: #4338ca; border-color: var(--neon-gold); color: #fff; }

    .lb-list-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .rank-item-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 5px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 8.5px;
    }
  </style>
</head>
<body>
  <div class="lb-layout">
    
    <!-- Üst Başlık -->
    <div class="lb-header">
      <a href="menu.html" class="icon-btn" style="border-color:var(--danger); padding:2px 8px; font-size:9.5px; text-decoration:none;">‹ Lobi</a>
      <div style="font-weight:900; font-size:11px; color:#38bdf8;">🏆 Liderlik Sıralamaları</div>
      <div id="lbl-my-current-score" style="font-size:8px; color:var(--neon-gold);">Puanım: 0</div>
    </div>

    <!-- Mod Kategorileri Şeridi -->
    <div class="lb-modes-scroll">
      <!-- 4'lü Ana Mod Toplamı -->
      <button type="button" class="lb-chip active" id="chip-all_top4" onclick="switchLBMode('all_top4')">🌟 Tümü (4 Ana Mod)</button>
      
      <!-- Özel Oyun Modları -->
      <button type="button" class="lb-chip" id="chip-standard" onclick="switchLBMode('standard')">⚔️ Normal Mod</button>
      <button type="button" class="lb-chip" id="chip-ten_cases" onclick="switchLBMode('ten_cases')">📦 10 Kutu</button>
      <button type="button" class="lb-chip" id="chip-catch_basket" onclick="switchLBMode('catch_basket')">🧺 Tut & Aç</button>
      <button type="button" class="lb-chip" id="chip-catch_open" onclick="switchLBMode('catch_open')">🎯 Yakala & Aç</button>
      <button type="button" class="lb-chip" id="chip-mines_mode" onclick="switchLBMode('mines_mode')">💣 Mayınlı Kasa</button>
      <button type="button" class="lb-chip" id="chip-mega_mode" onclick="switchLBMode('mega_mode')">💎 Mega Kasa</button>
      <button type="button" class="lb-chip" id="chip-speedrun_mode" onclick="switchLBMode('speedrun_mode')">⚡ Speedrun</button>
      <button type="button" class="lb-chip" id="chip-temple_mode" onclick="switchLBMode('temple_mode')">🏛️ Gizli Tapınak</button>
      <button type="button" class="lb-chip" id="chip-double_mode" onclick="switchLBMode('double_mode')">🎰 Çift Rulet</button>
      <button type="button" class="lb-chip" id="chip-wheel_mode" onclick="switchLBMode('wheel_mode')">🎡 Çarkıfelek</button>
      <button type="button" class="lb-chip" id="chip-scratch_mode" onclick="switchLBMode('scratch_mode')">🪙 Kazı Kazan</button>

      <!-- Eğlence & Birleştirme Modu -->
      <button type="button" class="lb-chip" id="chip-merge_mode" onclick="switchLBMode('merge_mode')">♾️ Birleştirme (Merge)</button>
    </div>

    <!-- Sıralama Listesi -->
    <div class="lb-list-area" id="leaderboard-container">
      <div style="color:#64748b; font-size:8px; text-align:center; padding:15px;">Sıralama yükleniyor...</div>
    </div>

  </div>

  <script src="app.js"></script>
  <script>
    let currentMode = 'all_top4';

    window.onload = () => {
      switchLBMode('all_top4');
    };

    function switchLBMode(modeKey) {
      currentMode = modeKey;
      document.querySelectorAll(".lb-chip").forEach(c => c.classList.remove("active"));
      const activeEl = document.getElementById(`chip-${modeKey}`);
      if (activeEl) activeEl.classList.add("active");

      loadLeaderboard(modeKey);
    }

    function loadLeaderboard(modeKey) {
      const container = document.getElementById("leaderboard-container");
      container.innerHTML = "<div style='color:#64748b; font-size:8px; text-align:center; padding:15px;'>Yükleniyor...</div>";

      const u = getActiveUser();
      const myUID = u ? String(u.uid).replace(/[.#$\[\]]/g, "_") : "";

      db.ref("scores").once("value").then(snap => {
        container.innerHTML = "";
        if (!snap.exists()) {
          container.innerHTML = "<div style='color:#64748b; font-size:8px; text-align:center; padding:15px;'>Kayıtlı skor bulunamadı.</div>";
          return;
        }

        let userMap = {};

        snap.forEach(child => {
          const s = child.val();
          const uid = s.uid || child.key;

          if (!userMap[uid]) {
            userMap[uid] = {
              name: s.username || 'Oyuncu',
              avatar: s.avatar || '👤',
              title: s.title || 'Çaylak',
              top4Total: 0,
              modeScores: {}
            };
          }

          const pts = parseInt(s.score, 10) || 0;
          const gameMode = s.gameMode || 'standard';

          // Mod skorunu güncelle
          if (!userMap[uid].modeScores[gameMode] || pts > userMap[uid].modeScores[gameMode]) {
            userMap[uid].modeScores[gameMode] = pts;
          }
        });

        // Skorları Listele ve Hesapla
        let list = Object.keys(userMap).map(uid => {
          const d = userMap[uid];
          // Tümü kategorisi: Sadece Normal, 10 Kutu, Mayınlı ve Mega toplamı
          const top4 = (d.modeScores['standard'] || 0) + (d.modeScores['ten_cases'] || 0) + (d.modeScores['mines_mode'] || 0) + (d.modeScores['mega_mode'] || 0);
          
          let displayScore = 0;
          if (modeKey === 'all_top4') displayScore = top4;
          else displayScore = d.modeScores[modeKey] || 0;

          return {
            uid: uid,
            name: d.name,
            avatar: d.avatar,
            title: d.title,
            score: displayScore
          };
        });

        list.sort((a, b) => b.score - a.score);

        // Kendi Puanını Üstte Göster
        const myItem = list.find(l => l.uid === myUID);
        document.getElementById("lbl-my-current-score").innerText = `Puanım: ${myItem ? myItem.score : 0} P`;

        if (list.length === 0 || list.every(l => l.score === 0)) {
          container.innerHTML = "<div style='color:#64748b; font-size:8px; text-align:center; padding:15px;'>Bu modda henüz skor kaydedilmemiş.</div>";
          return;
        }

        list.slice(0, 50).forEach((item, idx) => {
          if (item.score <= 0 && modeKey !== 'all_top4') return;
          const isMe = item.uid === myUID;

          const div = document.createElement("div");
          div.className = "rank-item-card";
          if (isMe) div.style.borderColor = "var(--neon-gold)";

          let rankBadge = `#${idx+1}`;
          if (idx === 0) rankBadge = "🥇 1.";
          else if (idx === 1) rankBadge = "🥈 2.";
          else if (idx === 2) rankBadge = "🥉 3.";

          div.innerHTML = `
            <div style="display:flex; align-items:center; gap:4px;">
              <span style="font-weight:bold; color:#38bdf8; width:22px;">${rankBadge}</span>
              <span>${item.avatar}</span>
              <b>${item.name}</b>
              <span style="color:#94a3b8; font-size:6.5px;">(${item.title})</span>
            </div>
            <div style="font-weight:bold; color:var(--neon-green); font-size:9.5px;">${item.score} P</div>
          `;
          container.appendChild(div);
        });
      });
    }
  </script>
</body>
</html>
