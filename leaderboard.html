<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sıralama Tablosu</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="lobby-header">
      <a href="menu.html" class="btn-sm" style="background:var(--neon-purple);">‹ Lobi</a>
      <div style="font-weight:bold; font-size:12px;">🏆 Sıralama Tablosu</div>
      <div></div>
    </div>

    <div style="padding: 10px 14px; flex:1; overflow-y:auto;">
      <div class="mode-card">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Oyuncu</th>
              <th>Unvan</th>
              <th>Seviye</th>
            </tr>
          </thead>
          <tbody id="lb-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    window.onload = () => {
      db.ref("registered_users").orderByChild("level").limitToLast(20).on("value", snap => {
        let b = document.getElementById("lb-rows");
        b.innerHTML = "";
        let list = [];
        snap.forEach(c => list.push(c.val()));
        list.reverse();

        list.forEach((p, i) => {
          b.innerHTML += `
            <tr>
              <td style="font-weight:bold; color:var(--neon-purple);">${i + 1}</td>
              <td>${p.fullName}</td>
              <td style="color:#c084fc;">[${p.title}]</td>
              <td style="font-weight:bold; color:var(--gold);">Lvl ${p.level || 1}</td>
            </tr>
          `;
        });
      });
    };
  </script>
</body>
</html>
