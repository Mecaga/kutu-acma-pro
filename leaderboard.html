<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liderlik Tablosu & Sıralama</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-standard">
  <div class="app-container">
    
    <div class="top-header">
      <a href="menu.html" class="icon-btn" style="border-color:var(--danger); text-decoration:none;">‹ Lobi</a>
      <div style="font-weight:bold; font-size:14px; color:var(--neon-blue);">🏆 Liderlik Tablosu</div>
      <div id="lbl-my-score" style="font-size:11px; color:var(--neon-gold);">Puanım: 0 P</div>
    </div>

    <div style="display:flex; gap:4px; overflow-x:auto; padding:6px 0; scrollbar-width:none;" id="lb-chips-bar">
      <button class="icon-btn active" id="chip-all_top3" onclick="selectLBMode('all_top3')">🌟 Tümü</button>
      <button class="icon-btn" id="chip-standard" onclick="selectLBMode('standard')">📦 Klasik</button>
      <button class="icon-btn" id="chip-ten_cases" onclick="selectLBMode('ten_cases')">📦🔟 10 Kutu</button>
      <button class="icon-btn" id="chip-catch_basket" onclick="selectLBMode('catch_basket')">🧺 Tut & Aç</button>
      <button class="icon-btn" id="chip-catch_open" onclick="selectLBMode('catch_open')">🎯 Yakala & Aç</button>
      <button class="icon-btn" id="chip-mines_mode" onclick="selectLBMode('mines_mode')">💣 Mayınlı Kasa</button>
      <button class="icon-btn" id="chip-speedrun_mode" onclick="selectLBMode('speedrun_mode')">⚡ Speedrun</button>
      <button class="icon-btn" id="chip-double_mode" onclick="selectLBMode('double_mode')">🎰 Çift Rulet</button>
      <button class="icon-btn" id="chip-guess_mode" onclick="selectLBMode('guess_mode')">🔮 Kasa Tahmin</button>
      <button class="icon-btn" id="chip-farm_mode" onclick="selectLBMode('farm_mode')">🌾 Çiftlik</button>
    </div>

    <div class="leaderboard-list" id="lb-container" style="margin-top:10px;">
      <div style="text-align:center; color:#64748b; padding:20px;">Yükleniyor...</div>
    </div>

  </div>

  <script src="app.js"></script>
  <script>
    let currentMode = 'all_top3';

    window.onload = () => {
      selectLBMode('all_top3');
    };

    function selectLBMode(modeKey) {
      currentMode = modeKey;
      document.querySelectorAll("#lb-chips-bar button").forEach(b => b.classList.remove("active"));
      const target = document.getElementById(`chip-${modeKey}`);
      if (target) target.classList.add("active");

      loadLeaderboardData(modeKey);
    }

    function loadLeaderboardData(modeKey) {
      const container = document.getElementById("lb-container");
      container.innerHTML = "<div style='text-align:center; color:#64748b; padding:20px;'>Skorlar getiriliyor...</div>";

      const u = getActiveUser();
      const myUID = u ? String(u.uid).replace(/[.#$\[\]]/g, "_") : "";

      Promise.all([
        db.ref("game_scores").once("value"),
        db.ref("scores").once("value")
      ]).then(([snap1, snap2]) => {
        container.innerHTML = "";
        let raw = [];

        if (snap1.exists()) snap1.forEach(c => raw.push(c.val()));
        if (snap2.exists()) snap2.forEach(c => raw.push(c.val()));

        if (raw.length === 0) {
          container.innerHTML = "<div style='text-align:center; color:#64748b; padding:20px;'>Henüz kayıtlı skor bulunmuyor.</div>";
          return;
        }

        let users = {};

        raw.forEach(s => {
          if (!s) return;
          const uid = String(s.uid || s.username || 'guest').replace(/[.#$\[\]]/g, "_");
          const name = s.username || s.name || 'Oyuncu';
          const pts = parseInt(s.score || s.points, 10) || 0;
          const mode = s.gameMode || s.mode || 'standard';

          if (!users[uid]) {
            users[uid] = {
              name: name,
              avatar: s.avatar || '👤',
              title: s.title || 'Çaylak',
              scores: {}
            };
          }

          if (!users[uid].scores[mode] || pts > users[uid].scores[mode]) {
            users[uid].scores[mode] = pts;
          }
        });

        let list = Object.keys(users).map(uid => {
          const d = users[uid];
          const top3Total = (d.scores['standard'] || 0) + (d.scores['ten_cases'] || 0) + (d.scores['mines_mode'] || 0);

          let displayScore = 0;
          if (modeKey === 'all_top3') displayScore = top3Total;
          else displayScore = d.scores[modeKey] || 0;

          return {
            uid: uid,
            name: d.name,
            avatar: d.avatar,
            title: d.title,
            score: displayScore
          };
        });

        list.sort((a, b) => b.score - a.score);

        const myItem = list.find(l => l.uid === myUID);
        document.getElementById("lbl-my-score").innerText = `Puanım: ${myItem ? myItem.score : 0} P`;

        list.slice(0, 50).forEach((item, idx) => {
          if (item.score <= 0 && modeKey !== 'all_top3') return;
          const isMe = item.uid === myUID;

          const card = document.createElement("div");
          card.className = "rank-card" + (isMe ? " my-rank" : "");

          let badge = `#${idx + 1}`;
          if (idx === 0) badge = "🥇 1.";
          else if (idx === 1) badge = "🥈 2.";
          else if (idx === 2) badge = "🥉 3.";

          card.innerHTML = `
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="rank-pos">${badge}</span>
              <span style="font-size:18px;">${item.avatar}</span>
              <div>
                <div style="font-weight:bold; font-size:12px;">${item.name}</div>
                <div style="font-size:9px; color:#94a3b8;">${item.title}</div>
              </div>
            </div>
            <div style="font-weight:bold; color:var(--neon-green); font-size:13px;">${item.score} P</div>
          `;
          container.appendChild(card);
        });
      });
    }
  </script>
</body>
</html>
