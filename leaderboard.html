<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liderlik Tablosu</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <header>
        <div class="user-meta"><span style="font-weight: bold;" id="p-name"></span></div>
        <div>💰 <span id="p-coins" style="color:var(--gold); font-weight:bold;"></span> Altın</div>
    </header>

    <nav>
        <a href="menu.html">🏠 Menü</a>
        <a href="game1.html">📦 Kutu Açma</a>
        <a href="pvp.html">⚔️ 1v1 Arena</a>
        <a href="chat.html">💬 Sohbet</a>
        <a href="leaderboard.html" class="active">🏆 Sıralama</a>
        <a href="user.html">👤 Profil</a>
    </nav>

    <main>
        <h2>🏆 En İyi Oyuncular</h2>
        <div class="card" style="margin-top: 15px;">
            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr style="border-bottom: 1px solid var(--border); color: var(--gold);">
                        <th style="padding: 8px;">#</th>
                        <th style="padding: 8px;">Oyuncu</th>
                        <th style="padding: 8px;">Seviye</th>
                        <th style="padding: 8px;">Altın</th>
                    </tr>
                </thead>
                <tbody id="board-rows"></tbody>
            </table>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        window.onload = () => {
            updateGlobalHeader();
            db.ref("leaderboard").orderByChild("level").limitToLast(10).on("value", snap => {
                let tbody = document.getElementById("board-rows");
                tbody.innerHTML = "";
                let list = [];
                snap.forEach(c => list.push(c.val()));
                list.reverse(); // En yüksek seviye en üstte

                list.forEach((p, idx) => {
                    tbody.innerHTML += `
                        <tr style="border-bottom: 1px solid #21262d;">
                            <td style="padding: 8px; font-weight:bold;">${idx + 1}</td>
                            <td style="padding: 8px;">${p.name}</td>
                            <td style="padding: 8px;"><span class="badge">Lvl ${p.level}</span></td>
                            <td style="padding: 8px; color:var(--gold);">${p.coins}</td>
                        </tr>
                    `;
                });
            });
        };
    </script>
</body>
</html>
