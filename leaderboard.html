<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sıralama Tablosu</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="top-header">
      <a href="menu.html" class="icon-btn" style="border-color:var(--danger);">‹ Lobi</a>
      <div style="font-weight:bold; font-size:12px;">🏆 Sıralama Tablosu</div>
      <div></div>
    </div>

    <!-- Mod Filtre Sekmeleri -->
    <div style="display:flex; gap:4px; overflow-x:auto; padding-bottom:4px; margin-bottom:8px;">
      <button class="icon-btn" id="flt-all" style="background:var(--btn-blue);" onclick="loadLB('all', this)">Tümü</button>
      <button class="icon-btn" onclick="loadLB('standard', this)">Normal</button>
      <button class="icon-btn" onclick="loadLB('ten_cases', this)">10 Kutu</button>
      <button class="icon-btn" onclick="loadLB('catch_open', this)">Yakala & Aç</button>
      <button class="icon-btn" onclick="loadLB('upgrade_mode', this)">Şans Yükseltme</button>
      <button class="icon-btn" onclick="loadLB('mines_mode', this)">Mayın</button>
    </div>

    <div id="lb-records-list" style="flex:1; overflow-y:auto; display:flex; flex-direction:column;"></div>
  </div>

  <!-- Profil & Detay Modalı -->
  <div id="modal-lb-profile" class="modal-overlay">
    <div class="modal-card">
      <div style="text-align:center;">
        <div style="font-size:36px;">👤</div>
        <h3 id="lb-prof-name" style="color:var(--neon-blue);">Oyuncu</h3>
        <div id="lb-prof-title" style="color:var(--neon-gold); font-size:11px; margin-bottom:6px;">[Çaylak]</div>
      </div>

      <div style="background:#050a14; padding:8px; border-radius:6px; font-size:11px; margin-bottom:8px; line-height:1.8;">
        <div><b>Oynanan Mod:</b> <span id="lb-prof-mode" style="color:var(--neon-gold);">Normal Kasa</span></div>
        <div><b>Oynanma Tarihi:</b> <span id="lb-prof-date" style="color:#94a3b8;">-</span></div>
        <div><b>Toplam Oyun:</b> <span id="lb-prof-played">0</span></div>
        <div><b>Kazanma Oranı:</b> <span id="lb-prof-winrate">%100</span></div>
      </div>

      <div style="font-size:10px; font-weight:bold; color:#fff; margin-bottom:4px;">📦 Çıkan Eşyalar:</div>
      <div id="lb-prof-drops" style="max-height:120px; overflow-y:auto; display:flex; flex-direction:column; gap:3px; margin-bottom:10px;"></div>

      <!-- Kendi Profilimizde Gizlenen Butonlar -->
      <div id="lb-prof-actions" style="display:flex; gap:4px;">
        <button id="btn-lb-add" class="btn-start" style="flex:1; background:var(--neon-green); font-size:11px; padding:8px;">➕ Arkadaş Ekle</button>
        <button id="btn-lb-msg" class="btn-start" style="flex:1; background:var(--btn-blue); font-size:11px; padding:8px;">💬 Mesaj Yaz</button>
      </div>

      <button class="btn-close" onclick="document.getElementById('modal-lb-profile').style.display='none'">Kapat</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let activeFilter = 'all';

    window.onload = () => {
      loadLB('all', document.getElementById("flt-all"));
    };

    function loadLB(filter, btn) {
      if (btn) {
        document.querySelectorAll(".icon-btn").forEach(b => b.style.background = "#1b263b");
        btn.style.background = "var(--btn-blue)";
      }
      activeFilter = filter;
      const listContainer = document.getElementById("lb-records-list");
      listContainer.innerHTML = "<div style='text-align:center; font-size:11px; color:#888; padding:15px;'>Yükleniyor...</div>";

      db.ref("leaderboards").once("value", snap => {
        listContainer.innerHTML = "";
        let allScores = [];

        snap.forEach(modeSnap => {
          if (filter === 'all' || modeSnap.key === filter) {
            modeSnap.forEach(userRecord => {
              allScores.push(userRecord.val());
            });
          }
        });

        // En yüksek skora göre sıralama
        allScores.sort((a, b) => b.score - a.score);

        if (allScores.length === 0) {
          listContainer.innerHTML = "<div style='text-align:center; font-size:11px; color:#888; padding:20px;'>Kayıt bulunamadı.</div>";
          return;
        }

        allScores.forEach((rec, idx) => {
          const itemRow = document.createElement("div");
          let rankClass = "rank-card";
          if (idx === 0) rankClass += " rank-1";
          else if (idx === 1) rankClass += " rank-2";
          else if (idx === 2) rankClass += " rank-3";

          itemRow.className = rankClass;
          itemRow.innerHTML = `
            <span><b>${idx+1}.</b> ${rec.fullName} <small style="color:var(--neon-gold);">[${rec.modeName || 'Normal'}]</small></span>
            <b style="color:var(--neon-green); font-size:13px;">${rec.score} P</b>
          `;
          itemRow.onclick = () => openPlayerProfile(rec);
          listContainer.appendChild(itemRow);
        });
      });
    }

    function openPlayerProfile(rec) {
      const u = getActiveUser();
      document.getElementById("lb-prof-name").innerText = rec.fullName;
      document.getElementById("lb-prof-title").innerText = `[${rec.title || 'Çaylak'}]`;
      document.getElementById("lb-prof-mode").innerText = rec.modeName;
      document.getElementById("lb-prof-date").innerText = rec.date || 'Bilinmiyor';

      db.ref("users/" + rec.uid).once("value", snap => {
        const fullUser = snap.val() || {};
        const stats = fullUser.stats || {};
        let totalGames = 0, totalWins = 0;
        for (let k in stats) {
          totalGames += stats[k].played || 0;
          totalWins += stats[k].wins || 0;
        }
        document.getElementById("lb-prof-played").innerText = totalGames;
        document.getElementById("lb-prof-winrate").innerText = totalGames > 0 ? `%${Math.round((totalWins / totalGames) * 100)}` : "%0";
      });

      const dropsBox = document.getElementById("lb-prof-drops");
      dropsBox.innerHTML = "";
      if (rec.drops && rec.drops.length > 0) {
        rec.drops.forEach(d => {
          dropsBox.innerHTML += `
            <div style="background:#070212; padding:3px 6px; border-radius:4px; display:flex; justify-content:space-between; font-size:9px; border:1px solid #3b1d6e;">
              <span><b style="color:${d.c || '#fff'};">[${d.tier}]</b> ${d.item}</span>
              <b style="color:var(--neon-green);">+${d.pts}P</b>
            </div>
          `;
        });
      } else {
        dropsBox.innerHTML = "<div style='color:#666; font-size:9px;'>Kasa dökümü yok.</div>";
      }

      const isMe = u && (rec.uid === u.uid);
      const isDeleted = rec.fullName && rec.fullName.startsWith("deleteUser");
      document.getElementById("lb-prof-actions").style.display = (isMe || isDeleted) ? "none" : "flex";

      if (!isMe && !isDeleted) {
        document.getElementById("btn-lb-add").onclick = () => {
          db.ref(`friend_requests/${rec.uid}/${u.uid}`).set({ fromUID: u.uid, fromName: `${u.name}${u.tag}` });
          alert(`${rec.fullName} kullanıcısına istek gönderildi!`);
        };
        document.getElementById("btn-lb-msg").onclick = () => {
          db.ref(`friends/${u.uid}/${rec.uid}`).set({ fullName: rec.fullName });
          window.location.href = "chat.html";
        };
      }

      document.getElementById("modal-lb-profile").style.display = "flex";
    }
  </script>
</body>
</html>
