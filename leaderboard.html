<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sıralama Tablosu</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="top-header">
      <a href="menu.html" class="icon-btn" style="border-color:var(--danger);">‹ Lobi</a>
      <div style="font-weight:bold; font-size:12px;">🏆 Sıralama Tablosu</div>
      <div></div>
    </div>

    <div style="display:flex; gap:4px; overflow-x:auto; padding-bottom:4px; margin-bottom:8px;">
      <button class="icon-btn" id="flt-all" style="background:var(--btn-blue);" onclick="loadLB('all', this)">Tümü</button>
      <button class="icon-btn" onclick="loadLB('standard', this)">Normal</button>
      <button class="icon-btn" onclick="loadLB('ten_cases', this)">10 Kutu</button>
      <button class="icon-btn" onclick="loadLB('catch_open', this)">Yakala & Aç</button>
      <button class="icon-btn" onclick="loadLB('upgrade_mode', this)">Şans Yükseltme</button>
      <button class="icon-btn" onclick="loadLB('mines_mode', this)">Mayın</button>
      <button class="icon-btn" onclick="loadLB('pvp_mode', this)">PvP</button>
    </div>

    <div id="lb-records-list" style="flex:1; overflow-y:auto; display:flex; flex-direction:column;"></div>
  </div>

  <!-- 1. Oyun Bilgileri Modalı -->
  <div id="modal-lb-game-info" class="modal-overlay">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span style="font-size:10px; color:var(--text-dim);">Oyuncu İsmine Dokunarak Profili Açın:</span>
        <button class="icon-btn" style="border-color:var(--danger); padding:2px 6px;" onclick="closeGameInfoModal()">X</button>
      </div>
      <h3 id="det-user-clickable" style="color:var(--neon-blue); font-size:14px; cursor:pointer; text-decoration:underline; margin-bottom:4px;">Oyuncu#12345</h3>
      <div id="det-mode-info" style="font-size:10px; color:var(--neon-gold); margin-bottom:2px;">Mod: Normal Kasa</div>
      <div id="det-date" style="font-size:9px; color:#94a3b8; margin-bottom:6px;">Tarih: -</div>

      <div style="font-size:10px; font-weight:bold; color:#fff; margin-bottom:4px;">📦 Çıkan Eşyalar:</div>
      <div id="det-drops-list" style="max-height:140px; overflow-y:auto; display:flex; flex-direction:column; gap:3px; margin-bottom:8px;"></div>
    </div>
  </div>

  <!-- 2. Profil Modalı -->
  <div id="modal-full-profile" class="modal-overlay">
    <div class="modal-card panel-theme-profile">
      <div style="text-align:center;">
        <div style="font-size:36px;">👤</div>
        <h3 id="prof-full-name" style="color:var(--neon-blue);">Oyuncu</h3>
        <div id="prof-full-title" style="color:var(--neon-gold); font-size:11px; margin-bottom:6px;">[Çaylak]</div>
      </div>
      <div style="background:#050a14; padding:8px; border-radius:6px; font-size:11px; margin-bottom:8px; line-height:1.8;">
        <div><b>Toplam Oyun:</b> <span id="prof-full-played">0</span></div>
        <div><b>Kazanma Oranı:</b> <span id="prof-full-winrate">%100</span></div>
      </div>
      <div style="font-size:10px; font-weight:bold; color:var(--neon-gold); margin-bottom:4px;">🏆 Mod Rekorları:</div>
      <div id="prof-full-records" style="display:flex; flex-direction:column; gap:3px; max-height:110px; overflow-y:auto; margin-bottom:8px;"></div>
      <button class="btn-close" onclick="closeFullProfileModal()">Kapat</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let activeFilter = 'all';

    window.onload = () => {
      loadLB('all', document.getElementById("flt-all"));
    };

    function loadLB(filter, btn) {
      if (btn) {
        document.querySelectorAll(".icon-btn").forEach(b => b.style.background = "#1b263b");
        btn.style.background = "var(--btn-blue)";
      }
      activeFilter = filter;
      const listContainer = document.getElementById("lb-records-list");
      listContainer.innerHTML = "<div style='text-align:center; font-size:11px; color:#888; padding:15px;'>Yükleniyor...</div>";

      db.ref("leaderboards").once("value", snap => {
        listContainer.innerHTML = "";
        let allScores = [];

        snap.forEach(modeSnap => {
          if (filter === 'all' || modeSnap.key === filter) {
            modeSnap.forEach(userRecord => {
              allScores.push(userRecord.val());
            });
          }
        });

        allScores.sort((a, b) => b.score - a.score);

        if (allScores.length === 0) {
          listContainer.innerHTML = "<div style='text-align:center; font-size:11px; color:#888; padding:20px;'>Kayıt bulunamadı.</div>";
          return;
        }

        allScores.forEach((rec, idx) => {
          const itemRow = document.createElement("div");
          let rankClass = "rank-card";
          if (idx === 0) rankClass += " rank-1";
          else if (idx === 1) rankClass += " rank-2";
          else if (idx === 2) rankClass += " rank-3";

          itemRow.className = rankClass;
          itemRow.innerHTML = `
            <span><b>${idx+1}.</b> ${rec.fullName} <small style="color:var(--neon-gold);">[${rec.modeName || 'Normal'}]</small></span>
            <b style="color:var(--neon-green); font-size:13px;">${rec.score} P</b>
          `;
          itemRow.onclick = () => openGameInfoModal(rec);
          listContainer.appendChild(itemRow);
        });
      });
    }

    function openGameInfoModal(rec) {
      document.getElementById("det-user-clickable").innerText = rec.fullName;
      document.getElementById("det-mode-info").innerText = `Mod: ${rec.modeName}`;
      document.getElementById("det-date").innerText = `Tarih: ${rec.date || 'Bilinmiyor'}`;

      document.getElementById("det-user-clickable").onclick = () => {
        closeGameInfoModal();
        openFullProfile(rec.uid, rec.fullName, rec.title);
      };

      const dropsBox = document.getElementById("det-drops-list");
      dropsBox.innerHTML = "";
      if (rec.drops && rec.drops.length > 0) {
        rec.drops.forEach(d => {
          dropsBox.innerHTML += `
            <div style="background:#070212; padding:3px 6px; border-radius:4px; display:flex; justify-content:space-between; font-size:9px; border:1px solid #3b1d6e;">
              <span><b style="color:${d.c || '#fff'};">[${d.tier}]</b> ${d.item}</span>
              <b style="color:var(--neon-green);">+${d.pts}P</b>
            </div>
          `;
        });
      } else {
        dropsBox.innerHTML = "<div style='color:#666; font-size:9px;'>Kasa dökümü yok.</div>";
      }

      document.getElementById("modal-lb-game-info").style.display = "flex";
    }

    function closeGameInfoModal() { document.getElementById("modal-lb-game-info").style.display = "none"; }

    function openFullProfile(uid, name, title) {
      document.getElementById("prof-full-name").innerText = name;
      document.getElementById("prof-full-title").innerText = `[${title || 'Çaylak'}]`;

      db.ref("users/" + uid).once("value", snap => {
        const fullUser = snap.val() || {};
        const stats = fullUser.stats || {};
        let totalGames = 0, totalWins = 0;
        const recBox = document.getElementById("prof-full-records");
        recBox.innerHTML = "";

        const modLabels = { standard: "Normal", ten_cases: "10 Kutu", catch_open: "Yakala&Aç", upgrade_mode: "Yükselt", mines_mode: "Mayın", pvp_mode: "PvP" };
        for (let k in modLabels) {
          const s = stats[k] || { played: 0, wins: 0, best: 0 };
          totalGames += s.played || 0;
          totalWins += s.wins || 0;
          recBox.innerHTML += `
            <div style="background:#070212; padding:3px 6px; border-radius:4px; display:flex; justify-content:space-between; font-size:9px;">
              <span>${modLabels[k]}: ${s.played} Oyun</span>
              <b style="color:var(--neon-gold);">${s.best} P</b>
            </div>
          `;
        }

        document.getElementById("prof-full-played").innerText = totalGames;
        document.getElementById("prof-full-winrate").innerText = totalGames > 0 ? `%${Math.round((totalWins / totalGames) * 100)}` : "%0";
      });

      document.getElementById("modal-full-profile").style.display = "flex";
    }

    function closeFullProfileModal() { document.getElementById("modal-full-profile").style.display = "none"; }
  </script>
</body>
</html>
