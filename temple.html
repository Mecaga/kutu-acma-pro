<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gizemli Tapınak</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-upgrade_mode">
  <div class="app-container" style="justify-content:space-between;">
    <div>
      <div class="top-header">
        <a href="menu.html" class="icon-btn" style="border-color:var(--danger); z-index:999;">‹ Lobi</a>
        <div style="font-weight:bold; font-size:12px; color:var(--neon-gold);">🏛️ Gizemli Tapınak</div>
        <div id="score-badge" style="color:var(--neon-gold); font-weight:bold; font-size:12px;">0 P</div>
      </div>

      <div class="game-stats-top" style="display:flex; justify-content:space-between; margin-bottom:6px;">
        <div class="stat-card timer" style="border:1px solid #eab308; background:#0d1527; padding:4px 8px; border-radius:8px;">
          <div style="font-size:9px; color:#94a3b8;">AŞAMA</div>
          <div style="font-size:14px; font-weight:bold; color:#facc15;" id="lbl-floor">Kat: 1 / 5</div>
          <div style="font-size:10px; color:#38bdf8;" id="lbl-user-tag">@User</div>
        </div>
        <div class="stat-card score" style="border:1px solid #10b981; background:#0d1527; padding:4px 8px; border-radius:8px; text-align:right;">
          <div style="font-size:9px; color:#94a3b8;">BİRİKEN HAZİNE</div>
          <div style="font-size:14px; font-weight:bold; color:#34d399;" id="lbl-accumulated">0 P</div>
        </div>
      </div>
    </div>

    <!-- Kapı Seçim Alanı (3 Kapı) -->
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#060b17; border-radius:12px; border:1px solid #3b1d6e; margin:6px 0; padding:12px; gap:10px;">
      <div id="temple-status-txt" style="font-size:11px; color:#cbd5e1; text-align:center; font-weight:bold;">
        3 Kapıdan 1'i Tuzak! Güvenli kapıyı seçerek ilerle.
      </div>
      
      <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; width:100%;">
        <div class="mine-card" id="door-0" onclick="chooseDoor(0)" style="height:90px; font-size:26px;">🚪<br><span style="font-size:9px; color:#fbbf24;">1. Kapı</span></div>
        <div class="mine-card" id="door-1" onclick="chooseDoor(1)" style="height:90px; font-size:26px;">🚪<br><span style="font-size:9px; color:#fbbf24;">2. Kapı</span></div>
        <div class="mine-card" id="door-2" onclick="chooseDoor(2)" style="height:90px; font-size:26px;">🚪<br><span style="font-size:9px; color:#fbbf24;">3. Kapı</span></div>
      </div>
    </div>

    <button id="btn-temple-cashout" class="btn-start" style="background:#0284c7;" onclick="cashoutTemple()">💰 Hazineni Al ve Çık</button>

    <div id="summary-overlay" class="modal-overlay">
      <div class="modal-card">
        <div id="sum-title" style="font-size:14px; font-weight:bold; color:var(--neon-gold); text-align:center; margin-bottom:8px;">TAPINAK SONUCU</div>
        <div style="display:flex; justify-content:space-around; margin-bottom:8px; background:#070212; padding:6px; border-radius:6px;">
          <div>Kazanılan: <b id="sum-score" style="color:var(--neon-green);">0 P</b></div>
          <div>Ulaşılan Kat: <b id="sum-floor" style="color:var(--neon-blue);">0</b></div>
        </div>
        <div id="summary-drops-list" style="max-height:140px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; margin-bottom:8px;"></div>
        <div style="display:flex; gap:6px;">
          <button class="icon-btn" style="flex:1; background:var(--btn-blue); justify-content:center;" onclick="location.reload()">🔄 Tekrar</button>
          <a href="menu.html" class="icon-btn" style="flex:1; background:var(--danger); justify-content:center;">🚪 Lobi</a>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let currentFloor = 1;
    let accumulatedScore = 0;
    let trapDoor = Math.floor(Math.random() * 3);
    let drops = [];
    let isGameOver = false;

    const FLOOR_REWARDS = [50, 120, 250, 500, 1000];

    window.onload = () => {
      const u = getActiveUser();
      document.getElementById("lbl-user-tag").innerText = u ? `@${u.name}${u.tag}` : "@Misafir";
    };

    function chooseDoor(doorIdx) {
      if (isGameOver) return;

      if (doorIdx === trapDoor) {
        isGameOver = true;
        document.getElementById(`door-${doorIdx}`).style.background = "#7f1d1d";
        document.getElementById(`door-${doorIdx}`).innerHTML = `💀<br><span style="font-size:8px; color:#fca5a5;">TUZAK!</span>`;
        document.getElementById("btn-temple-cashout").disabled = true;
        accumulatedScore = 0;
        drops = [{ tier: "Tuzak", item: "Tapınak Çöktü (0P)", pts: 0, c: "#ef4444" }];
        setTimeout(() => triggerSummary("💀 TUZAĞA DÜŞTÜN!", false), 1000);
      } else {
        const floorPts = FLOOR_REWARDS[currentFloor - 1];
        accumulatedScore += floorPts;
        drops.push({ tier: `Kat ${currentFloor}`, item: `Tapınak Sandığı (+${floorPts}P)`, pts: floorPts, c: "#fbbf24" });

        document.getElementById(`door-${doorIdx}`).style.background = "#064e3b";
        document.getElementById(`door-${doorIdx}`).innerHTML = `✨<br><span style="font-size:8px; color:#34d399;">+${floorPts}P</span>`;
        document.getElementById("lbl-accumulated").innerText = `${accumulatedScore} P`;
        document.getElementById("score-badge").innerText = `${accumulatedScore} P`;

        if (currentFloor === 5) {
          isGameOver = true;
          setTimeout(() => triggerSummary("👑 BÜYÜK TAPINAK FETHEDİLDİ!", true), 800);
        } else {
          currentFloor++;
          setTimeout(() => {
            resetDoors();
            document.getElementById("lbl-floor").innerText = `Kat: ${currentFloor} / 5`;
          }, 600);
        }
      }
    }

    function resetDoors() {
      trapDoor = Math.floor(Math.random() * 3);
      for (let i = 0; i < 3; i++) {
        const d = document.getElementById(`door-${i}`);
        d.style.background = "#120826";
        d.innerHTML = `🚪<br><span style="font-size:9px; color:#fbbf24;">${i + 1}. Kapı</span>`;
      }
    }

    function cashoutTemple() {
      if (isGameOver) return;
      isGameOver = true;
      triggerSummary("💰 HAZİNEYİ ALIP ÇEKİLDİN", true);
    }

    function triggerSummary(title, isWin) {
      document.getElementById("sum-title").innerText = title;
      document.getElementById("sum-score").innerText = `${accumulatedScore} P`;
      document.getElementById("sum-floor").innerText = `${currentFloor} / 5`;
      const dBox = document.getElementById("summary-drops-list");
      dBox.innerHTML = "";
      drops.forEach(d => {
        dBox.innerHTML += `
          <div style="background:#070212; padding:4px 8px; border-radius:4px; display:flex; justify-content:space-between; font-size:10px;">
            <span>[${d.tier}] ${d.item}</span>
            <b style="color:var(--neon-green);">+${d.pts}P</b>
          </div>
        `;
      });
      document.getElementById("summary-overlay").style.display = "flex";
      recordGameScore('mines_mode', 'Gizemli Tapınak', accumulatedScore, drops, isWin);
    }
  </script>
</body>
</html>
