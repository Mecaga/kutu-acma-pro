<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online PvP & Mini Oyunlar</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-pvp_mode">
  <div class="app-container" style="justify-content:space-between;">
    <div>
      <div class="top-header">
        <a href="menu.html" class="icon-btn" style="border-color:var(--danger); z-index:999;" onclick="leavePvPRoom()">‹ Çıkış</a>
        <div id="pvp-room-tag" style="font-weight:bold; font-size:12px;">⚔️ PvP Arenası</div>
        <div id="pvp-status-badge" style="color:var(--neon-gold); font-weight:bold; font-size:11px;">Oda Seç</div>
      </div>
    </div>

    <div id="pvp-lobby-panel" style="display:flex; flex-direction:column; gap:6px; flex:1; justify-content:center;">
      <div style="font-size:10px; color:var(--text-dim); text-align:center;">1. Oyun Modunu Seç:</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:4px;">
        <button type="button" class="mode-btn" id="m-xox" style="background:var(--btn-blue); font-size:10px; text-align:center;" onclick="setGameType('xox')">⭕❌ Canlı XOX</button>
        <button type="button" class="mode-btn" id="m-std" style="font-size:10px; text-align:center;" onclick="setGameType('standard')">⚔️ Kasa Kapışması</button>
        <button type="button" class="mode-btn" id="m-mega" style="font-size:10px; text-align:center;" onclick="setGameType('mega')">💎 Mega Kasa</button>
        <button type="button" class="mode-btn" id="m-mines" style="font-size:10px; text-align:center;" onclick="setGameType('mines')">💣 Mayın Düellosu</button>
      </div>

      <div id="size-select-section" style="display:none; flex-direction:column; gap:4px; margin-top:4px;">
        <div style="font-size:10px; color:var(--text-dim); text-align:center;">2. Oyuncu Sayısı:</div>
        <div style="display:flex; gap:4px;">
          <button type="button" class="mode-btn" id="btn-p2" style="flex:1; background:var(--btn-blue); text-align:center;" onclick="setRoomSize(2)">1v1</button>
          <button type="button" class="mode-btn" id="btn-p3" style="flex:1; text-align:center;" onclick="setRoomSize(3)">3 Kişi</button>
          <button type="button" class="mode-btn" id="btn-p4" style="flex:1; text-align:center;" onclick="setRoomSize(4)">4 Kişi</button>
        </div>
      </div>

      <button type="button" id="btn-create-room" class="btn-start" style="background:linear-gradient(90deg, #9333ea, #c084fc); margin-top:10px;" onclick="createOnlineRoom()">🔥 4 Haneli Oda Kur</button>

      <div style="display:flex; gap:4px; margin-top:8px;">
        <input type="number" id="in-room-code" class="input-field" style="margin:0; font-size:13px; letter-spacing:2px; font-weight:bold;" placeholder="4 Haneli Kod (Örn: 4821)" maxlength="4">
        <button type="button" id="btn-join-room" class="icon-btn" style="background:var(--neon-green); white-space:nowrap;" onclick="joinOnlineRoom()">Odaya Katıl</button>
      </div>
    </div>

    <div id="pvp-game-panel" style="display:none; flex-direction:column; flex:1; justify-content:space-between;">
      <div style="display:grid; gap:4px; margin-bottom:4px;" id="pvp-players-row"></div>

      <div id="case-mode-container">
        <div style="margin:4px 0;">
          <div style="display:flex; justify-content:space-between; font-size:10px; margin-bottom:2px;">
            <span style="color:var(--neon-blue); font-weight:bold;">📦 Açılacak Kutular:</span>
            <span style="color:var(--neon-gold);" id="lbl-pvp-progress">0 / 5</span>
          </div>
          <div class="pvp-grid-boxes" id="pvp-boxes-grid"></div>
        </div>

        <div class="roulette-container" id="pvp-roulette-box">
          <div class="roulette-needle"></div>
          <div class="roulette-track" id="pvp-roulette-track"></div>
        </div>
      </div>

      <div id="xox-mode-container" style="display:none; flex-direction:column; align-items:center; justify-content:center; flex:1;">
        <div id="xox-turn-indicator" style="font-size:12px; font-weight:bold; color:var(--neon-gold); margin-bottom:8px;">Sıra: Bekleniyor...</div>
        <div id="xox-board" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; width:220px; height:220px;"></div>
      </div>

      <button type="button" id="btn-ready-pvp" class="btn-start" style="background:var(--neon-gold); color:#000; font-weight:900; margin-top:6px;" onclick="toggleReadyPvP()">⚡ HAZIR VER</button>
    </div>

    <div id="pvp-podium-panel" style="display:none; flex-direction:column; flex:1; background:#120826; padding:12px; border-radius:8px; border:2px solid var(--neon-purple); justify-content:space-between;">
      <div>
        <div style="font-size:15px; font-weight:900; color:var(--neon-gold); text-align:center; margin-bottom:4px;">🏆 MAÇ BİTTİ</div>
        <div id="podium-result-msg" style="font-size:13px; font-weight:bold; text-align:center; color:#fff; margin-bottom:8px;"></div>
        <div id="podium-list" style="display:flex; flex-direction:column; gap:4px; max-height:180px; overflow-y:auto;"></div>
      </div>

      <div style="display:flex; gap:6px;">
        <button type="button" id="btn-replay-pvp" class="btn-start" style="flex:1; background:var(--btn-blue);" onclick="voteReplayPvP()">🔄 Tekrar Oyna (<span id="replay-vote-count">0</span>)</button>
        <a href="menu.html" class="btn-start" style="flex:1; background:var(--danger); text-align:center; text-decoration:none; padding:10px;" onclick="leavePvPRoom()">🚪 Çıkış</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>

  <script>
    // 1. TAM VE EKSİKSİZ FIREBASE YAPILANDIRMASI
    const firebaseConfig = {
      apiKey: "AIzaSyBrWRQIsPhQqSuiQkhd47HOmxKvsyT_3wc",
      authDomain: "kutu-acma-pro.firebaseapp.com",
      databaseURL: "https://kutu-acma-pro-default-rtdb.firebaseio.com",
      projectId: "kutu-acma-pro",
      storageBucket: "kutu-acma-pro.firebasestorage.app",
      messagingSenderId: "483395048462",
      appId: "1:483395048462:web:450f18178e682a4a2f985f"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let roomCapacity = 2, totalBoxesPerPlayer = 5, currentRoomCode = null, selectedGameType = 'xox';
    let myOpenedCount = 0, myTotalScore = 0, isMatchPlaying = false, isSpinningSlot = false, isMyReady = false;
    let mySymbol = "X";

    const PVP_TIERS = {
      standard: [
        { name: "Tahta Kılıç", p: 5, c: "#fff" }, { name: "Demir Balta", p: 15, c: "#38bdf8" },
        { name: "Gümüş Yüzük", p: 35, c: "#c084fc" }, { name: "Ejder Kılıcı", p: 100, c: "#f43f5e" }
      ],
      mega: [
        { name: "Mega Kılıç", p: 25, c: "#fff" }, { name: "Safir Zırh", p: 70, c: "#38bdf8" },
        { name: "Kutsal Asa", p: 200, c: "#c084fc" }, { name: "Tanrısal Kama", p: 600, c: "#f43f5e" }
      ],
      mines: [
        { name: "Güvenli Sandık", p: 30, c: "#10b981" }, { name: "Hazine", p: 100, c: "#fbbf24" }, { name: "Bomba!", p: -20, c: "#ef4444" }
      ]
    };

    // OTURUM BİLGİSİNİ AL (app.js / localStorage / fallback)
    function getUserInfo() {
      if (typeof getActiveUser === "function") {
        const u = getActiveUser();
        if (u && u.uid) return u;
      }
      try {
        const s = localStorage.getItem("kutu_active_session");
        if (s) return JSON.parse(s);
      } catch (e) {}

      let guestUID = localStorage.getItem("kutu_pvp_uid");
      if (!guestUID) {
        guestUID = "U" + Math.floor(1000 + Math.random() * 9000);
        localStorage.setItem("kutu_pvp_uid", guestUID);
      }
      return { uid: guestUID, name: "Oyuncu", tag: "#" + guestUID.substring(1) };
    }

    function setGameType(type) {
      selectedGameType = type;
      ['xox', 'std', 'mega', 'mines'].forEach(k => {
        const el = document.getElementById('m-' + k);
        if (el) el.style.background = '#13072b';
      });
      const activeEl = document.getElementById('m-' + type);
      if (activeEl) activeEl.style.background = 'var(--btn-blue)';

      const sizeSec = document.getElementById('size-select-section');
      if (type === 'xox') {
        sizeSec.style.display = 'none';
        roomCapacity = 2;
      } else {
        sizeSec.style.display = 'flex';
      }
    }

    function setRoomSize(num) {
      roomCapacity = num;
      totalBoxesPerPlayer = num === 2 ? 5 : (num === 3 ? 10 : 15);
      [2, 3, 4].forEach(n => {
        const b = document.getElementById(`btn-p${n}`);
        if (b) b.style.background = n === num ? "var(--btn-blue)" : "#13072b";
      });
    }

    // ODA KUR BUTONU
    function createOnlineRoom() {
      const btn = document.getElementById("btn-create-room");
      btn.disabled = true;
      btn.innerText = "⏳ Oda Kuruluyor...";

      const u = getUserInfo();
      const code = String(Math.floor(1000 + Math.random() * 9000));
      currentRoomCode = code;

      const pData = {};
      pData[u.uid] = {
        uid: u.uid,
        fullName: `${u.name}${u.tag}`,
        score: 0,
        opened: 0,
        ready: false,
        wantsReplay: false,
        symbol: "X"
      };

      const roomData = {
        code: code,
        capacity: selectedGameType === 'xox' ? 2 : roomCapacity,
        totalBoxes: totalBoxesPerPlayer,
        gameType: selectedGameType,
        status: "waiting",
        turn: u.uid,
        xoxBoard: ["", "", "", "", "", "", "", "", ""],
        players: pData
      };

      db.ref("pvp_rooms/" + code).set(roomData)
        .then(() => {
          btn.disabled = false;
          btn.innerText = "🔥 4 Haneli Oda Kur";
          listenRoom(code);
        })
        .catch(err => {
          btn.disabled = false;
          btn.innerText = "🔥 4 Haneli Oda Kur";
          alert("Hata: " + err.message);
        });
    }

    // ODAYA KATIL BUTONU
    function joinOnlineRoom() {
      const inputCode = document.getElementById("in-room-code").value.trim();
      if (!inputCode || inputCode.length !== 4) return alert("Lütfen 4 haneli oda numarasını giriniz!");

      const u = getUserInfo();
      const btn = document.getElementById("btn-join-room");
      btn.innerText = "Giriş...";

      db.ref("pvp_rooms/" + inputCode).once("value")
        .then(snap => {
          btn.innerText = "Odaya Katıl";
          const room = snap.val();
          if (!room) return alert("Oda bulunamadı! Numarayı kontrol edin.");

          const players = room.players || {};
          const count = Object.keys(players).length;

          if (count >= room.capacity && !players[u.uid]) {
            return alert("Oda tamamen dolmuş!");
          }

          currentRoomCode = room.code;
          selectedGameType = room.gameType || 'xox';
          totalBoxesPerPlayer = room.totalBoxes || 5;

          return db.ref(`pvp_rooms/${inputCode}/players/${u.uid}`).update({
            uid: u.uid,
            fullName: `${u.name}${u.tag}`,
            score: 0,
            opened: 0,
            ready: false,
            wantsReplay: false,
            symbol: "O"
          }).then(() => {
            listenRoom(inputCode);
          });
        })
        .catch(err => {
          btn.innerText = "Odaya Katıl";
          alert("Bağlantı Hatası: " + err.message);
        });
    }

    // ODA CANLI DİNLEME
    function listenRoom(code) {
      document.getElementById("pvp-lobby-panel").style.display = "none";
      document.getElementById("pvp-game-panel").style.display = "flex";
      document.getElementById("pvp-room-tag").innerText = `Oda #${code} (${selectedGameType.toUpperCase()})`;

      const u = getUserInfo();

      if (selectedGameType === 'xox') {
        document.getElementById("case-mode-container").style.display = "none";
        document.getElementById("xox-mode-container").style.display = "flex";
      } else {
        document.getElementById("case-mode-container").style.display = "block";
        document.getElementById("xox-mode-container").style.display = "none";
      }

      db.ref("pvp_rooms/" + code).on("value", snap => {
        const room = snap.val();
        if (!room) return;

        const pList = Object.values(room.players || {});
        const pRow = document.getElementById("pvp-players-row");
        pRow.style.gridTemplateColumns = `repeat(${room.capacity}, 1fr)`;
        pRow.innerHTML = "";

        let readyCount = 0, replayVotes = 0;

        pList.forEach(p => {
          const isMe = p.uid === u.uid;
          if (isMe) mySymbol = p.symbol || "X";
          if (p.ready) readyCount++;
          if (p.wantsReplay) replayVotes++;

          pRow.innerHTML += `
            <div style="background:#070212; border:1px solid ${isMe ? 'var(--neon-gold)' : '#3b1d6e'}; border-radius:6px; padding:4px 2px; text-align:center;">
              <div style="font-size:8px; font-weight:bold; color:${isMe ? 'var(--neon-gold)' : '#fff'};">${p.fullName} (${p.symbol || '?'})</div>
              <div style="font-size:13px; font-weight:bold; color:var(--neon-green);">${p.score} P</div>
              <div style="font-size:8px; color:${p.ready ? 'var(--neon-green)' : '#94a3b8'};">${p.ready ? '⚡ HAZIR' : 'Bekliyor'}</div>
            </div>
          `;
        });

        const voteBadge = document.getElementById("replay-vote-count");
        if (voteBadge) voteBadge.innerText = `${replayVotes}/${room.capacity}`;

        if (readyCount < room.capacity && room.status === "waiting") {
          document.getElementById("pvp-status-badge").innerText = `⏳ Bekleniyor (${readyCount}/${room.capacity})`;
        } else if (readyCount === room.capacity && room.status === "waiting") {
          db.ref("pvp_rooms/" + code).update({ status: "playing" });
        } else if (room.status === "playing") {
          document.getElementById("pvp-status-badge").innerText = "⚔️ Canlı Maç!";
          document.getElementById("btn-ready-pvp").style.display = "none";
          isMatchPlaying = true;

          if (selectedGameType === 'xox') {
            renderXOXBoard(room);
          } else {
            renderPvPBoxesGrid();
          }
        }

        if (replayVotes === room.capacity && room.status === "finished") resetPvPRound();
      });
    }

    function toggleReadyPvP() {
      isMyReady = !isMyReady;
      const u = getUserInfo();
      db.ref(`pvp_rooms/${currentRoomCode}/players/${u.uid}/ready`).set(isMyReady);
      document.getElementById("btn-ready-pvp").innerText = isMyReady ? "✅ HAZIR GERİ AL" : "⚡ HAZIR VER";
      document.getElementById("btn-ready-pvp").style.background = isMyReady ? "var(--neon-green)" : "var(--neon-gold)";
    }

    function renderXOXBoard(room) {
      const u = getUserInfo();
      const board = room.xoxBoard || ["", "", "", "", "", "", "", "", ""];
      const isMyTurn = room.turn === u.uid;
      const indicator = document.getElementById("xox-turn-indicator");
      indicator.innerText = isMyTurn ? "👉 Sıra Sende!" : "⏳ Rakibin Hamlesi...";
      indicator.style.color = isMyTurn ? "var(--neon-green)" : "var(--neon-gold)";

      const container = document.getElementById("xox-board");
      container.innerHTML = "";

      board.forEach((val, idx) => {
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "icon-btn";
        cell.style.cssText = "width:100%; height:100%; font-size:26px; font-weight:900; border:2px solid #3b1d6e; background:#070212;";
        cell.innerText = val;
        if (val === "X") cell.style.color = "var(--neon-blue)";
        if (val === "O") cell.style.color = "var(--neon-gold)";

        cell.onclick = () => {
          if (!isMyTurn || val !== "" || !isMatchPlaying) return;
          board[idx] = mySymbol;
          
          const pList = Object.keys(room.players || {});
          const nextTurn = pList.find(id => id !== u.uid) || u.uid;

          if (checkXOXWinner(board)) {
            db.ref(`pvp_rooms/${currentRoomCode}/players/${u.uid}/score`).set(100);
            db.ref(`pvp_rooms/${currentRoomCode}`).update({
              xoxBoard: board,
              status: "finished"
            });
            showResultPanel(`${u.name}${u.tag} KAZANDI! 🎉`);
          } else if (board.every(b => b !== "")) {
            db.ref(`pvp_rooms/${currentRoomCode}`).update({
              xoxBoard: board,
              status: "finished"
            });
            showResultPanel("DOSTLUK KAZANDI! (BERABERE) 🤝");
          } else {
            db.ref(`pvp_rooms/${currentRoomCode}`).update({
              xoxBoard: board,
              turn: nextTurn
            });
          }
        };
        container.appendChild(cell);
      });
    }

    function checkXOXWinner(b) {
      const lines = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8],
        [0, 3, 6], [1, 4, 7], [2, 5, 8],
        [0, 4, 8], [2, 4, 6]
      ];
      return lines.some(([x, y, z]) => b[x] && b[x] === b[y] && b[x] === b[z]);
    }

    function renderPvPBoxesGrid() {
      const grid = document.getElementById("pvp-boxes-grid");
      if (grid.children.length > 0) return;

      for (let i = 0; i < totalBoxesPerPlayer; i++) {
        const b = document.createElement("div");
        b.className = "roulette-item";
        b.style.cssText = "width:100%; height:50px; cursor:pointer;";
        b.innerHTML = `<span>📦</span><span style="font-size:7px;">${i+1}</span>`;

        b.onclick = () => {
          if (!isMatchPlaying || isSpinningSlot || b.dataset.opened || myOpenedCount >= totalBoxesPerPlayer) return;
          b.dataset.opened = "1";
          spinSlotForPvP(b);
        };
        grid.appendChild(b);
      }
    }

    function spinSlotForPvP(boxEl) {
      isSpinningSlot = true;
      const track = document.getElementById("pvp-roulette-track");
      const wrap = document.getElementById("pvp-roulette-box");
      track.style.transition = "none";
      track.style.transform = "translateX(0px)";
      track.innerHTML = "";

      const pool = PVP_TIERS[selectedGameType] || PVP_TIERS.standard;
      const totalItems = 25, winIdx = 20;
      let winDrop = null;

      for (let i = 0; i < totalItems; i++) {
        let d = pool[Math.floor(Math.random() * pool.length)];
        if (i === winIdx) winDrop = d;
        track.innerHTML += `
          <div class="roulette-item" style="width:75px; height:75px; border-bottom:3px solid ${d.c};">
            <span style="color:${d.c}; font-size:8px; font-weight:bold;">${d.name}</span>
            <span style="color:var(--neon-green); font-size:9px;">+${d.p}P</span>
          </div>
        `;
      }

      setTimeout(() => {
        track.style.transition = "transform 2.5s cubic-bezier(0.12, 0.8, 0.2, 1)";
        track.style.transform = `translateX(${-(winIdx * 75) + (wrap.offsetWidth / 2) - 37.5}px)`;
      }, 20);

      setTimeout(() => {
        myTotalScore += winDrop.p;
        myOpenedCount++;
        document.getElementById("lbl-pvp-progress").innerText = `${myOpenedCount} / ${totalBoxesPerPlayer}`;
        boxEl.style.background = "#070212";
        boxEl.innerHTML = `<span style="color:${winDrop.c}; font-size:6px;">${winDrop.name}</span><b style="color:var(--neon-green); font-size:8px;">+${winDrop.p}P</b>`;

        const u = getUserInfo();
        db.ref(`pvp_rooms/${currentRoomCode}/players/${u.uid}`).update({
          score: myTotalScore,
          opened: myOpenedCount
        });

        isSpinningSlot = false;
        if (myOpenedCount >= totalBoxesPerPlayer) {
          db.ref(`pvp_rooms/${currentRoomCode}`).update({ status: "finished" });
          showResultPanel("Tüm Kutular Açıldı!");
        }
      }, 2600);
    }

    function showResultPanel(msg) {
      document.getElementById("pvp-game-panel").style.display = "none";
      document.getElementById("pvp-podium-panel").style.display = "flex";
      document.getElementById("podium-result-msg").innerText = msg;
    }

    function voteReplayPvP() {
      const u = getUserInfo();
      db.ref(`pvp_rooms/${currentRoomCode}/players/${u.uid}/wantsReplay`).set(true);
      document.getElementById("btn-replay-pvp").disabled = true;
    }

    function resetPvPRound() {
      myOpenedCount = 0; myTotalScore = 0; isMyReady = false;
      const u = getUserInfo();

      db.ref(`pvp_rooms/${currentRoomCode}/players/${u.uid}`).update({
        score: 0, opened: 0, ready: false, wantsReplay: false
      });

      db.ref(`pvp_rooms/${currentRoomCode}`).update({
        status: "waiting",
        xoxBoard: ["", "", "", "", "", "", "", "", ""]
      });

      document.getElementById("pvp-podium-panel").style.display = "none";
      document.getElementById("pvp-game-panel").style.display = "flex";
      document.getElementById("btn-ready-pvp").style.display = "block";
      document.getElementById("btn-ready-pvp").innerText = "⚡ HAZIR VER";
      document.getElementById("btn-ready-pvp").style.background = "var(--neon-gold)";
      document.getElementById("btn-replay-pvp").disabled = false;
    }

    function leavePvPRoom() {
      if (currentRoomCode) {
        const u = getUserInfo();
        db.ref(`pvp_rooms/${currentRoomCode}/players/${u.uid}`).remove().then(() => {
          db.ref(`pvp_rooms/${currentRoomCode}/players`).once("value", snap => {
            if (!snap.exists() || snap.numChildren() === 0) {
              db.ref(`pvp_rooms/${currentRoomCode}`).remove();
            }
          });
        });
      }
    }
  </script>
</body>
</html>
