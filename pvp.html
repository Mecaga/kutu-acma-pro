<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online PvP Arenası</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-pvp_mode">
  <div class="app-container" style="justify-content:space-between;">
    <div>
      <div class="top-header">
        <a href="menu.html" id="btn-leave-room" class="icon-btn" style="border-color:var(--danger); z-index:999;" onclick="leavePvPRoom()">‹ Çıkış</a>
        <div id="pvp-room-tag" style="font-weight:bold; font-size:12px;">⚔️ PvP Arenası</div>
        <div id="pvp-status-badge" style="color:var(--neon-gold); font-weight:bold; font-size:11px;">Oda Seç</div>
      </div>
    </div>

    <!-- 1. ODA KURMA & KATILMA MENÜSÜ -->
    <div id="pvp-lobby-panel" style="display:flex; flex-direction:column; gap:6px; flex:1; justify-content:center;">
      <div style="font-size:10px; color:var(--text-dim); text-align:center;">1. Kapışma Modunu Seç:</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:4px;">
        <button class="mode-btn" id="m-std" style="background:var(--btn-blue); font-size:10px; text-align:center;" onclick="setGameType('standard')">⚔️ Normal Kasa</button>
        <button class="mode-btn" id="m-mega" style="font-size:10px; text-align:center;" onclick="setGameType('mega')">💎 Mega Kasa</button>
        <button class="mode-btn" id="m-speed" style="font-size:10px; text-align:center;" onclick="setGameType('speedrun')">⚡ Speedrun</button>
        <button class="mode-btn" id="m-mines" style="font-size:10px; text-align:center;" onclick="setGameType('mines')">💣 Mayınlı Kasa</button>
      </div>

      <div style="font-size:10px; color:var(--text-dim); text-align:center; margin-top:4px;">2. Oyuncu Sayısı & Kutu:</div>
      <div style="display:flex; gap:4px;">
        <button class="mode-btn" id="btn-p2" style="flex:1; background:var(--btn-blue); color:#fff; text-align:center;" onclick="setRoomSize(2)">1v1<br><small>(5 Kutu)</small></button>
        <button class="mode-btn" id="btn-p3" style="flex:1; text-align:center;" onclick="setRoomSize(3)">1v1v1<br><small>(10 Kutu)</small></button>
        <button class="mode-btn" id="btn-p4" style="flex:1; text-align:center;" onclick="setRoomSize(4)">1v1v1v1<br><small>(15 Kutu)</small></button>
      </div>

      <button class="btn-start" style="background:linear-gradient(90deg, #9333ea, #c084fc); margin-top:6px;" onclick="createOnlineRoom()">🔥 Oda Kur</button>

      <div style="display:flex; gap:4px; margin-top:8px;">
        <input type="text" id="in-room-code" class="input-field" style="margin:0; font-size:11px;" placeholder="Oda Kodu (Örn: pvp#1234)">
        <button class="icon-btn" style="background:var(--neon-green); white-space:nowrap;" onclick="joinOnlineRoom()">Katıl</button>
      </div>
    </div>

    <!-- 2. CANLI MAÇ ALANI -->
    <div id="pvp-game-panel" style="display:none; flex-direction:column; flex:1; justify-content:space-between;">
      <div style="display:grid; gap:4px; margin-bottom:4px;" id="pvp-players-row"></div>

      <!-- Hızlı Reaksiyonlar -->
      <div style="display:flex; justify-content:center; gap:4px; overflow-x:auto;">
        <button class="icon-btn" onclick="sendQuickAction('🔥')">🔥</button>
        <button class="icon-btn" onclick="sendQuickAction('😎')">😎</button>
        <button class="icon-btn" onclick="sendQuickAction('💀')">💀</button>
        <button class="icon-btn" onclick="sendQuickAction('🎉')">🎉</button>
        <button class="icon-btn" onclick="sendQuickAction('👑')">👑</button>
      </div>

      <div style="margin:4px 0;">
        <div style="display:flex; justify-content:space-between; font-size:10px; margin-bottom:2px;">
          <span style="color:var(--neon-blue); font-weight:bold;" id="lbl-pvp-modename">📦 Kutularınız:</span>
          <span style="color:var(--neon-gold);" id="lbl-pvp-progress">0 / 5</span>
        </div>
        <div class="pvp-grid-boxes" id="pvp-boxes-grid"></div>
      </div>

      <div>
        <div class="roulette-container" id="pvp-roulette-box">
          <div class="roulette-needle"></div>
          <div class="roulette-track" id="pvp-roulette-track"></div>
        </div>
        <button id="btn-ready-pvp" class="btn-start" style="background:var(--neon-gold); color:#000; font-weight:900;" onclick="toggleReadyPvP()">⚡ HAZIR VER</button>
      </div>
    </div>

    <!-- 3. PODYUM & SONUÇLAR -->
    <div id="pvp-podium-panel" style="display:none; flex-direction:column; flex:1; background:#120826; padding:12px; border-radius:8px; border:2px solid var(--neon-purple); justify-content:space-between;">
      <div>
        <div style="font-size:15px; font-weight:900; color:var(--neon-gold); text-align:center; margin-bottom:4px;">🏆 MAÇ BİTTİ - SIRALAMA</div>
        <div style="font-size:9.5px; color:#94a3b8; text-align:center; margin-bottom:8px;">Eşya dökümünü görmek için oyuncuya dokunun:</div>
        <div id="podium-list" style="display:flex; flex-direction:column; gap:4px; max-height:180px; overflow-y:auto;"></div>
        <div id="replay-status-txt" style="text-align:center; font-size:11px; color:var(--neon-gold); margin:6px 0;">Herkes tekrar oyna basmalıdır!</div>
      </div>

      <div style="display:flex; gap:6px;">
        <button id="btn-replay-pvp" class="btn-start" style="flex:1; background:var(--btn-blue);" onclick="voteReplayPvP()">🔄 Tekrar (<span id="replay-vote-count">0</span>)</button>
        <a href="menu.html" class="btn-start" style="flex:1; background:var(--danger); text-align:center; text-decoration:none; padding:10px;" onclick="leavePvPRoom()">🚪 Lobi</a>
      </div>
    </div>
  </div>

  <!-- Eşya İnceleme Modalı -->
  <div id="modal-pvp-inspect" class="modal-overlay">
    <div class="modal-card">
      <h3 id="inspect-player-name" style="color:var(--neon-blue); font-size:13px; margin-bottom:4px;">Oyuncu Eşyaları</h3>
      <div id="inspect-drops-list" style="max-height:160px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; margin-bottom:6px;"></div>
      <button class="btn-close" onclick="document.getElementById('modal-pvp-inspect').style.display='none'">Kapat</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let roomCapacity = 2, totalBoxesPerPlayer = 5, currentRoomCode = null, selectedGameType = 'standard';
    let myOpenedCount = 0, myTotalScore = 0, myDrops = [], isMatchPlaying = false, isSpinningSlot = false, isMyReady = false, countdownInt = null;

    const PVP_TIERS = {
      standard: [
        { name: "Tahta Kılıç", p: 2, c: "#fff" }, { name: "Demir Balta", p: 6, c: "#38bdf8" },
        { name: "Gümüş Yüzük", p: 15, c: "#c084fc" }, { name: "Ejder Baltası", p: 40, c: "#fb923c" }, { name: "Efsane Kılıç", p: 100, c: "#f43f5e" }
      ],
      mega: [
        { name: "Mega Kılıç", p: 15, c: "#fff" }, { name: "Safir Zırh", p: 45, c: "#38bdf8" },
        { name: "Kutsal Asa", p: 120, c: "#c084fc" }, { name: "Tanrısal Kama", p: 450, c: "#f43f5e" }
      ],
      speedrun: [
        { name: "Hız İksiri", p: 20, c: "#38bdf8" }, { name: "Yıldırım Kristali", p: 60, c: "#fbbf24" }, { name: "Işık Baltası", p: 150, c: "#f43f5e" }
      ],
      mines: [
        { name: "Güvenli Sandık", p: 25, c: "#10b981" }, { name: "Büyük Hazine", p: 80, c: "#fbbf24" }, { name: "Tuzak Sandık", p: -10, c: "#ef4444" }
      ]
    };

    function setGameType(type) {
      selectedGameType = type;
      ['std', 'mega', 'speed', 'mines'].forEach(k => document.getElementById('m-' + k).style.background = '#13072b');
      const map = { standard: 'std', mega: 'mega', speedrun: 'speed', mines: 'mines' };
      document.getElementById('m-' + map[type]).style.background = 'var(--btn-blue)';
    }

    function setRoomSize(num) {
      roomCapacity = num;
      totalBoxesPerPlayer = num === 2 ? 5 : (num === 3 ? 10 : 15);
      document.getElementById("btn-p2").style.background = num === 2 ? "var(--btn-blue)" : "#13072b";
      document.getElementById("btn-p3").style.background = num === 3 ? "var(--btn-blue)" : "#13072b";
      document.getElementById("btn-p4").style.background = num === 4 ? "var(--btn-blue)" : "#13072b";
    }

    function createOnlineRoom() {
      const u = getActiveUser();
      if (!u) return;
      const code = `pvp#${Math.floor(1000 + Math.random() * 9000)}`;
      currentRoomCode = code;
      const chKey = code.replace(/[^a-zA-Z0-9]/g, '_');

      const pData = {};
      pData[u.uid] = { uid: u.uid, fullName: `${u.name}${u.tag}`, score: 0, opened: 0, lastDrop: "-", ready: false, wantsReplay: false, drops: [] };

      db.ref("pvp_rooms/" + chKey).set({
        code: code,
        capacity: roomCapacity,
        totalBoxes: totalBoxesPerPlayer,
        gameType: selectedGameType,
        status: "waiting",
        players: pData
      }).then(() => listenRoom(code));
    }

    function joinOnlineRoom() {
      const inputCode = document.getElementById("in-room-code").value.trim();
      if (!inputCode) return alert("Oda kodu giriniz!");
      const u = getActiveUser();

      db.ref("pvp_rooms").once("value", snap => {
        let foundKey = null, foundRoom = null;
        snap.forEach(c => {
          if (c.val().code && c.val().code.toLowerCase() === inputCode.toLowerCase()) {
            foundKey = c.key;
            foundRoom = c.val();
          }
        });

        if (!foundRoom) return alert("Böyle bir oda bulunamadı!");
        const currentCount = Object.keys(foundRoom.players || {}).length;
        if (currentCount >= foundRoom.capacity) return alert("Bu oda tamamen dolmuş!");

        currentRoomCode = foundRoom.code;
        totalBoxesPerPlayer = foundRoom.totalBoxes || 5;
        selectedGameType = foundRoom.gameType || 'standard';

        db.ref(`pvp_rooms/${foundKey}/players/${u.uid}`).set({
          uid: u.uid,
          fullName: `${u.name}${u.tag}`,
          score: 0,
          opened: 0,
          lastDrop: "-",
          ready: false,
          wantsReplay: false,
          drops: []
        }).then(() => listenRoom(foundRoom.code));
      });
    }

    function listenRoom(code) {
      document.getElementById("pvp-lobby-panel").style.display = "none";
      document.getElementById("pvp-game-panel").style.display = "flex";
      document.getElementById("pvp-room-tag").innerText = `${code} (${selectedGameType.toUpperCase()})`;

      const u = getActiveUser();
      const chKey = code.replace(/[^a-zA-Z0-9]/g, '_');

      db.ref("pvp_rooms/" + chKey).on("value", snap => {
        const room = snap.val();
        if (!room) return;

        totalBoxesPerPlayer = room.totalBoxes || 5;
        selectedGameType = room.gameType || 'standard';
        const pList = Object.values(room.players || {});
        const pRow = document.getElementById("pvp-players-row");
        pRow.style.gridTemplateColumns = `repeat(${room.capacity}, 1fr)`;
        pRow.innerHTML = "";

        let readyCount = 0, replayVotes = 0;

        pList.forEach(p => {
          const isMe = p.fullName === `${u.name}${u.tag}`;
          if (p.ready) readyCount++;
          if (p.wantsReplay) replayVotes++;

          pRow.innerHTML += `
            <div style="background:#070212; border:1px solid ${isMe ? 'var(--neon-gold)' : '#3b1d6e'}; border-radius:6px; padding:4px 2px; text-align:center;">
              <div style="font-size:8px; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:${isMe ? 'var(--neon-gold)' : '#fff'};">${p.fullName}</div>
              <div style="font-size:14px; font-weight:bold; color:var(--neon-green); margin:1px 0;">${p.score} P</div>
              <div style="font-size:8px; color:#38bdf8;">${p.lastDrop}</div>
              <div style="font-size:7px; color:${p.ready ? 'var(--neon-green)' : '#94a3b8'};">${p.ready ? '⚡ HAZIR' : `${p.opened}/${totalBoxesPerPlayer} Kutu`}</div>
            </div>
          `;
        });

        const voteBadge = document.getElementById("replay-vote-count");
        if (voteBadge) voteBadge.innerText = `${replayVotes}/${room.capacity}`;

        if (readyCount < room.capacity && (room.status === "starting" || room.status === "waiting")) {
          if (countdownInt) { clearInterval(countdownInt); countdownInt = null; }
          if (room.status === "starting") db.ref("pvp_rooms/" + chKey).update({ status: "waiting" });
          document.getElementById("pvp-status-badge").innerText = `⏳ Bekleniyor (${readyCount}/${room.capacity} Hazır)`;
          document.getElementById("pvp-status-badge").style.color = "var(--neon-gold)";
        } 
        else if (readyCount === room.capacity && room.status === "waiting") {
          db.ref("pvp_rooms/" + chKey).update({ status: "starting" });
          let cd = 3;
          document.getElementById("pvp-status-badge").innerText = `🔥 Başlıyor: ${cd}s`;
          if (countdownInt) clearInterval(countdownInt);
          countdownInt = setInterval(() => {
            cd--;
            document.getElementById("pvp-status-badge").innerText = `🔥 Başlıyor: ${cd}s`;
            if (cd <= 0) {
              clearInterval(countdownInt); countdownInt = null;
              db.ref("pvp_rooms/" + chKey).update({ status: "playing" });
            }
          }, 1000);
        } else if (room.status === "playing") {
          document.getElementById("pvp-status-badge").innerText = "⚔️ Maç Başladı!";
          document.getElementById("pvp-status-badge").style.color = "var(--neon-green)";
          document.getElementById("btn-ready-pvp").style.display = "none";
          isMatchPlaying = true;
          renderPvPBoxesGrid();
        }

        if (replayVotes === room.capacity && room.status === "finished") resetPvPRound();

        const allDone = pList.length === room.capacity && pList.every(p => p.opened === totalBoxesPerPlayer);
        if (allDone && room.status === "playing") {
          document.getElementById("pvp-status-badge").innerText = "🏆 Maç Bitti!";
          db.ref("pvp_rooms/" + chKey).update({ status: "finished" });
          setTimeout(() => showPodium(pList), 2500);
        }
      });
    }

    function toggleReadyPvP() {
      isMyReady = !isMyReady;
      playSound('click');
      const u = getActiveUser();
      const chKey = currentRoomCode.replace(/[^a-zA-Z0-9]/g, '_');
      db.ref(`pvp_rooms/${chKey}/players/${u.uid}/ready`).set(isMyReady);
      document.getElementById("btn-ready-pvp").innerText = isMyReady ? "✅ HAZIR GERİ AL" : "⚡ HAZIR VER";
      document.getElementById("btn-ready-pvp").style.background = isMyReady ? "var(--neon-green)" : "var(--neon-gold)";
    }

    function renderPvPBoxesGrid() {
      const grid = document.getElementById("pvp-boxes-grid");
      if (grid.children.length > 0) return;
      document.getElementById("lbl-pvp-progress").innerText = `${myOpenedCount} / ${totalBoxesPerPlayer}`;

      for (let i = 0; i < totalBoxesPerPlayer; i++) {
        const b = document.createElement("div");
        b.className = "roulette-item";
        b.style.cssText = "width:100%; height:50px; cursor:pointer;";
        b.innerHTML = `<span>📦</span><span style="font-size:7px;">${i+1}</span>`;

        b.onclick = () => {
          if (!isMatchPlaying || isSpinningSlot || b.dataset.opened || myOpenedCount >= totalBoxesPerPlayer) return;
          b.dataset.opened = "1";
          spinSlotForPvP(b);
        };
        grid.appendChild(b);
      }
    }

    function spinSlotForPvP(boxEl) {
      isSpinningSlot = true;
      playSound('click');
      const track = document.getElementById("pvp-roulette-track");
      const wrap = document.getElementById("pvp-roulette-box");
      track.style.transition = "none";
      track.style.transform = "translateX(0px)";
      track.innerHTML = "";

      const pool = PVP_TIERS[selectedGameType] || PVP_TIERS.standard;
      const totalItems = 25, winIdx = 20;
      let winDrop = null;
      const itemWidth = 75;

      for (let i = 0; i < totalItems; i++) {
        let d = pool[Math.floor(Math.random() * pool.length)];
        if (i === winIdx) winDrop = d;
        track.innerHTML += `
          <div class="roulette-item" style="width:75px; height:75px; border-bottom:3px solid ${d.c};">
            <span style="color:${d.c}; font-size:8px; font-weight:bold;">${d.name}</span>
            <span style="color:var(--neon-green); font-size:9px;">+${d.p}P</span>
          </div>
        `;
      }

      setTimeout(() => {
        track.style.transition = "transform 2.5s cubic-bezier(0.12, 0.8, 0.2, 1)";
        const targetX = -(winIdx * itemWidth) + (wrap.offsetWidth / 2) - (itemWidth / 2);
        track.style.transform = `translateX(${targetX}px)`;
        
        let tInt = setInterval(() => playSound('tick'), 160);
        setTimeout(() => clearInterval(tInt), 2200);
      }, 20);

      setTimeout(() => {
        playSound('win');
        myTotalScore += winDrop.p;
        myOpenedCount++;
        myDrops.push(winDrop);
        document.getElementById("lbl-pvp-progress").innerText = `${myOpenedCount} / ${totalBoxesPerPlayer}`;

        boxEl.style.background = "#070212";
        boxEl.innerHTML = `<span style="color:${winDrop.c}; font-size:6px;">${winDrop.name}</span><b style="color:var(--neon-green); font-size:8px;">+${winDrop.p}P</b>`;

        const u = getActiveUser();
        const chKey = currentRoomCode.replace(/[^a-zA-Z0-9]/g, '_');
        db.ref(`pvp_rooms/${chKey}/players/${u.uid}`).update({
          score: myTotalScore,
          opened: myOpenedCount,
          lastDrop: `+${winDrop.p}P (${winDrop.name})`,
          drops: myDrops
        });

        isSpinningSlot = false;
      }, 2600);
    }

    function sendQuickAction(txt) {
      const u = getActiveUser();
      if (!currentRoomCode) return;
      const chKey = currentRoomCode.replace(/[^a-zA-Z0-9]/g, '_');
      db.ref(`pvp_rooms/${chKey}/players/${u.uid}`).update({ lastDrop: txt });
    }

    function showPodium(pList) {
      document.getElementById("pvp-game-panel").style.display = "none";
      document.getElementById("pvp-podium-panel").style.display = "flex";

      const u = getActiveUser();
      pList.sort((a, b) => b.score - a.score);

      const podBox = document.getElementById("podium-list");
      podBox.innerHTML = "";

      pList.forEach((p, idx) => {
        const isMe = p.fullName === `${u.name}${u.tag}`;
        const item = document.createElement("div");
        item.className = `rank-card ${idx === 0 ? 'rank-1' : (idx === 1 ? 'rank-2' : (idx === 2 ? 'rank-3' : ''))}`;
        if (isMe) item.style.border = "2px solid var(--neon-gold)";

        item.innerHTML = `
          <span><b>${idx+1}.</b> ${p.fullName} ${isMe ? '(SEN)' : ''}</span>
          <b style="color:var(--neon-green); font-size:13px;">${p.score} P</b>
        `;
        item.onclick = () => openPvPInspect(p);
        podBox.appendChild(item);
      });
    }

    function openPvPInspect(player) {
      document.getElementById("inspect-player-name").innerText = `${player.fullName} - Çıkan Eşyalar`;
      const box = document.getElementById("inspect-drops-list");
      box.innerHTML = "";

      if (player.drops && player.drops.length > 0) {
        player.drops.forEach(d => {
          box.innerHTML += `
            <div style="background:#070212; padding:4px 8px; border-radius:4px; display:flex; justify-content:space-between; font-size:10px;">
              <span style="color:${d.c || '#fff'}; font-weight:bold;">${d.name}</span>
              <b style="color:var(--neon-green);">+${d.p}P</b>
            </div>
          `;
        });
      } else {
        box.innerHTML = "<div style='color:#666; font-size:10px; padding:10px; text-align:center;'>Eşya dökümü bulunamadı.</div>";
      }

      document.getElementById("modal-pvp-inspect").style.display = "flex";
    }

    function voteReplayPvP() {
      const u = getActiveUser();
      const chKey = currentRoomCode.replace(/[^a-zA-Z0-9]/g, '_');
      db.ref(`pvp_rooms/${chKey}/players/${u.uid}/wantsReplay`).set(true);
      document.getElementById("btn-replay-pvp").disabled = true;
      document.getElementById("btn-replay-pvp").innerText = "Bekleniyor...";
    }

    function resetPvPRound() {
      myOpenedCount = 0; myTotalScore = 0; myDrops = []; isMyReady = false;
      const u = getActiveUser();
      const chKey = currentRoomCode.replace(/[^a-zA-Z0-9]/g, '_');

      db.ref(`pvp_rooms/${chKey}/players/${u.uid}`).update({
        score: 0, opened: 0, lastDrop: "-", ready: false, wantsReplay: false, drops: []
      });

      db.ref(`pvp_rooms/${chKey}`).update({ status: "waiting" });

      document.getElementById("pvp-boxes-grid").innerHTML = "";
      document.getElementById("pvp-podium-panel").style.display = "none";
      document.getElementById("pvp-game-panel").style.display = "flex";
      document.getElementById("btn-ready-pvp").innerText = "⚡ HAZIR VER";
      document.getElementById("btn-ready-pvp").style.background = "var(--neon-gold)";
      document.getElementById("btn-ready-pvp").style.display = "block";
      document.getElementById("btn-replay-pvp").disabled = false;
      document.getElementById("btn-replay-pvp").innerHTML = `🔄 Tekrar (<span id="replay-vote-count">0</span>)`;
    }

    function leavePvPRoom() {
      if (currentRoomCode) {
        const u = getActiveUser();
        const chKey = currentRoomCode.replace(/[^a-zA-Z0-9]/g, '_');
        db.ref(`pvp_rooms/${chKey}/players/${u.uid}`).remove().then(() => {
          db.ref(`pvp_rooms/${chKey}/players`).once("value", pSnap => {
            if (!pSnap.exists() || pSnap.numChildren() === 0) {
              db.ref(`pvp_rooms/${chKey}`).remove();
            }
          });
        });
      }
      window.location.href = "menu.html";
    }
  </script>
</body>
</html>
