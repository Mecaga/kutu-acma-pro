<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online PvP Arenası</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="lobby-header">
      <a href="menu.html" class="btn-sm" style="background:var(--danger);">‹ Çık</a>
      <div id="pvp-title" style="font-size:12px; font-weight:bold;">2 Kişilik Oda (10 Kutu)</div>
      <div id="pvp-time-badge" style="color:var(--gold); font-weight:bold;">30s</div>
    </div>

    <!-- Mod Seçimi (1v1, 1v1v1, 1v1v1v1) -->
    <div style="padding:8px 12px; display:flex; gap:4px;">
      <button class="btn-sm" style="background:#1e0d3d;" onclick="setMode(2)">1v1</button>
      <button class="btn-sm" style="background:#1e0d3d;" onclick="setMode(3)">1v1v1</button>
      <button class="btn-sm" style="background:#1e0d3d;" onclick="setMode(4)">1v1v1v1</button>
    </div>

    <div style="padding:0 12px; display:flex; gap:6px;">
      <button class="btn-sm" style="background:var(--neon-purple);" onclick="createRoom()">Oda Kur</button>
      <input type="text" id="room-code-in" placeholder="Oda Kodu" class="auth-input" style="margin:0; padding:6px; font-size:11px;">
      <button class="btn-sm" style="background:var(--btn-green);" onclick="joinRoom()">Katıl</button>
    </div>

    <div id="pvp-status-txt" style="text-align:center; font-size:11px; font-weight:bold; color:var(--gold); margin:8px 0;">⏳ Rakip Bekleniyor</div>
    <div class="pvp-room-grid" id="pvp-players-box" style="padding:0 12px;"></div>

    <div style="padding:12px; margin-top:auto;">
      <div style="font-size:11px; font-weight:bold; color:var(--neon-purple); margin-bottom:4px;">📦 Açılabilir Kutuların:</div>
      <div class="pvp-box-grid" id="pvp-boxes"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let pvpPlayers = 2;
    let totalBoxes = 10;
    let activeRoom = null;
    let opened = 0;
    let myScore = 0;

    function setMode(p) {
      pvpPlayers = p;
      totalBoxes = p * 5;
      document.getElementById("pvp-title").innerText = `${p} Kişilik Oda (${totalBoxes} Kutu)`;
    }

    function createRoom() {
      let code = "PVP_" + Math.floor(1000 + Math.random() * 9000);
      let u = getUser();
      activeRoom = code;
      opened = 0;
      myScore = 0;

      let pData = {};
      pData[u.uid] = { name: `${u.name}${u.tag}`, score: 0, opened: 0 };

      db.ref("arenas/" + code).set({
        max: pvpPlayers,
        totalBoxes: totalBoxes,
        status: "waiting",
        players: pData
      });
      listenRoom(code);
      alert("Oda Kodu: " + code);
    }

    function joinRoom() {
      let code = document.getElementById("room-code-in").value.trim();
      if (!code) return;
      let u = getUser();
      activeRoom = code;
      opened = 0;
      myScore = 0;

      db.ref("arenas/" + code).transaction(r => {
        if (r && Object.keys(r.players || {}).length < r.max) {
          r.players[u.uid] = { name: `${u.name}${u.tag}`, score: 0, opened: 0 };
          if (Object.keys(r.players).length === r.max) r.status = "playing";
        }
        return r;
      });
      listenRoom(code);
    }

    function listenRoom(code) {
      let u = getUser();
      db.ref("arenas/" + code).on("value", snap => {
        let r = snap.val();
        if (!r) return;

        let list = Object.values(r.players || {});
        let pBox = document.getElementById("pvp-players-box");
        pBox.innerHTML = "";
        list.forEach(p => {
          pBox.innerHTML += `
            <div class="pvp-player-col filled">
              <div style="font-size:10px; color:#38bdf8;">${p.name}</div>
              <div style="font-size:20px; font-weight:bold; color:var(--btn-green);">${p.score} P</div>
              <div style="font-size:9px; color:#aaa;">${p.opened}/${r.totalBoxes} Kutu</div>
            </div>
          `;
        });

        let st = document.getElementById("pvp-status-txt");
        if (r.status === "playing") {
          st.innerText = "⚔️ MAÇ BAŞLADI!";
          st.style.color = "var(--btn-green)";
          buildBoxes(r.totalBoxes);
        } else {
          st.innerText = `⏳ Oyuncular Bekleniyor (${list.length}/${r.max})`;
        }
      });
    }

    function buildBoxes(count) {
      let grid = document.getElementById("pvp-boxes");
      if (grid.children.length > 0) return;
      grid.innerHTML = "";

      for (let i = 0; i < count; i++) {
        let b = document.createElement("div");
        b.className = "pvp-box-slot";
        b.innerHTML = `📦<br>${i + 1}`;
        b.onclick = () => {
          if (b.classList.contains("opened") || opened >= count) return;
          b.classList.add("opened");
          let pt = Math.floor(Math.random() * 20) + 2;
          b.innerHTML = `<span style="color:#60a5fa; font-size:8px;">Kılıç</span><br><b style="color:#10b981;">+${pt}P</b>`;
          opened++;
          myScore += pt;

          let u = getUser();
          db.ref(`arenas/${activeRoom}/players/${u.uid}`).update({
            score: myScore,
            opened: opened
          });

          if (opened === count) {
            setTimeout(() => alert("🏁 Tüm kutular açıldı! 10sn içinde kazanan belirleniyor."), 1000);
          }
        };
        grid.appendChild(b);
      }
    }
  </script>
</body>
</html>
