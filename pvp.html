<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online PvP Arenası</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-pvp_mode">
  <div class="app-container">
    <div class="top-header">
      <button id="btn-leave-room" class="icon-btn" style="border-color:var(--danger);" onclick="leavePvPRoom()">‹ Çıkış</button>
      <div id="pvp-room-tag" style="font-weight:bold; font-size:12px;">⚔️ PvP Arenası</div>
      <div id="pvp-status-badge" style="color:var(--neon-gold); font-weight:bold; font-size:11px;">Oda Seç</div>
    </div>

    <!-- Oda Paneli -->
    <div id="pvp-lobby-panel" style="display:flex; flex-direction:column; gap:8px;">
      <div style="font-size:11px; color:var(--text-dim);">Oyun Türü Seç:</div>
      <div style="display:flex; gap:4px;">
        <button class="mode-btn" id="btn-p2" style="flex:1; background:var(--btn-blue); color:#fff; text-align:center;" onclick="setRoomSize(2)">1v1</button>
        <button class="mode-btn" id="btn-p3" style="flex:1; text-align:center;" onclick="setRoomSize(3)">1v1v1</button>
        <button class="mode-btn" id="btn-p4" style="flex:1; text-align:center;" onclick="setRoomSize(4)">1v1v1v1</button>
      </div>

      <button class="btn-start" style="background:linear-gradient(90deg, #9333ea, #c084fc);" onclick="createOnlineRoom()">🔥 Oda Kur</button>

      <div style="display:flex; gap:4px; margin-top:10px;">
        <input type="text" id="in-room-code" class="input-field" style="margin:0; font-size:11px;" placeholder="Oda Adı (Örn: pvp#1234)">
        <button class="icon-btn" style="background:var(--neon-green); white-space:nowrap;" onclick="joinOnlineRoom()">Katıl</button>
      </div>
    </div>

    <!-- Canlı Oyun Alanı -->
    <div id="pvp-game-panel" style="display:none; flex-direction:column; flex:1;">
      <div style="display:grid; gap:4px; margin-bottom:8px;" id="pvp-players-row"></div>
      
      <div style="display:flex; justify-content:center; gap:6px; margin-bottom:6px;">
        <button class="icon-btn" onclick="sendQuickEmoji('🔥')">🔥</button>
        <button class="icon-btn" onclick="sendQuickEmoji('😎')">😎</button>
        <button class="icon-btn" onclick="sendQuickEmoji('💀')">💀</button>
        <button class="icon-btn" onclick="sendQuickEmoji('🎉')">🎉</button>
      </div>

      <div style="font-size:10px; color:var(--neon-blue); font-weight:bold; margin-bottom:4px;">📦 Açılacak 5 Kutunuz:</div>
      <div style="display:grid; grid-template-columns:repeat(5, 1fr); gap:4px; flex:1; align-content:start;" id="pvp-boxes-grid"></div>
    </div>

    <!-- Podyum / Kazanan Paneli -->
    <div id="pvp-podium-panel" style="display:none; flex-direction:column; flex:1; background:#120826; padding:12px; border-radius:8px; border:2px solid var(--neon-purple); box-shadow:0 0 20px var(--neon-purple-glow);">
      <div style="font-size:15px; font-weight:900; color:var(--neon-gold); text-align:center; margin-bottom:10px;">🏆 MAÇ BİTTİ - SIRALAMA</div>
      <div id="podium-list" style="display:flex; flex-direction:column; gap:6px; flex:1; overflow-y:auto;"></div>
      
      <div id="replay-status-txt" style="text-align:center; font-size:11px; color:var(--neon-gold); margin:6px 0;">Herkes tekrar oynamak için basmalı!</div>

      <div style="display:flex; gap:6px; margin-top:6px;">
        <button id="btn-replay-pvp" class="icon-btn" style="flex:1; background:var(--btn-blue); justify-content:center; padding:10px;" onclick="voteReplayPvP()">🔄 Tekrar Oyna (<span id="replay-vote-count">0</span>)</button>
        <button class="icon-btn" style="flex:1; background:var(--danger); justify-content:center; padding:10px;" onclick="leavePvPRoom()">🚪 Lobiye Dön</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let roomCapacity = 2;
    let currentRoomCode = null;
    let myOpenedCount = 0;
    let myTotalScore = 0;
    let isLocked = true;
    let startTimeout = null;

    const PVP_TIERS = [
      { name: "Tahta Kılıç", p: 2, c: "#fff" },
      { name: "Demir Balta", p: 6, c: "#38bdf8" },
      { name: "Gümüş Yüzük", p: 15, c: "#c084fc" },
      { name: "Ejder Baltası", p: 40, c: "#fb923c" },
      { name: "Efsane Kılıç", p: 100, c: "#f43f5e" }
    ];

    function setRoomSize(num) {
      roomCapacity = num;
      document.getElementById("btn-p2").style.background = num === 2 ? "var(--btn-blue)" : "#0f172a";
      document.getElementById("btn-p3").style.background = num === 3 ? "var(--btn-blue)" : "#0f172a";
      document.getElementById("btn-p4").style.background = num === 4 ? "var(--btn-blue)" : "#0f172a";
    }

    function createOnlineRoom() {
      const u = getActiveUser();
      if (!u) return;
      const code = `pvp#${Math.floor(1000 + Math.random() * 9000)}`;
      currentRoomCode = code;
      const chKey = code.replace(/[^a-zA-Z0-9]/g, '_');

      const pData = {};
      pData[u.uid] = { uid: u.uid, fullName: `${u.name}${u.tag}`, score: 0, opened: 0, lastDrop: "-", wantsReplay: false };

      db.ref("pvp_rooms/" + chKey).set({
        code: code,
        capacity: roomCapacity,
        status: "waiting",
        players: pData
      }).then(() => {
        listenRoom(code);
      });
    }

    function joinOnlineRoom() {
      const inputCode = document.getElementById("in-room-code").value.trim();
      if (!inputCode) return alert("Oda kodu giriniz!");
      const u = getActiveUser();

      db.ref("pvp_rooms").once("value", snap => {
        let foundKey = null;
        let foundRoom = null;

        snap.forEach(c => {
          if (c.val().code.toLowerCase() === inputCode.toLowerCase()) {
            foundKey = c.key;
            foundRoom = c.val();
          }
        });

        if (!foundRoom) return alert("Böyle bir oda bulunamadı!");

        const currentCount = Object.keys(foundRoom.players || {}).length;
        if (currentCount >= foundRoom.capacity) return alert("Bu oda tamamen dolmuş!");

        currentRoomCode = foundRoom.code;

        db.ref(`pvp_rooms/${foundKey}/players/${u.uid}`).set({
          uid: u.uid,
          fullName: `${u.name}${u.tag}`,
          score: 0,
          opened: 0,
          lastDrop: "-",
          wantsReplay: false
        }).then(() => {
          if (currentCount + 1 === foundRoom.capacity) {
            db.ref(`pvp_rooms/${foundKey}`).update({ status: "starting" });
          }
          listenRoom(foundRoom.code);
        });
      });
    }

    function listenRoom(code) {
      document.getElementById("pvp-lobby-panel").style.display = "none";
      document.getElementById("pvp-game-panel").style.display = "flex";
      document.getElementById("pvp-room-tag").innerText = code;

      const u = getActiveUser();
      const chKey = code.replace(/[^a-zA-Z0-9]/g, '_');

      db.ref("pvp_rooms/" + chKey).on("value", snap => {
        const room = snap.val();
        if (!room) return;

        const pList = Object.values(room.players || {});
        const pRow = document.getElementById("pvp-players-row");
        pRow.style.gridTemplateColumns = `repeat(${room.capacity}, 1fr)`;
        pRow.innerHTML = "";

        let replayVotes = 0;

        pList.forEach(p => {
          const isMe = p.fullName === `${u.name}${u.tag}`;
          if (p.wantsReplay) replayVotes++;

          pRow.innerHTML += `
            <div style="background:#070212; border:1px solid ${isMe ? 'var(--neon-gold)' : '#3b1d6e'}; border-radius:6px; padding:6px 2px; text-align:center;">
              <div style="font-size:9px; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:${isMe ? 'var(--neon-gold)' : '#fff'};">${p.fullName}</div>
              <div style="font-size:16px; font-weight:bold; color:var(--neon-green); margin:2px 0;">${p.score} P</div>
              <div style="font-size:8px; color:#38bdf8;">${p.lastDrop}</div>
              <div style="font-size:8px; color:#94a3b8;">${p.opened}/5 Kutu</div>
            </div>
          `;
        });

        const voteBadge = document.getElementById("replay-vote-count");
        if (voteBadge) voteBadge.innerText = `${replayVotes}/${room.capacity}`;

        // Sadece bir oyuncu gerçekten ayrılmışsa uyar ve tekrar oynamayı kilitle
        if (pList.length < room.capacity) {
          if (startTimeout) clearTimeout(startTimeout);
          document.getElementById("pvp-status-badge").innerText = `⏳ Bekleniyor (${pList.length}/${room.capacity})`;
          document.getElementById("pvp-status-badge").style.color = "var(--neon-gold)";
          isLocked = true;
          document.getElementById("btn-leave-room").disabled = false;

          const replayBtn = document.getElementById("btn-replay-pvp");
          if (replayBtn && room.status === "finished") {
            replayBtn.disabled = true;
            document.getElementById("replay-status-txt").innerText = "⚠️ Bir oyuncu ayrıldı, tekrar oynanamaz!";
          }
        } else if (room.status === "starting") {
          document.getElementById("pvp-status-badge").innerText = "⏳ 5sn Sonra Başlıyor...";
          startTimeout = setTimeout(() => {
            db.ref("pvp_rooms/" + chKey).update({ status: "playing" });
          }, 5000);
        } else if (room.status === "playing") {
          document.getElementById("pvp-status-badge").innerText = "⚔️ Maç Başladı!";
          document.getElementById("pvp-status-badge").style.color = "var(--neon-green)";
          document.getElementById("btn-leave-room").disabled = true;
          isLocked = false;
          renderPvPBoxes(chKey);
        }

        if (replayVotes === room.capacity && room.status === "finished") {
          resetPvPRound();
        }

        const allDone = pList.length === room.capacity && pList.every(p => p.opened === 5);
        if (allDone && room.status === "playing") {
          document.getElementById("pvp-status-badge").innerText = "🏆 5sn Sonra Kazanan Açıklanıyor!";
          db.ref("pvp_rooms/" + chKey).update({ status: "finished" });
          setTimeout(() => {
            showPodium(pList);
          }, 5000);
        }
      });
    }

    function renderPvPBoxes(chKey) {
      const grid = document.getElementById("pvp-boxes-grid");
      if (grid.children.length > 0) return;

      const u = getActiveUser();

      for (let i = 0; i < 5; i++) {
        const b = document.createElement("div");
        b.className = "roulette-item";
        b.style.cssText = "width:100%; height:60px; cursor:pointer;";
        b.innerHTML = `<span>📦</span><span style="font-size:8px;">${i+1}</span>`;

        b.onclick = () => {
          if (isLocked || b.dataset.opened || myOpenedCount >= 5) return;

          b.dataset.opened = "1";
          b.style.background = "#070212";

          const d = PVP_TIERS[Math.floor(Math.random() * PVP_TIERS.length)];
          myTotalScore += d.p;
          myOpenedCount++;

          b.innerHTML = `<span style="color:${d.c}; font-size:7px;">${d.name}</span><b style="color:var(--neon-green); font-size:9px;">+${d.p}P</b>`;

          db.ref(`pvp_rooms/${chKey}/players/${u.uid}`).update({
            score: myTotalScore,
            opened: myOpenedCount,
            lastDrop: `+${d.p}P (${d.name})`
          });
        };
        grid.appendChild(b);
      }
    }

    function sendQuickEmoji(emoji) {
      const u = getActiveUser();
      if (!currentRoomCode) return;
      const chKey = currentRoomCode.replace(/[^a-zA-Z0-9]/g, '_');
      db.ref(`pvp_rooms/${chKey}/players/${u.uid}`).update({
        lastDrop: `${emoji} ${emoji}`
      });
    }

    function showPodium(pList) {
      document.getElementById("pvp-game-panel").style.display = "none";
      document.getElementById("pvp-podium-panel").style.display = "flex";

      const u = getActiveUser();
      pList.sort((a, b) => b.score - a.score);

      const podBox = document.getElementById("podium-list");
      podBox.innerHTML = "";

      pList.forEach((p, idx) => {
        const isMe = p.fullName === `${u.name}${u.tag}`;
        podBox.innerHTML += `
          <div class="rank-card ${idx === 0 ? 'rank-1' : (idx === 1 ? 'rank-2' : (idx === 2 ? 'rank-3' : ''))}" style="${isMe ? 'border:2px solid var(--neon-gold); color:var(--neon-gold);' : ''}">
            <span><b>${idx+1}.</b> ${p.fullName} ${isMe ? '(SEN)' : ''}</span>
            <b style="color:var(--neon-green); font-size:13px;">${p.score} P</b>
          </div>
        `;
      });

      recordGameScore('pvp_mode', 'Online PvP', myTotalScore, []);
    }

    function voteReplayPvP() {
      const u = getActiveUser();
      const chKey = currentRoomCode.replace(/[^a-zA-Z0-9]/g, '_');
      db.ref(`pvp_rooms/${chKey}/players/${u.uid}/wantsReplay`).set(true);
      document.getElementById("btn-replay-pvp").disabled = true;
      document.getElementById("btn-replay-pvp").innerText = "Bekleniyor...";
    }

    function resetPvPRound() {
      myOpenedCount = 0;
      myTotalScore = 0;
      const u = getActiveUser();
      const chKey = currentRoomCode.replace(/[^a-zA-Z0-9]/g, '_');

      db.ref(`pvp_rooms/${chKey}/players/${u.uid}`).update({
        score: 0,
        opened: 0,
        lastDrop: "-",
        wantsReplay: false
      });

      db.ref(`pvp_rooms/${chKey}`).update({ status: "starting" });

      document.getElementById("pvp-boxes-grid").innerHTML = "";
      document.getElementById("pvp-podium-panel").style.display = "none";
      document.getElementById("pvp-game-panel").style.display = "flex";
      document.getElementById("btn-replay-pvp").disabled = false;
      document.getElementById("btn-replay-pvp").innerHTML = `🔄 Tekrar Oyna (<span id="replay-vote-count">0</span>)`;
    }

    function leavePvPRoom() {
      if (currentRoomCode) {
        const u = getActiveUser();
        const chKey = currentRoomCode.replace(/[^a-zA-Z0-9]/g, '_');
        db.ref(`pvp_rooms/${chKey}/players/${u.uid}`).remove();
      }
      window.location.href = "menu.html";
    }
  </script>
</body>
</html>
