<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>1v1 PvP Arenası</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="app.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #020617; font-family: system-ui, sans-serif; color: #fff; }

    .pvp-layout { width: 100%; max-width: 480px; height: 100dvh; margin: 0 auto; background: #030712; display: flex; flex-direction: column; position: relative; }
    .pvp-header { flex-shrink: 0; background: #090d1a; border-bottom: 2px solid #1e293b; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; }
    
    .pvp-content { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }
    .pvp-content::-webkit-scrollbar { width: 3px; }
    .pvp-content::-webkit-scrollbar-thumb { background: #3b1d6e; border-radius: 4px; }

    .vs-card { background: linear-gradient(135deg, #1e1b4b, #0f172a); border: 1px solid #334155; border-radius: 10px; padding: 10px; display: flex; justify-content: space-around; align-items: center; }
    .player-slot { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .player-avatar { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--neon-gold); display: flex; align-items: center; justify-content: center; font-size: 22px; background: #060913; }

    /* Mod Seçim Çubuğu */
    .mode-switch-bar { display: flex; gap: 4px; background: #0b1329; padding: 4px; border-radius: 8px; border: 1px solid #1e293b; }
    .mode-btn-tab { flex: 1; background: #1e293b; border: 1px solid #334155; color: #94a3b8; font-size: 9px; font-weight: bold; padding: 6px; border-radius: 6px; cursor: pointer; text-align: center; }
    .mode-btn-tab.active { background: #4338ca; border-color: var(--neon-gold); color: #fff; }

    /* Amiral Battı Izgarası */
    .navy-grid-box {
      display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px;
      background: #0b1329; border: 2px solid #1e3a8a; border-radius: 8px; padding: 6px;
      width: 100%; max-width: 320px; aspect-ratio: 1; margin: 0 auto;
    }
    .navy-cell {
      background: #0f172a; border: 1px solid #1e293b; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; cursor: pointer; user-select: none;
    }
    .navy-cell.hit { background: #dc2626 !important; border-color: #ef4444; }
    .navy-cell.miss { background: #1e293b !important; color: #64748b; font-weight: bold; }
    .navy-cell.surround { background: #070d1e !important; border-color: #0284c7; }
  </style>
</head>
<body>
  <div class="pvp-layout">
    <div class="pvp-header">
      <a href="menu.html" class="icon-btn" style="border-color:var(--danger); padding:2px 6px; font-size:9.5px; text-decoration:none;">‹ Lobi</a>
      <div style="font-weight:900; font-size:11.5px; color:var(--neon-gold);">⚔️ 1v1 PvP Arenası</div>
      <div id="lbl-room-status" style="font-size:8px; color:var(--neon-green);">● Bağlandı</div>
    </div>

    <div class="pvp-content">
      <!-- VS Başlık Kartı -->
      <div class="vs-card">
        <div class="player-slot">
          <div class="player-avatar" id="p1-avatar">👤</div>
          <b id="p1-name" style="font-size:9.5px; color:#38bdf8;">Sen</b>
          <span id="p1-score" style="font-size:12px; font-weight:bold; color:var(--neon-green);">0</span>
        </div>
        <div style="font-size:16px; font-weight:900; color:var(--danger);">VS</div>
        <div class="player-slot">
          <div class="player-avatar" id="p2-avatar">👤</div>
          <b id="p2-name" style="font-size:9.5px; color:#f87171;">Rakip</b>
          <span id="p2-score" style="font-size:12px; font-weight:bold; color:var(--neon-green);">0</span>
        </div>
      </div>

      <!-- Mod Değiştirme Butonları -->
      <div class="mode-switch-bar">
        <button type="button" class="mode-btn-tab active" id="tab-speed" onclick="switchPvPMode('speedrun')">⚡ 1v1 Speedrun</button>
        <button type="button" class="mode-btn-tab" id="tab-navy" onclick="switchPvPMode('battleship')">🚢 1v1 Amiral Battı</button>
      </div>

      <!-- 1. SPEEDRUN OYUN ALANI -->
      <div id="zone-speedrun" style="display:flex; flex-direction:column; align-items:center; gap:8px; margin-top:10px;">
        <div id="speed-status" style="font-size:11px; font-weight:bold; color:#cbd5e1; text-align:center;">Hedef: 100 Puan! İlk ulaşan kazanır.</div>
        <button type="button" id="btn-speed-action" class="btn-start" style="width:85%; padding:14px; font-size:12px; display:none;" onclick="handleSpeedClick()">🔥 KUTU AÇ (+5-15P)</button>
      </div>

      <!-- 2. AMİRAL BATTI OYUN ALANI -->
      <div id="zone-battleship" style="display:none; flex-direction:column; align-items:center; gap:6px;">
        <div id="navy-status" style="font-size:9.5px; font-weight:bold; color:#38bdf8; text-align:center;">Düşman sularına atış yapın!</div>
        <div class="navy-grid-box" id="pvp-navy-grid"></div>
      </div>

      <!-- BİTİŞ VE REMATCH (TEKRAR OYNA) BÖLÜMÜ -->
      <div id="pvp-game-over-box" style="display:none; flex-direction:column; gap:6px; margin-top:auto;">
        <div id="pvp-winner-txt" style="font-size:13px; font-weight:900; color:var(--neon-gold); text-align:center;"></div>
        <button type="button" id="btn-rematch" class="btn-start" style="background:#16a34a; padding:10px; font-size:11px;" onclick="requestRematch()">🔄 Tekrar Oyna</button>
      </div>
    </div>
  </div>

  <script>
    let activeUser = null;
    let currentPvPMode = 'speedrun';
    let currentRoomId = "arena_main_room";
    let isGameOver = false;
    let mySpeedScore = 0;

    // Amiral Battı Değişkenleri (8x8)
    const GRID_SIZE = 8;
    let navyBoard = [];
    let navyShips = [];

    window.onload = () => {
      activeUser = getActiveUser();
      if (!activeUser) return location.href = "index.html";
      initPvPSystem();
    };

    function switchPvPMode(m) {
      if (isGameOver) return alert("Maç bittiğinde tekrar başlatabilirsiniz.");
      currentPvPMode = m;
      document.querySelectorAll(".mode-btn-tab").forEach(b => b.classList.remove("active"));
      if (m === 'speedrun') {
        document.getElementById("tab-speed").classList.add("active");
        document.getElementById("zone-speedrun").style.display = "flex";
        document.getElementById("zone-battleship").style.display = "none";
      } else {
        document.getElementById("tab-navy").classList.add("active");
        document.getElementById("zone-speedrun").style.display = "none";
        document.getElementById("zone-battleship").style.display = "flex";
      }
      startFreshRound();
    }

    function initPvPSystem() {
      const myKey = String(activeUser.username).toLowerCase();
      const roomRef = db.ref(`pvp_rooms/${currentRoomId}`);

      roomRef.child("players/" + myKey).set({
        name: activeUser.displayName,
        avatar: activeUser.avatar || "👤",
        score: 0,
        ready: true
      });

      roomRef.on("value", snap => {
        const room = snap.val() || {};
        const players = room.players || {};
        const pKeys = Object.keys(players);

        if (pKeys.length > 0) {
          const p1 = players[pKeys[0]];
          document.getElementById("p1-name").innerText = p1.name;
          document.getElementById("p1-avatar").innerText = p1.avatar || "👤";
          document.getElementById("p1-score").innerText = p1.score || 0;
        }
        if (pKeys.length > 1) {
          const p2 = players[pKeys[1]];
          document.getElementById("p2-name").innerText = p2.name;
          document.getElementById("p2-avatar").innerText = p2.avatar || "👤";
          document.getElementById("p2-score").innerText = p2.score || 0;
        }

        // Rematch Sayacı
        const votes = room.rematch_votes || {};
        const voterCount = Object.keys(votes).length;

        if (voterCount === 1) {
          if (votes[myKey]) {
            document.getElementById("btn-rematch").innerText = "⏳ Rakibin Onayı Bekleniyor...";
            document.getElementById("btn-rematch").disabled = true;
          } else {
            document.getElementById("btn-rematch").innerText = "🔥 Rakip Tekrar İstiyor! (Bas ve Başla)";
            document.getElementById("btn-rematch").style.background = "#eab308";
          }
        } else if (voterCount >= 2) {
          roomRef.child("rematch_votes").remove();
          startFreshRound();
        }

        if (room.winner && !isGameOver) {
          endPvPGame(room.winner);
        }
      });

      startFreshRound();
    }

    function startFreshRound() {
      isGameOver = false;
      mySpeedScore = 0;
      document.getElementById("pvp-game-over-box").style.display = "none";
      document.getElementById("btn-rematch").disabled = false;
      document.getElementById("btn-rematch").innerText = "🔄 Tekrar Oyna";
      document.getElementById("btn-rematch").style.background = "#16a34a";

      const myKey = String(activeUser.username).toLowerCase();
      db.ref(`pvp_rooms/${currentRoomId}/players/${myKey}/score`).set(0);
      db.ref(`pvp_rooms/${currentRoomId}/winner`).remove();

      if (currentPvPMode === 'speedrun') {
        let count = 3;
        document.getElementById("speed-status").innerText = `Maç Başlıyor: ${count}`;
        document.getElementById("btn-speed-action").style.display = "none";

        const timer = setInterval(() => {
          count--;
          if (count > 0) {
            document.getElementById("speed-status").innerText = `Maç Başlıyor: ${count}`;
          } else {
            clearInterval(timer);
            document.getElementById("speed-status").innerText = "⚡ Hızlı olan kazanır! (Hedef: 100 Puan)";
            document.getElementById("btn-speed-action").style.display = "block";
          }
        }, 1000);
      } else {
        setupNavyGame();
      }
    }

    // SPEEDRUN MOTORU
    function handleSpeedClick() {
      if (isGameOver) return;
      SoundFX.play('open');
      mySpeedScore += Math.floor(Math.random() * 12) + 5;

      const myKey = String(activeUser.username).toLowerCase();
      db.ref(`pvp_rooms/${currentRoomId}/players/${myKey}/score`).set(mySpeedScore);

      if (mySpeedScore >= 100) {
        db.ref(`pvp_rooms/${currentRoomId}/winner`).set(activeUser.displayName);
      }
    }

    // AMİRAL BATTI MOTORU (GEMİ BATINCA ÇEVRESİ OTOMATİK AÇILIR)
    function setupNavyGame() {
      document.getElementById("navy-status").innerText = "Düşman sularına atış yapın!";
      navyBoard = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
      navyShips = [
        { name: "Kruvazör", size: 3, hits: 0, coords: [] },
        { name: "Hücumbot", size: 2, hits: 0, coords: [] }
      ];

      navyShips.forEach(ship => {
        let placed = false;
        while (!placed) {
          const horiz = Math.random() > 0.5;
          const r = Math.floor(Math.random() * (horiz ? GRID_SIZE : GRID_SIZE - ship.size));
          const c = Math.floor(Math.random() * (horiz ? GRID_SIZE - ship.size : GRID_SIZE));

          let overlap = false;
          let tempCoords = [];
          for (let i = 0; i < ship.size; i++) {
            const curR = horiz ? r : r + i;
            const curC = horiz ? c + i : c;
            if (navyBoard[curR][curC]) { overlap = true; break; }
            tempCoords.push({ r: curR, c: curC });
          }

          if (!overlap) {
            tempCoords.forEach(pos => { navyBoard[pos.r][pos.c] = ship; });
            ship.coords = tempCoords;
            placed = true;
          }
        }
      });

      const gridBox = document.getElementById("pvp-navy-grid");
      gridBox.innerHTML = "";
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const cell = document.createElement("div");
          cell.className = "navy-cell";
          cell.dataset.r = r;
          cell.dataset.c = c;
          cell.onclick = () => handleNavyShot(r, c, cell);
          gridBox.appendChild(cell);
        }
      }
    }

    function handleNavyShot(r, c, cellEl) {
      if (isGameOver || cellEl.classList.contains("hit") || cellEl.classList.contains("miss")) return;

      const target = navyBoard[r][c];
      if (target) {
        SoundFX.play('open');
        cellEl.classList.add("hit");
        cellEl.innerText = "💥";
        target.hits++;

        // Gemi tamamen battığında çevresini otomatik olarak deniz yap
        if (target.hits >= target.size) {
          revealNavySurroundings(target.coords);
          document.getElementById("navy-status").innerText = `🔥 TEBRİKLER! Düşman ${target.name} gemisi battı!`;
        } else {
          document.getElementById("navy-status").innerText = "🎯 İsabet! Gemi vuruldu.";
        }
      } else {
        SoundFX.play('click');
        cellEl.classList.add("miss");
        cellEl.innerText = "•";
        document.getElementById("navy-status").innerText = "💦 Iska! Boş deniz.";
      }

      // Skor Güncelleme
      const totalHits = navyShips.reduce((acc, s) => acc + s.hits, 0);
      const myKey = String(activeUser.username).toLowerCase();
      db.ref(`pvp_rooms/${currentRoomId}/players/${myKey}/score`).set(totalHits);

      const allSunk = navyShips.every(s => s.hits >= s.size);
      if (allSunk) {
        db.ref(`pvp_rooms/${currentRoomId}/winner`).set(activeUser.displayName);
      }
    }

    function revealNavySurroundings(coords) {
      SoundFX.play('boom');
      coords.forEach(pt => {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = pt.r + dr;
            const nc = pt.c + dc;
            if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
              const isShip = coords.some(c => c.r === nr && c.c === nc);
              if (!isShip) {
                const el = document.querySelector(`[data-r="${nr}"][data-c="${nc}"]`);
                if (el && !el.classList.contains("hit")) {
                  el.classList.add("miss", "surround");
                  el.innerText = "🌊";
                }
              }
            }
          }
        }
      });
    }

    function endPvPGame(winnerName) {
      isGameOver = true;
      SoundFX.play(winnerName === activeUser.displayName ? 'win' : 'boom');
      document.getElementById("btn-speed-action").style.display = "none";
      document.getElementById("pvp-winner-txt").innerText = `🏆 Kazanan: ${winnerName}`;
      document.getElementById("pvp-game-over-box").style.display = "flex";
    }

    function requestRematch() {
      SoundFX.play('click');
      const myKey = String(activeUser.username).toLowerCase();
      db.ref(`pvp_rooms/${currentRoomId}/rematch_votes/${myKey}`).set(true);
    }
  </script>
</body>
</html>
