<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online PvP Arenası</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="top-header">
      <a href="menu.html" class="icon-btn" style="border-color:var(--danger);">‹ Çık</a>
      <div id="pvp-title" style="font-weight:bold; font-size:12px;">PvP (3 Kişi - 15 Kutu)</div>
      <div id="pvp-timer" style="color:var(--danger); font-weight:bold; font-size:12px;">Bekleniyor</div>
    </div>

    <!-- Mod Seçimi -->
    <div style="display:flex; gap:4px; margin-bottom:6px;">
      <button class="nav-action-btn" style="flex:1;" onclick="setPvPPlayerCount(2)">1v1</button>
      <button class="nav-action-btn" style="flex:1; background:var(--btn-blue);" onclick="setPvPPlayerCount(3)">1v1v1</button>
      <button class="nav-action-btn" style="flex:1;" onclick="setPvPPlayerCount(4)">1v1v1v1</button>
    </div>

    <!-- Oyuncu Sütunları -->
    <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:4px; margin-bottom:8px;" id="pvp-players-row"></div>

    <!-- Kutular -->
    <div style="font-size:10px; color:var(--neon-blue); font-weight:bold; margin-bottom:4px;">📦 Sana Ait 5 Kutu (Hepsini Aç):</div>
    <div style="display:grid; grid-template-columns:repeat(5, 1fr); gap:4px; flex:1; align-content:start;" id="pvp-boxes-grid"></div>
  </div>

  <script src="app.js"></script>
  <script>
    let pCount = 3;
    let myBoxesOpened = 0;
    let myScore = 0;
    let pvpState = [];

    const PVP_DROPS = [
      { name: "Tahta Kılıç", p: 2, c: "#fff" },
      { name: "Demir Balta", p: 4, c: "#38bdf8" },
      { name: "Gümüş Yüzük", p: 8, c: "#c084fc" },
      { name: "Deri Kask", p: 2, c: "#fff" },
      { name: "Taş Parçası", p: 1, c: "#94a3b8" }
    ];

    window.onload = () => {
      initPvPStage();
    };

    function setPvPPlayerCount(c) {
      pCount = c;
      document.getElementById("pvp-title").innerText = `PvP (${c} Kişi - ${c*5} Kutu)`;
      initPvPStage();
    }

    function initPvPStage() {
      const u = getActiveUser();
      myBoxesOpened = 0;
      myScore = 0;
      pvpState = [];

      for (let i = 1; i < pCount; i++) {
        pvpState.push({ name: `Rakip_${i}#${Math.floor(1000+Math.random()*9000)}`, score: 0, opened: 0, isMe: false });
      }
      pvpState.push({ name: `${u.name}${u.tag} (Sen)`, score: 0, opened: 0, isMe: true });

      renderPlayersGrid();
      renderBoxesGrid();
      startPvPSimulation();
    }

    function renderPlayersGrid() {
      const grid = document.getElementById("pvp-players-row");
      grid.style.gridTemplateColumns = `repeat(${pCount}, 1fr)`;
      grid.innerHTML = "";

      pvpState.forEach((p, i) => {
        grid.innerHTML += `
          <div style="background:#070c18; border:1px solid ${p.isMe ? 'var(--btn-blue)' : 'var(--danger)'}; border-radius:6px; padding:6px 2px; text-align:center;">
            <div style="font-size:9px; font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${p.name}</div>
            <div style="font-size:18px; font-weight:bold; color:var(--btn-green); margin:2px 0;" id="pscore-${i}">${p.score} P</div>
            <div style="font-size:8px; color:#94a3b8;" id="pbox-${i}">${p.opened}/5 Kutu</div>
          </div>
        `;
      });
    }

    function renderBoxesGrid() {
      const grid = document.getElementById("pvp-boxes-grid");
      grid.innerHTML = "";
      for (let i = 0; i < 5; i++) {
        const b = document.createElement("div");
        b.className = "roulette-item";
        b.style.width = "100%";
        b.style.height = "60px";
        b.style.cursor = "pointer";
        b.innerHTML = `<span>📦</span><span style="font-size:8px;">${i+1}</span>`;
        b.onclick = () => openPvPBox(i, b);
        grid.appendChild(b);
      }
    }

    function openPvPBox(idx, el) {
      if (el.classList.contains("opened") || myBoxesOpened >= 5) return;
      el.classList.add("opened");
      el.style.background = "#050a14";

      const d = PVP_DROPS[Math.floor(Math.random() * PVP_DROPS.length)];
      myScore += d.p;
      myBoxesOpened++;

      el.innerHTML = `<span style="color:${d.c}; font-size:7px;">${d.name}</span><b style="color:var(--btn-green); font-size:9px;">+${d.p}P</b>`;

      const meIdx = pvpState.findIndex(p => p.isMe);
      pvpState[meIdx].score = myScore;
      pvpState[meIdx].opened = myBoxesOpened;

      document.getElementById(`pscore-${meIdx}`).innerText = `${myScore} P`;
      document.getElementById(`pbox-${meIdx}`).innerText = `${myBoxesOpened}/5 Kutu`;

      checkFinish();
    }

    function startPvPSimulation() {
      const sim = setInterval(() => {
        pvpState.forEach((p, i) => {
          if (!p.isMe && p.opened < 5 && Math.random() > 0.4) {
            p.opened++;
            p.score += Math.floor(Math.random() * 6) + 2;
            document.getElementById(`pscore-${i}`).innerText = `${p.score} P`;
            document.getElementById(`pbox-${i}`).innerText = `${p.opened}/5 Kutu`;
          }
        });
        if (pvpState.every(p => p.opened === 5)) clearInterval(sim);
      }, 1000);
    }

    function checkFinish() {
      if (pvpState.every(p => p.opened === 5)) {
        document.getElementById("pvp-timer").innerText = "10s";
        let c = 10;
        const cd = setInterval(() => {
          c--;
          document.getElementById("pvp-timer").innerText = `${c}s`;
          if (c <= 0) {
            clearInterval(cd);
            pvpState.sort((a,b) => b.score - a.score);
            const rank = pvpState.findIndex(p => p.isMe) + 1;
            alert(`🏁 Maç Bitti! ${rank}. oldunuz! Puan: ${myScore}`);
            window.location.href = "menu.html";
          }
        }, 1000);
      }
    }
  </script>
</body>
</html>
