<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1v1 Canlı Arena</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="lobby-header">
        <button class="btn btn-purple" onclick="location.href='menu.html'">‹ Lobiye Dön</button>
        <span id="header-user-tag"></span>
    </div>

    <div class="content-box">
        <h2>⚔️ 1v1 Canlı Düello Arenası</h2>
        <div style="display: flex; gap: 8px; margin: 15px 0;">
            <button class="btn btn-purple" onclick="createRoom()">Oda Kur</button>
            <input type="text" id="join-room-code" placeholder="Oda Kodunu Girin">
            <button class="btn btn-green" onclick="joinRoom()">Odaya Katıl</button>
        </div>

        <div class="mode-card" style="text-align: center; padding: 25px;">
            <div style="display: flex; justify-content: space-around; align-items: center; margin-bottom: 20px;">
                <div>
                    <h3 id="p1-title">Oyuncu 1</h3>
                    <h1 id="p1-pts" style="color: var(--gold); font-size: 32px;">0</h1>
                    <small id="p1-left">Kalan: 5</small>
                </div>

                <div>
                    <div style="font-size: 36px; font-weight: bold; color: var(--neon-purple);">30s</div>
                    <span id="pvp-lock-status" style="font-size: 13px; color: var(--gold);">⏳ Rakip Bekleniyor</span>
                </div>

                <div>
                    <h3 id="p2-title">Oyuncu 2 (Bekleniyor)</h3>
                    <h1 id="p2-pts" style="color: var(--gold); font-size: 32px;">0</h1>
                    <small id="p2-left">Kalan: 5</small>
                </div>
            </div>

            <button id="pvp-open-btn" class="btn btn-green btn-play-big" onclick="pvpOpenBox()" disabled>Rakip Gelmeden Kutu Açılamaz</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        window.onload = renderHeader;
        let activeRoom = null;
        let myBoxesLeft = 5;

        function createRoom() {
            let u = getCurrentUser();
            let roomId = "DUEL_" + Math.floor(1000 + Math.random() * 9000);
            activeRoom = roomId;
            myBoxesLeft = 5;
            db.ref("arenas/" + roomId).set({
                status: "waiting",
                p1: { uid: u.uid, name: `${u.username}${u.tag}`, score: 0, rem: 5 },
                p2: null
            });
            listenDuel(roomId);
            alert("Oda oluşturuldu! Kod: " + roomId);
        }

        function joinRoom() {
            let u = getCurrentUser();
            let roomId = document.getElementById("join-room-code").value.trim();
            if (!roomId) return alert("Oda kodu giriniz!");
            activeRoom = roomId;
            myBoxesLeft = 5;

            db.ref("arenas/" + roomId).transaction(room => {
                if (room && !room.p2 && room.p1.uid !== u.uid) {
                    room.p2 = { uid: u.uid, name: `${u.username}${u.tag}`, score: 0, rem: 5 };
                    room.status = "active";
                }
                return room;
            });
            listenDuel(roomId);
        }

        function listenDuel(roomId) {
            let u = getCurrentUser();
            db.ref("arenas/" + roomId).on("value", snap => {
                let data = snap.val();
                if (!data) return;

                document.getElementById("p1-title").innerText = data.p1 ? data.p1.name : "Bekleniyor";
                document.getElementById("p1-pts").innerText = data.p1 ? data.p1.score : 0;
                document.getElementById("p1-left").innerText = "Kalan: " + (data.p1 ? data.p1.rem : 5);

                if (data.p2) {
                    document.getElementById("p2-title").innerText = data.p2.name;
                    document.getElementById("p2-pts").innerText = data.p2.score;
                    document.getElementById("p2-left").innerText = "Kalan: " + data.p2.rem;
                }

                const btn = document.getElementById("pvp-open-btn");
                const lockStatus = document.getElementById("pvp-lock-status");

                if (data.status === "active" && data.p2) {
                    lockStatus.innerText = "⚔️ Düello Başladı!";
                    lockStatus.style.color = "var(--btn-green)";
                    btn.disabled = myBoxesLeft <= 0;
                    btn.innerText = myBoxesLeft > 0 ? `Kutu Aç (${myBoxesLeft}/5)` : "Kutuların Bitti";
                } else {
                    lockStatus.innerText = "⏳ Rakip Bekleniyor...";
                    lockStatus.style.color = "var(--gold)";
                    btn.disabled = true;
                    btn.innerText = "Rakip Gelmeden Kutu Açılamaz";
                }
            });
        }

        function pvpOpenBox() {
            if (!activeRoom || myBoxesLeft <= 0) return;
            let u = getCurrentUser();
            myBoxesLeft--;
            let gain = Math.floor(Math.random() * 90) + 10;

            db.ref("arenas/" + activeRoom).once("value", snap => {
                let d = snap.val();
                let isP1 = d.p1.uid === u.uid;
                let target = isP1 ? "p1" : "p2";
                db.ref(`arenas/${activeRoom}/${target}`).update({
                    score: d[target].score + gain,
                    rem: myBoxesLeft
                });
            });
        }
    </script>
</body>
</html>
