<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>1v1 PvP Arenası</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="app.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    
    /* Apple iPhone & iPad Tam Ekran Uyumu */
    html, body {
      width: 100% !important;
      height: 100% !important;
      height: 100dvh !important;
      min-height: -webkit-fill-available;
      overflow: hidden !important;
      background: #020617;
      font-family: system-ui, sans-serif;
      color: #fff;
    }

    .pvp-app-container {
      width: 100% !important;
      max-width: min(96vw, 620px) !important; /* iPad'de küçücük kalmaz, geniş ve ferah oturur */
      height: 100dvh !important;
      margin: 0 auto !important;
      background: #030712;
      display: flex !important;
      flex-direction: column !important;
      position: relative;
      box-shadow: 0 0 35px rgba(0,0,0,0.8);
    }

    .pvp-header {
      flex-shrink: 0;
      background: #090d1a;
      border-bottom: 2px solid #1e293b;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .pvp-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .pvp-body::-webkit-scrollbar { width: 4px; }
    .pvp-body::-webkit-scrollbar-thumb { background: #3b1d6e; border-radius: 4px; }

    /* Eski Sevilen VS Kartı */
    .vs-display-card {
      background: linear-gradient(135deg, #1e1b4b, #0f172a);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .player-box { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .player-avatar-circle {
      width: 52px; height: 52px; border-radius: 50%;
      border: 2px solid var(--neon-gold);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; background: #060913;
    }

    /* Amiral Battı Izgarası */
    .battleship-grid {
      display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px;
      background: #0b1329; border: 2px solid #1e3a8a; border-radius: 10px; padding: 8px;
      width: 100%; max-width: 360px; aspect-ratio: 1; margin: 0 auto;
    }
    .navy-tile {
      background: #0f172a; border: 1px solid #1e293b; border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; cursor: pointer; user-select: none;
    }
    .navy-tile.hit { background: #dc2626 !important; border-color: #ef4444; }
    .navy-tile.miss { background: #1e293b !important; color: #64748b; font-weight: bold; }
    .navy-tile.surround { background: #070d1e !important; border-color: #0284c7; }

    /* Lobi Oda Kartları */
    .room-card {
      background: #070d1e; border: 1px solid #1e293b; border-radius: 8px;
      padding: 8px 12px; display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; transition: transform 0.1s ease, border-color 0.1s ease;
    }
    .room-card:active { transform: scale(0.98); border-color: #38bdf8; }

    .action-btn-large {
      width: 100%; max-width: 380px; padding: 16px; font-size: 14px;
      font-weight: 900; letter-spacing: 0.5px; border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="pvp-app-container">
    
    <!-- Üst Başlık Barı -->
    <div class="pvp-header">
      <div style="display:flex; align-items:center; gap:6px;">
        <a href="menu.html" class="icon-btn" style="border-color:var(--danger); padding:3px 8px; font-size:10px; text-decoration:none;">‹ Lobi</a>
        <button type="button" id="btn-leave-room" class="icon-btn" style="display:none; padding:3px 8px; font-size:9.5px;" onclick="leaveCurrentRoom()">🚪 Odadan Çık</button>
      </div>
      <div style="font-weight:900; font-size:12.5px; color:var(--neon-gold);">⚔️ 1v1 PvP Arenası</div>
      <div id="lbl-status-pill" style="font-size:8.5px; color:var(--neon-green);">● Çevrimiçi</div>
    </div>

    <div class="pvp-body">
      
      <!-- ================= 1. BÖLÜM: LOBİ & ODA LİSTESİ (ODADA DEĞİLKEN) ================= -->
      <div id="view-lobby" style="display:flex; flex-direction:column; gap:10px;">
        <div style="display:flex; gap:6px;">
          <button type="button" class="btn-start" style="flex:1; background:#16a34a; font-size:10.5px; padding:10px;" onclick="openCreateRoomModal()">➕ Oda Kur</button>
          <button type="button" class="btn-start" style="flex:1; background:#0284c7; font-size:10.5px; padding:10px;" onclick="quickJoinMatch()">⚡ Hızlı Eşleş</button>
        </div>

        <div style="font-size:9.5px; font-weight:800; color:#94a3b8; text-transform:uppercase;">Aktif Açık Odalar</div>
        <div id="lobby-rooms-feed" style="display:flex; flex-direction:column; gap:6px;">
          <div style="color:#64748b; font-size:9.5px; text-align:center; padding:20px;">Odalar taranıyor...</div>
        </div>
      </div>

      <!-- ================= 2. BÖLÜM: AKTİF MAÇ ODASI (ESKİ SEVİLEN GÖRÜNÜM) ================= -->
      <div id="view-arena" style="display:none; flex-direction:column; gap:10px; flex:1;">
        
        <!-- Eski Sade VS Kartı -->
        <div class="vs-display-card">
          <div class="player-box">
            <div class="player-avatar-circle" id="arena-p1-avatar">👤</div>
            <b id="arena-p1-name" style="font-size:11px; color:#38bdf8;">Sen</b>
            <span id="arena-p1-score" style="font-size:16px; font-weight:900; color:var(--neon-green);">0</span>
          </div>
          <div style="text-align:center;">
            <div style="font-size:20px; font-weight:900; color:var(--danger);">VS</div>
            <div id="arena-mode-badge" style="font-size:8.5px; color:var(--neon-gold); margin-top:2px;">Speedrun</div>
          </div>
          <div class="player-box">
            <div class="player-avatar-circle" id="arena-p2-avatar">👤</div>
            <b id="arena-p2-name" style="font-size:11px; color:#f87171;">Rakip Bekleniyor</b>
            <span id="arena-p2-score" style="font-size:16px; font-weight:900; color:var(--neon-green);">0</span>
          </div>
        </div>

        <!-- Oyun Alanı -->
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;">
          <div id="arena-status-announcer" style="font-size:13px; font-weight:bold; color:#cbd5e1; text-align:center;">Rakip Bekleniyor...</div>
          
          <!-- Speedrun / Klasik Kasa Açma Butonu -->
          <button type="button" id="btn-arena-action" class="btn-start action-btn-large" style="display:none;" onclick="handleArenaActionClick()">🔥 KUTU AÇ (+5-15P)</button>

          <!-- Amiral Battı Tahtası -->
          <div id="arena-battleship-wrap" style="display:none; width:100%;">
            <div class="battleship-grid" id="arena-navy-grid"></div>
          </div>
        </div>

        <!-- Bitiş ve Tekrar Oyna Butonu -->
        <div id="arena-finish-bar" style="display:none; flex-direction:column; gap:6px; margin-top:auto;">
          <div id="arena-winner-text" style="font-size:14px; font-weight:900; color:var(--neon-gold); text-align:center;"></div>
          <button type="button" id="btn-arena-rematch" class="btn-start" style="background:#16a34a; padding:12px; font-size:11.5px;" onclick="requestArenaRematch()">🔄 Tekrar Oyna</button>
        </div>

      </div>

    </div>
  </div>

  <!-- ODA KURMA MODALI -->
  <div id="modal-create-room" class="modal-overlay">
    <div class="modal-card">
      <div style="font-size:13px; font-weight:bold; color:var(--neon-gold); text-align:center; margin-bottom:8px;">⚔️ Yeni PvP Odası Kur</div>
      
      <label style="font-size:8.5px; color:#94a3b8; font-weight:bold;">OYUN MODU</label>
      <select id="sel-create-mode" class="input-field" style="background:#0f172a; margin-top:3px; padding:7px; font-size:10px;">
        <option value="speedrun">⚡ 1v1 Speedrun (Hedefe İlk Ulaşan)</option>
        <option value="battleship">🚢 1v1 Amiral Battı (Gemi Avı)</option>
        <option value="classic">⚔️ 1v1 Normal Kasa (30s Yarışı)</option>
      </select>

      <label style="font-size:8.5px; color:#94a3b8; font-weight:bold; margin-top:6px; display:block;">HEDEF PUAN / BİTİŞ KURALI</label>
      <select id="sel-create-target" class="input-field" style="background:#0f172a; margin-top:3px; padding:7px; font-size:10px;">
        <option value="100">100 Puan (Hızlı Maç)</option>
        <option value="250">250 Puan (Standart)</option>
        <option value="500">500 Puan (Büyük Düello)</option>
      </select>

      <button type="button" class="btn-start" style="background:#16a34a; padding:9px; font-size:11px; margin-top:8px;" onclick="submitCreateRoom()">Odayı Başlat</button>
      <button type="button" class="btn-close" style="margin-top:6px;" onclick="document.getElementById('modal-create-room').style.display='none'">Vazgeç</button>
    </div>
  </div>

  <script>
    let activeUser = null;
    let currentJoinedRoomId = null;
    let currentRoomData = null;
    let roomListenerRef = null;
    let isMatchOver = false;
    let myScore = 0;

    // Amiral Battı (8x8)
    const GRID_SIZE = 8;
    let navyBoard = [];
    let navyShips = [];

    window.onload = () => {
      activeUser = getActiveUser();
      if (!activeUser) return location.href = "index.html";
      initLobbyRoomsStream();
    };

    // ================= LOBİ VE ODA YÖNETİMİ =================
    function initLobbyRoomsStream() {
      db.ref("pvp_rooms").on("value", snap => {
        if (currentJoinedRoomId) return; // Odadaysak lobi listesini güncelleme
        const feed = document.getElementById("lobby-rooms-feed");
        feed.innerHTML = "";

        if (!snap.exists()) {
          feed.innerHTML = "<div style='color:#64748b; font-size:9.5px; text-align:center; padding:20px;'>Açık oda yok. İlk odayı sen kur!</div>";
          return;
        }

        snap.forEach(c => {
          const room = c.val();
          const rId = c.key;
          const players = room.players || {};
          const pCount = Object.keys(players).length;

          if (pCount >= 2 && !players[String(activeUser.username).toLowerCase()]) return; // Dolu oda

          const modeName = room.mode === 'battleship' ? '🚢 Amiral Battı' : (room.mode === 'classic' ? '⚔️ Normal Kasa' : '⚡ Speedrun');

          const card = document.createElement("div");
          card.className = "room-card";
          card.innerHTML = `
            <div>
              <b style="font-size:11px; color:#38bdf8;">${room.hostName}'in Odası</b>
              <div style="font-size:8px; color:var(--neon-gold); margin-top:2px;">${modeName} • Hedef: ${room.targetScore || 100}P</div>
            </div>
            <button type="button" class="btn-start" style="width:auto; padding:6px 12px; font-size:9px; background:#0284c7;" onclick="joinRoomById('${rId}')">Katıl (${pCount}/2) ›</button>
          `;
          feed.appendChild(card);
        });
      });
    }

    function openCreateRoomModal() {
      document.getElementById("modal-create-room").style.display = "flex";
    }

    function submitCreateRoom() {
      const mode = document.getElementById("sel-create-mode").value;
      const target = parseInt(document.getElementById("sel-create-target").value) || 100;
      const myKey = String(activeUser.username).toLowerCase();

      const rId = "room_" + Date.now().toString(36);
      const roomPayload = {
        hostKey: myKey,
        hostName: activeUser.displayName,
        mode: mode,
        targetScore: target,
        createdAt: Date.now(),
        players: {
          [myKey]: {
            name: activeUser.displayName,
            avatar: activeUser.avatar || "👤",
            score: 0,
            ready: true
          }
        }
      };

      db.ref("pvp_rooms/" + rId).set(roomPayload).then(() => {
        document.getElementById("modal-create-room").style.display = "none";
        enterRoomArena(rId);
      });
    }

    function quickJoinMatch() {
      db.ref("pvp_rooms").once("value", snap => {
        let targetId = null;
        if (snap.exists()) {
          snap.forEach(c => {
            const r = c.val();
            const pCount = Object.keys(r.players || {}).length;
            if (pCount === 1 && !targetId) targetId = c.key;
          });
        }
        if (targetId) joinRoomById(targetId);
        else openCreateRoomModal();
      });
    }

    function joinRoomById(rId) {
      const myKey = String(activeUser.username).toLowerCase();
      db.ref(`pvp_rooms/${rId}/players/${myKey}`).set({
        name: activeUser.displayName,
        avatar: activeUser.avatar || "👤",
        score: 0,
        ready: true
      }).then(() => {
        enterRoomArena(rId);
      });
    }

    function leaveCurrentRoom() {
      if (!currentJoinedRoomId) return;
      const myKey = String(activeUser.username).toLowerCase();
      
      if (roomListenerRef) roomListenerRef.off();
      db.ref(`pvp_rooms/${currentJoinedRoomId}/players/${myKey}`).remove();

      currentJoinedRoomId = null;
      document.getElementById("view-arena").style.display = "none";
      document.getElementById("view-lobby").style.display = "flex";
      document.getElementById("btn-leave-room").style.display = "none";
      initLobbyRoomsStream();
    }

    // ================= ARENA MAÇ MOTORU =================
    function enterRoomArena(rId) {
      currentJoinedRoomId = rId;
      document.getElementById("view-lobby").style.display = "none";
      document.getElementById("view-arena").style.display = "flex";
      document.getElementById("btn-leave-room").style.display = "inline-block";

      const myKey = String(activeUser.username).toLowerCase();
      roomListenerRef = db.ref(`pvp_rooms/${rId}`);

      roomListenerRef.on("value", snap => {
        if (!snap.exists()) {
          alert("Oda kapatıldı.");
          leaveCurrentRoom();
          return;
        }

        currentRoomData = snap.val();
        const players = currentRoomData.players || {};
        const pKeys = Object.keys(players);

        // Mod Rozeti
        const modeLabel = currentRoomData.mode === 'battleship' ? '🚢 Amiral Battı' : (currentRoomData.mode === 'classic' ? '⚔️ Normal Kasa' : '⚡ Speedrun');
        document.getElementById("arena-mode-badge").innerText = modeLabel;

        // P1 ve P2 Güncelle
        if (pKeys.length > 0) {
          const p1 = players[pKeys[0]];
          document.getElementById("arena-p1-name").innerText = p1.name;
          document.getElementById("arena-p1-avatar").innerText = p1.avatar || "👤";
          document.getElementById("arena-p1-score").innerText = p1.score || 0;
        }
        if (pKeys.length > 1) {
          const p2 = players[pKeys[1]];
          document.getElementById("arena-p2-name").innerText = p2.name;
          document.getElementById("arena-p2-avatar").innerText = p2.avatar || "👤";
          document.getElementById("arena-p2-score").innerText = p2.score || 0;
        } else {
          document.getElementById("arena-p2-name").innerText = "Rakip Bekleniyor";
          document.getElementById("arena-p2-avatar").innerText = "👤";
          document.getElementById("arena-p2-score").innerText = "0";
        }

        // Rematch Oy Kontrolü (Senkron Başlatma)
        const votes = currentRoomData.rematch_votes || {};
        const vCount = Object.keys(votes).length;

        if (vCount === 1) {
          if (votes[myKey]) {
            document.getElementById("btn-arena-rematch").innerText = "⏳ Rakibin Onayı Bekleniyor...";
            document.getElementById("btn-arena-rematch").disabled = true;
          } else {
            document.getElementById("btn-arena-rematch").innerText = "🔥 Rakip Tekrar İstiyor! (Bas ve Başla)";
            document.getElementById("btn-arena-rematch").style.background = "#eab308";
          }
        } else if (vCount >= 2) {
          roomListenerRef.child("rematch_votes").remove();
          startArenaRound();
        }

        // Kazanan Kontrolü
        if (currentRoomData.winner && !isMatchOver) {
          concludeArenaMatch(currentRoomData.winner);
        }
      });

      startArenaRound();
    }

    function startArenaRound() {
      isMatchOver = false;
      myScore = 0;
      document.getElementById("arena-finish-bar").style.display = "none";
      document.getElementById("btn-arena-rematch").disabled = false;
      document.getElementById("btn-arena-rematch").innerText = "🔄 Tekrar Oyna";
      document.getElementById("btn-arena-rematch").style.background = "#16a34a";

      const myKey = String(activeUser.username).toLowerCase();
      db.ref(`pvp_rooms/${currentJoinedRoomId}/players/${myKey}/score`).set(0);
      db.ref(`pvp_rooms/${currentJoinedRoomId}/winner`).remove();

      document.getElementById("btn-arena-action").style.display = "none";
      document.getElementById("arena-battleship-wrap").style.display = "none";

      // 2 Oyuncu var mı kontrolü
      const pCount = Object.keys((currentRoomData && currentRoomData.players) || {}).length;
      if (pCount < 2) {
        document.getElementById("arena-status-announcer").innerText = "Arkadaşının / Rakibin Katılması Bekleniyor...";
        return;
      }

      let count = 3;
      document.getElementById("arena-status-announcer").innerText = `Maç Başlıyor: ${count}`;

      const t = setInterval(() => {
        count--;
        if (count > 0) {
          document.getElementById("arena-status-announcer").innerText = `Maç Başlıyor: ${count}`;
        } else {
          clearInterval(t);
          launchArenaMode();
        }
      }, 1000);
    }

    function launchArenaMode() {
      const mode = currentRoomData.mode || 'speedrun';

      if (mode === 'battleship') {
        document.getElementById("arena-status-announcer").innerText = "🚢 Düşman Filosunu Yok Et!";
        document.getElementById("arena-battleship-wrap").style.display = "block";
        setupArenaNavyBoard();
      } else {
        const target = currentRoomData.targetScore || 100;
        document.getElementById("arena-status-announcer").innerText = `⚡ Hedef: ${target} Puan! İlk ulaşan kazanır.`;
        document.getElementById("btn-arena-action").style.display = "block";
      }
    }

    function handleArenaActionClick() {
      if (isMatchOver) return;
      SoundFX.play('open');
      myScore += Math.floor(Math.random() * 12) + 6;

      const myKey = String(activeUser.username).toLowerCase();
      db.ref(`pvp_rooms/${currentJoinedRoomId}/players/${myKey}/score`).set(myScore);

      const target = currentRoomData.targetScore || 100;
      if (myScore >= target) {
        db.ref(`pvp_rooms/${currentJoinedRoomId}/winner`).set(activeUser.displayName);
      }
    }

    // ================= AMİRAL BATTI VE ÇEVRE KARESİ =================
    function setupArenaNavyBoard() {
      navyBoard = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
      navyShips = [
        { name: "Kruvazör", size: 3, hits: 0, coords: [] },
        { name: "Hücumbot", size: 2, hits: 0, coords: [] }
      ];

      navyShips.forEach(s => {
        let placed = false;
        while (!placed) {
          const horiz = Math.random() > 0.5;
          const r = Math.floor(Math.random() * (horiz ? GRID_SIZE : GRID_SIZE - s.size));
          const c = Math.floor(Math.random() * (horiz ? GRID_SIZE - s.size : GRID_SIZE));

          let overlap = false;
          let temp = [];
          for (let i = 0; i < s.size; i++) {
            const curR = horiz ? r : r + i;
            const curC = horiz ? c + i : c;
            if (navyBoard[curR][curC]) { overlap = true; break; }
            temp.push({ r: curR, c: curC });
          }

          if (!overlap) {
            temp.forEach(pos => { navyBoard[pos.r][pos.c] = s; });
            s.coords = temp;
            placed = true;
          }
        }
      });

      const gridEl = document.getElementById("arena-navy-grid");
      gridEl.innerHTML = "";
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const tile = document.createElement("div");
          tile.className = "navy-tile";
          tile.dataset.r = r;
          tile.dataset.c = c;
          tile.onclick = () => onArenaNavyTileClick(r, c, tile);
          gridEl.appendChild(tile);
        }
      }
    }

    function onArenaNavyTileClick(r, c, tileEl) {
      if (isMatchOver || tileEl.classList.contains("hit") || tileEl.classList.contains("miss")) return;

      const target = navyBoard[r][c];
      if (target) {
        SoundFX.play('open');
        tileEl.classList.add("hit");
        tileEl.innerText = "💥";
        target.hits++;

        // Gemi tamamen battığında çevresindeki tüm kareler otomatik boş deniz olur
        if (target.hits >= target.size) {
          revealSurroundingSea(target.coords);
          document.getElementById("arena-status-announcer").innerText = `🔥 TEBRİKLER! ${target.name} gemisi battı!`;
        }
      } else {
        SoundFX.play('click');
        tileEl.classList.add("miss");
        tileEl.innerText = "•";
      }

      const totalHits = navyShips.reduce((acc, s) => acc + s.hits, 0);
      const myKey = String(activeUser.username).toLowerCase();
      db.ref(`pvp_rooms/${currentJoinedRoomId}/players/${myKey}/score`).set(totalHits);

      if (navyShips.every(s => s.hits >= s.size)) {
        db.ref(`pvp_rooms/${currentJoinedRoomId}/winner`).set(activeUser.displayName);
      }
    }

    function revealSurroundingSea(coords) {
      SoundFX.play('boom');
      coords.forEach(pt => {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = pt.r + dr;
            const nc = pt.c + dc;
            if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
              const isShip = coords.some(c => c.r === nr && c.c === nc);
              if (!isShip) {
                const el = document.querySelector(`[data-r="${nr}"][data-c="${nc}"]`);
                if (el && !el.classList.contains("hit")) {
                  el.classList.add("miss", "surround");
                  el.innerText = "🌊";
                }
              }
            }
          }
        }
      });
    }

    function concludeArenaMatch(winnerName) {
      isMatchOver = true;
      SoundFX.play(winnerName === activeUser.displayName ? 'win' : 'boom');
      document.getElementById("btn-arena-action").style.display = "none";
      document.getElementById("arena-winner-text").innerText = `🏆 Kazanan: ${winnerName}!`;
      document.getElementById("arena-finish-bar").style.display = "flex";
    }

    function requestArenaRematch() {
      SoundFX.play('click');
      const myKey = String(activeUser.username).toLowerCase();
      db.ref(`pvp_rooms/${currentJoinedRoomId}/rematch_votes/${myKey}`).set(true);
    }
  </script>
</body>
</html>
