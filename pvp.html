<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online PvP Arenası</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="top-header">
      <button id="btn-leave-room" class="icon-btn" style="border-color:var(--danger);" onclick="leavePvPRoom()">‹ Çıkış</button>
      <div id="pvp-room-tag" style="font-weight:bold; font-size:12px;">PvP Arenası</div>
      <div id="pvp-status-badge" style="color:var(--neon-gold); font-weight:bold; font-size:11px;">Oda Seç</div>
    </div>

    <!-- Oda Paneli -->
    <div id="pvp-lobby-panel" style="display:flex; flex-direction:column; gap:8px;">
      <div style="font-size:11px; color:var(--text-dim);">Oyun Türü Seç:</div>
      <div style="display:flex; gap:4px;">
        <button class="mode-btn" id="btn-p2" style="flex:1; background:var(--btn-blue); color:#fff; text-align:center;" onclick="setRoomSize(2)">1v1</button>
        <button class="mode-btn" id="btn-p3" style="flex:1; text-align:center;" onclick="setRoomSize(3)">1v1v1</button>
        <button class="mode-btn" id="btn-p4" style="flex:1; text-align:center;" onclick="setRoomSize(4)">1v1v1v1</button>
      </div>

      <button class="btn-start" style="background:var(--neon-purple);" onclick="createOnlineRoom()">Oda Kur</button>

      <div style="display:flex; gap:4px; margin-top:10px;">
        <input type="text" id="in-room-code" class="input-field" style="margin:0; font-size:11px;" placeholder="Oda Adı (Örn: arena#1234)">
        <button class="icon-btn" style="background:var(--neon-green); white-space:nowrap;" onclick="joinOnlineRoom()">Katıl</button>
      </div>
    </div>

    <!-- Canlı Oyun Alanı -->
    <div id="pvp-game-panel" style="display:none; flex-direction:column; flex:1;">
      <div style="display:grid; gap:4px; margin-bottom:8px;" id="pvp-players-row"></div>
      <div style="font-size:10px; color:var(--neon-blue); font-weight:bold; margin-bottom:4px;">📦 Açılacak 5 Kutunuz (2sn Cooldown):</div>
      <div style="display:grid; grid-template-columns:repeat(5, 1fr); gap:4px; flex:1; align-content:start;" id="pvp-boxes-grid"></div>
    </div>

    <!-- Podyum / Kazanan Paneli -->
    <div id="pvp-podium-panel" style="display:none; flex-direction:column; flex:1; background:#120826; padding:12px; border-radius:8px; border:1px solid var(--neon-purple);">
      <div style="font-size:14px; font-weight:bold; color:var(--neon-gold); text-align:center; margin-bottom:10px;">🏆 MAÇ BİTTİ - SIRALAMA</div>
      <div id="podium-list" style="display:flex; flex-direction:column; gap:6px; flex:1; overflow-y:auto;"></div>
      <button class="btn-start" style="margin-top:10px;" onclick="location.href='menu.html'">Lobiye Dön</button>
    </div>
  </div>

  <!-- Profil İnceleme Modalı -->
  <div id="modal-pvp-profile" class="modal-overlay">
    <div class="modal-card panel-theme-profile" style="text-align:center;">
      <div style="font-size:36px;">👤</div>
      <h3 id="pvp-prof-name" style="color:var(--neon-blue);">Oyuncu</h3>
      <div id="pvp-prof-title" style="color:var(--neon-gold); font-size:11px; margin-bottom:8px;">[Çaylak]</div>
      <button class="btn-close" onclick="document.getElementById('modal-pvp-profile').style.display='none'">Geri Dön</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let roomCapacity = 2;
    let currentRoomCode = null;
    let myOpenedCount = 0;
    let myTotalScore = 0;
    let isLocked = true;
    let startTimeout = null;
    let lastPvPOpenTime = 0;

    const PVP_TIERS = [
      { name: "Tahta Kılıç", p: 2, c: "#fff" },
      { name: "Demir Balta", p: 6, c: "#38bdf8" },
      { name: "Gümüş Yüzük", p: 15, c: "#c084fc" },
      { name: "Ejder Baltası", p: 40, c: "#fb923c" },
      { name: "Efsane Kılıç", p: 100, c: "#f43f5e" }
    ];

    function setRoomSize(num) {
      roomCapacity = num;
      document.getElementById("btn-p2").style.background = num === 2 ? "var(--btn-blue)" : "#0f172a";
      document.getElementById("btn-p3").style.background = num === 3 ? "var(--btn-blue)" : "#0f172a";
      document.getElementById("btn-p4").style.background = num === 4 ? "var(--btn-blue)" : "#0f172a";
    }

    function createOnlineRoom() {
      const u = getActiveUser();
      if (!u) return;
      const code = `pvp#${Math.floor(1000 + Math.random() * 9000)}`;
      currentRoomCode = code;

      const pData = {};
      pData[u.uid] = { uid: u.uid, fullName: `${u.name}${u.tag}`, score: 0, opened: 0, lastDrop: "-" };

      db.ref("pvp_rooms/" + code.replace('#', '_')).set({
        code: code,
        capacity: roomCapacity,
        status: "waiting",
        players: pData
      }).then(() => {
        listenRoom(code);
      });
    }

    function joinOnlineRoom() {
      const code = document.getElementById("in-room-code").value.trim();
      if (!code) return alert("Oda kodu giriniz!");
      const u = getActiveUser();
      currentRoomCode = code;

      db.ref("pvp_rooms/" + code.replace('#', '_')).transaction(room => {
        if (room) {
          if (!room.players) room.players = {};
          if (Object.keys(room.players).length < room.capacity) {
            room.players[u.uid] = { uid: u.uid, fullName: `${u.name}${u.tag}`, score: 0, opened: 0, lastDrop: "-" };
            if (Object.keys(room.players).length === room.capacity) {
              room.status = "starting";
            }
          }
        }
        return room;
      }, (err, committed) => {
        if (committed) listenRoom(code);
        else alert("Oda dolu veya bulunamadı!");
      });
    }

    function listenRoom(code) {
      document.getElementById("pvp-lobby-panel").style.display = "none";
      document.getElementById("pvp-game-panel").style.display = "flex";
      document.getElementById("pvp-room-tag").innerText = code;

      const u = getActiveUser();

      db.ref("pvp_rooms/" + code.replace('#', '_')).on("value", snap => {
        const room = snap.val();
        if (!room) return;

        const pList = Object.values(room.players || {});
        const pRow = document.getElementById("pvp-players-row");
        pRow.style.gridTemplateColumns = `repeat(${room.capacity}, 1fr)`;
        pRow.innerHTML = "";

        pList.forEach(p => {
          const isMe = p.fullName === `${u.name}${u.tag}`;
          pRow.innerHTML += `
            <div style="background:#070212; border:1px solid ${isMe ? 'var(--neon-gold)' : '#3b1d6e'}; border-radius:6px; padding:6px 2px; text-align:center; cursor:pointer;" onclick="inspectPvPPlayer('${p.uid}', '${p.fullName}')">
              <div style="font-size:9px; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:${isMe ? 'var(--neon-gold)' : '#fff'};">${p.fullName}</div>
              <div style="font-size:16px; font-weight:bold; color:var(--neon-green); margin:2px 0;">${p.score} P</div>
              <div style="font-size:8px; color:#38bdf8;">${p.lastDrop}</div>
              <div style="font-size:8px; color:#94a3b8;">${p.opened}/5 Kutu</div>
            </div>
          `;
        });

        // Oyuncu eksikse sayacı sıfırla
        if (pList.length < room.capacity) {
          if (startTimeout) clearTimeout(startTimeout);
          document.getElementById("pvp-status-badge").innerText = `⏳ Bekleniyor (${pList.length}/${room.capacity})`;
          document.getElementById("pvp-status-badge").style.color = "var(--neon-gold)";
          isLocked = true;
          document.getElementById("btn-leave-room").disabled = false;
        } else if (room.status === "starting") {
          document.getElementById("pvp-status-badge").innerText = "⏳ 5sn Sonra Başlıyor...";
          startTimeout = setTimeout(() => {
            db.ref("pvp_rooms/" + code.replace('#', '_')).update({ status: "playing" });
          }, 5000);
        } else if (room.status === "playing") {
          document.getElementById("pvp-status-badge").innerText = "⚔️ Maç Başladı!";
          document.getElementById("pvp-status-badge").style.color = "var(--neon-green)";
          document.getElementById("btn-leave-room").disabled = true; // Maç devam ederken çıkış yapılamaz
          isLocked = false;
          renderPvPBoxes(room.code);
        }

        const allDone = pList.length === room.capacity && pList.every(p => p.opened === 5);
        if (allDone) {
          document.getElementById("pvp-status-badge").innerText = "🏆 5sn Sonra Kazanan Açıklanıyor!";
          setTimeout(() => {
            showPodium(pList);
          }, 5000);
        }
      });
    }

    function renderPvPBoxes(roomKey) {
      const grid = document.getElementById("pvp-boxes-grid");
      if (grid.children.length > 0) return;

      const u = getActiveUser();

      for (let i = 0; i < 5; i++) {
        const b = document.createElement("div");
        b.className = "roulette-item";
        b.style.cssText = "width:100%; height:60px; cursor:pointer;";
        b.innerHTML = `<span>📦</span><span style="font-size:8px;">${i+1}</span>`;

        b.onclick = () => {
          if (isLocked || b.dataset.opened || myOpenedCount >= 5) return;
          const now = Date.now();
          if (now - lastPvPOpenTime < 2000) return alert("Kutuları 2 saniyede bir açabilirsiniz!");
          lastPvPOpenTime = now;

          b.dataset.opened = "1";
          b.style.background = "#070212";

          const d = PVP_TIERS[Math.floor(Math.random() * PVP_TIERS.length)];
          myTotalScore += d.p;
          myOpenedCount++;

          b.innerHTML = `<span style="color:${d.c}; font-size:7px;">${d.name}</span><b style="color:var(--neon-green); font-size:9px;">+${d.p}P</b>`;

          db.ref(`pvp_rooms/${roomKey.replace('#', '_')}/players/${u.uid}`).update({
            score: myTotalScore,
            opened: myOpenedCount,
            lastDrop: `+${d.p}P (${d.name})`
          });
        };
        grid.appendChild(b);
      }
    }

    function showPodium(pList) {
      document.getElementById("pvp-game-panel").style.display = "none";
      document.getElementById("pvp-podium-panel").style.display = "flex";

      const u = getActiveUser();
      pList.sort((a, b) => b.score - a.score);

      const podBox = document.getElementById("podium-list");
      podBox.innerHTML = "";

      pList.forEach((p, idx) => {
        const isMe = p.fullName === `${u.name}${u.tag}`;
        podBox.innerHTML += `
          <div class="rank-card ${idx === 0 ? 'rank-1' : (idx === 1 ? 'rank-2' : (idx === 2 ? 'rank-3' : ''))}" style="${isMe ? 'border:2px solid var(--neon-gold); color:var(--neon-gold);' : ''}">
            <span><b>${idx+1}.</b> ${p.fullName} ${isMe ? '(SEN)' : ''}</span>
            <b style="color:var(--neon-green); font-size:13px;">${p.score} P</b>
          </div>
        `;
      });
    }

    function inspectPvPPlayer(uid, name) {
      db.ref("users/" + uid).once("value", snap => {
        const p = snap.val() || {};
        document.getElementById("pvp-prof-name").innerText = name;
        document.getElementById("pvp-prof-title").innerText = `[${p.title || 'Çaylak'}]`;
        document.getElementById("modal-pvp-profile").style.display = "flex";
      });
    }

    function leavePvPRoom() {
      if (currentRoomCode) {
        const u = getActiveUser();
        db.ref(`pvp_rooms/${currentRoomCode.replace('#', '_')}/players/${u.uid}`).remove();
      }
      window.location.href = "menu.html";
    }
  </script>
</body>
</html>
